<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Chimera renderer v2 — spike</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #06070d; color: #c8d0e0;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 10px 14px; border-bottom: 1px solid #1d2434; }
  h1 { font: 600 14px/1.4 inherit; margin: 0 0 6px; color: #e6ecf7; letter-spacing: .02em; }
  #hud { font-size: 13px; }
  #hud b { color: #fff; font-size: 15px; }
  .ok { color: #5fd08a; } .no { color: #ff8b6b; } .d { color: #7d89a3; }
  #wrap { padding: 12px 14px; }
  canvas { width: 100%; max-width: 1600px; aspect-ratio: 16/9; display: block;
           border: 1px solid #222a3c; border-radius: 10px; background: #04050b;
           cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #ctl { display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin:10px 0 4px; font-size:13px; }
  #ctl label { display:flex; gap:6px; align-items:center; color:#c8d0e0; }
  #ctl input[type=range] { width:130px; }
  #log { white-space: pre-wrap; color: #7d89a3; padding: 8px 14px; font-size: 12px; }
  button { background: #182238; color: #c8d0e0; border: 1px solid #2c3850;
           border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #24304a; }
</style>
</head>
<body>
<header>
  <h1>Chimera renderer v2 — spike · preprocess → GPU radix sort → tile raster, no host in the frame loop</h1>
  <div id="hud">starting…</div>
</header>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="ctl">
    <button id="spin">spin</button>
    <label><input type="checkbox" id="cSurf" checked> surface</label>
    <label><input type="checkbox" id="cAtm" checked> atmosphere</label>
    <label><input type="checkbox" id="cIso"> force isotropic (v1 shape)</label>
    <label><input type="checkbox" id="cNorm" checked> normalized surface</label>
    <label>size <input type="range" id="cScale" min="0.4" max="2.5" step="0.05" value="1"><span id="vScale">1.00</span></label>
    <label>opacity <input type="range" id="cOpa" min="0.1" max="1" step="0.05" value="1"><span id="vOpa">1.00</span></label>
    <label>thickness <input type="range" id="cFlat" min="0.05" max="1" step="0.05" value="0.7"><span id="vFlat">0.70</span></label>
    <label>cull margin <input type="range" id="cFade" min="0" max="0.8" step="0.05" value="0.3"><span id="vFade">0.30</span></label>
    <label>edge sharpness <input type="range" id="cCov" min="0.3" max="4" step="0.1" value="1"><span id="vCov">1.0</span></label>
    <label>depth window <input type="range" id="cEps" min="0.5" max="12" step="0.5" value="3"><span id="vEps">3.0</span></label>
  </div>
  <p class="d">drag to orbit · wheel to zoom · rendering at 2560×1440 — toggle things until the spot changes, that names the cause</p>
</div>
<pre id="log"></pre>
<script type="module" src="main.js"></script>
<script>
  // wire the panel once main.js has installed its hooks
  const wire = () => {
    if (!window.__atm) return setTimeout(wire, 200);
    const b = (id, fn) => document.getElementById(id).onchange = e => fn(e.target.checked);
    b('cSurf', window.__surf); b('cAtm', window.__atm); b('cIso', window.__iso); b('cNorm', window.__norm);
    const r = (id, out, fn) => { const el = document.getElementById(id);
      el.oninput = e => { const v = parseFloat(e.target.value); fn(v); document.getElementById(out).textContent = v.toFixed(2); }; };
    r('cScale', 'vScale', window.__scale); r('cOpa', 'vOpa', window.__opa);
    r('cFlat', 'vFlat', window.__flat); r('cFade', 'vFade', window.__margin); r('cCov', 'vCov', window.__cov); r('cEps', 'vEps', window.__eps);
  };
  wire();
</script>
</body>
</html>
