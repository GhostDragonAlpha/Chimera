<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPIACE RPG — Phase 4: Multiplayer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; display: flex; flex-direction: column; align-items: center; height: 100vh; font-family: monospace; color: #aaa; overflow: hidden; }
  .split { display: flex; width: 100%; height: 100%; }
  .pane { flex: 1; position: relative; border-right: 1px solid #333; }
  .pane:last-child { border-right: none; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; background: #050510; }
  #hud-top { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,.9); padding: 6px 12px; font-size: 11px; line-height: 1.5; z-index: 10; display: flex; justify-content: space-between; }
  #hud-top .fps { color: #7f7; }
  #hud-top .info { color: #7bf; }
  #hud-top .warn { color: #fa7; }
  .pane-label { position: fixed; top: 36px; z-index: 11; font-size: 12px; padding: 2px 8px; border-radius: 3px; }
  #label-p1 { left: 10px; background: rgba(100,150,255,.2); color: #7bf; border: 1px solid #4488ff44; }
  #label-p2 { right: 10px; background: rgba(255,100,100,.2); color: #f77; border: 1px solid #f444444; }
  .pane-hud { position: fixed; font-size: 10px; line-height: 1.6; pointer-events: none; z-index: 12; padding: 6px 10px; background: rgba(0,0,0,.7); border-radius: 4px; }
  #hud-p1 { left: 10px; top: 56px; color: #7bf; }
  #hud-p2 { right: 10px; top: 56px; color: #f77; text-align: right; }
  .panel { position: fixed; background: rgba(5,5,20,.95); border: 1px solid #333; border-radius: 4px; padding: 8px 12px; font-size: 11px; line-height: 1.5; color: #aaa; z-index: 20; }
  .panel h3 { color: #7f7; margin-bottom: 4px; font-size: 12px; border-bottom: 1px solid #222; padding-bottom: 3px; }
  .panel button { background: #1a1a2e; color: #7f7; border: 1px solid #333; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; margin: 2px 2px 2px 0; }
  .panel button:hover { background: #2a2a4e; }
  .panel button.active { background: #7f7; color: #000; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 2px 0; gap: 8px; }
  .val { color: #ff7; min-width: 50px; text-align: right; font-size: 10px; }
  #ctrl-panel { bottom: 10px; left: 50%; transform: translateX(-50%); max-width: 500px; }
  .controls-hint { font-size: 9px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<div class="split">
  <div class="pane"><canvas id="c1"></canvas></div>
  <div class="pane"><canvas id="c2"></canvas></div>
</div>
<div id="hud-top">
  <span class="fps" id="fps">-- fps</span>
  <span class="info" id="sys-info">SPIACE Phase 4 -- Multiplayer (P1: WASD+X, P2: Arrows+Shift)</span>
  <span class="warn" id="sync-info">Sync: OK | Clients: 2</span>
</div>
<div class="pane-label" id="label-p1">PLAYER 1 — Blue</div>
<div class="pane-label" id="label-p2">PLAYER 2 — Red</div>
<div class="pane-hud" id="hud-p1"></div>
<div class="pane-hud" id="hud-p2"></div>
<div class="panel" id="ctrl-panel">
  <h3>Multiplayer Controls</h3>
  <div class="row"><button id="btn-save">Save Universe [S]</button><button id="btn-load">Load [L]</button><button id="btn-reset">Reset [R]</button></div>
  <div class="row"><label>Time Scale:</label><span class="val" id="time-scale">1x</span></div>
  <div class="row"><input type="range" id="tslider" min="0" max="100" value="50" style="width:200px;accent-color:#7f7"></div>
  <div class="controls-hint">P1: WASD move, X thrust | P2: Arrows move, Shift thrust</div>
</div>

<script>
// SPIACE Phase 4 -- Multiplayer with Authoritative Sync + Persistent Universe
var canvases = [document.getElementById('c1'), document.getElementById('c2')];
var ctxs = canvases.map(function(c) { return c.getContext('2d'); });

var G = 6.674e-11;
var GM_sun = 1.327e20;
var PLANET_RADIUS = 6.371e6;
var ATMOSPHERE_HEIGHT = 85000;

// ---- GAME STATE (authoritative -- runs once per frame) ----
var gameTime = 0;
var timeScale = 1;
var lastTime = performance.now();
var frameCount = 0, fps = 0;

// Stars background (shared)
function hash(x,y) { var h=(x*374761393+y*668265263)>>>0; h=((h^(h>>13))*1274126177)>>>0; return(h>>>(h>>16)&0x7fffffff)/0x7fffffff; }

// ---- SHIP CLASS ----
function createShip(id, color, startAngle) {
  var r = PLANET_RADIUS + 80000 + id * 20000;
  return {
    id: id, color: color,
    pos: [Math.cos(startAngle)*r, r*0.3, Math.sin(startAngle)*r],
    vel: [0, 0, 0],
    mass: 1000, fuelMass: 500 - id * 100, Isp: 300, thrust: 8000,
    trail: [], maxTrail: 200
  };
}

var ships = [
  createShip(0, '#4488ff', 0),
  createShip(1, '#ff4444', Math.PI * 0.67)
];

// Input state per player
var keys_p1 = {};
var keys_p2 = {};

document.addEventListener('keydown', function(e) {
  if (['KeyW','KeyA','KeyS','KeyD','KeyX'].indexOf(e.code) >= 0) keys_p1[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].indexOf(e.code) >= 0) keys_p2[e.code] = true;
  if (e.code === 'KeyS' && !e.repeat) saveUniverse();
  if (e.code === 'KeyL') loadUniverse();
  if (e.code === 'KeyR') resetGame();
});
document.addEventListener('keyup', function(e) {
  if (['KeyW','KeyA','KeyS','KeyD','KeyX'].indexOf(e.code) >= 0) keys_p1[e.code] = false;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight'].indexOf(e.code) >= 0) keys_p2[e.code] = false;
});

// ---- PHYSICS (authoritative, runs once per frame) ----
function updatePhysics(dt) {
  var sunPos = [0, 0, 0];
  for (var i = 0; i < ships.length; i++) {
    var ship = ships[i];
    // Gravity from sun
    var rVec = [sunPos[0]-ship.pos[0], sunPos[1]-ship.pos[1], sunPos[2]-ship.pos[2]];
    var rMag = Math.sqrt(rVec[0]*rVec[0]+rVec[1]*rVec[1]+rVec[2]*rVec[2]);
    if (rMag > 1e5) {
      var gravAccel = GM_sun / (rMag * rMag);
      var nx = rVec[0]/rMag, ny = rVec[1]/rMag, nz = rVec[2]/rMag;
      ship.vel[0] -= nx * gravAccel * dt;
      ship.vel[1] -= ny * gravAccel * dt;
      ship.vel[2] -= nz * gravAccel * dt;
    }
    // Atmospheric drag (thin shell)
    var alt = rMag - PLANET_RADIUS;
    if (alt > 0 && alt < ATMOSPHERE_HEIGHT * 8) {
      var rho = Math.exp(-alt / ATMOSPHERE_HEIGHT);
      var speed = Math.sqrt(ship.vel[0]*ship.vel[0]+ship.vel[1]*ship.vel[1]+ship.vel[2]*ship.vel[2]);
      var dragAccel = 0.0001 * rho * speed * speed / (ship.mass / 1000);
      if (speed > 0) {
        var spd = Math.sqrt(ship.vel[0]*ship.vel[0]+ship.vel[1]*ship.vel[1]+ship.vel[2]*ship.vel[2]);
        ship.vel[0] -= (ship.vel[0]/spd) * dragAccel * dt;
        ship.vel[1] -= (ship.vel[1]/spd) * dragAccel * dt;
        ship.vel[2] -= (ship.vel[2]/spd) * dragAccel * dt;
      }
    }
  }

  // Player 1 input
  var p1 = ships[0];
  if (keys_p1['KeyX'] && p1.fuelMass > 0) {
    var fwd = normalize([p1.pos[0], p1.pos[1]+1, p1.pos[2]]);
    var accel = p1.thrust / p1.mass;
    p1.vel[0] += fwd[0] * accel * dt;
    p1.vel[1] += fwd[1] * accel * dt;
    p1.vel[2] += fwd[2] * accel * dt;
    p1.fuelMass -= p1.thrust * dt / (p1.Isp * 9.81);
    if (p1.fuelMass < 0) p1.fuelMass = 0;
    p1.mass = 1000 + p1.fuelMass;
  }
  // WASD moves camera target for P1 (affects thrust direction in free-fly mode)
  var camSpeed = 3e4 * dt;
  if (keys_p1['KeyW']) { p1.pos[0] += norm([p1.pos[0],p1.pos[1]+1,p1.pos[2]])[0]*camSpeed*0.1; }

  // Player 2 input
  var p2 = ships[1];
  if (keys_p2['ShiftLeft'] || keys_p2['ShiftRight']) {
    if (p2.fuelMass > 0) {
      var fwd2 = normalize([p2.pos[0], p2.pos[1]+1, p2.pos[2]]);
      var accel2 = p2.thrust / p2.mass;
      p2.vel[0] += fwd2[0] * accel2 * dt;
      p2.vel[1] += fwd2[1] * accel2 * dt;
      p2.vel[2] += fwd2[2] * accel2 * dt;
      p2.fuelMass -= p2.thrust * dt / (p2.Isp * 9.81);
      if (p2.fuelMass < 0) p2.fuelMass = 0;
      p2.mass = 1000 + p2.fuelMass;
    }
  }

  // Integrate positions
  for (var i = 0; i < ships.length; i++) {
    var s = ships[i];
    s.pos[0] += s.vel[0] * dt;
    s.pos[1] += s.vel[1] * dt;
    s.pos[2] += s.vel[2] * dt;
    // Trail
    if (frameCount % 3 === 0) {
      s.trail.push([s.pos[0], s.pos[1], s.pos[2]]);
      if (s.trail.length > s.maxTrail) s.trail.shift();
    }
    // Ground collision
    var alt2 = Math.sqrt(s.pos[0]*s.pos[0]+s.pos[1]*s.pos[1]+s.pos[2]*s.pos[2]) - PLANET_RADIUS;
    if (alt2 < 0) {
      s.pos[0] *= PLANET_RADIUS / Math.sqrt(s.pos[0]*s.pos[0]+s.pos[1]*s.pos[1]+s.pos[2]*s.pos[2]);
      s.pos[1] = PLANET_RADIUS;
      s.pos[2] *= PLANET_RADIUS / Math.sqrt(s.pos[0]*s.pos[0]+s.pos[1]*s.pos[1]+s.pos[2]*s.pos[2]);
      if (Math.abs(s.vel[1]) > 30) {
        s.vel[1] = -s.vel[1] * 0.3;
      } else {
        s.vel[1] = 0;
      }
      s.vel[0] *= 0.8;
      s.vel[2] *= 0.8;
    }
  }
  gameTime += dt;
}

function normalize(v) { var l=Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]); return l>0?[v[0]/l,v[1]/l,v[2]/l]:[0,1,0]; }

// ---- RENDERING (per-client camera) ----
function resize() {
  var paneW = window.innerWidth / 2;
  for (var i = 0; i < canvases.length; i++) {
    canvases[i].width = paneW;
    canvases[i].height = window.innerHeight;
  }
}
window.addEventListener('resize', resize);
resize();

function project3D(pos, W, H, scale) {
  return [W/2 + pos[0]*scale, H/2 - pos[2]*scale];
}

function renderPane(ctx, ship, otherShip, W, H, camAngle) {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = '#ffffff';
  for (var i = 0; i < 200; i++) {
    var seed = i * 7919;
    var x = ((seed*137.5)%W+W)%W;
    var y = ((seed*97.3)%H+H)%H;
    ctx.globalAlpha = 0.3 + 0.4*Math.sin(gameTime*0.3 + i);
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.globalAlpha = 1;

  // Scale (logarithmic)
  var scale = Math.min(W,H) * 0.25 / 3e7;
  var camDist = 2e7;

  // Camera offset from ship
  var cx = ship.pos[0] + Math.cos(camAngle)*camDist;
  var cy = ship.pos[1] + 5e6;
  var cz = ship.pos[2] + Math.sin(camAngle)*camDist;

  // Sun
  var [sx, sy] = project3D([0,0,0], W, H, scale);
  ctx.fillStyle = '#ffd283';
  ctx.beginPath(); ctx.arc(sx,sy,15,0,Math.PI*2); ctx.fill();
  var starGrad = ctx.createRadialGradient(sx,sy,0,sx,sy,60);
  starGrad.addColorStop(0,'rgba(255,210,130,0.3)');
  starGrad.addColorStop(1,'transparent');
  ctx.fillStyle = starGrad;
  ctx.beginPath(); ctx.arc(sx,sy,60,0,Math.PI*2); ctx.fill();

  // Planet
  var [px, py] = project3D([0, PLANET_RADIUS*0.5, 0], W, H, scale);
  var planetR = Math.abs(scale * PLANET_RADIUS * 0.5);
  var platGrad = ctx.createRadialGradient(px-planetR*0.3, py-planetR*0.3, planetR*0.1, px, py, planetR);
  platGrad.addColorStop(0,'#4488cc');
  platGrad.addColorStop(0.7,'#1a3a5c');
  platGrad.addColorStop(1,'#050510');
  ctx.fillStyle = platGrad;
  ctx.beginPath(); ctx.arc(px,py,planetR,0,Math.PI*2); ctx.fill();
  // Atmosphere glow
  var atmoGrad = ctx.createRadialGradient(px,py,planetR*0.95,px,py,planetR*1.15);
  atmoGrad.addColorStop(0,'transparent');
  atmoGrad.addColorStop(0.5,'rgba(100,180,255,0.15)');
  atmoGrad.addColorStop(1,'transparent');
  ctx.fillStyle = atmoGrad;
  ctx.beginPath(); ctx.arc(px,py,planetR*1.15,0,Math.PI*2); ctx.fill();

  // Ship trails
  for (var i = 0; i < ships.length; i++) {
    var s = ships[i];
    if (s.trail.length > 1) {
      ctx.strokeStyle = s.color + '66';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var j = 0; j < s.trail.length; j++) {
        var tp = project3D(s.trail[j], W, H, scale);
        if (j === 0) ctx.moveTo(tp[0], tp[1]); else ctx.lineTo(tp[0], tp[1]);
      }
      ctx.stroke();
    }
  }

  // Ships
  for (var i = 0; i < ships.length; i++) {
    var s = ships[i];
    var [ssx, ssy] = project3D(s.pos, W, H, scale);
    ctx.fillStyle = s.color;
    ctx.beginPath(); ctx.arc(ssx,ssy,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '9px monospace';
    ctx.fillText('P' + (s.id+1), ssx+7, ssy-4);
  }

  // HUD overlay for this pane
  var ship = ships[0] === ctx ? ships[0] : (ship.id === 0 ? ships[0] : ships[1]);
  // Actually render the correct ship's HUD
  var hudEl = document.getElementById('hud-p' + (ship.id+1));
  var speed = Math.sqrt(ship.vel[0]*ship.vel[0]+ship.vel[1]*ship.vel[1]+ship.vel[2]*ship.vel[2]);
  var alt = Math.sqrt(ship.pos[0]*ship.pos[0]+ship.pos[1]*ship.pos[1]+ship.pos[2]*ship.pos[2]) - PLANET_RADIUS;
  hudEl.innerHTML =
    'P' + (ship.id+1) + '<br>' +
    'Alt: ' + (alt/1000).toFixed(0) + ' km<br>' +
    'Speed: ' + (speed/1000).toFixed(1) + ' km/s<br>' +
    'Fuel: ' + (ship.fuelMass/5).toFixed(0) + '%<br>' +
    'Mass: ' + ship.mass.toFixed(0) + ' kg';
}

// ---- SAVE / LOAD (IndexedDB persistence) ----
function saveUniverse() {
  var state = {
    version: 1, timestamp: Date.now(), gameTime: gameTime,
    ships: ships.map(function(s) { return { pos:s.pos.slice(), vel:s.vel.slice(), mass:s.mass, fuelMass:s.fuelMass, Isp:s.Isp, thrust:s.thrust, trailLen:s.trail.length }; }),
    seed: 'multiplayer_' + Math.floor(Math.random()*999999)
  };
  try {
    var dbReq = indexedDB.open('SpiaceUniverse', 1);
    dbReq.onupgradeneeded = function(e) { e.target.result.createObjectStore('saves', { keyPath: 'id' }); };
    dbReq.onsuccess = function(e) {
      var db = e.target.result;
      var tx = db.transaction('saves', 'readwrite');
      tx.objectStore('saves').put(state);
      document.getElementById('sync-info').textContent = 'Sync: Saved! | Clients: 2';
      setTimeout(function() { document.getElementById('sync-info').textContent = 'Sync: OK | Clients: 2'; }, 2000);
    };
  } catch(e) {
    // Fallback: localStorage
    localStorage.setItem('spiace_save', JSON.stringify(state));
  }
}

function loadUniverse() {
  try {
    var dbReq = indexedDB.open('SpiaceUniverse', 1);
    dbReq.onsuccess = function(e) {
      var db = e.target.result;
      var tx = db.transaction('saves', 'readonly');
      var req = tx.objectStore('saves').get('default');
      req.onsuccess = function() {
        if (req.result) restoreState(req.result);
      };
    };
  } catch(e) {
    var saved = localStorage.getItem('spiace_save');
    if (saved) restoreState(JSON.parse(saved));
  }
}

function restoreState(state) {
  gameTime = state.gameTime || 0;
  for (var i = 0; i < ships.length && i < state.ships.length; i++) {
    var s = state.ships[i];
    ships[i].pos = s.pos;
    ships[i].vel = s.vel;
    ships[i].mass = s.mass;
    ships[i].fuelMass = s.fuelMass;
  }
  document.getElementById('sync-info').textContent = 'Sync: Loaded! | Clients: 2';
  setTimeout(function() { document.getElementById('sync-info').textContent = 'Sync: OK | Clients: 2'; }, 2000);
}

function resetGame() {
  ships[0] = createShip(0, '#4488ff', 0);
  ships[1] = createShip(1, '#ff4444', Math.PI * 0.67);
  gameTime = 0;
}

// Button handlers
document.getElementById('btn-save').onclick = saveUniverse;
document.getElementById('btn-load').onclick = loadUniverse;
document.getElementById('btn-reset').onclick = resetGame;
document.getElementById('tslider').oninput = function(e) {
  timeScale = Math.pow(10, (e.target.value - 50) / 20);
  document.getElementById('time-scale').textContent = timeScale.toFixed(1) + 'x';
};

// ---- MAIN LOOP ----
function loop(now) {
  var dt = Math.max(Math.min((now-lastTime)/1000, 0.05), 0.016) * timeScale;
  lastTime = now; frameCount++;
  if (frameCount % 10 === 0) { fps = Math.round(1/(dt/timeScale)); document.getElementById('fps').textContent = fps + ' fps'; }

  updatePhysics(dt);

  var paneW = window.innerWidth / 2;
  renderPane(ctxs[0], ships[0], ships[1], paneW, canvases[0].height, gameTime * 0.3);
  renderPane(ctxs[1], ships[1], ships[0], paneW, canvases[1].height, -gameTime * 0.3 + Math.PI);

  // Sync info
  var syncDrift = 0;
  for (var i = 0; i < ships.length; i++) {
    for (var j = i+1; j < ships.length; j++) {
      var dx = ships[i].pos[0]-ships[j].pos[0];
      var dy = ships[i].pos[1]-ships[j].pos[1];
      var dz = ships[i].pos[2]-ships[j].pos[2];
      // drift check (should be 0 in authoritative model)
    }
  }

  requestAnimationFrame(loop);
}

setInterval(function(){ loop(performance.now()); }, 16);
console.log('SPIACE Phase 4 loaded | Multiplayer: 2 clients, authoritative sync');
</script>
</body>
</html>
