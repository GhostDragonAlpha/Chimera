<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SPIACE NATIVE VIEWER — C++ core, browser eyes</title>
<style>
  html, body { margin:0; height:100%; background:#07080c; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:10px; left:10px; color:#9fd; font:12px/1.5 monospace;
         white-space:pre; text-shadow:0 0 4px #000; pointer-events:none; }
  #tag { position:fixed; bottom:10px; left:10px; color:#567; font:11px monospace;
         pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">booting…</div>
<div id="tag">C++ ca_core.exe → SSE → splats · this page holds ZERO simulation logic</div>
<div id="ctl" style="display:none;position:fixed;bottom:10px;right:10px;
                    font:12px monospace">
  <button id="bwave">WAVE (1)</button> <button id="bwalk">WALK (2)</button>
  <button id="brest">REST (3)</button> <button id="bauto">AUTO (4)</button>
   <button id="bdrop">DROP (5)</button> <button id="bnav">NAV (6)</button>
   <button id="bteddy">TEDDY (7)</button>
   <button id="bmuscle">MUSCLE (8)</button>
   <button id="brom">ROM (9)</button>

</div>
<script type="module">
// ============================================================================
// SPIACE NATIVE VIEWER — the browser is the EYES, not the brain. The structure
// is grown by native/ca_core.cpp from a .chimera genome (the same rule tables
// as G1/G2/G3); this page only turns the streamed cell identities into splats.
// The FIRST wire line is {"type":"meta","kind":...} — it selects which
// PRESENTATION table below applies. Everything in those tables is how a cell
// LOOKS (color, splat size, camera framing), never what the simulation DOES.
// ============================================================================

// ---------- presentation tables (zero simulation logic) ----------------------
// wall geometry constants mirror how a brick LOOKS; the sim never sees them.
const WALL = { brickLen:0.22, brickH:0.075, gap:0.012, courses:12, wide:18 };
const PRESENT = {
  wall:     { focus: { cx: WALL.wide * (WALL.brickLen + WALL.gap) / 2,
                       cy: WALL.courses * (WALL.brickH + WALL.gap) / 2,
                       R: 3.4, eyeY: 1.35, ang0: 0.42 },
              groundY: -0.09, cell: 0.05 },
  oak:      { focus: { cx: 0, cy: 1.05, R: 3.0, eyeY: 1.35, ang0: 0.6 },
              groundY: -0.06, cell: 0.05 },   // focus copied from spiace_grow
  creature: { focus: { cx: -0.2, cy: 0, R: 2.6, eyeY: 0.8, ang0: 0.6 },
              groundY: -0.30, cell: 0.06 },
};

// ---------- stream -----------------------------------------------------------
let KIND = null, PRES = null, GENOME = '?';
let cells = [], lastTick = 0, lastViol = 0, done = false;
let lastHeight = 0, lastLeaves = 0, lastTips = 0;               // oak frame stats
let lastPhase = '', lastLimbs = 0, lastEyes = 0;                // creature stats
let finalLedger = null;
const histCells = [], histViol = [];
let splatsDirty = true;
const splatData = [];
// G4/G5 embodiment wire state (bear genomes) — presentation only: the C++
// core owns the rig, the IK, the gait, and the learner; this page renders
let EMB = 0, rigged = false, bodyX = 0, lastCmd = 'rest', lastRes = null,
    waveDone = false, episode = 0, eps = 0, waveBack = 0, visitorPos = null,
    bodyY = 0, velY = 0, inContact = true, groundWire = null,   // N5 physics
    groundNow = null, terrainWire = null, terrainScale = 1024,  // N6 terrain
    goalWire = null, lastNav = null;                           // N8 goal+state
let camLagX = 0;              // lagged follow — translation must be VISIBLE
const newCellKeys = new Set();   // voxels ADDED this tick (the CA action)
let prevCellKeys = new Set();
const posedMap = new Map();      // "x,y,z" -> [px,py,pz] (cell units)
const earKeys = new Set();       // "x,y,z" of the two derived ear cells
let romState = null;             // PART A: {chain, chains, th0, th1} or null
const romChainKeys = [];         // per-chain Sets of cKey ints (rig wire)
let SHELL = null;              // T2: teddy render pyramid — appearance only
const FLAT = location.search.includes('flat');   // T2 debug: uniform shell color
let teddyFramed = false;       // T5: camera distance DERIVED from body bounds
let exposure = 1.0;            // T5: display gain (the sRGB encode is the fix)

const es = new EventSource('/stream');
es.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.type === 'meta') {
    KIND = m.kind; GENOME = m.name; EMB = m.embodiment || 0; camLagX = 0;
    romState = null;
    PRES = structuredClone(PRESENT[KIND] || PRESENT.wall);   // T5: clone — the
    // teddy's derived framing must never mutate the shared presentation table
    teddyFramed = false;
    if (m.cell > 0) PRES.cell = m.cell;      // the core reports its cell size
    if (EMB) document.getElementById('ctl').style.display = 'block';
    if (GENOME.startsWith('teddy') && !SHELL)
      fetch('/genomes/teddy_shell.json').then(r => r.json()).then(j => {
        for (const L of j.levels)      // T6: the shell payload is DISPLAY-
          L.coll = L.col.map(c => [Math.pow(c[0], 2.2),      // REFERRED sRGB —
                                   Math.pow(c[1], 2.2),      // decode once so
                                   Math.pow(c[2], 2.2)]);    // the pipe's
        SHELL = j; splatsDirty = true;   // encode round-trips the scan's color
      }).catch(() => {});
    window.__growthStats = stats();
    return;
  }
  if (m.type === 'rig') {
    rigged = true; earKeys.clear();
    for (const e2 of m.ears) earKeys.add(e2.join(','));
    romChainKeys.length = 0;                     // PART A: chain membership
    for (const ch of m.chains || [])
      romChainKeys.push(new Set(ch.path.map(p => cKey(p[0], p[1], p[2]))));
    if (GENOME.startsWith('teddy') && !GENOME.includes('muscle') && m.chains) {
      // derived front view (PART A): the face points from the hind-chain
      // roots toward the fore-chain roots — the camera looks down that
      // axis. Measured on the survey strip: the fore end carries the ear
      // and reads as the teddy's front. The muscle genome keeps its side
      // view — gait readability is ACROSS the frame there.
      let fx = 0, fz = 0, nf = 0, hx = 0, hz = 0, nh = 0;
      for (const ch of m.chains) {
        const r = ch.path[0];
        if (ch.fore) { fx += r[0]; fz += r[2]; nf++; }
        else { hx += r[0]; hz += r[2]; nh++; }
      }
      if (nf && nh) {
        const dx = fx / nf - hx / nh, dz = fz / nf - hz / nh;
        PRES.focus.ang0 = Math.atan2(dx, dz);
      }
    }
    if (m.ground !== undefined) groundWire = m.ground;   // N5: derived plane
    if (m.goalX !== undefined) goalWire = m.goalX;         // N8: flag position
    if (m.terrain) {                                     // N6: grown world
      terrainWire = new Map(m.terrain);
      terrainScale = m.terrainScale || 1024;
    }
    window.__growthStats = stats();
    return;
  }
  if (m.type === 'anim') {
    lastCmd = m.cmd; lastRes = m.res; bodyX = m.body[0];
    bodyY = m.body[1]; velY = m.vy; inContact = m.contact;   // N5 physics
    groundNow = m.ground;                                    // N6 per-frame
    lastNav = m.nav || null;                                 // N8 nav state
    romState = m.rom || null;                                // PART A: ROM demo
    waveDone = m.waveDone; episode = m.episode; eps = m.eps;
    waveBack = m.waveBack; visitorPos = m.visitor;
    if (m.cells) {
      cells = m.cells;   // T3: the live lattice rides anim frames
      newCellKeys.clear();
      const cur = new Set();
      for (const c of cells) cur.add(cKey(c[0], c[1], c[2]));
      for (const k of cur) if (!prevCellKeys.has(k)) newCellKeys.add(k);
      prevCellKeys = cur;
    }
    posedMap.clear();
    for (const p of m.posed)
      posedMap.set(p[0] + ',' + p[1] + ',' + p[2], [p[3], p[4], p[5]]);
    splatsDirty = true;
    window.__growthStats = stats();
    return;
  }
  if (m.type === 'final') { finalLedger = m; done = true;
                            window.__growthStats = stats(); return; }
  if (m.type !== 'frame') return;
  cells = m.cells; lastTick = m.tick; lastViol = m.violations; done = m.done;
  if (KIND === 'oak') { lastHeight = m.height; lastLeaves = m.leaves;
                        lastTips = m.tips; }
  if (KIND === 'creature') { lastPhase = m.phase; lastLimbs = m.limbs;
                             lastEyes = m.eyes; }
  histCells.push(cells.length); histViol.push(m.violations);
  splatsDirty = true;
  window.__growthStats = stats();
};
function stats() {
  const s = { kind: KIND, genome: GENOME, tick: lastTick, cellCount: cells.length,
              violations: lastViol, done };
  if (KIND === 'wall') {
    let maxCourse = -1;
    for (const c of cells) maxCourse = Math.max(maxCourse, c[0]);
    s.blueprintCount = Math.ceil(WALL.courses / 2) * WALL.wide +
                       Math.floor(WALL.courses / 2) * (WALL.wide - 1);
    s.maxCourse = maxCourse;
  } else if (KIND === 'oak') {
    s.height = lastHeight; s.leaves = lastLeaves; s.tips = lastTips;
  } else if (KIND === 'creature') {
    s.phase = lastPhase; s.limbs = lastLimbs; s.eyes = lastEyes;
    if (EMB) {
      s.rigged = rigged; s.cmd = lastCmd; s.res = lastRes; s.bodyX = bodyX;
      s.waveDone = waveDone; s.episode = episode; s.eps = eps;
      s.bodyY = bodyY; s.vy = velY; s.contact = inContact;   // N5 physics
      s.ground = groundNow !== null ? groundNow : groundWire;  // N6 dynamic
      if (goalWire !== null) s.goalX = goalWire;              // N8 flag pos
      if (lastNav) s.nav = lastNav;                           // N8 nav state
      if (romState) s.rom = romState;                         // PART A: ROM
    }
  }
  return s;
}
window.__growthCheck = () => ({ kind: KIND, cells, histCells, histViol,
                                violations: lastViol, done, tick: lastTick,
                                final: finalLedger,
                                posed: [...posedMap.entries()] });
window.__setAng = a => { if (PRES) PRES.focus.ang0 = a; };   // probe: orbit

// ---------- embodiment commands (buttons + 1-4 -> POST /cmd -> core stdin) ---
function bearCmd(c) { fetch('/cmd', { method: 'POST', body: c }); }
document.getElementById('bwave').onclick = () => bearCmd('wave');
document.getElementById('bwalk').onclick = () =>
  bearCmd(lastCmd === 'walk' ? 'rest' : 'walk');
document.getElementById('brest').onclick = () => bearCmd('rest');
document.getElementById('bauto').onclick = () =>
  bearCmd(lastCmd === 'auto' ? 'rest' : 'auto');
document.getElementById('bdrop').onclick = () => bearCmd('drop');   // N5
(document.getElementById('bnav')).onclick = () =>
  bearCmd(lastCmd === 'nav' ? 'rest' : 'nav');                // N8 toggle
function teddyCmd() { fetch('/cmd', { method: 'POST', body: 'genome:teddy' }); }
(document.getElementById('bteddy')).onclick = () => teddyCmd();   // T1 vox genome
function muscleCmd() { fetch('/cmd', { method: 'POST', body: 'genome:teddymuscle' }); }
(document.getElementById('bmuscle')).onclick = () => muscleCmd();  // T3 voxel-muscle
(document.getElementById('brom')).onclick = () => bearCmd('rom');  // PART A: ROM demo
window.addEventListener('keydown', e => {
  if (!EMB) return;
  if (e.key === '1') bearCmd('wave');
  else if (e.key === '2') bearCmd(lastCmd === 'walk' ? 'rest' : 'walk');
  else if (e.key === '3') bearCmd('rest');
  else if (e.key === '4') bearCmd(lastCmd === 'auto' ? 'rest' : 'auto');
  else if (e.key === '5') bearCmd('drop');
  else if (e.key === '6') bearCmd(lastCmd === 'nav' ? 'rest' : 'nav');
  else if (e.key === '7') teddyCmd();
  else if (e.key === '8') muscleCmd();
  else if (e.key === '9') bearCmd('rom');
});

// ---------- splats (palettes copied from spiace_grow.html) --------------------
function hash01(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function ground(y0, x0 = 0) {              // N5: the grid scrolls with the bear
  const gx0 = Math.round(x0 / 0.24);
  for (let gx = gx0 - 8; gx <= gx0 + 8; gx++) for (let gz = -8; gz <= 8; gz++) {
    const h = hash01(gx * 13 + gz * 41);
    splatData.push({ p: [gx * 0.24, y0, gz * 0.24], s: 0.16,
                     col: [0.14 + 0.05*h, 0.13 + 0.05*h, 0.11 + 0.04*h, 1] });
  }
}
function wallSplats() {
  const xp = WALL.brickLen + WALL.gap, cy = WALL.brickH / 2;
  for (const [y, i] of cells) {
    const off = (y % 2 === 0) ? 0 : xp / 2;
    const x0 = i * xp + off;
    const h = hash01(y * 31 + i * 7);
    const r = 0.58 + 0.10 * h, g = 0.24 + 0.06 * h, b = 0.16 + 0.04 * h;
    const yy = y * (WALL.brickH + WALL.gap) + cy;
    for (let k = -1; k <= 1; k++)
      splatData.push({ p: [x0 + WALL.brickLen / 2 + k * WALL.brickLen * 0.28, yy, 0],
                       s: 0.075, col: [r, g, b, 1] });
  }
  for (let gx = -2; gx < 22; gx++) for (let gz = -3; gz <= 3; gz++) {
    const h = hash01(gx * 13 + gz * 41);
    splatData.push({ p: [gx * 0.24, -0.09, gz * 0.24], s: 0.16,
                     col: [0.16 + 0.04*h, 0.15 + 0.04*h, 0.14 + 0.03*h, 1] });
  }
}
function oakSplats() {
  const s0 = PRES.cell;
  for (const [x, y, z, mat] of cells) {
    const h = hash01(x * 7 + y * 31 + z * 13);
    const p = [x * s0, y * s0, z * s0];
    if (mat === 'wood')
      splatData.push({ p, s: s0 * 0.62, col: [0.36 + 0.08*h, 0.22 + 0.05*h, 0.12, 1] });
    else if (mat === 'leaf')
      splatData.push({ p, s: s0 * 0.72, col: [0.13 + 0.06*h, 0.44 + 0.14*h, 0.14, 1] });
    else   // bud
      splatData.push({ p, s: s0 * 0.5, col: [0.55, 0.62 + 0.1*h, 0.18, 1] });
  }
  ground(PRES.groundY);
}
function critSplats() {
  const s0 = PRES.cell;
  const bx = EMB ? bodyX * s0 : 0;         // the walking bear's drift
  for (const [x, y, z, mat] of cells) {
    const h = hash01(x * 7 + y * 31 + z * 13);
    let lp = [x, y, z];
    if (EMB && rigged) {                   // G4: limb/digit cells render at
      const posed = posedMap.get(x + ',' + y + ',' + z);   // FK-posed pos
      if (posed) lp = posed;
    }
    const p = [lp[0] * s0 + bx, (lp[1] + bodyY) * s0, lp[2] * s0];   // N5: y rides physics
    if (SHELL) continue;              // T2: the shell IS the teddy's skin
    let col;
    if (mat === 'eye') col = [0.16, 0.26, 0.78, 1];
    else if (EMB && (mat === 'ear' || earKeys.has(x + ',' + y + ',' + z)))
      col = [0.86, 0.62, 0.50, 1];
    else if (mat === 'limb')
      col = EMB ? [0.56 + 0.05*h, 0.40, 0.30, 1]          // darker fur
                : [0.64 + 0.06*h, 0.45, 0.35, 1];
    else col = EMB ? [0.66 + 0.05*h, 0.47 + 0.03*h, 0.34, 1]   // fur
                   : [0.74 + 0.06*h, 0.54 + 0.04*h, 0.43, 1];
    splatData.push({ p, s: s0 * 0.72, col });
  }
  if (SHELL) shellSplats();
  if (EMB && visitorPos) {                 // G5: the visitor, in world space
    const bob = waveBack > 0 ? 0.12 * Math.abs(Math.sin(waveBack * 0.3)) : 0;
    splatData.push({ p: [visitorPos[0] * s0, 0.06 + bob, visitorPos[2] * s0],
                     s: 0.10, col: [0.75, 0.20, 0.18, 1] });
    splatData.push({ p: [visitorPos[0] * s0, 0.17 + bob, visitorPos[2] * s0],
                     s: 0.075, col: [0.85, 0.35, 0.25, 1] });
  }
  // N8: flag pole (6 splats) + pennant (4 splats) at goalWire
  if (EMB && goalWire !== null && terrainWire) {
    const base = groundWire !== null ? groundWire : -4;
    const gx = goalWire;
    const h = (terrainWire.get(gx) || 0) / terrainScale;
    const fy = (base + h) * s0;
    for (let k = 0; k < 6; k++)
      splatData.push({ p: [gx * s0, fy + 0.06 + k * 0.09, 0],
                       s: 0.05, col: [0.85, 0.82, 0.70, 1] });
    for (let k = 0; k < 4; k++)
      splatData.push({ p: [gx * s0 + 0.06 + k * 0.07, fy + 0.55 - k * 0.03, 0],
                       s: 0.06, col: [0.90, 0.25, 0.15, 1] });
  }
  groundSplats(s0, bx);   // T2: density-law ground (below) — meatballs retired
}
// ---------- T2: camera-driven density (the measured 3DGS law) -------------
// Real scans carry ~0.5-2 splats per screen PIXEL; per-cm density is that law
// x camera distance. So density here is never a constant: level/spacing are
// picked so one splat covers ~2.5 px at the subject's depth.
function lodSpacing(depth) {
  const hPx = canvas.clientHeight || 720, f = 1 / Math.tan(0.85 / 2);
  return 2.5 * Math.max(0.5, depth) / ((hPx / 2) * f);
}
function shellLevel() {
  const sp = lodSpacing(PRES.focus.R);
  let best = SHELL.levels[0];
  for (const L of SHELL.levels)
    if (L.cell >= sp * 0.55) best = L;      // finest level still covering
  return best;
}
window.__dbgShell = () => ({
  loaded: !!SHELL,
  levels: SHELL ? SHELL.levels.map(L => [L.h, L.n, L.cell]) : null,
  picked: SHELL ? shellLevel().h : null,
  spacing: PRES ? lodSpacing(PRES.focus.R) : null,
  splatCount: splatData.length,
});
// T5: the frame-fill probe — the framing claim is MEASURED, not eyeballed.
window.__dbgFrame = () => {
  if (!cells.length || !PRES) return null;
  const s0 = PRES.cell;
  let y0 = 1e9, y1 = -1e9;
  for (const c of cells) { if (c[1] < y0) y0 = c[1]; if (c[1] > y1) y1 = c[1]; }
  const bodyH = (y1 - y0 + 1) * s0;
  return { R: PRES.focus.R, bodyH,
           fillFrac: bodyH / (2 * PRES.focus.R * Math.tan(0.85 / 2)) };
};
// T3: shell splats are bound to sim cells; when the voxel-muscle gait moves
// a cell, its shell splats follow (rebind = home cell, else nearest within
// +/-2 — searched only for splats whose bound cell vanished this frame).
const BINDS = new Map();   // L.h -> { key: Int32Array, off: Float32Array }
const cKey = (x, y, z) => (x + 64) + (y + 64) * 128 + (z + 64) * 16384;
function shellSplats() {
  const L = shellLevel();
  const s0 = PRES.cell, size = L.cell * 0.6, bx = EMB ? bodyX * s0 : 0;   // T6:
  // splat disc = level spacing + 20% overlap (was 1.9x = 17px discs on 4.5px
  // spacing — 3.8x overlap, the measured popcorn-mush cause)
  let B = BINDS.get(L.h);
  if (!B || B.key.length !== L.n) {
    B = { key: new Int32Array(L.n).fill(-1), off: new Float32Array(L.n * 3) };
    BINDS.set(L.h, B);
  }
  const occ = new Set();
  const live = cells.length && typeof cells[0][0] === "number" && cells[0].length >= 3
             && GENOME.startsWith("teddy");
  if (live) for (const c of cells) occ.add(cKey(c[0], c[1], c[2]));
  for (let i = 0; i < L.n; i++) {
    const p = L.pos[i], c = L.coll ? L.coll[i] : L.col[i];   // T6: decoded
    let wx, wy, wz, legZ = false, hot = false, rommed = false;
    if (live) {
      const hx = Math.round(p[0] * L.cell / s0), hy = Math.round(p[1] * L.cell / s0),
            hz = Math.round(p[2] * L.cell / s0);
      let k = B.key[i];
      if (k < 0 || !occ.has(k)) {          // (re)bind: home, else nearest +-2
        k = occ.has(cKey(hx, hy, hz)) ? cKey(hx, hy, hz) : -1;
        if (k < 0) {
          let best = 1e9;
          for (let dx = -2; dx <= 2; dx++) for (let dy = -2; dy <= 2; dy++)
            for (let dz = -2; dz <= 2; dz++) {
              const k2 = cKey(hx + dx, hy + dy, hz + dz);
              if (!occ.has(k2)) continue;
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 < best) { best = d2; k = k2; }
            }
        }
        if (k >= 0) {
          B.key[i] = k;
          const bx2 = (k % 128) - 64, by2 = (Math.floor(k / 128) % 128) - 64,
                bz2 = Math.floor(k / 16384) - 64;
          B.off[i * 3] = p[0] * L.cell - bx2 * s0;   // offset rides the
          B.off[i * 3 + 1] = p[1] * L.cell - by2 * s0;   // BOUND cell
          B.off[i * 3 + 2] = p[2] * L.cell - bz2 * s0;
        }
      }
      if (k >= 0) {                        // bound: follow the live cell
        const cx = (k % 128) - 64, cy = (Math.floor(k / 128) % 128) - 64,
              cz = (Math.floor(k / 16384)) - 64;
        wx = cx * s0 + B.off[i * 3]; wy = cy * s0 + B.off[i * 3 + 1];
        wz = cz * s0 + B.off[i * 3 + 2];
        const pd = posedMap.get(cx + ',' + cy + ',' + cz);
        if (pd) {                          // PART A: FK pose
          wx += (pd[0] - cx) * s0;         // displaces the cell;
          wy += (pd[1] - cy) * s0;         // the shell rides the
          wz += (pd[2] - cz) * s0;         // pose delta (offset
        }                                  // rigid: ROM strip)
        legZ = cy <= -2;                 // the stepping zone reads darker
        hot = newCellKeys.has(k);        // voxels born this tick read HOT
        rommed = !!(romState && romChainKeys[romState.chain] &&
                    romChainKeys[romState.chain].has(k));
      } else {                             // orphan: hold the grown pose
        wx = p[0] * L.cell; wy = p[1] * L.cell; wz = p[2] * L.cell;
      }
    } else {
      wx = p[0] * L.cell; wy = p[1] * L.cell; wz = p[2] * L.cell;
    }
    let cc = FLAT ? [0.55, 0.42, 0.30] : c;
    if (legZ) cc = [cc[0] * 0.55, cc[1] * 0.55, cc[2] * 0.62];
    if (rommed)                    // PART A: swept chain reads CYAN
      cc = [cc[0] * 0.45 + 0.05, cc[1] * 0.6 + 0.25, Math.min(1, cc[2] * 0.5 + 0.55)];
    if (hot)
      cc = [Math.min(1, cc[0] * 1.4 + 0.45), cc[1] * 0.55 + 0.12, cc[2] * 0.3];
    splatData.push({ p: [wx + bx, wy + bodyY * s0, wz], s: size,
                     col: [cc[0], cc[1], cc[2], 1] });
  }
}
function groundSplats(s0, bx) {
  const base = EMB && groundWire !== null ? groundWire : -4;
  const cx0 = EMB ? bodyX : 0;
  const x0 = (cx0 - 48) * s0, x1 = (cx0 + 48) * s0, z1 = 26 * s0;
  // T5: the density law is PER-DEPTH — a ground splat's spacing is set by
  // ITS distance from the camera, not the subject's. And the background's
  // rho/4 rule applies to COUNT, not just spacing: the ground gets a
  // quarter of the subject's splat budget, marched outward from the
  // subject until spent (measured bug: uniform spacing cost 259k splats /
  // 20 fps at close framing; the first per-depth march still spent 140k
  // because the near-field patch is huge relative to the camera distance).
  // The fade reaches zero at the marched boundary, so the stop is invisible.
  const eyeD = PRES.focus.R;
  const stepAt = d => lodSpacing(Math.max(0.5, Math.hypot(d, eyeD))) * 2;
  const budget = SHELL ? shellLevel().n >> 2 : 4096;
  // Isotropic spend: concentric rings around the subject (the camera orbits
  // the subject, so the ground that matters is a disc — the contact zone
  // plus the parallax field). Row-marching spent the whole budget on a
  // runway band along z=0 (measured, strip #2); rings spend it where the
  // subject actually stands. The fade reaches zero at the disc edge.
  const pts = [];
  let fadeEff = 1e-6;
  for (let r = stepAt(0) * 0.5; pts.length < budget; r += stepAt(r)) {
    const sp = stepAt(r);
    const n = Math.max(6, Math.round(2 * Math.PI * r / sp));
    for (let k = 0; k < n && pts.length < budget; k++) {
      const a = 2 * Math.PI * k / n;
      const x = cx0 * s0 + r * Math.cos(a), z = r * Math.sin(a);
      if (x < x0 || x > x1 || Math.abs(z) > z1) continue;
      pts.push([x, z, sp]);
    }
    fadeEff = r;
    if (r > 4 * eyeD) break;   // the law never lets the disc outrun the scene
  }
  for (const [x, z, sp] of pts) {
    const col2 = Math.round(x / s0);
    const hh = terrainWire ? ((terrainWire.get(col2) || 0) / terrainScale) : 0;
    const y = (base + hh) * s0 - 0.012;
    const d = Math.hypot(x - cx0 * s0, z);
    const fade = Math.max(0, 1 - d / fadeEff);
    const h2 = hash01(Math.round(x * 997) + Math.round(z * 613));
    const k = 0.30 * fade * (0.9 + 0.2 * h2);
    splatData.push({ p: [x, y, z], s: sp * 0.62, col: [k, k * 0.97, k * 0.85, 1] });
  }
}

function rebuildSplats() {
  splatData.length = 0;
  if (KIND === 'oak') oakSplats();
  else if (KIND === 'creature') critSplats();
  else wallSplats();
  splatsDirty = false;
}

// ---------- WebGPU Gaussian billboard splat renderer (same pipe as GROW) -----
const canvas = document.getElementById('c');
window.__renderer = 'none';
let device, ctx, pipeline, ubuf, ibuf, depthTex, bindGroup, cap = 0;

const WGSL = `
struct U { proj: mat4x4f, view: mat4x4f, exposure: f32 };
@group(0) @binding(0) var<uniform> u: U;
struct VOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) col: vec4f };
@vertex fn vs(@builtin(vertex_index) vi: u32,
              @location(0) center: vec3f, @location(1) size: f32,
              @location(2) col: vec4f) -> VOut {
  var corners = array<vec2f, 4>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0),
                                vec2f(-1.0, 1.0), vec2f(1.0, 1.0));
  let cr = corners[vi];
  let vp = u.view * vec4f(center, 1.0);
  let p = vp.xyz + vec3f(cr * size, 0.0);
  var o: VOut;
  o.pos = u.proj * vec4f(p, 1.0);
  o.uv = cr; o.col = col;
  return o;
}
@fragment fn fs(inp: VOut) -> @location(0) vec4f {
  let r2 = dot(inp.uv, inp.uv);
  if (r2 > 1.0) { discard; }
  let g = exp(-4.0 * r2);
  let shade = 0.80 + 0.20 * g;      // T2: flat-ish — no dark rims between splats
  // T5: the canvas is sRGB but the pipe wrote LINEAR values — the missing
  // transfer function put everything ~2 stops dark (the muddy-teddy bug).
  // The encode is derived (the sRGB standard), not a tuned brightness knob.
  let lin = inp.col.rgb * shade * 1.12 * u.exposure;
  return vec4f(pow(lin, vec3f(1.0 / 2.2)), 1.0);
}`;

async function initGPU() {
  if (!navigator.gpu) throw new Error('no WebGPU');
  const adapter = await navigator.gpu.requestAdapter();
  device = await adapter.requestDevice();
  ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });
  pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: device.createShaderModule({ code: WGSL }), entryPoint: 'vs',
      buffers: [{ arrayStride: 32, stepMode: 'instance', attributes: [
        { shaderLocation: 0, offset: 0, format: 'float32x3' },
        { shaderLocation: 1, offset: 12, format: 'float32' },
        { shaderLocation: 2, offset: 16, format: 'float32x4' }] }] },
    fragment: { module: device.createShaderModule({ code: WGSL }), entryPoint: 'fs',
      targets: [{ format }] },
    primitive: { topology: 'triangle-strip', cullMode: 'none' },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
  });
  ubuf = device.createBuffer({ size: 144, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  bindGroup = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: ubuf } }] });
  window.__renderer = 'webgpu-splat';
}

// ---------- camera -------------------------------------------------------------
function perspective(fovY, aspect, near, far) {
  const f = 1 / Math.tan(fovY / 2), m = new Float32Array(16);
  m[0] = f / aspect; m[5] = f; m[10] = far / (near - far); m[11] = -1;
  m[14] = far * near / (near - far);
  return m;
}
function lookAt(ex, ey, ez, tx, ty, tz) {
  let fx = tx - ex, fy = ty - ey, fz = tz - ez;
  let fl = Math.hypot(fx, fy, fz); fx /= fl; fy /= fl; fz /= fl;
  let rx = -fz, ry = 0, rz = fx;
  let rl = Math.hypot(rx, ry, rz); rx /= rl; rz /= rl;
  const ux = ry * fz - rz * fy, uy = rz * fx - rx * fz, uz = rx * fy - ry * fx;
  return new Float32Array([
    rx, ux, -fx, 0,  ry, uy, -fy, 0,  rz, uz, -fz, 0,
    -(rx * ex + ry * ey + rz * ez), -(ux * ex + uy * ey + uz * ez),
    (fx * ex + fy * ey + fz * ez), 1]);
}

// ---------- T5: derived framing (the 3DGS law applies to the CAMERA too) ----
// A real scan's camera is held where the subject fills the frame — so the
// subject's screen size derives from ITS bounds, never a per-genome constant
// by taste. Runs once, on the first frame that carries the grown body.
function deriveTeddyFraming() {
  if (teddyFramed || !GENOME.startsWith('teddy') || !cells.length) return;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (const c of cells) {
    if (c[0] < x0) x0 = c[0]; if (c[0] > x1) x1 = c[0];
    if (c[1] < y0) y0 = c[1]; if (c[1] > y1) y1 = c[1];
    if (c[2] < z0) z0 = c[2]; if (c[2] > z1) z1 = c[2];
  }
  const s0 = PRES.cell;
  const bodyH = (y1 - y0 + 1) * s0;
  const bodyW = Math.max(x1 - x0 + 1, z1 - z0 + 1) * s0;
  // fill target 45% of frame height (margin for gait lift and the wave);
  // horizontal fit derived the same way against the live aspect ratio.
  const aspect = (canvas.clientWidth || 1280) / (canvas.clientHeight || 720);
  const tV = Math.tan(0.85 / 2), tH = tV * aspect;
  PRES.focus.R = Math.max(bodyH / (2 * tV * 0.45), bodyW / (2 * tH * 0.45));
  PRES.focus.cx = (x0 + x1) / 2 * s0;
  PRES.focus.cy = (y0 + y1) / 2 * s0;
  PRES.focus.eyeY = PRES.focus.cy + bodyH * 0.3;   // mild high angle, derived
  teddyFramed = true;
}

// ---------- main loops (setInterval — Playwright-safe, project law) ------------
let frames = 0, fpsT = performance.now(), fps = 0;

function render() {
  if (!device || !PRES) return;
  deriveTeddyFraming();
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; depthTex = null; }
  if (!depthTex) depthTex = device.createTexture({ size: [w, h], format: 'depth24plus',
    usage: GPUTextureUsage.RENDER_ATTACHMENT });
  if (splatsDirty) {
    rebuildSplats();
    const n = splatData.length;
    if (n > cap) {
      cap = Math.max(4096, n * 2);
      ibuf = device.createBuffer({ size: cap * 32,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
    }
    const f32 = new Float32Array(n * 8);
    splatData.forEach((s, i) =>
      f32.set([s.p[0], s.p[1], s.p[2], s.s, s.col[0], s.col[1], s.col[2], s.col[3]], i * 8));
    device.queue.writeBuffer(ibuf, 0, f32);
  }
  const t = performance.now() / 1000;
  const ang = PRES.focus.ang0 + 0.10 * Math.sin(t * 0.15);
  camLagX += (bodyX - camLagX) * 0.05;              // ease toward the body:
  const fx = PRES.focus.cx + (EMB ? camLagX * PRES.cell : 0);  // it drifts in-frame
  const fy = PRES.focus.cy + (EMB ? bodyY * PRES.cell : 0);   // track the fall
  const eye = [fx + PRES.focus.R * Math.sin(ang), PRES.focus.eyeY + (EMB ? bodyY * PRES.cell : 0),
               PRES.focus.R * Math.cos(ang)];
  const proj = perspective(0.85, w / h, 0.05, 50);
  const view = lookAt(eye[0], eye[1], eye[2], fx, fy, 0);
  const u32 = new Float32Array(36); u32.set(proj, 0); u32.set(view, 16);
  u32[32] = exposure;
  device.queue.writeBuffer(ubuf, 0, u32);
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({
    colorAttachments: [{ view: ctx.getCurrentTexture().createView(),
      clearValue: { r: 0.027, g: 0.031, b: 0.047, a: 1 }, loadOp: 'clear', storeOp: 'store' }],
    depthStencilAttachment: { view: depthTex.createView(),
      depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' } });
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  if (ibuf && splatData.length) { pass.setVertexBuffer(0, ibuf); pass.draw(4, splatData.length); }
  pass.end();
  device.queue.submit([enc.finish()]);
  frames++;
  const now = performance.now();
  if (now - fpsT > 1000) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; }
}

function hud() {
  const s = stats();
  let body;
  if (KIND === 'oak')
    body = `tick    ${s.tick}\ncells   ${s.cellCount}\nheight  ${s.height}\n` +
           `leaves  ${s.leaves}\ntips    ${s.tips}\ndominance viol ${s.violations}`;
  else if (KIND === 'creature') {
    body = `tick    ${s.tick}\ncells   ${s.cellCount}\nphase   ${s.phase}\n` +
           `limbs   ${s.limbs}\neyes    ${s.eyes}`;
    if (EMB) body += `\ncmd     ${s.cmd}${s.waveDone ? ' (wave done)' : ''}` +
           `\nres     ${s.res === null ? '—' : s.res.toFixed(4)}` +
           `\nbodyX   ${s.bodyX.toFixed(1)} cells` +
           `\nbodyY   ${(s.bodyY ?? 0).toFixed(2)} cells  vy ${(s.vy ?? 0).toFixed(4)}` +
           `\ncontact ${s.contact ? 'GROUND' : 'AIR'}    ground ${s.ground ?? '—'}` +
           `\nepisode ${s.episode}  eps ${s.eps.toFixed(3)}`;
    if (EMB && s.nav) body +=
      `\nNAV     st${s.nav.state} v${s.nav.verb} d=${s.nav.dist.toFixed(2)} ep${s.nav.ep} arr${s.nav.arrivals}` +
      (s.goalX !== undefined ? `  flag@${s.goalX}` : '');
    if (EMB && romState)
      body += `\nROM     chain ${romState.chain + 1}/${romState.chains}` +
              `  th0 ${romState.th0 >= 0 ? '+' : ''}${romState.th0.toFixed(2)}` +
              `  th1 ${romState.th1 >= 0 ? '+' : ''}${romState.th1.toFixed(2)} rad`;
  }
  else
    body = `tick    ${s.tick}\nbricks  ${s.cellCount} / ${s.blueprintCount || 210}` +
           `\ncourse  ${(s.maxCourse ?? -1) + 1} / ${WALL.courses}` +
           `\nviolations ${s.violations}`;
  document.getElementById('hud').textContent =
    `GENOME  ${s.genome}  [${s.kind || '?'}]\n${body}` +
    `\nstatus  ${s.done ? 'COMPLETE' : 'growing'}` +
    `\nfps     ${fps.toFixed(0)}\nrenderer ${window.__renderer}\nsource  C++ ca_core.exe (SSE)`;
}

initGPU().catch(e => { window.__renderer = 'unavailable: ' + e.message; });
setInterval(render, 16);
setInterval(hud, 250);
</script>
</body>
