<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPIACE RPG — Phase 2: Planetary Surface</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; display: flex; flex-direction: column; align-items: center; height: 100vh; font-family: monospace; color: #aaa; overflow: hidden; }
  canvas { image-rendering: pixelated; border: 1px solid #222; background: #050510; }
  #hud { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,.85); padding: 8px 12px; border-radius: 4px; font-size: 11px; line-height: 1.6; pointer-events: none; z-index: 10; }
  #hud .fps { color: #7f7; font-size: 14px; }
  #hud .ms { color: #ff7; }
  #hud .info { color: #7bf; }
  #hud .warn { color: #fa7; }
  #err { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #f77; font-size: 16px; text-align: center; display: none; z-index: 100; }
  .panel { position: fixed; background: rgba(5,5,20,.95); border: 1px solid #333; border-radius: 4px; padding: 8px 12px; font-size: 11px; line-height: 1.5; color: #aaa; z-index: 20; }
  .panel h3 { color: #7f7; margin-bottom: 4px; font-size: 12px; border-bottom: 1px solid #222; padding-bottom: 3px; }
  .panel pre { background: #0a0a1a; padding: 4px 6px; border-radius: 3px; overflow-x: auto; white-space: pre; color: #8cf; max-height: 120px; overflow-y: auto; font-size: 10px; }
  .panel button { background: #1a1a2e; color: #7f7; border: 1px solid #333; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; margin: 2px 2px 2px 0; }
  .panel button:hover { background: #2a2a4e; }
  .panel button.active { background: #7f7; color: #000; }
  #ctrl-panel { bottom: 10px; left: 10px; max-width: 280px; }
  #info-panel { bottom: 10px; right: 10px; max-width: 300px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 2px 0; gap: 8px; }
  .val { color: #ff7; min-width: 60px; text-align: right; font-size: 10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="fps" id="fps">-- fps</div>
  <div class="ms" id="times">-- ms</div>
  <div class="info" id="sys-info">SPIACE Phase 2 -- Planetary Surface + Atmosphere</div>
  <div class="warn" id="ship-info"></div>
  <div class="info" id="surface-info"></div>
  <div class="info" id="atmo-info"></div>
</div>
<div id="err"></div>
<div class="panel" id="ctrl-panel">
  <h3>Landing Controls</h3>
  <div class="row"><button id="btn-thrust">Thrust [X]</button><span class="val" id="thrust-status">OFF</span></div>
  <div class="row"><button id="btn-land">Auto-Land</button><button id="btn-takeoff">Takeoff</button></div>
  <div class="row"><label>Time Scale:</label><span class="val" id="time-scale">1x</span></div>
  <div class="row"><input type="range" id="tslider" min="0" max="100" value="50" style="width:100%;accent-color:#7f7"></div>
  <div class="row"><label>Star Angle:</label><span class="val" id="star-angle">90°</span></div>
  <div class="row"><button id="btn-day">Day</button><button id="btn-night">Night</button><button id="btn-dawn">Dawn</button></div>
</div>
<div class="panel" id="info-panel">
  <h3>Surface Telemetry</h3>
  <div class="row"><label>Altitude:</label><span class="val" id="alt">-- m</span></div>
  <div class="row"><label>Vertical Speed:</label><span class="val" id="vspeed">-- m/s</span></div>
  <div class="row"><label>Horizontal Speed:</label><span class="val" id="hspeed">-- m/s</span></div>
  <div class="row"><label>Landing Status:</label><span class="val" id="landing">AIRBORNE</span></div>
  <div class="row"><label>Atmosphere:</label><span class="val" id="atmo-pct">0%</span></div>
  <div class="row"><label>Surface Temp:</label><span class="val" id="temp">-- K</span></div>
  <div class="row"><label>Gravity:</label><span class="val" id="grav">-- m/s²</span></div>
  <div class="row"><label>Fuel:</label><span class="val" id="fuel-pct">50%</span></div>
</div>

<script>
// ============================================================
// SPIACE Phase 2 -- Planetary Surface with Atmosphere
// Thin-shell atmosphere model, fBm terrain, landing physics
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---- CONSTANTS ----
const G = 6.674e-11;
const GM_sun = 1.327e20;

// Planet parameters (Earth-like)
const PLANET_RADIUS = 6.371e6;       // 6,371 km
const PLANET_MASS = 5.972e24;        // kg
const ATMOSPHERE_HEIGHT = 8.5e4;     // 85 km scale height
const SEA_LEVEL_PRESSURE = 101325;   // Pa
const SURFACE_TEMP = 288;           // K (15°C)

// Ship
let ship = {
  pos: [0, PLANET_RADIUS + 50000, 0],  // 50 km altitude
  vel: [0, 0, 0],
  mass: 1000, fuelMass: 500, Isp: 300, thrust: 15000,
  onGround: false, landed: false
};

// Camera (orbit around planet, focus on ship)
let cam = { pos: [200000, 100000, 200000], target: [0, PLANET_RADIUS + 50000, 0] };
let keys = {};
let mouseDX = 0, mouseDY = 0;
let timeScale = 1;
let starAngle = Math.PI/2; // 90 degrees (noon)
let simTime = 0;
let lastTime = performance.now();
let frameCount = 0, fps = 0;

// ---- NOISE / TERRAIN (fBm) ----
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) & 0x7fffffff) / 0x7fffffff;
}

function smoothNoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx*fx*(3-2*fx), sy = fy*fy*(3-2*fy);
  const n00 = hash(ix,iy), n10 = hash(ix+1,iy);
  const n01 = hash(ix,iy+1), n11 = hash(ix+1,iy+1);
  return (n00*(1-sx)+n10*sx)*(1-sy) + (n01*(1-sx)+n11*sx)*sy;
}

function fbm(x, y, octaves=6) {
  let val = 0, amp = 1, freq = 1, max = 0;
  for(let i=0;i<octaves;i++){
    val += smoothNoise(x*freq, y*freq) * amp;
    max += amp; amp *= 0.5; freq *= 2;
  }
  return val / max;
}

function getTerrainHeight(lon, lat) {
  // lon, lat in radians
  const x = Math.cos(lat) * Math.sin(lon);
  const z = Math.sin(lat);
  const y = Math.cos(lat) * Math.cos(lon);
  const scale = 8;
  const n = fbm(x*scale + 100, z*scale + 200, 6);
  // Mountains: some areas higher
  return (n - 0.5) * 2000 * (0.5 + 0.5*Math.sin(lon*3 + lat*2)); // ±2km variation
}

// ---- ATMOSPHERE MODEL ----
function getAtmosphereDensity(altitude) {
  if(altitude < 0) altitude = 0;
  return Math.exp(-altitude / ATMOSPHERE_HEIGHT);
}

function getAtmospherePressure(altitude) {
  return SEA_LEVEL_PRESSURE * Math.exp(-altitude / ATMOSPHERE_HEIGHT);
}

function getTemperature(altitude, starAngle) {
  // Multi-layer model: troposphere (lapse rate) then stratosphere (constant)
  const baseTemp = SURFACE_TEMP + 10 * Math.cos(starAngle);
  if(altitude <= 12000) return baseTemp - 6.5 * (altitude / 1000);
  return baseTemp - 78 + 2 * ((altitude - 12000) / 1000); // stratosphere warms slightly
}

function getGravity(altitude) {
  const r = PLANET_RADIUS + altitude;
  return G * PLANET_MASS / (r * r);
}

// ---- INPUT ----
document.addEventListener('keydown', e => keys[e.code] = true);
document.addEventListener('keyup', e => keys[e.code] = false);
canvas.addEventListener('click', () => canvas.requestPointerLock?.());
document.addEventListener('mousemove', e => {
  if(document.pointerLockElement === canvas) { mouseDX += e.movementX; mouseDY += e.movementY; }
});

// Buttons
let autoLand = false;
document.getElementById('btn-thrust').onclick = function() {
  this.classList.toggle('active');
  document.getElementById('thrust-status').textContent = this.classList.contains('active') ? 'ON' : 'OFF';
};
document.getElementById('btn-land').onclick = () => { autoLand = !autoLand; document.getElementById('btn-land').classList.toggle('active', autoLand); };
document.getElementById('btn-takeoff').onclick = () => {
  ship.onGround = false; ship.landed = false;
  ship.vel = [0, 500, 0]; // brief boost
};
document.getElementById('btn-day').onclick = () => { starAngle = Math.PI/2; };
document.getElementById('btn-night').onclick = () => { starAngle = Math.PI; };
document.getElementById('btn-dawn').onclick = () => { starAngle = Math.PI/4; };
document.getElementById('tslider').oninput = (e) => {
  timeScale = Math.pow(10, (e.target.value - 50) / 20);
  document.getElementById('time-scale').textContent = timeScale.toFixed(1) + 'x';
};

// ---- MATH ----
function add(a,b){return[a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function scale(v,s){return[v[0]*s,v[1]*s,v[2]*s];}
function len(v){return Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);}
function norm(v){const l=len(v);return l>0?[v[0]/l,v[1]/l,v[2]/l]:[0,0,1];}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function dist(a,b){return len(sub(a,b));}

// ---- UPDATE ----
function update(dt) {
  const scaledDt = dt * timeScale;

  // Camera orbit (auto-rotate around planet)
  const camDist = 300000;
  const camAngle = simTime * 0.05;
  const autoCamPos = [Math.cos(camAngle)*camDist, PLANET_RADIUS + 80000, Math.sin(camAngle)*camDist];

  // Mouse look overrides camera
  if(document.pointerLockElement === canvas) {
    cam.pos[0] += mouseDX * 100;
    cam.pos[2] += mouseDY * 100;
    mouseDX = mouseDY = 0;
  } else {
    // Smooth follow auto-cam
    cam.pos = add(cam.pos, scale(sub(autoCamPos, cam.pos), Math.min(1, 2*scaledDt)));
  }
  cam.target = [ship.pos[0], ship.pos[1], ship.pos[2]];

  // Thrust
  const thrusting = keys['KeyX'] || document.getElementById('btn-thrust').classList.contains('active');
  if(thrusting && ship.fuelMass > 0) {
    // Thrust direction: up (radial from planet center)
    const up = norm(ship.pos);
    const accel = ship.thrust / ship.mass;
    ship.vel = add(ship.vel, scale(up, accel * scaledDt));
    ship.fuelMass -= ship.thrust * scaledDt / (ship.Isp * 9.81);
    if(ship.fuelMass < 0) ship.fuelMass = 0;
    ship.mass = 1000 + ship.fuelMass;
  }

  // Auto-land logic
  if(autoLand && !ship.onGround) {
    const alt = len(ship.pos) - PLANET_RADIUS;
    const vspeed = norm(ship.pos); // radial direction
    // Apply braking thrust opposite to velocity
    const speed = len(ship.vel);
    if(speed > 10) {
      const brakeDir = norm(ship.vel);
      const brakeAccel = Math.min(ship.thrust / ship.mass, 20); // cap at 20 m/s² deceleration
      ship.vel = add(ship.vel, scale(brakeDir, -brakeAccel * scaledDt));
      if(thrusting) {
        ship.fuelMass -= ship.thrust * scaledDt / (ship.Isp * 9.81);
        if(ship.fuelMass < 0) ship.fuelMass = 0;
        ship.mass = 1000 + ship.fuelMass;
      }
    }
    // Level out: reduce horizontal velocity
    const radialVel = dot(ship.vel, norm(ship.pos));
    const horizVel = sub(ship.vel, scale(norm(ship.pos), radialVel));
    if(len(horizVel) > 5) {
      ship.vel = add(ship.vel, scale(norm(horizVel), -5 * scaledDt));
    }
  }

  // Gravity
  const rMag = len(ship.pos);
  const alt = rMag - PLANET_RADIUS;
  const gravAccel = G * PLANET_MASS / (rMag * rMag);
  ship.vel = add(ship.vel, scale(norm(ship.pos), -gravAccel * scaledDt));

  // Atmospheric drag
  if(alt < ATMOSPHERE_HEIGHT * 5 && alt > 0) {
    const rho = getAtmosphereDensity(alt);
    const dragCoeff = 0.0002; // simplified
    const speed = len(ship.vel);
    const dragAccel = dragCoeff * rho * speed * speed / (ship.mass / 1000);
    ship.vel = add(ship.vel, scale(norm(ship.vel), -dragAccel * scaledDt));
  }

  // Integrate position
  ship.pos = add(ship.pos, scale(ship.vel, scaledDt));

  // Ground collision
  const newAlt = len(ship.pos) - PLANET_RADIUS;
  if(newAlt <= 0) {
    if(ship.onGround) {
      ship.pos = scale(norm(ship.pos), PLANET_RADIUS);
      ship.vel = [0,0,0];
    } else if(len(ship.vel) < 50) {
      // Soft landing
      ship.pos = scale(norm(ship.pos), PLANET_RADIUS);
      ship.vel = [0,0,0];
      ship.onGround = true;
      ship.landed = true;
    } else {
      // Hard landing - bounce or crash
      ship.pos = scale(norm(ship.pos), PLANET_RADIUS);
      const normal = norm(ship.pos);
      const velDotN = dot(ship.vel, normal);
      if(velDotN < 0) {
        ship.vel = sub(ship.vel, scale(normal, 1.5 * velDotN)); // partial bounce
        if(len(ship.vel) < 20) {
          ship.vel = [0,0,0];
          ship.onGround = true;
        }
      }
    }
  } else {
    ship.onGround = false;
  }

  simTime += scaledDt;

  // Update HUD
  const alt_m = len(ship.pos) - PLANET_RADIUS;
  const speed_ms = len(ship.vel);
  const radialVel = dot(ship.vel, norm(ship.pos));
  const horizSpeed = Math.sqrt(speed_ms*speed_ms - radialVel*radialVel);

  document.getElementById('ship-info').textContent =
    `Alt: ${(alt_m/1000).toFixed(0)}km | Speed: ${speed_ms.toFixed(0)} m/s | Fuel: ${(ship.fuelMass/5).toFixed(0)}%`;
  document.getElementById('surface-info').textContent =
    ship.onGround ? 'STATUS: LANDED' : (ship.landed ? 'STATUS: TOUCHDOWN' : 'STATUS: AIRBORNE');
  document.getElementById('atmo-info').textContent =
    `Atm: ${(getAtmosphereDensity(Math.max(0,alt_m))*100).toFixed(1)}% | T: ${getTemperature(Math.max(0,alt_m), starAngle).toFixed(0)}K`;

  // Telemetry panel
  document.getElementById('alt').textContent = alt_m.toFixed(0) + ' m';
  document.getElementById('vspeed').textContent = radialVel.toFixed(1) + ' m/s';
  document.getElementById('hspeed').textContent = horizSpeed.toFixed(1) + ' m/s';
  document.getElementById('landing').textContent = ship.onGround ? 'LANDED' : (ship.landed ? 'TOUCHDOWN' : 'AIRBORNE');
  document.getElementById('landing').style.color = ship.onGround ? '#7f7' : '#fa7';
  document.getElementById('atmo-pct').textContent = (getAtmosphereDensity(Math.max(0,alt_m))*100).toFixed(1) + '%';
  document.getElementById('temp').textContent = getTemperature(Math.max(0,alt_m), starAngle).toFixed(0) + ' K';
  document.getElementById('grav').textContent = getGravity(alt_m).toFixed(2) + ' m/s²';
  document.getElementById('fuel-pct').textContent = (ship.fuelMass/5).toFixed(0) + '%';
  document.getElementById('star-angle').textContent = Math.round(starAngle * 180 / Math.PI) + '°';
}

// ---- RENDER ----
function render() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  // Stars (background)
  ctx.fillStyle = '#ffffff';
  for(let i=0;i<400;i++){
    const seed = i * 7919;
    const x = ((seed*137.5)%W+W)%W;
    const y = ((seed*97.3)%H+H)%H;
    const twinkle = 0.3 + 0.7*Math.sin(simTime*0.5 + i);
    ctx.globalAlpha = twinkle * 0.6;
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.globalAlpha = 1;

  // Star (sun direction)
  const starDir = [Math.cos(starAngle), 0, Math.sin(starAngle)];
  const camRight = norm(cross([0,1,0], norm(sub(cam.target, cam.pos))));
  const starScreenPos = project3D(scale(starDir, 5e9), W, H);

  // Sun glow
  if(starScreenPos[0] > -200 && starScreenPos[0] < W+200 && starScreenPos[1] > -200 && starScreenPos[1] < H+200) {
    const grad = ctx.createRadialGradient(starScreenPos[0], starScreenPos[1], 0, starScreenPos[0], starScreenPos[1], 80);
    grad.addColorStop(0, '#fffde7');
    grad.addColorStop(0.1, '#ffdd44');
    grad.addColorStop(0.4, '#ff880044');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(starScreenPos[0], starScreenPos[1], 80, 0, Math.PI*2);
    ctx.fill();

    // Sun core
    ctx.fillStyle = '#fffde7';
    ctx.beginPath();
    ctx.arc(starScreenPos[0], starScreenPos[1], 15, 0, Math.PI*2);
    ctx.fill();
  }

  // Planet (sphere with terrain shading)
  const planetCenter = project3D([0, PLANET_RADIUS*0.5, 0], W, H);
  const planetScreenR = Math.min(W, H) * 0.4 * PLANET_RADIUS / (PLANET_RADIUS * 2);

  // Draw planet as gradient sphere
  const sunDirNorm = norm(starDir);
  const toCamera = norm(sub(cam.pos, [0, PLANET_RADIUS, 0]));

  // Planet body
  ctx.beginPath();
  ctx.arc(planetCenter[0], planetCenter[1], Math.abs(planetScreenR), 0, Math.PI*2);

  // Gradient for day/night
  const grad = ctx.createRadialGradient(
    planetCenter[0] + sunDirNorm[0]*planetScreenR*0.3,
    planetCenter[1] - sunDirNorm[1]*planetScreenR*0.3,
    planetScreenR*0.1,
    planetCenter[0], planetCenter[1], Math.abs(planetScreenR)
  );

  // Day side color (blue-green for Earth-like)
  const dayFactor = Math.max(0, dot(sunDirNorm, toCamera));
  grad.addColorStop(0, lerpColor('#1a3a5c', '#4488ff', dayFactor));
  grad.addColorStop(0.5, lerpColor('#0a1a2c', '#2266aa', dayFactor));
  grad.addColorStop(1, '#050510');

  ctx.fillStyle = grad;
  ctx.fill();

  // Atmosphere glow
  const atmoGrad = ctx.createRadialGradient(planetCenter[0], planetCenter[1], Math.abs(planetScreenR)*0.95, planetCenter[0], planetCenter[1], Math.abs(planetScreenR)*1.15);
  atmoGrad.addColorStop(0, 'rgba(100,180,255,0)');
  atmoGrad.addColorStop(0.5, `rgba(100,180,255,${0.15 * dayFactor})`);
  atmoGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = atmoGrad;
  ctx.beginPath();
  ctx.arc(planetCenter[0], planetCenter[1], Math.abs(planetScreenR)*1.15, 0, Math.PI*2);
  ctx.fill();

  // Ship (point sprite)
  const shipScreen = project3D(ship.pos, W, H);
  ctx.fillStyle = ship.onGround ? '#7f7' : '#ff7';
  ctx.beginPath();
  ctx.arc(shipScreen[0], shipScreen[1], 5, 0, Math.PI*2);
  ctx.fill();

  // Ship label
  ctx.fillStyle = '#fff';
  ctx.font = '10px monospace';
  ctx.fillText('SHIP', shipScreen[0]+8, shipScreen[1]-5);

  // Altitude line from ship to surface
  if(!ship.onGround) {
    const surfPoint = scale(norm(ship.pos), PLANET_RADIUS);
    const surfScreen = project3D(surfPoint, W, H);
    ctx.strokeStyle = '#7f74';
    ctx.lineWidth = 1;
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(shipScreen[0], shipScreen[1]);
    ctx.lineTo(surfScreen[0], surfScreen[1]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Altitude label
    const alt_m = len(ship.pos) - PLANET_RADIUS;
    ctx.fillStyle = '#7f7';
    ctx.fillText(`${alt_m.toFixed(0)}m`, (shipScreen[0]+surfScreen[0])/2, (shipScreen[1]+surfScreen[1])/2);
  }
}

function project3D(pos, W, H) {
  const scale = Math.min(W, H) * 0.4 / PLANET_RADIUS;
  return [W/2 + pos[0]*scale, H/2 - pos[1]*scale];
}

function lerpColor(c1, c2, t) {
  t = Math.max(0, Math.min(1, t));
  const r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
  const r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

// ---- MAIN LOOP ----
function resize() {
  canvas.width = Math.min(window.innerWidth, 1280);
  canvas.height = Math.min(window.innerHeight, 720);
}
window.addEventListener('resize', resize);
resize();

function loop(now) {
  const dt = Math.min((now-lastTime)/1000, 0.05);
  lastTime = now; frameCount++;
  if(frameCount%10===0){fps=Math.round(1/dt);document.getElementById('fps').textContent=fps+' fps';}
  update(dt); render();
  document.getElementById('times').textContent=(dt*1000).toFixed(1)+' ms';
  setInterval(()=>loop(performance.now()), 16);
}
setInterval(()=>loop(performance.now()), 16);

console.log('SPIACE Phase 2 loaded | Planet radius:', PLANET_RADIUS/1000, 'km');
console.log('Atmosphere scale height:', ATMOSPHERE_HEIGHT/1000, 'km');
</script>
</body>
</html>
