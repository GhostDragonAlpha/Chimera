            - paragraph [ref=f29e368]:
              - text: A virtual economy (or sometimes synthetic economy) is an
              - link "emergent" [ref=f29e369] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Emergence
              - text: economy existing in a
              - link "virtual world" [ref=f29e370] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Virtual_world
              - text: ", usually exchanging"
              - link "virtual goods" [ref=f29e371] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Virtual_goods
              - text: in the context of an
              - link "online game" [ref=f29e372] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Online_game
              - text: ", particularly in"
              - link "massively multiplayer online games" [ref=f29e373] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Massively_multiplayer_online_game
              - text: (MMOs). People enter these virtual economies for recreation and entertainment rather than necessity, which means that virtual economies lack the aspects of a real economy that are not considered to be "fun" (for instance, avatars in a virtual economy often do not need to buy food in order to survive, and usually do not have any biological needs at all). However, some people do interact with virtual economies for "real" economic benefit.
            - paragraph [ref=f29e374]:
              - text: The virtual economy, often referred to as digital economy, has expanded rapidly in recent years and is increasingly influencing global economic activity. Opportunities within the digital economy include digital trade growth, evolving investment trends and advancements in
              - link "artificial intelligence" [ref=f29e375] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Artificial_intelligence
              - text: technologies.However, its development remains uneven. Digital infrastructure and technological capacity are concentrated in very few countries with only a portion of developing countries having artificial intelligence in place. Billions of people remain without
              - link "internet access" [ref=f29e376] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Internet_access
              - text: while some have chosen to remain offline.
              - superscript [ref=f29e377]:
                - link "[1]" [ref=f29e378] [cursor=pointer]:
                  - /url: "#cite_note-1"
                  - generic [ref=f29e379]: "[1]"
            - paragraph [ref=f29e380]:
              - text: Recent digital economy reports emphasize the need for environmentally sustainable and inclusive digitization strategies to ensure that the benefits of technological advancement are more equally accessible.
              - superscript [ref=f29e381]:
                - link "[2]" [ref=f29e382] [cursor=pointer]:
                  - /url: "#cite_note-2"
                  - generic [ref=f29e383]: "[2]"
            - paragraph [ref=f29e384]:
              - text: Despite primarily dealing with in-game currencies, this term also encompasses the selling of virtual currency for real money, in what is sometimes called "open centralised marketplaces".
              - superscript [ref=f29e385]:
                - link "[3]" [ref=f29e386] [cursor=pointer]:
                  - /url: "#cite_note-auto-3"
                  - generic [ref=f29e387]: "[3]"
          - region "Overview" [ref=f29e388]:
            - generic [ref=f29e389]:
              - heading "Overview" [level=2] [ref=f29e390]
              - generic [ref=f29e391]:
                - link "edit":
                  - /url: /w/index.php?title=Virtual_economy&action=edit&section=1
            - paragraph [ref=f29e392]:
              - text: Virtual economies are observed in
              - link "MUDs" [ref=f29e393] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Multi-user_dungeon
              - text: and
              - link "massively multiplayer online role-playing games" [ref=f29e394] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Massively_multiplayer_online_role-playing_games
              - text: (MMORPGs). The largest virtual economies are found in MMORPGs. Virtual economies also exist in life simulation games which may have taken the most radical steps toward linking a virtual economy with the real world. This can be seen, for example, in
              - link "Second Life" [ref=f29e395] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Second_Life
              - text: "'s recognition of intellectual property rights for assets created \"in-world\" by subscribers, and its"
              - link "laissez-faire" [ref=f29e397] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Laissez-faire
              - text: policy on the buying and selling of Linden Dollars (the world's official currency) for real money on third party websites.
              - superscript [ref=f29e398]:
                - link "[4]" [ref=f29e399] [cursor=pointer]:
                  - /url: "#cite_note-4"
                  - generic [ref=f29e400]: "[4]"
              - superscript [ref=f29e401]:
                - link "[5]" [ref=f29e402] [cursor=pointer]:
                  - /url: "#cite_note-5"
                  - generic [ref=f29e403]: "[5]"
              - text: Virtual economies can also exist in browser-based Internet games where "real" money can be spent and user-created shops opened, or as a kind of
              - link "emergent gameplay" [ref=f29e404] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Emergent_gameplay
              - text: .
            - paragraph [ref=f29e405]:
              - text: Virtual property is a label that can refer to any resource that is controlled by the powers-that-be, including virtual objects,
              - link "avatars" [ref=f29e406] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Avatar_(computing)
              - text: ", or user accounts."
              - superscript [ref=f29e407]:
                - link "[6]" [ref=f29e408] [cursor=pointer]:
                  - /url: "#cite_note-6"
                  - generic [ref=f29e409]: "[6]"
              - text: The following characteristics may be found in virtual resources in mimicry of tangible property. Note however that it is possible for virtual resources to lack one or more of these characteristics, and they should be interpreted with reasonable flexibility.
              - superscript [ref=f29e410]:
                - link "[7]" [ref=f29e411] [cursor=pointer]:
                  - /url: "#cite_note-7"
                  - generic [ref=f29e412]: "[7]"
            - list [ref=f29e413]:
              - listitem [ref=f29e414]: "Rivalry: Possession of a resource is limited to one person or a small number of persons within the virtual world's game mechanics."
              - listitem [ref=f29e415]: "Persistence: Virtual resources persist across user sessions. In some cases, the resource exists for public view even when its owner is not logged into the virtual world."
              - listitem [ref=f29e416]: "Interconnectivity: Resources may affect or be affected by other people and other objects. The value of a resource varies according to a person's ability to use it for creating or experiencing some effect."
              - listitem [ref=f29e417]: "Secondary markets: Virtual resources may be created, traded, bought, and sold. Real-world assets (typically money) may be at stake."
              - listitem [ref=f29e418]: "Value added by users: Users may enhance the value of virtual resources by customizing and improving upon the resource."
            - paragraph [ref=f29e419]:
              - text: The existence of these conditions create an economic system with properties similar to those seen in contemporary
              - link "economies" [ref=f29e420] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Economy
              - text: . Therefore, economic theory can often be used to study these virtual worlds.
            - paragraph [ref=f29e421]:
              - text: Within the virtual worlds they inhabit, synthetic economies allow in-game items to be priced according to
              - link "supply and demand" [ref=f29e422] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Supply_and_demand
              - text: rather than by the developer's estimate of the item's utility. These emergent economies are considered by most players to be an asset of the game, giving an extra dimension of reality to play. In classical synthetic economies, these goods were charged only for in-game currencies. These currencies are often sold for real world profit.
            - region "Marketplace" [ref=f29e423]:
              - generic [ref=f29e424]:
                - heading "Marketplace" [level=3] [ref=f29e425]
                - generic [ref=f29e426]:
                  - link "edit":
                    - /url: /w/index.php?title=Virtual_economy&action=edit&section=2
              - paragraph [ref=f29e427]:
                - text: The release of
                - link "Blizzard Entertainment" [ref=f29e428] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Blizzard_Entertainment
                - text: "'s"
                - link "World of Warcraft" [ref=f29e430] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/World_of_Warcraft
                - text: in 2004 and its subsequent success has propelled both
                - link "MMORPGs" [ref=f29e431] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/MMORPGs
                - text: and their secondary markets into mainstream consciousness, and many new market places have opened up during this time. Real money commerce in a virtual market has grown to become a multibillion-dollar industry. In 2001,
                - link "EverQuest" [ref=f29e433] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/EverQuest
                - text: players Brock Pierce and Alan Debonneville founded
                - generic [ref=f29e434]:
                  - text: Internet Gaming Entertainment Ltd (
                  - link "IGE" [ref=f29e435] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/IGE
                  - text: )
                - text: ", a company that offered not only the virtual commodities in exchange for real money but also provided professional customer service. IGE had a trained staff that would handle financial issues, customer inquiries and technical support to ensure that gamers are satisfied with each real money purchase. It also took advantage of the global reach of synthetic worlds by setting up a shop in"
                - link "Hong Kong" [ref=f29e436] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hong_Kong
                - text: where a large number of technically savvy but low wage workers could field orders, load up avatars, retrieve store goods and deliver them wherever necessary.
                - superscript [ref=f29e437]:
                  - link "[8]" [ref=f29e438] [cursor=pointer]:
                    - /url: "#cite_note-CNN-8"
                    - generic [ref=f29e439]: "[8]"
                - superscript [ref=f29e440]:
                  - link "[9]" [ref=f29e441] [cursor=pointer]:
                    - /url: "#cite_note-9"
                    - generic [ref=f29e442]: "[9]"
                - text: This market has opened a novel type of economy where the border between real and virtual is obscure.
                - superscript [ref=f29e443]:
                  - link "[10]" [ref=f29e444] [cursor=pointer]:
                    - /url: "#cite_note-New_York_Times-10"
                    - generic [ref=f29e445]: "[10]"
              - paragraph [ref=f29e446]:
                - text: Hundreds of companies are succeeding in this newfound market, with certain virtual items being sold for several million dollars, such as
                - link "Beeple" [ref=f29e447] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Mike_Winkelmann
                - text: "'s"
                - link "Everyday" [ref=f29e449] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Everydays:_the_First_5000_Days
                - text: .
                - superscript [ref=f29e450]:
                  - link "[11]" [ref=f29e451] [cursor=pointer]:
                    - /url: "#cite_note-11"
                    - generic [ref=f29e452]: "[11]"
                - text: Some companies sell multiple virtual goods for multiple games, and others sell services for single games. Virtual real estate is earning real-world money; for example, a 43-year-old
                - link "Wonder Bread" [ref=f29e454] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wonder_Bread
                - text: deliveryman, John Dugger, purchased virtual real estate for $750, setting him back more than a weeks wages.
                - superscript [ref=f29e455]:
                  - link "[12]" [ref=f29e456] [cursor=pointer]:
                    - /url: "#cite_note-12"
                    - generic [ref=f29e457]: "[12]"
                - text: This virtual property includes nine rooms, three stories, a rooftop patio, a wall of solid stonework in a prime location, nestled at the foot of a quiet coastal hillside. Dugger represents a group of gamers that are not in the market for a real house but instead own a small piece of the virtual real estate in the mythical
                - link "MMO" [ref=f29e458] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Massively_multiplayer_online_game
                - link "Ultima Online" [ref=f29e460] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ultima_Online
                - text: . Such trading of real money for virtual goods simply represents the development of virtual economies, where people come together, as the real and the synthetic worlds meet within an economic sphere.
                - superscript [ref=f29e461]:
                  - link "[13]" [ref=f29e462] [cursor=pointer]:
                    - /url: "#cite_note-13"
                    - generic [ref=f29e463]: "[13]"
              - paragraph [ref=f29e464]:
                - text: Although virtual markets may represent a growth area, it is unclear to what extent they can scale to supporting large numbers of businesses, due to the inherent substitutability of goods on these markets plus the lack of factors such as location to dispense demand.
                - superscript [ref=f29e465]:
                  - link "[14]" [ref=f29e466] [cursor=pointer]:
                    - /url: "#cite_note-14"
                    - generic [ref=f29e467]: "[14]"
                - text: In spite of numerous famed examples of the economic growth of
                - link "Second Life" [ref=f29e468] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Second_Life
                - text: ", an amateur analyst in 2008 estimated the income inequity in Second Life's economy as worse than has ever been recorded in any real economy: a"
                - link "Gini coefficient" [ref=f29e469] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Gini_coefficient
                - text: of 90.2, a
                - link "Hoover index" [ref=f29e470] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hoover_index
                - text: of 77.8, and a
                - link "Theil index" [ref=f29e471] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Theil_index
                - text: of 91%.
                - superscript [ref=f29e472]:
                  - text: "["
                  - link "citation needed" [ref=f29e474] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
                - text: However, the application of these economic measures to a virtual world may be inappropriate where poverty is merely virtual and there is a
                - link "direct relationship" [ref=f29e475] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Direct_relationship
                - text: between in-game wealth and time spent playing.
              - paragraph [ref=f29e476]:
                - text: The global secondary market - defined as
                - link "real money trading" [ref=f29e477] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Real_money_trading
                - text: between players - turnover was estimated at 880 million dollars in 2005 by the president of the, at the time, market leading company
                - link "IGE" [ref=f29e478] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Internet_Gaming_Entertainment
                - text: .
                - superscript [ref=f29e479]:
                  - link "[15]" [ref=f29e480] [cursor=pointer]:
                    - /url: "#cite_note-15"
                    - generic [ref=f29e481]: "[15]"
                - text: Before that, in 2004, the American economist
                - link "Edward Castronova" [ref=f29e482] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Edward_Castronova
                - text: had estimated the turnover at over 100 million dollars based solely on sales figures from the two auction sites
                - link "eBay" [ref=f29e483] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/EBay
                - text: and the Korean itemBay.
                - superscript [ref=f29e484]:
                  - link "[16]" [ref=f29e485] [cursor=pointer]:
                    - /url: "#cite_note-16"
                    - generic [ref=f29e486]: "[16]"
                - text: A speculative extrapolation based on these quotes and other industry figures produced a global turnover figure of 2 billion dollars as of 2007.
                - superscript [ref=f29e487]:
                  - link "[17]" [ref=f29e488] [cursor=pointer]:
                    - /url: "#cite_note-17"
                    - generic [ref=f29e489]: "[17]"
              - paragraph [ref=f29e490]:
                - text: However, the secondary market is unlikely to have followed the growth of the primary market since 2007 seeing as game companies have become better at monetizing on their games with
                - link "microtransaction" [ref=f29e491] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Microtransaction
                - text: s and many popular games such as
                - link "World of Warcraft" [ref=f29e492] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/World_of_Warcraft
                - text: are sporting increased measures against player to player real money trading. Also hampering the turnover growth are the extreme price drops that has followed the increased competition from businesses in
                - link "mainland China" [ref=f29e493] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Mainland_China
                - text: targeting the global secondary market.
                - superscript [ref=f29e494]:
                  - link "[18]" [ref=f29e495] [cursor=pointer]:
                    - /url: "#cite_note-:0-18"
                    - generic [ref=f29e496]: "[18]"
                - text: Furthermore, the global decline in consumption that followed the
                - link "2008 financial crisis" [ref=f29e497] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/2008_financial_crisis
                - text: would have affected the secondary market negatively as well.
                - superscript [ref=f29e498]:
                  - link "[19]" [ref=f29e499] [cursor=pointer]:
                    - /url: "#cite_note-19"
                    - generic [ref=f29e500]: "[19]"
                - text: Post 2007 secondary market growth is likely localized to
                - link "emerging markets" [ref=f29e501] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Emerging_markets
                - text: such as Russia, eastern Europe, South America, and South East Asia - all of which are relatively inaccessible to international merchants due to payment systems, advertisement channels and language barrier. For example, South Korea is estimated to have the biggest share of the global real money trading market and it has there become an officially acknowledged and taxable part of the economy.
                - superscript [ref=f29e502]:
                  - link "[20]" [ref=f29e503] [cursor=pointer]:
                    - /url: "#cite_note-20"
                    - generic [ref=f29e504]: "[20]"
                - text: In western countries the secondary market remains a black market with little to no social acceptance or official acknowledgement.
              - paragraph [ref=f29e505]:
                - text: As for an actual economic model, secondary market turnover in popular player vs player oriented MMORPGs without trade restrictions such as
                - link "RuneScape" [ref=f29e507] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/RuneScape
                - text: ","
                - link "Eve Online" [ref=f29e509] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Eve_Online
                - text: and
                - link "Ultima Online" [ref=f29e511] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ultima_Online
                - text: has been estimated at 1.1 dollar per concurrent player and day.
                - superscript [ref=f29e512]:
                  - link "[21]" [ref=f29e513] [cursor=pointer]:
                    - /url: "#cite_note-21"
                    - generic [ref=f29e514]: "[21]"
                - text: No model for more regulated MMORPGs such as World of Warcraft has been suggested. However, being a largely unregulated market and tax free market, any turnover figure or economic model remain speculative.
          - region "Types of virtual currencies" [ref=f29e515]:
            - generic [ref=f29e516]:
              - heading "Types of virtual currencies" [level=2] [ref=f29e517]
              - generic [ref=f29e518]:
                - link "edit":
                  - /url: /w/index.php?title=Virtual_economy&action=edit&section=3
            - region "Standard currency" [ref=f29e519]:
              - generic [ref=f29e520]:
                - heading "Standard currency" [level=3] [ref=f29e521]
                - generic [ref=f29e522]:
                  - link "edit":
                    - /url: /w/index.php?title=Virtual_economy&action=edit&section=4
              - paragraph [ref=f29e523]:
                - text: Many games, both online and off, use a common or standard type of currency that can only be earned in-game and used to spend on in-game items that cannot be traded with other players or converted to real-world funds by means provided by the developer; for example, by completing quests in World of Warcraft, players earn gold pieces that are used to purchase new gear.
                - superscript [ref=f29e524]:
                  - link "[22]" [ref=f29e525] [cursor=pointer]:
                    - /url: "#cite_note-22"
                    - generic [ref=f29e526]: "[22]"
            - region "Premium currency" [ref=f29e527]:
              - generic [ref=f29e528]:
                - heading "Premium currency" [level=3] [ref=f29e529]
                - generic [ref=f29e530]:
                  - link "edit":
                    - /url: /w/index.php?title=Virtual_economy&action=edit&section=5
              - paragraph [ref=f29e531]:
                - text: Many online games, particularly those that use the
                - link "freemium" [ref=f29e532] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Freemium
                - text: model, offer at least one additional form of currency beyond its standard one, called premium currency. Premium currency cannot typically be earned in-game like common currency but instead by purchasing the premium currency using real-world funds. Premium currency typically is limited to purchase time-limited virtual goods, access to new characters or levels, large quantities of standard in-game currency, temporary boosts to the player-character's experience growth, or other goods that cannot be acquired with the common in-game currency.
                - superscript [ref=f29e533]:
                  - link "[23]" [ref=f29e534] [cursor=pointer]:
                    - /url: "#cite_note-23"
                    - generic [ref=f29e535]: "[23]"
                - text: Once premium currency is purchased, it is rare for players to be able to revert the premium currency, or the goods purchased with it, back into real-world funds without selling it to other players through 3rd-party websites, making it a "one-way currency".
                - superscript [ref=f29e536]:
                  - link "[24]" [ref=f29e537] [cursor=pointer]:
                    - /url: "#cite_note-24"
                    - generic [ref=f29e538]: "[24]"
                - superscript [ref=f29e539]:
                  - link "[25]" [ref=f29e540] [cursor=pointer]:
                    - /url: "#cite_note-25"
                    - generic [ref=f29e541]: "[25]"
                - text: Most commonly, premium currency must be purchased through
                - link "microtransactions" [ref=f29e542] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Microtransaction
                - text: in bundles of fixed sizes with discounts for larger purchases, and do not allow players to purchase exactly the amount of premium currency they need for a virtual good. This practice tends to encourage the player to buy additional bundles as to minimize their leftover premium currency, a favorable practice for the publisher.
                - superscript [ref=f29e543]:
                  - link "[26]" [ref=f29e544] [cursor=pointer]:
                    - /url: "#cite_note-26"
                    - generic [ref=f29e545]: "[26]"
            - region "In-game membership items" [ref=f29e546]:
              - generic [ref=f29e547]:
                - heading "In-game membership items" [level=3] [ref=f29e548]
                - generic [ref=f29e549]:
                  - link "edit":
                    - /url: /w/index.php?title=Virtual_economy&action=edit&section=6
              - paragraph [ref=f29e550]:
                - text: Some membership-based MMORPGs take advantage of the population of players who wish to buy in-game items with real money through in-game items that can only be generated by buying them from the developer, which can then be redeemed for membership status or traded with other players for items such as in-game currency. This also allows for games to maintain larger audiences of high-level players as they have the resources to buy membership with in-game gold from people who purchase and trade these items for gold.
                - superscript [ref=f29e551]:
                  - link "[27]" [ref=f29e552] [cursor=pointer]:
                    - /url: "#cite_note-27"
                    - generic [ref=f29e553]: "[27]"
                - text: This also allows for an official conversion rate of in-game currency to real world currency to be established, though many 3rd-party item sellers will work to obtain the in-game currency needed to buy the membership items and sell them on 3rd-party markets at a lower real-world price than the official conversion rate. Many games who implement this monetization model often strictly prohibit 3rd-party real world trading and ban players who do so. Some examples of this form of monetization include Runescape's bonds
                - superscript [ref=f29e554]:
                  - link "[28]" [ref=f29e555] [cursor=pointer]:
                    - /url: "#cite_note-28"
                    - generic [ref=f29e556]: "[28]"
                - text: and World of Warcraft's WoW Tokens.
                - superscript [ref=f29e557]:
                  - link "[29]" [ref=f29e558] [cursor=pointer]:
                    - /url: "#cite_note-29"
                    - generic [ref=f29e559]: "[29]"
            - region "Cosmetic items" [ref=f29e560]:
              - generic [ref=f29e561]:
                - heading "Cosmetic items" [level=3] [ref=f29e562]
                - generic [ref=f29e563]:
                  - link "edit":
                    - /url: /w/index.php?title=Virtual_economy&action=edit&section=7
              - paragraph [ref=f29e564]:
                - text: Many online multiplayer games have player-run economies of cosmetic items, sometimes involving and encouraging the use of real-world money.
                - link "Team Fortress 2" [ref=f29e566] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Team_Fortress_2
                - text: ", a team-based online FPS released by"
                - link "Valve" [ref=f29e567] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Valve_Corporation
                - text: in 2007, is a
                - link "hero shooter" [ref=f29e568] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hero_shooter
                - text: ", where players selected from one of several created characters to control. In 2009, Valve introduced hats,"
                - link "virtual goods" [ref=f29e569] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Virtual_goods
                - text: that could be used to customize the character models.
                - superscript [ref=f29e570]:
                  - link "[30]" [ref=f29e571] [cursor=pointer]:
                    - /url: "#cite_note-30"
                    - generic [ref=f29e572]: "[30]"
                - superscript [ref=f29e573]:
                  - link "[31]" [ref=f29e574] [cursor=pointer]:
                    - /url: "#cite_note-31"
                    - generic [ref=f29e575]: "[31]"
                - text: Hats could be earned by players by accumulating in-game material drops and then used to synthesize the hat, or later could be purchased directly using real-world currency through the game's storefront.
                - superscript [ref=f29e576]:
                  - link "[32]" [ref=f29e577] [cursor=pointer]:
                    - /url: "#cite_note-32"
                    - generic [ref=f29e578]: "[32]"
                - text: Valve also expanded this customization beyond hats to include weapons, weapon "skins" which change the appearance of the weapon, and similar means to customize the selected character avatar. In addition, through Valve's digital storefront
                - link "Steam" [ref=f29e579] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Steam_(service)
                - text: ", players could trade these items, sell them in exchange for monetary credits which could only be used on Steam (from which Valve would take a cut of the sale), or receive them in promotions with other publishers of products they owned."
                - superscript [ref=f29e580]:
                  - link "[33]" [ref=f29e581] [cursor=pointer]:
                    - /url: "#cite_note-33"
                    - generic [ref=f29e582]: "[33]"
                - text: This created a virtual economy around the game, as certain customization items carried status and recognition, giving them a perceived social value status.
                - superscript [ref=f29e583]:
                  - link "[34]" [ref=f29e584] [cursor=pointer]:
                    - /url: "#cite_note-34"
                    - generic [ref=f29e585]: "[34]"
                - text: This created a virtual economy around items in the game, as some rare items, known as "unusuals" by the game community due to various special effects applied, and are seen as having high social value, had traded for as high as US$1,000,
                - superscript [ref=f29e586]:
                  - link "[35]" [ref=f29e587] [cursor=pointer]:
                    - /url: "#cite_note-35"
                    - generic [ref=f29e588]: "[35]"
                - text: and because of the active trading that incorporated real-world money, Valve hired economist
                - link "Yanis Varoufakis" [ref=f29e589] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Yanis_Varoufakis
                - text: to help manage this.
                - superscript [ref=f29e590]:
                  - link "[36]" [ref=f29e591] [cursor=pointer]:
                    - /url: "#cite_note-36"
                    - generic [ref=f29e592]: "[36]"
              - paragraph [ref=f29e593]:
                - text: Valve followed the same pattern with its next major game,
                - 'link "Counter-Strike: Global Offensive" [ref=f29e595] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Counter-Strike:_Global_Offensive
                - text: ", where players could earn crates in-game that could be unlocked with keys purchased through real-world funds to obtain weapon skins that were doled out based on a rarity scale, a practice they had started in Team Fortress 2. As with Team Fortress 2 skins, these Counter-Strike skins gained value as status symbols among players coupled with the rarity of certain skins, and became highly valued, and was considered to help boost the popularity of the game."
                - superscript [ref=f29e596]:
                  - link "[37]" [ref=f29e597] [cursor=pointer]:
                    - /url: "#cite_note-37"
                    - generic [ref=f29e598]: "[37]"
                - text: However, as Counter-Strike gained favor as an
                - link "esport" [ref=f29e599] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Esport
                - text: ", these skins became part of a larger"
                - link "skin gambling" [ref=f29e600] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Skin_gambling
                - text: scheme, where grey market websites, integrated with Steam's features, could allow players to use skins to gamble on the results of Counter-Strike esport events, and later just using skins to play
                - link "games of chance" [ref=f29e601] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Game_of_chance
                - text: ", sometimes skirting many gambling restrictions that virtual and real world casinos are subject to. While some of these websites were taken off line for various reasons, Valve was pressured to prevent abuse of the skin trading systems on Steam."
                - superscript [ref=f29e602]:
                  - link "[38]" [ref=f29e603] [cursor=pointer]:
                    - /url: "#cite_note-38"
                    - generic [ref=f29e604]: "[38]"
              - paragraph [ref=f29e605]:
                - text: Many games on Valve's video game marketplace
                - link "Steam" [ref=f29e606] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Steam_(service)
                - text: would implement this form of trading in their games, monetizing it by taking a cut of sales revenue from these items, with Valve also doing the same.
                - superscript [ref=f29e607]:
                  - text: "["
                  - link "citation needed" [ref=f29e609] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
            - region "Player-driven economy" [ref=f29e610]:
              - generic [ref=f29e611]:
                - heading "Player-driven economy" [level=3] [ref=f29e612]
                - generic [ref=f29e613]:
                  - link "edit":
                    - /url: /w/index.php?title=Virtual_economy&action=edit&section=8
              - paragraph [ref=f29e614]:
                - text: Some games may have currency systems that are partially or fully controlled by players of the game. Such games offer the means for players to acquire in-game resources which players may then sell or trade with other players, craft into gear which can be sell or traded, and otherwise create a virtual marketplace within the game above and beyond in-game stores established by the developer. This economy may also mix with real-world currency, with players trading in-game items through external websites to the game.
                - link "EVE Online" [ref=f29e616] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/EVE_Online
                - text: is a prime example of an online game with a vast player-driven economy that, in 2014, was estimated to have a total virtual value of US$18 million based on the trading of the in-game currency.
                - superscript [ref=f29e617]:
                  - link "[39]" [ref=f29e618] [cursor=pointer]:
                    - /url: "#cite_note-39"
                    - generic [ref=f29e619]: "[39]"
                - superscript [ref=f29e620]:
                  - link "[40]" [ref=f29e621] [cursor=pointer]:
                    - /url: "#cite_note-40"
                    - generic [ref=f29e622]: "[40]"
                - text: Player-driven economies have led to
                - link "immaterial labor" [ref=f29e623] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Immaterial_labor
                - text: activities, such as
                - link "gold farming" [ref=f29e624] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Gold_farming
                - text: in
                - link "World of Warcraft" [ref=f29e626] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/World_of_Warcraft
                - text: ", where some players are paid in real-world funds to spend the time to acquire in-game wealth for other players."
                - superscript [ref=f29e627]:
                  - link "[18]" [ref=f29e628] [cursor=pointer]:
                    - /url: "#cite_note-:0-18"
                    - generic [ref=f29e629]: "[18]"
                - text: Websites such as
                - link "Playerauctions" [ref=f29e630] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Playerauctions
                - text: and
                - link "G2A" [ref=f29e631] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/G2A
                - text: operate as digital marketplaces for players to exchange items of value.
                - superscript [ref=f29e632]:
                  - link "[41]" [ref=f29e633] [cursor=pointer]:
                    - /url: "#cite_note-41"
                    - generic [ref=f29e634]: "[41]"
                - superscript [ref=f29e635]:
                  - link "[42]" [ref=f29e636] [cursor=pointer]:
                    - /url: "#cite_note-42"
                    - generic [ref=f29e637]: "[42]"
          - region "Recent developments" [ref=f29e638]:
            - generic [ref=f29e639]:
              - heading "Recent developments" [level=2] [ref=f29e640]
              - generic [ref=f29e641]:
                - link "edit":
                  - /url: /w/index.php?title=Virtual_economy&action=edit&section=9
            - region "More controlled markets" [ref=f29e642]:
              - generic [ref=f29e643]:
                - heading "More controlled markets" [level=3] [ref=f29e644]
                - generic [ref=f29e645]:
                  - link "edit":
                    - /url: /w/index.php?title=Virtual_economy&action=edit&section=10
              - region "Price comparison" [ref=f29e646]:
                - generic [ref=f29e647]:
                  - heading "Price comparison" [level=4] [ref=f29e648]
                  - generic [ref=f29e649]:
                    - link "edit":
                      - /url: /w/index.php?title=Virtual_economy&action=edit&section=11
                - paragraph [ref=f29e650]: Information brokerages and other tools that aid in the valuation of virtual items on secondary markets have increased in number. This has occurred as a response to alleviate the labor involved in leveling that requires hours, days or weeks to achieve. Being able to exchange real money for virtual currency provides the player purchasing power for virtual commodities. As such, players are guaranteed opportunities, increased skills and a fine reputation, which is a definite advantage over others.
              - region "Taxation" [ref=f29e651]:
                - generic [ref=f29e652]:
                  - heading "Taxation" [level=4] [ref=f29e653]
                  - generic [ref=f29e654]:
                    - link "edit":
                      - /url: /w/index.php?title=Virtual_economy&action=edit&section=12
                - paragraph [ref=f29e655]:
                  - text: Most scholars agree that the sale of virtual property for real currency or assets is taxable.
                  - superscript [ref=f29e656]:
                    - link "[43]" [ref=f29e657] [cursor=pointer]:
                      - /url: "#cite_note-Camp_2007_1-43"
                      - generic [ref=f29e658]: "[43]"
                  - superscript [ref=f29e659]:
                    - link "[44]" [ref=f29e660] [cursor=pointer]:
                      - /url: "#cite_note-Lederman_2007_1620-44"
                      - generic [ref=f29e661]: "[44]"
                  - superscript [ref=f29e662]:
                    - link "[45]" [ref=f29e663] [cursor=pointer]:
                      - /url: "#cite_note-Masnick-45"
                      - generic [ref=f29e664]: "[45]"
                  - text: However, there are significant legal and practical challenges to the taxation of income from the sale of virtual property.
                  - superscript [ref=f29e665]:
                    - link "[46]" [ref=f29e666] [cursor=pointer]:
                      - /url: "#cite_note-46"
                      - generic [ref=f29e667]: "[46]"
                  - text: For example, uncertainty regarding the nature and conceptual location of virtual property makes it difficult to collect and apportion tax revenue when a sale occurs across multiple jurisdictions.
                  - superscript [ref=f29e668]:
                    - link "[47]" [ref=f29e669] [cursor=pointer]:
                      - /url: "#cite_note-47"
                      - generic [ref=f29e670]: "[47]"
                - paragraph [ref=f29e671]:
                  - text: In addition to taxing income from transactions involving real currency or assets, there has been considerable discussion involving the taxation of transactions that take place entirely within a virtual economy.
                  - superscript [ref=f29e672]:
                    - link "[45]" [ref=f29e673] [cursor=pointer]:
                      - /url: "#cite_note-Masnick-45"
                      - generic [ref=f29e674]: "[45]"
                  - superscript [ref=f29e675]:
                    - link "[48]" [ref=f29e676] [cursor=pointer]:
                      - /url: "#cite_note-48"
                      - generic [ref=f29e677]: "[48]"
                  - text: Theoretically, virtual world transactions could be treated as a form of barter, thus generating taxable income.
                  - superscript [ref=f29e678]:
                    - link "[44]" [ref=f29e679] [cursor=pointer]:
                      - /url: "#cite_note-Lederman_2007_1620-44"
                      - generic [ref=f29e680]: "[44]"
                  - text: However, for policy reasons, many commentators support some form of a "cash out" rule that would prevent in-game transactions from generating tax liabilities.
                  - superscript [ref=f29e681]:
                    - link "[43]" [ref=f29e682] [cursor=pointer]:
                      - /url: "#cite_note-Camp_2007_1-43"
                      - generic [ref=f29e683]: "[43]"
                  - text: Nevertheless, as one commentator notes, "the easier it is to buy real goods with virtual currency (e.g. order a real life pizza) the more likely the IRS will see exclusively in-world profits as taxable."
                  - superscript [ref=f29e684]:
                    - link "[49]" [ref=f29e685] [cursor=pointer]:
                      - /url: "#cite_note-49"
                      - generic [ref=f29e686]: "[49]"
                  - text: The IRS had included in-game currency as taxable property in forms for calendar year 2019 reporting, but subsequently removed mention of them after complaints were filed about their inclusion.
                  - superscript [ref=f29e687]:
                    - link "[50]" [ref=f29e688] [cursor=pointer]:
                      - /url: "#cite_note-50"
                      - generic [ref=f29e689]: "[50]"
              - region "Gambling regulation" [ref=f29e690]:
                - generic [ref=f29e691]:
                  - heading "Gambling regulation" [level=4] [ref=f29e692]
                  - generic [ref=f29e693]:
                    - link "edit":
                      - /url: /w/index.php?title=Virtual_economy&action=edit&section=13
                - paragraph [ref=f29e694]:
                  - text: As with the above skin gambling concerns, conversion between in-game and real-world currency has led to direct comparisons with other online games of chance as 'virtual winnings'. This is why gamers and companies engaged in this conversion, where it is permitted by a game, may fall under
                  - link "gambling legislation" [ref=f29e695] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Gambling_legislation
                  - text: .
                - paragraph [ref=f29e696]:
                  - text: During an interview with
                  - link "Virtual World News" [ref=f29e697] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Virtual_World_News?action=edit&redlink=1
                  - text: ", Alex Chapman of the British law firm"
                  - link "Campbell Hooper" [ref=f29e698] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Campbell_Hooper?action=edit&redlink=1
                  - text: "stated: \"Now we've spoken with the gambling commission, and they've said that MMOGs aren't the reason for the ["
                  - link "Gambling Act 2005" [ref=f29e699] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Gambling_Act_2005
                  - text: "], but they won't say outright, and we've asked directly, that they won't be covered. You can see how these would be ignored at first, but very soon they could be in trouble. It's a risk, but a very easy risk to avoid.\""
                  - superscript [ref=f29e700]:
                    - link "[51]" [ref=f29e701] [cursor=pointer]:
                      - /url: "#cite_note-VWNews-51"
                      - generic [ref=f29e702]: "[51]"
                  - text: He suggested that compliance might require MMOGs and related traders to obtain a gambling license, which is not excessively difficult in the EU.
                - paragraph [ref=f29e703]:
                  - text: "When queried about games where real-world transactions for in-game assets are not permitted, but there is an 'unofficial secondary market', Chapman responded: \"Ultimately the point is whether the thing that you win has value in money or money's worth. If it does have value, it could be gambling.\""
                  - superscript [ref=f29e704]:
                    - link "[51]" [ref=f29e705] [cursor=pointer]:
                      - /url: "#cite_note-VWNews-51"
                      - generic [ref=f29e706]: "[51]"
                  - text: So to avoid regulation by these laws, the "operator would need to take reasonable steps to ensure that the rewards they give do not have a monetary value[,]"
                  - superscript [ref=f29e707]:
                    - link "[51]" [ref=f29e708] [cursor=pointer]:
                      - /url: "#cite_note-VWNews-51"
                      - generic [ref=f29e709]: "[51]"
                  - text: possibly by demonstrating enforcement of their
                  - link "terms of service" [ref=f29e710] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Terms_of_service
                  - text: prohibiting secondary markets.
            - region "Virtual crime" [ref=f29e711]:
              - generic [ref=f29e712]:
                - heading "Virtual crime" [level=3] [ref=f29e713]
                - generic [ref=f29e714]:
                  - link "edit":
                    - /url: /w/index.php?title=Virtual_economy&action=edit&section=14
              - note [ref=f29e715]:
                - text: "Main article:"
                - link "Virtual crime" [ref=f29e716] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Virtual_crime
              - paragraph [ref=f29e717]:
                - text: Monetary issues can give a virtual world problems similar to those in the real world. In
                - link "South Korea" [ref=f29e718] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/South_Korea
                - text: ", where the number of video game players is massive, some"
                - superscript [ref=f29e719]:
                  - text: "["
                  - link "who?" [ref=f29e721] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Manual_of_Style/Words_to_watch#Unsupported_attributions
                  - text: "]"
                - text: have reported the emergence of gangs and mafia, where powerful players would threaten beginners to give money for their "protection", and actually steal and rob.
                - superscript [ref=f29e722]:
                  - text: "["
                  - link "citation needed" [ref=f29e724] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
              - paragraph [ref=f29e725]:
                - text: Other similar problems arise in other virtual economies. In the game
                - generic [ref=f29e726]:
                  - link "The Sims Online" [ref=f29e727] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/The_Sims_Online
                  - text: ","
                - text: a 17-year-old boy going by the in-game name "Evangeline" was discovered to have built a cyber-
                - link "brothel" [ref=f29e728] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Brothel
                - text: ", where customers would pay sim-money for minutes of"
                - link "cybersex" [ref=f29e729] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Cybersex
                - text: .
                - link "Maxis" [ref=f29e730] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Maxis
                - text: canceled each of his accounts, but had he deposited his fortune in the Gaming Open Market he would have been able to keep a part of it.
                - superscript [ref=f29e731]:
                  - link "[52]" [ref=f29e732] [cursor=pointer]:
                    - /url: "#cite_note-52"
                    - generic [ref=f29e733]: "[52]"
                - superscript [ref=f29e734]:
                  - link "[53]" [ref=f29e735] [cursor=pointer]:
                    - /url: "#cite_note-53"
                    - generic [ref=f29e736]: "[53]"
              - paragraph [ref=f29e737]:
                - text: A 2007 virtual heist has led to calls from some community members in
                - link "Second Life" [ref=f29e739] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Second_Life
                - text: "to bring in external regulation of these markets: \"In late July, a perpetrator with privileged information cracked a stock exchange's computers, made false deposits, then ran off with what appears to be the equivalent of US$10,000, disappearing into thin air. This heist left investors feeling outraged and vulnerable.\""
                - superscript [ref=f29e740]:
                  - link "[54]" [ref=f29e741] [cursor=pointer]:
                    - /url: "#cite_note-54"
                    - generic [ref=f29e742]: "[54]"
              - paragraph [ref=f29e743]:
                - text: In
                - link "EVE Online" [ref=f29e745] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/EVE_Online
                - text: however, theft and scamming other players is perfectly allowed within the game's framework as long as no real world trading is committed.
                - superscript [ref=f29e746]:
                  - text: "["
                  - link "citation needed" [ref=f29e748] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
                - text: Players are allowed to loot all items from fallen victims in battle, but there is a disincentive in the form of
                - link "NPC" [ref=f29e749] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Non-player_character
                - text: police intervention in higher-security space. Virtual possessions valued in the tens of thousands of
                - link "USD" [ref=f29e750] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/United_States_dollar
                - text: have been destroyed or plundered through
                - link "corporate espionage" [ref=f29e751] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Corporate_espionage
                - text: and
                - link "piracy" [ref=f29e752] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Piracy
                - text: . This has resulted in widespread retributive warfare and crime between various player corporations.
              - region "Black market" [ref=f29e753]:
                - generic [ref=f29e754]:
                  - heading "Black market" [level=4] [ref=f29e755]
                  - generic [ref=f29e756]:
                    - link "edit":
                      - /url: /w/index.php?title=Virtual_economy&action=edit&section=15
                - paragraph [ref=f29e757]:
                  - text: Many MMORPGs such as
                  - link "RuneScape" [ref=f29e759] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/RuneScape
                  - text: ","
                  - link "World of Warcraft" [ref=f29e761] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/World_of_Warcraft
                  - text: ","
                  - link "Guild Wars" [ref=f29e763] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Guild_Wars
                  - text: ","
                  - link "Warhammer Online" [ref=f29e765] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Warhammer_Online
                  - text: ","
                  - link "Lord of the Rings Online" [ref=f29e767] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Lord_of_the_Rings_Online
                  - text: and
                  - link "Final Fantasy XI" [ref=f29e769] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Final_Fantasy_XI
                  - text: strictly prohibit buying gold, items, or any other product linked with the game, with real world cash.
                  - link "RuneScape" [ref=f29e771] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/RuneScape
                  - text: went as far as making this practice impossible after being threatened by credit card companies when their customers who bought gold had their credit cards stolen to be used for bot accounts to farm even more gold by criminal traders.
                  - superscript [ref=f29e772]:
                    - link "[55]" [ref=f29e773] [cursor=pointer]:
                      - /url: "#cite_note-55"
                      - generic [ref=f29e774]: "[55]"
                  - text: They did this by removing unbalanced trades and their traditional player vs. player fighting system to prevent players from trading items by killing each other in combat for each other's items (this was scrapped on February 1, 2011, after having been in place for 3 years), resulting in over 60,000 cancelled subscriptions in protest.
                  - superscript [ref=f29e775]:
                    - link "[56]" [ref=f29e776] [cursor=pointer]:
                      - /url: "#cite_note-56"
                      - generic [ref=f29e777]: "[56]"
                  - link "Final Fantasy XI" [ref=f29e779] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Final_Fantasy_XI
                  - text: and
                  - link "Warhammer Online" [ref=f29e781] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Warhammer_Online
                  - text: both have entire task forces dedicated to the removal of real money trading from the game. To control real money trading,
                  - link "EVE Online" [ref=f29e783] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/EVE_Online
                  - text: created an official and sanctioned method to convert real world cash to in-game currency; players can use real world money to buy a specific in-game item which can be redeemed for account subscription time or traded on the in-game market for in-game currency.
            - region "Stability" [ref=f29e784]:
              - generic [ref=f29e785]:
                - heading "Stability" [level=3] [ref=f29e786]
                - generic [ref=f29e787]:
                  - link "edit":
                    - /url: /w/index.php?title=Virtual_economy&action=edit&section=16
              - note [ref=f29e788]:
                - text: "Main article:"
                - link "Mudflation" [ref=f29e789] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Mudflation
              - paragraph [ref=f29e790]: For a persistent world to maintain a stable economy, a balance must be struck between currency sources and sinks. Generally, games possess numerous sources of new currency for players to earn. However, some possess no effective "sinks", or methods of removing currency from circulation. If other factors remain constant, greater currency supply weakens the buying power of a given amount; a process known as inflation. In practice, this results in constantly rising prices for traded commodities. With the proper balance of growth in player base, currency sources, and sinks, a virtual economy could remain stable indefinitely.
              - paragraph [ref=f29e791]:
                - text: As in the real world, actions by players can destabilize the economy.
                - link "Gold farming" [ref=f29e792] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Gold_farming
                - text: creates resources within the game more rapidly than usual, exacerbating inflation. In extreme cases, a
                - link "cracker" [ref=f29e793] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Cracker_(software)
                - text: may be able to exploit the system and create a large amount of money. This could result in
                - link "hyperinflation" [ref=f29e794] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hyperinflation
                - text: .
              - paragraph [ref=f29e795]:
                - text: In the real world entire institutions are devoted to maintaining desired level of inflation. This difficult task is a serious issue for serious MMORPGs, that often have to cope with
                - link "mudflation" [ref=f29e796] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Mudflation
                - text: . Episodes of
                - link "hyperinflation" [ref=f29e797] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hyperinflation
                - text: have also been observed.
              - region "Non-fungible token" [ref=f29e798]:
                - generic [ref=f29e799]:
                  - heading "Non-fungible token" [level=4] [ref=f29e800]
                  - generic [ref=f29e801]:
                    - link "edit":
                      - /url: /w/index.php?title=Virtual_economy&action=edit&section=17
                - paragraph [ref=f29e802]:
                  - text: A
                  - link "non-fungible token" [ref=f29e803] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Non-fungible_token
                  - text: (NFT) is a unit of data on a digital
                  - link "ledger" [ref=f29e804] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Ledger
                  - text: called a
                  - link "blockchain" [ref=f29e805] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Blockchain
                  - text: ", where each NFT can represent a unique digital item, and thus they are not"
                  - link "interchangeable" [ref=f29e806] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Fungibility
                  - text: . NFTs can represent digital files such as art, audio, videos, items in video games and other forms of creative work. While the digital files themselves are infinitely reproducible, the NFTs representing them are tracked on their underlying blockchains and provide buyers with proof of
                  - link "ownership" [ref=f29e807] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Ownership
                  - text: . Blockchains such as
                  - link "Ethereum" [ref=f29e808] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Ethereum
                  - text: ", WAXP,"
                  - link "Bitcoin Cash" [ref=f29e809] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Bitcoin_Cash
                  - text: and Flow each have their own token standards to define their use of NFTs.
                  - superscript [ref=f29e810]:
                    - text: "["
                    - link "citation needed" [ref=f29e812] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                    - text: "]"
                - paragraph [ref=f29e813]:
                  - text: NFTs can also be used to represent in-game assets which are controlled by the user instead of the game developer. NFTs allow assets to be traded on third-party marketplaces where players of games such as
                  - link "Axie Infinity" [ref=f29e814] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Axie_Infinity
                  - text: or
                  - link "MyCryptoHero" [ref=f29e815] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/MyCryptoHero?action=edit&redlink=1
                  - text: can trade their tokenised "Axies" or "Heroes".
                  - superscript [ref=f29e816]:
                    - link "[3]" [ref=f29e817] [cursor=pointer]:
                      - /url: "#cite_note-auto-3"
                      - generic [ref=f29e818]: "[3]"
          - region "Capital" [ref=f29e819]:
            - generic [ref=f29e820]:
              - heading "Capital" [level=2] [ref=f29e821]
              - generic [ref=f29e822]:
                - link "edit":
                  - /url: /w/index.php?title=Virtual_economy&action=edit&section=18
            - paragraph [ref=f29e823]:
              - text: In these virtual economies, the value of in-game resources is frequently tied to the in-game power they confer upon the owner. This power allows the user, usually, to acquire more rare and valuable items. In this regard, in-game resources are not just tradable objects but can play the role of
              - link "capital" [ref=f29e825] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Capital_(economics)
              - text: .
            - paragraph [ref=f29e826]:
              - text: Players also acquire
              - link "human capital" [ref=f29e827] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Human_capital
              - text: as they become more powerful. Powerful guilds often recruit powerful players so that certain players can acquire better items which can only be acquired by the cooperation among many players.
              - superscript [ref=f29e828]:
                - text: "["
                - link "citation needed" [ref=f29e830] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
          - region "Other virtual economies" [ref=f29e831]:
            - generic [ref=f29e832]:
              - heading "Other virtual economies" [level=2] [ref=f29e833]
              - generic [ref=f29e834]:
                - link "edit":
                  - /url: /w/index.php?title=Virtual_economy&action=edit&section=19
            - paragraph [ref=f29e835]:
              - text: Virtual economies have also been said to exist in the "metagame" worlds of
              - link "live action role-playing games" [ref=f29e836] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Live_action_role-playing_games
              - text: and
              - link "collectible card games" [ref=f29e837] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Trading_card_game
              - text: . Other "metagame" currencies have cropped up in games such as Everquest and World of Warcraft.
              - link "Dragon kill points" [ref=f29e838] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Dragon_kill_points
              - text: or DKP are a semi-formal score-keeping system used by
              - link "guilds" [ref=f29e839] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Clan_(computer_gaming)#Clans_in_RPGs
              - text: in
              - link "massively multiplayer online games" [ref=f29e840] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Massively_multiplayer_online_game
              - text: . Players in these games are faced with large scale challenges, or
              - link "raids" [ref=f29e841] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Raid_(gaming)
              - text: ", which may only be surmounted through the concerted effort of dozens of players at a time. Dragon kill points are not official currencies, but are created and managed by"
              - link "endgame" [ref=f29e842] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/EverQuest#Social_dynamics
              - text: guilds to manage distributions of rewards in those raids.
              - superscript [ref=f29e843]:
                - link "[57]" [ref=f29e844] [cursor=pointer]:
                  - /url: "#cite_note-57"
                  - generic [ref=f29e845]: "[57]"
              - superscript [ref=f29e846]:
                - link "[58]" [ref=f29e847] [cursor=pointer]:
                  - /url: "#cite_note-58"
                  - generic [ref=f29e848]: "[58]"
            - paragraph [ref=f29e849]:
              - text: Virtual economies represented not only in MMORPG genre but also in online
              - link "business simulation games" [ref=f29e850] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Business_simulation_game
              - text: (
              - link "Virtonomics" [ref=f29e852] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Virtonomics
              - text: ","
              - link "Miniconomy" [ref=f29e854] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Miniconomy
              - text: ). Simplified economy represented in almost all
              - link "real-time strategies" [ref=f29e855] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Real-time_strategies
              - text: (
              - 'link "StarCraft II: Heart of the Swarm" [ref=f29e857] [cursor=pointer]':
                - /url: //en.wikipedia.org/wiki/StarCraft_II:_Heart_of_the_Swarm
              - text: ","
              - 'link "Command & Conquer: Red Alert 2" [ref=f29e859] [cursor=pointer]':
                - /url: //en.wikipedia.org/wiki/Command_&_Conquer:_Red_Alert_2
              - text: ) in a form of gathering and spending resources.
              - link "Diablo III" [ref=f29e861] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Diablo_III
              - text: has its virtual economy as well which is represented by online game auction.
            - region "Moderation on social news and networking sites" [ref=f29e862]:
              - generic [ref=f29e863]:
                - heading "Moderation on social news and networking sites" [level=3] [ref=f29e864]
                - generic [ref=f29e865]:
                  - link "edit":
                    - /url: /w/index.php?title=Virtual_economy&action=edit&section=20
              - paragraph [ref=f29e866]:
                - text: On a number of discussion and networking sites, such as
                - link "Slashdot" [ref=f29e867] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Slashdot
                - text: ","
                - link "Reddit" [ref=f29e868] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Reddit
                - text: ","
                - link "care2" [ref=f29e869] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Care2
                - text: and
                - link "Yahoo! Answers" [ref=f29e870] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Yahoo!_Answers
                - text: ", points are gained through the"
                - link "garnering of trust evidenced in upward moderations of posted content" [ref=f29e871] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Trust_metric
                - text: ; however, as stated by Slashdot co-founder
                - link "CmdrTaco" [ref=f29e872] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/CmdrTaco
                - text: ", his implementation of"
                - link "user moderation" [ref=f29e873] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Moderation_system
                - text: was not intended as a currency, even though it has evolved on other discussion-oriented sites into such a system. On some such sites, the accumulation of "karma points" can be redeemed in various ways for virtual services or objects, while most other sites do not contain a redemption system.
              - paragraph [ref=f29e874]: On some sites, points are gained for inviting new users to the site.
          - region "Controversy" [ref=f29e875]:
            - generic [ref=f29e876]:
              - heading "Controversy" [level=2] [ref=f29e877]: Controversy
              - generic [ref=f29e878]:
                - link "edit":
                  - /url: /w/index.php?title=Virtual_economy&action=edit&section=21
            - note [ref=f29e879]:
              - text: "See also:"
              - link "Gold farming" [ref=f29e880] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Gold_farming
            - paragraph [ref=f29e881]:
              - text: A game's synthetic economy often results in interaction with a "real" economy; characters, currency, and items may be sold and bought on
              - link "online auction" [ref=f29e882] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Online_auction
              - text: websites or purchased from standalone webshops. Since January 2007 users are no longer allowed to sell virtual goods of online games on
              - link "eBay" [ref=f29e883] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/EBay
              - text: due to the ambiguous legal status of real world trading.
              - superscript [ref=f29e884]:
                - link "[59]" [ref=f29e885] [cursor=pointer]:
                  - /url: "#cite_note-59"
                  - generic [ref=f29e886]: "[59]"
              - superscript [ref=f29e887]:
                - link "[60]" [ref=f29e888] [cursor=pointer]:
                  - /url: "#cite_note-60"
                  - generic [ref=f29e889]: "[60]"
            - paragraph [ref=f29e890]:
              - text: While many game developers, such as
              - link "Blizzard" [ref=f29e891] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Blizzard_Entertainment
              - text: (creator of
              - link "World of Warcraft" [ref=f29e893] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/World_of_Warcraft
              - text: ), prohibit the practice, it is common that goods and services within virtual economies will be sold on
              - link "online auction" [ref=f29e894] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Online_auction
              - text: sites and traded for real currencies.
              - superscript [ref=f29e895]:
                - link "[61]" [ref=f29e896] [cursor=pointer]:
                  - /url: "#cite_note-61"
                  - generic [ref=f29e897]: "[61]"
            - paragraph [ref=f29e898]:
              - text: According to standard conceptions of economic value (see the
              - link "subjective theory of value" [ref=f29e899] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Economic_subjectivism
              - text: ), the goods and services of virtual economies do have a demonstrable value. Since players of these games are willing to substitute real economic resources of time and money (monthly fees) in exchange for these resources, by definition they have demonstrated
              - link "utility" [ref=f29e900] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Utility
              - text: to the user. Some virtual currencies have even accrued higher value and stability than some real world currencies. One example is Runescape's gold coins, which is more valuable and stable alternative to the Venezuelan Bolívar, with many Venezuelan's turning to selling Runescape gold to make a living.
              - superscript [ref=f29e901]:
                - link "[62]" [ref=f29e902] [cursor=pointer]:
                  - /url: "#cite_note-62"
                  - generic [ref=f29e903]: "[62]"
            - paragraph [ref=f29e904]:
              - text: In January 2010, Blizzard stepped up its offensive on account security scams with the launch of a new website. The new Battle.Net account security website hopes to highlight the importance of keeping it safe when it comes to subscribers' accounts.
              - superscript [ref=f29e905]:
                - link "[63]" [ref=f29e906] [cursor=pointer]:
                  - /url: "#cite_note-63"
                  - generic [ref=f29e907]: "[63]"
            - blockquote [ref=f29e908]:
              - paragraph [ref=f29e909]: These pages are part of a larger effort to provide you with the knowledge and tools necessary to identify and report threats to your account's safety, to spotlight ways in which we work to fulfill our security commitment, and to act as a helpful resource in case someone manages to steal account information from you.
            - paragraph [ref=f29e910]:
              - text: Ongoing campaign by WoW fan sites to boycott gold ads on their sites is just one of several community efforts to raise awareness against crackers.
              - superscript [ref=f29e911]:
                - link "[64]" [ref=f29e912] [cursor=pointer]:
                  - /url: "#cite_note-64"
                  - generic [ref=f29e913]: "[64]"
            - blockquote [ref=f29e914]:
              - paragraph [ref=f29e915]: Gold sellers and leveling services are responsible for the vast majority of all account thefts, and they are the number-one source of World of Warcraft-related phishing attempts, spyware, and even credit card theft. Players who buy gold actively support spam, hacks, and keyloggers, and by doing so diminish the gameplay experience for everyone else.
            - paragraph [ref=f29e916]:
              - text: On August 1, 2011, Blizzard Entertainment announced that their forthcoming MMORPG,
              - link "Diablo III" [ref=f29e917] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Diablo_III
              - text: ", will include a currency-based auction house, wherein players will be able to buy and sell in-game items for real money."
              - superscript [ref=f29e918]:
                - link "[65]" [ref=f29e919] [cursor=pointer]:
                  - /url: "#cite_note-65"
                  - generic [ref=f29e920]: "[65]"
              - text: Robert Bridenbecker, Vice President of Online Technologies at Blizzard, explained that the intent behind the effort is largely to reduce account thefts resulting from player interaction with third-party sites. An undisclosed fee structure including listing fees, sale fees, and cash-out fees will accompany the Auction House at launch, and all transactions will exist within the protected context of Blizzard's MMORPG. The "Real Money Auction House" (RMAH), as it is called by the
              - link "Diablo III" [ref=f29e922] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Diablo_III
              - text: fanbase, will exist in the presence of a parallel auction house wherein items are exchanged for gold, the in-game currency. Accordingly, gold can be posted on the RMAH such that the two currencies may be exchanged for one another at the market rate less applicable fees.
            - paragraph [ref=f29e923]:
              - text: Other virtual world developers officially sell virtual items and currency for real-world money. For example, the
              - link "MMOG" [ref=f29e924] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/MMOG
              - link "There" [ref=f29e926] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/There_(internet_service)
              - text: has
              - link "therebucks" [ref=f29e927] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Therebucks
              - text: that sell for US dollars. If the currency in
              - link "Second Life" [ref=f29e929] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Second_Life
              - text: ", the Linden Dollars, can be easily acquired with real money, the reverse is done through a market place owned by Linden Lab, but is not guaranteed, as the TOS of linden Lab explicitly says that Linden dollars are not redeemable. Rates would fluctuate based on supply and demand, but over the last few years they have remained fairly stable at around 265 Linden Dollars (L$) to the US Dollar, due to \""
              - link "money creation" [ref=f29e930] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Money_creation
              - text: "\" by Linden Lab. The currency in"
              - link "Entropia Universe" [ref=f29e932] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Entropia_Universe
              - text: ", Project Entropia Dollars (PED), could be bought and redeemed for real-world money at a rate of 10 PED for"
              - link "U.S$." [ref=f29e933] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/USD
              - text: 1. On December 14, 2004, an island in Project Entropia sold for U.S. $26,500 (£13,700). One gamer also purchased a virtual
              - link "space station" [ref=f29e934] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Space_station
              - text: for U.S. $100,000 (£56,200) and plans to use it as a virtual
              - link "nightclub" [ref=f29e935] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Nightclub
              - text: .
              - superscript [ref=f29e936]:
                - link "[66]" [ref=f29e937] [cursor=pointer]:
                  - /url: "#cite_note-66"
                  - generic [ref=f29e938]: "[66]"
              - superscript [ref=f29e939]:
                - link "[67]" [ref=f29e940] [cursor=pointer]:
                  - /url: "#cite_note-67"
                  - generic [ref=f29e941]: "[67]"
              - text: Another example was recently cited on
              - link "CNBC" [ref=f29e942] [cursor=pointer]:
                - /url: https://www.cnbc.com/2016/08/10/want-a-full-pokemon-go-account-its-yours-for-999999.html
              - superscript [ref=f29e943]:
                - link "[68]" [ref=f29e944] [cursor=pointer]:
                  - /url: "#cite_note-68"
                  - generic [ref=f29e945]: "[68]"
              - text: that one seller was selling a Pokémon Go account for $999,999.
            - paragraph [ref=f29e946]:
              - text: Many Korean virtual worlds (such as
              - link "Flyff" [ref=f29e947] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Flyff
              - text: ) and other worlds outside that country (such as
              - link "Archlord" [ref=f29e948] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Archlord
              - text: and
              - link "Achaea, Dreams of Divine Lands" [ref=f29e949] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Achaea,_Dreams_of_Divine_Lands
              - text: ) operate entirely by selling items to players for real money. Such items generally cannot be transferred and are often used only as a means to represent a Premium subscription via a method which is easily integrated into the game engine.
            - paragraph [ref=f29e950]:
              - text: These intersections with real economies remain controversial. Markets that capitalize in gaming are not widely accepted by the gaming industry. Reasons for this controversy are varied. Firstly, the developers of the games often consider themselves as trying to present a fantasy experience, so the involvement of real world transactions takes away from it. Further, in most games, it would be unacceptable to offer another player real currency in order to have them play a certain way (e.g., in a game of
              - link "Monopoly" [ref=f29e952] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Monopoly_(game)
              - text: between friends, offering another player a real dollar in exchange for a property on the board); and for this to be necessary or valuable may indicate a
              - link "Kingmaker scenario" [ref=f29e953] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Kingmaker_scenario
              - text: within the game. However, such rules of etiquette need not apply, and in practice they often don't, to massive game worlds with thousands of players who know one another only through the game system.
            - paragraph [ref=f29e954]: Further and more involved issues revolve around the issue of how (or if) real-money trading subjects the virtual economy to laws relating to the real economy. Some argue that to allow in-game items to have monetary values makes these games, essentially, gambling venues, which would be subject to legal regulation as such. Another issue is the impact of taxation that may apply if in-game items are seen as having real value. If (for example) a magic sword is considered to have real-world value, a player who kills a powerful monster to earn such a sword could find himself being charged tax on the value of the sword, as would be normal for a "prize winning". This would make it impossible for any player of the game not to participate in real-money trading.
            - paragraph [ref=f29e955]:
              - text: A third issue is the involvement of the world's developer or maintenance staff in such transactions. Since a developer may change the virtual world any time, ban a player, delete items, or even simply take the world down never to return, the issue of their responsibility in the case where real money investments are lost through items being lost or becoming inaccessible is significant. Richard Bartle argued that this aspect negates the whole idea of ownership in virtual worlds,
              - superscript [ref=f29e956]:
                - link "[69]" [ref=f29e957] [cursor=pointer]:
                  - /url: "#cite_note-69"
                  - generic [ref=f29e958]: "[69]"
              - text: and thus in the absence of real ownership no real trade may occur. Some developers have acted deliberately to delete items that have been traded for money, as in
              - link "Final Fantasy XI" [ref=f29e959] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Final_Fantasy_XI
              - text: ", where a task force was set up to delete characters involved in selling in-game currency for real-world money."
              - superscript [ref=f29e960]:
                - link "[70]" [ref=f29e961] [cursor=pointer]:
                  - /url: "#cite_note-70"
                  - generic [ref=f29e962]: "[70]"
            - figure "LindeX Market Data" [ref=f29e963]:
              - link [ref=f29e964] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:LindeX_Market_Data.png
                - img [ref=f29e965]
              - generic [ref=f29e966]: LindeX Market Data
            - paragraph [ref=f29e967]:
              - text: However,
              - link "Second Life" [ref=f29e968] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Second_Life
              - text: has shown a legal example which may indicate that the developer can be in part held responsible for such losses. Second Life at one stage, offered and advertised the ability to "own virtual land", which was purchased for real money. In 2007, Marc Bragg, an attorney, was banned from
              - link "Second Life" [ref=f29e969] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Second_Life
              - text: ; in response he sued the developers for thereby depriving him of his land, which he – based on the developers' own statements – "owned". The lawsuit ended with a settlement in which Bragg was re-admitted to Second Life. The details of the final settlement were not released, but the word "own" was removed from all advertising as a result. (Bragg purchased his land directly from the developers, and thus they were not an uninvolved third party in his transactions.)
              - superscript [ref=f29e970]:
                - text: "["
                - link "citation needed" [ref=f29e972] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
