            - paragraph [ref=f24e379]: Each ALSEP station had some common elements.
            - table [ref=f24e380]:
              - rowgroup [ref=f24e381]:
                - row "Name Diagram Picture Description" [ref=f24e382]:
                  - columnheader "Name" [ref=f24e383]
                  - columnheader "Diagram" [ref=f24e384]
                  - columnheader "Picture" [ref=f24e385]
                  - columnheader "Description" [ref=f24e386]
                - row "Central Station The picture shows the Central Station from Apollo 16's ALSEP. The Central Station was essentially the command center for the entire ALSEP station. It received commands from Earth, transmitted data, and distributed power to each experiment. Communications with Earth were achieved through a 58 cm long, 3.8 cm diameter modified axial-helical antenna mounted on top of the Central Station and pointed towards Earth by the astronauts. Transmitters, receivers, data processors and multiplexers were housed within the Central Station. The Central Station was a 25 kg box with a stowed volume of 34,800 cubic cm. In addition, on Apollos 12 to 15, a Dust Detector was mounted on the Central Station which measured the accumulation of lunar dust." [ref=f24e387]:
