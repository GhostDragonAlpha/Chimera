                    - text: ",\" either naturally or artificially created, to help study the structure of the subsurface."
                - row "Passive Seismic Experiment Package (PSEP) Similar to the PSE, except it was self-supporting. This meant it carried its own power source (solar arrays), electronics, and communications equipment. In addition, the PSEP also carried a Dust Detector." [ref=f24e538]:
                  - rowheader "Passive Seismic Experiment Package (PSEP)" [ref=f24e539]:
                    - link "Passive Seismic Experiment Package" [ref=f24e540] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/Passive_Seismic_Experiment_Package
                    - text: (PSEP)
                  - cell [ref=f24e541]:
                    - link [ref=f24e543] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:ALSEP_Passive_Seismic_Experiment_Package.gif
                      - img [ref=f24e544]
                  - cell "Similar to the PSE, except it was self-supporting. This meant it carried its own power source (solar arrays), electronics, and communications equipment. In addition, the PSEP also carried a Dust Detector." [ref=f24e545]:
                    - text: Similar to the PSE, except it was self-supporting. This meant it carried its own power source (
                    - link "solar arrays" [ref=f24e546] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/Photovoltaics
                    - text: ), electronics, and communications equipment. In addition, the PSEP also carried a Dust Detector.
                - row "Solar Wind Spectrometer Experiment (SWS) The SWS was designed to study solar wind properties and its effects on the lunar environment." [ref=f24e547]:
                  - rowheader "Solar Wind Spectrometer Experiment (SWS)" [ref=f24e548]:
                    - link "Solar Wind Spectrometer Experiment (SWS)" [ref=f24e549] [cursor=pointer]:
