                      - img [ref=f24e517]
                  - cell "The LSG was designed to make very accurate measurements of lunar gravity and its change over time. It was hoped the data could be used to prove the existence of gravitational waves." [ref=f24e518]:
                    - text: The LSG was designed to make very accurate measurements of lunar gravity and its change over time. It was hoped the data could be used to prove the existence of
                    - link "gravitational waves" [ref=f24e519] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/Gravitational_wave
                    - text: .
                - row "Lunar Surface Magnetometer (LSM) The LSM was designed to measure the Moon's magnetic field. The data could be used to determine electrical properties of the subsurface. It was also used to study the interaction of solar plasma and the lunar surface." [ref=f24e520]:
                  - rowheader "Lunar Surface Magnetometer (LSM)" [ref=f24e521]:
