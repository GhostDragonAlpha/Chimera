                - row "Heat Flow Experiment (HFE) The HFE was designed to make thermal measurements of the lunar subsurface in order to determine the rate at which heat flows out of the interior.[6] The measurements could help determine the abundance of radioisotopes and help understand the thermal evolution of the Moon. The HFE consisted of an electronics box and two probes. Each probe was placed in a hole by an astronaut that was drilled to about 2.5 m deep." [ref=f24e458]:
