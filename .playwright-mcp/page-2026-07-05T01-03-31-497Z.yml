                - row "Active Seismic Experiment (ASE) Through the use of seismology the internal structure of the Moon could be determined to several hundred feet underground. The ASE consisted of three major components. A set of three geophones was laid out in a line by an astronaut from the Central Station to detect the explosions.[5] A mortar package was designed to lob a set of four explosives from varying distances away from the ALSEP. An astronaut-activated Thumper was used to detonate one of 22 charges to create a small shock. The diagram shows the Thumper device." [ref=f24e432]:
