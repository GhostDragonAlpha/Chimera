                - row "Lunar Ejecta and Meteorites Experiment (LEAM) The LEAM was designed to detect secondary particles that had been ejected by meteorite impacts on the lunar surface and to detect primary micrometeorites themselves.[7] See lunar soil for some experiment results." [ref=f24e485]:
