                    - paragraph [ref=f24e398]: Transmitters, receivers, data processors and multiplexers were housed within the Central Station. The Central Station was a 25 kg box with a stowed volume of 34,800 cubic cm. In addition, on Apollos 12 to 15, a Dust Detector was mounted on the Central Station which measured the accumulation of lunar dust.
                - row "Radioisotope Thermoelectric Generator (RTG) The picture shows the RTG from Apollo 14 with the Central Station in the background. The RTG was the power source for the ALSEP. It utilized the heat from the radioactive decay of plutonium-238 and thermocouples to generate approximately 70 watts of power. The base of the RTG was the base of the second ALSEP subpackage." [ref=f24e399]:
