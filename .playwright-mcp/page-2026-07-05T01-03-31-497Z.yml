                - row "Cold Cathode Gauge Experiment (CCGE) or Cold Cathode Ion Gauge (CCIG) The CCGE experiment was designed to measure the pressure of the lunar atmosphere. It was originally designed to be part of the SIDE, but its strong magnetic field would have caused interference. The CCIG is on the right of the SIDE in the diagram." [ref=f24e452]:
