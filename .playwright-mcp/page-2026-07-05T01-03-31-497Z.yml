                - row "Laser Ranging Retroreflector (LRRR) An LRRR is used to reflect a laser beam from Earth, the round-trip timing of the beam is an accurate gauge of the distance to the Moon. The information is used to study lunar recession due to tidal dissipation and the irregular motion of the Earth. The LRRRs are the only experiments still in use. The above diagram shows the Apollo 11 version. Apollo 14's was similar to Apollo 11's. The lower diagram shows the larger Apollo 15 version." [ref=f24e465]:
