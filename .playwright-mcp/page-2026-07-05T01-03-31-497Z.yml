            - paragraph [ref=f24e929]:
              - text: The ALSEP system and instruments were controlled by commands from Earth. The stations ran from deployment until the support operations were terminated on 30 September 1977 due primarily to budgetary considerations. In 1977 it was evaluated that the power packs of at least one station could not run both the transmitter and any other instrument. The transmitters were not switched off,
              - superscript [ref=f24e930]:
                - link "[9]" [ref=f24e931] [cursor=pointer]:
                  - /url: "#cite_note-9"
                  - generic: "[9]"
              - text: and all 5 ALSEPs were observed by the Soviet radio telescope
              - link "RATAN-600" [ref=f24e932] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/RATAN-600
              - text: between 18 October and 28 November 1977, after the official termination of their mission.
              - superscript [ref=f24e933]:
                - link "[10]" [ref=f24e934] [cursor=pointer]:
                  - /url: "#cite_note-nau78-10"
                  - generic: "[10]"
            - paragraph [ref=f24e935]:
              - text: ALSEP systems are visible in several images taken by the
              - link "Lunar Reconnaissance Orbiter" [ref=f24e936] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Lunar_Reconnaissance_Orbiter
              - text: during its orbits over Apollo landing sites.
