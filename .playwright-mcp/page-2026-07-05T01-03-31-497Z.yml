                  - cell "The SWS was designed to study solar wind properties and its effects on the lunar environment." [ref=f24e554]
                - row "Suprathermal Ion Detector Experiment (SIDE) The SIDE was designed to measure various properties of positive ions in the lunar environment, provide data on the plasma interaction between solar wind and the Moon, and to determine the electrical potential of the lunar surface." [ref=f24e555]:
