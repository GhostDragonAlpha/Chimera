            - paragraph [ref=f24e564]: Each mission had a different array of experiments.
            - region "Apollo 11 (EASEP)" [ref=f24e565]:
              - generic [ref=f24e566]:
                - heading "Apollo 11 (EASEP)" [level=3] [ref=f24e567]: Apollo 11 (EASEP)
                - generic [ref=f24e568]:
                  - link "edit":
                    - /url: /w/index.php?title=Apollo_Lunar_Surface_Experiments_Package&action=edit&section=6
              - figure "On Apollo 11, Buzz Aldrin simply carried the EASEP to the deployment site by using handles. This is different from the carrybar used on later missions." [ref=f24e569]:
                - link [ref=f24e570] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:Buzz_Aldrin_carries_the_EASEP.jpg
                  - img [ref=f24e571]
                - generic [ref=f24e572]:
                  - text: On Apollo 11,
                  - link "Buzz Aldrin" [ref=f24e573] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Buzz_Aldrin
                  - text: simply carried the EASEP to the deployment site by using handles. This is different from the carrybar used on later missions.
              - paragraph [ref=f24e574]:
                - text: Because of the risk of an early abort on the Moon, geologists persuaded NASA to permit only experiments that could be set up or completed in 10 minutes.
                - superscript [ref=f24e575]:
                  - link "[8]" [ref=f24e576] [cursor=pointer]:
                    - /url: "#cite_note-lindoh-8"
                    - generic: "[8]"
                - text: As a result, Apollo 11 did not leave a full ALSEP package, but left a simpler version called the Early Apollo Surface Experiments Package (EASEP). Since there was only one 2 hour 40 minute EVA planned, the crew would not have enough time to deploy a full ALSEP, which usually took one to two hours to deploy. Both packages were stored in the LM's SEQ bay.
              - paragraph [ref=f24e577]:
                - text: Engineers designed the EASEP to deploy with one squeeze handle, and the Laser Ranging Retroreflector (LRRR) also deployed within ten minutes. Despite the simpler design, the seismometer was sensitive enough to detect
                - link "Neil Armstrong" [ref=f24e578] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Neil_Armstrong
                - text: "'s movements during sleep."
                - superscript [ref=f24e579]:
                  - link "[8]" [ref=f24e580] [cursor=pointer]:
                    - /url: "#cite_note-lindoh-8"
                    - generic: "[8]"
