                    - text: . The data could be used to determine electrical properties of the subsurface. It was also used to study the interaction of solar plasma and the lunar surface.
                - row "Apollo 12 Passive Seismic Experiment (PSE) The PSE was designed to detect \"moonquakes,\" either naturally or artificially created, to help study the structure of the subsurface." [ref=f24e529]:
