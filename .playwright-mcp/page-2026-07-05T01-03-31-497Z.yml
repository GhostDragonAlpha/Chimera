                - row "Lunar Seismic Profiling Experiment (LSPE) The LSPE was similar to the ASE except the expected depth was to be several kilometers. It consisted of three major components. A set of four geophones was laid out near the ALSEP by an astronaut.[5] The LSPE antenna was used to send signals to the charges. There were eight charges, each consisting of various sizes ranging from 1⁄8 to 6 lb (0.06 to 2.72 kg). The charges were deployed during the Lunar Roving Vehicle traverses." [ref=f24e496]:
                  - rowheader "Lunar Seismic Profiling Experiment (LSPE)" [ref=f24e497]:
