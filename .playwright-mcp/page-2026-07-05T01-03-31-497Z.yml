                    - text: (LSPE)
                  - cell [ref=f24e499]:
                    - link [ref=f24e501] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:ALSEP_Lunar_Seismic_Profiling_Experiment_Charge.gif
                      - img [ref=f24e502]
