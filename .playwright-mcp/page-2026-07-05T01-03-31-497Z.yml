      - generic "Apollo Lunar Surface Experiments Package" [ref=f24e222]:
        - generic [ref=f24e224]: From Wikipedia, the free encyclopedia
        - generic [ref=f24e226]:
          - generic [ref=f24e227]:
            - figure "The ALSEP of the Apollo 16 mission" [ref=f24e228]:
              - link [ref=f24e229] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Ap16_pse.jpg
                - img [ref=f24e230]
              - generic [ref=f24e231]: The ALSEP of the Apollo 16 mission
            - paragraph [ref=f24e232]:
              - text: The Apollo Lunar Surface Experiments Package (ALSEP) comprised a set of scientific instruments placed by the
              - link "astronauts" [ref=f24e233] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Astronaut
              - text: at the landing site of each of the five
              - link "Apollo missions" [ref=f24e234] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Apollo_program
              - text: to land on the Moon following
              - link "Apollo 11" [ref=f24e235] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Apollo_11
              - text: (Apollos
              - link "12" [ref=f24e236] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Apollo_12
              - text: ","
              - link "14" [ref=f24e237] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Apollo_14
              - text: ","
              - link "15" [ref=f24e238] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Apollo_15
              - text: ","
              - link "16" [ref=f24e239] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Apollo_16
              - text: ", and"
              - link "17" [ref=f24e240] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Apollo_17
              - text: ). Apollo 11 left a smaller package called the Early Apollo Scientific Experiments Package, or EASEP.
          - region "Background" [ref=f24e241]:
            - generic [ref=f24e242]:
              - heading "Background" [level=2] [ref=f24e243]
              - generic [ref=f24e244]:
                - link "edit":
                  - /url: /w/index.php?title=Apollo_Lunar_Surface_Experiments_Package&action=edit&section=1
            - paragraph [ref=f24e245]:
              - text: "The instrumentation and experiments that would comprise ALSEP were decided in February 1966. Specifically, the experiments, institutions responsible, and principal investigators and coinvestigators were:"
              - superscript [ref=f24e246]:
                - link [ref=f24e247] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Apollo_Lunar_Surface_Experiments_Package#endnote_EAweb
            - list [ref=f24e248]:
              - listitem [ref=f24e249]:
                - text: "Passive Lunar Seismic Experiment:"
                - link "Massachusetts Institute of Technology" [ref=f24e250] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Massachusetts_Institute_of_Technology
                - text: ","
                - link "Frank Press" [ref=f24e251] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Frank_Press
                - text: ;
                - link "Columbia University" [ref=f24e252] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Columbia_University
                - text: ", George Sutton;"
                - link "Georgia Tech" [ref=f24e253] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Georgia_Tech
                - text: ", Robert Hostetler"
              - listitem [ref=f24e254]:
                - link "Lunar Surface Magnetometer" [ref=f24e255] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Lunar_Surface_Magnetometer
                - text: ":"
                - link "Ames Research Center" [ref=f24e256] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ames_Research_Center
                - text: ", C. P. Sonett;"
                - link "Marshall Space Flight Center" [ref=f24e257] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Marshall_Space_Flight_Center
                - text: ", Jerry Modisette."
              - listitem [ref=f24e258]:
                - text: Medium-Energy
                - link "Solar Wind" [ref=f24e259] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Solar_Wind_Spectrometer
                - text: ":"
                - link "Jet Propulsion Laboratory" [ref=f24e260] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Jet_Propulsion_Laboratory
                - text: ", C. W. Snyder and M. M. Neugebauer."
              - listitem [ref=f24e261]:
                - link "Suprathermal Ion Detection" [ref=f24e262] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Suprathermal_Ion_Detector_Experiment
                - text: ":"
                - link "Rice University" [ref=f24e263] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Rice_University
                - text: ", J. W. Freeman Jr.; Marshall Space Flight Center,"
                - link "Curt Michel" [ref=f24e264] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Curt_Michel
                - text: .
              - listitem [ref=f24e265]:
                - link "Heat Flow Experiment" [ref=f24e266] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Heat_Flow_Experiment
                - text: ": Columbia University, M. Langseth;"
                - link "Yale University" [ref=f24e267] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Yale_University
                - text: ", S. Clark."
              - listitem [ref=f24e268]:
                - text: Low-Energy Solar Wind
                - link "Charged Particle Lunar Environment Experiment" [ref=f24e269] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Charged_Particle_Lunar_Environment_Experiment
                - text: ": Rice University, B. J. O'Brien."
              - listitem [ref=f24e270]:
                - link "Active Seismic Experiment" [ref=f24e271] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Active_Seismic_Experiment
                - text: ":"
                - superscript [ref=f24e272]:
                  - link "[1]" [ref=f24e273] [cursor=pointer]:
                    - /url: "#cite_note-active-1"
                    - generic: "[1]"
                - superscript [ref=f24e274]:
                  - link "[2]" [ref=f24e275] [cursor=pointer]:
                    - /url: "#cite_note-ninfinger-2"
                    - generic: "[2]"
                - link "Stanford University" [ref=f24e276] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Stanford_University
                - text: ", R. L. Kovach;"
                - link "United States Geological Survey" [ref=f24e277] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/United_States_Geological_Survey
                - text: ", J. S. Watkins."
              - listitem [ref=f24e278]:
                - text: "SNAP-27 isotopic power system:"
                - superscript [ref=f24e279]:
                  - link "[3]" [ref=f24e280] [cursor=pointer]:
                    - /url: "#cite_note-3"
                    - generic: "[3]"
                - link "Sandia National Laboratories" [ref=f24e281] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Sandia_National_Laboratories
                - text: ", Jim Leonard"
            - paragraph [ref=f24e282]:
              - text: The ALSEP was built and tested by
              - link "Bendix Aerospace" [ref=f24e283] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Bendix_Corporation
              - text: in
              - link "Ann Arbor, Michigan" [ref=f24e284] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ann_Arbor,_Michigan
              - text: . The instruments were designed to run autonomously after the astronauts left and to make long-term studies of the lunar environment. They were arrayed around a Central Station which supplied power generated by a
              - link "radioisotope thermoelectric generator" [ref=f24e285] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Radioisotope_thermoelectric_generator
              - text: (RTG) to run the instruments and communications so data collected by the experiments could be relayed to Earth. Thermal control was achieved by passive elements (insulation, reflectors, thermal coatings) as well as power dissipation resistors and heaters. Data collected from the instruments were converted into a telemetry format and transmitted to Earth.
          - region "Deployment" [ref=f24e286]:
            - generic [ref=f24e287]:
              - heading "Deployment" [level=2] [ref=f24e288]
              - generic [ref=f24e289]:
                - link "edit":
                  - /url: /w/index.php?title=Apollo_Lunar_Surface_Experiments_Package&action=edit&section=2
            - paragraph [ref=f24e290]:
              - text: The ALSEP was stored in the
              - link "Lunar Module" [ref=f24e291] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Apollo_Lunar_Module
              - text: "'s Scientific Equipment (SEQ) Bay in two separate subpackages. The base of the first subpackage formed the Central Station. The base of the second subpackage was part of the RTG. A subpallet was attached to the second subpackage, which usually carried one or two of the experiments and the antenna gimbal assembly."
            - paragraph [ref=f24e292]: On Apollo 12, 13, and 14, the second subpackage stored the Lunar Hand Tool Carrier (HTC). The exact deployment of experiments differed by mission. The following pictures show a typical procedure from Apollo 12.
            - table [ref=f24e293]:
              - rowgroup [ref=f24e294]:
                - row "Picture Description" [ref=f24e295]:
                  - columnheader "Picture" [ref=f24e296]
                  - columnheader "Description" [ref=f24e297]
                - row "Pete Conrad opens the SEQ bay doors through a system of lanyards and pulleys." [ref=f24e298]:
                  - cell [ref=f24e299]:
                    - link [ref=f24e301] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:ALSEP_AS12-47-6913.jpg
                      - img [ref=f24e302]
                  - cell "Pete Conrad opens the SEQ bay doors through a system of lanyards and pulleys." [ref=f24e303]:
                    - link "Pete Conrad" [ref=f24e304] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/Pete_Conrad
                    - text: opens the SEQ bay doors through a system of lanyards and pulleys.
                - row "Alan Bean removes the second subpackage from the SEQ bay. This was accomplished by using the boom which can be seen extended and a pulley system to set it on the ground. By Apollo 17, astronauts felt that the use of the boom and pulley system complicated the operation. And as such, the entire system was removed for Apollo 17. On Apollo 11, Buzz Aldrin chose not to use the system because of a lack of time." [ref=f24e305]:
                  - cell [ref=f24e306]:
                    - link [ref=f24e308] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:ALSEP_AS12-46-6783.jpg
                      - img [ref=f24e309]
                  - cell "Alan Bean removes the second subpackage from the SEQ bay. This was accomplished by using the boom which can be seen extended and a pulley system to set it on the ground. By Apollo 17, astronauts felt that the use of the boom and pulley system complicated the operation. And as such, the entire system was removed for Apollo 17. On Apollo 11, Buzz Aldrin chose not to use the system because of a lack of time." [ref=f24e310]:
                    - link "Alan Bean" [ref=f24e311] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/Alan_Bean
                    - text: removes the second subpackage from the SEQ bay. This was accomplished by using the boom which can be seen extended and a pulley system to set it on the ground. By Apollo 17, astronauts felt that the use of the boom and pulley system complicated the operation. And as such, the entire system was removed for Apollo 17. On Apollo 11, Buzz Aldrin chose not to use the system because of a lack of time.
                - row "The first subpackage, which Conrad had removed from the SEQ bay earlier." [ref=f24e312]:
                  - cell [ref=f24e313]:
                    - link [ref=f24e315] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:ALSEP_AS12-46-6784.jpg
                      - img [ref=f24e316]
                  - cell "The first subpackage, which Conrad had removed from the SEQ bay earlier." [ref=f24e317]
                - row "Bean lowers the RTG cask into a position where he can access it." [ref=f24e318]:
                  - cell [ref=f24e319]:
                    - link [ref=f24e321] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:ALSEP_AS12-46-6786.jpg
                      - img [ref=f24e322]
                  - cell "Bean lowers the RTG cask into a position where he can access it." [ref=f24e323]
                - row "Bean is beginning to remove the dome from the RTG cask. He is using a specialized tool called the Dome Removal Tool (DRT). Note how he has already prepared the RTG for fueling and has already deployed the HTC. Conrad has already removed the subpallet from the RTG subpackage." [ref=f24e324]:
                  - cell [ref=f24e325]:
                    - link [ref=f24e327] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:ALSEP_AS12-46-6787.jpg
                      - img [ref=f24e328]
                  - cell "Bean is beginning to remove the dome from the RTG cask. He is using a specialized tool called the Dome Removal Tool (DRT). Note how he has already prepared the RTG for fueling and has already deployed the HTC. Conrad has already removed the subpallet from the RTG subpackage." [ref=f24e329]
                - row "Bean discards the dome with the DRT still attached. Neither had a use afterward." [ref=f24e330]:
                  - cell [ref=f24e331]:
                    - link [ref=f24e333] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:ALSEP_AS12-46-6788.jpg
                      - img [ref=f24e334]
                  - cell "Bean discards the dome with the DRT still attached. Neither had a use afterward." [ref=f24e335]
                - row "Bean is attempting to remove the fuel element from the cask using the Fuel Transfer Tool (FTT). Note one of the Universal Hand Tools (UHT) attached to the RTG subpackage. On Apollo 12, the fuel element stuck in the cask because of thermal expansion (Bean could feel the heat through his suit). Conrad pounded the side of the cask with a hammer while Bean successfully worked it loose. He then inserted it into the RTG and discarded the FTT." [ref=f24e336]:
                  - cell [ref=f24e337]:
                    - link [ref=f24e339] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:Putting_the_Plutonium_238_fuel_into_the_SNAP_27.jpg
                      - img [ref=f24e340]
                  - cell "Bean is attempting to remove the fuel element from the cask using the Fuel Transfer Tool (FTT). Note one of the Universal Hand Tools (UHT) attached to the RTG subpackage. On Apollo 12, the fuel element stuck in the cask because of thermal expansion (Bean could feel the heat through his suit). Conrad pounded the side of the cask with a hammer while Bean successfully worked it loose. He then inserted it into the RTG and discarded the FTT." [ref=f24e341]
                - row "Bean attaches the RTG subpackage to the carrybar in preparation for the traverse to the ALSEP deployment site. The carrybar would later be used as the mast for the antenna on the Central Station." [ref=f24e342]:
                  - cell [ref=f24e343]:
                    - link [ref=f24e345] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:ALSEP_AS12-46-6792.jpg
                      - img [ref=f24e346]
                  - cell "Bean attaches the RTG subpackage to the carrybar in preparation for the traverse to the ALSEP deployment site. The carrybar would later be used as the mast for the antenna on the Central Station." [ref=f24e347]
