                - row "Lunar Surface Gravimeter (LSG) The LSG was designed to make very accurate measurements of lunar gravity and its change over time. It was hoped the data could be used to prove the existence of gravitational waves." [ref=f24e511]:
                  - rowheader "Lunar Surface Gravimeter (LSG)" [ref=f24e512]:
