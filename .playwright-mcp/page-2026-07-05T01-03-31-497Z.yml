                - row "RTG Cask The RTG cask stored the plutonium-238 fuel element. It was located to left of the SEQ bay. The cask was designed to withstand a launch vehicle explosion in the event of an abort or a re-entry into Earth's atmosphere, which is what occurred on Apollo 13. The picture shows Edgar Mitchell practicing the removal of the fuel element." [ref=f24e414]:
