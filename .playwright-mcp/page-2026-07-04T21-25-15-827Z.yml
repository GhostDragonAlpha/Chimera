                  - strong [ref=f142e576]: Behavior Tree
                  - text: references the
                  - strong [ref=f142e577]: Blackboard
                  - text: in its decision-making process (you can always add
                  - strong [ref=f142e578]: Keys
                  - text: later as you need them). You can edit a
                  - strong [ref=f142e579]: Blackboard
                  - text: asset by double-clicking on the asset in the
                  - strong [ref=f142e580]: Content Drawer
                  - text: to open it up in the
                  - strong [ref=f142e581]: Blackboard Editor
                  - text: .
