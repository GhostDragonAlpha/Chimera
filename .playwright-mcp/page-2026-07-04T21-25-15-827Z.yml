                  - text: to inherit functionality from by selecting it from the drop-down menu.
                - img "You can use an existing Behavior Tree Decorator as the Parent Class to inherit functionality from by selecting it from the drop-down menu"
                - heading "Creating a Behavior Tree Service" [level=3] [ref=f142e536]
                - paragraph [ref=f142e537]:
                  - strong [ref=f142e538]: Services
                  - text: attach to
                  - strong [ref=f142e539]: Composite
                  - text: nodes and will execute at their defined frequency as long as their branch is being executed. These are often used to make checks and to update the
                  - strong [ref=f142e540]: Blackboard
                  - text: and take the place of traditional Parallel nodes in other Behavior Tree systems. While there are a few
                  - strong [ref=f142e541]: Services
                  - text: available by default, you will more than likely want to create your own custom
                  - strong [ref=f142e542]: Services
                  - text: that assist in determining how your
                  - strong [ref=f142e543]: Behavior Tree
                  - text: is executed.
                - generic [ref=f142e545]:
                  - generic [ref=f142e546]: 
                  - paragraph [ref=f142e548]: If optimization is a concern, you may want to consider switching Blueprint Behavior Tree Services to native Behavior Tree Services.
                - paragraph [ref=f142e549]:
