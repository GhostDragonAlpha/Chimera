                - heading "Working with Nodes" [level=3] [ref=f142e699]
                - paragraph [ref=f142e700]:
                  - text: To add
                  - strong [ref=f142e701]: Composites
                  - text: or
                  - strong [ref=f142e702]: Tasks
                  - text: to the graph of your
