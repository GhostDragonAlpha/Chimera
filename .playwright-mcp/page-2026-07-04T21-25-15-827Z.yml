                - paragraph [ref=f142e489]:
                  - text: The
                  - strong [ref=f142e490]: Task Blueprint
                  - text: will be created inside the
                  - strong [ref=f142e491]: Content Drawer
                  - text: in the same location as your
                  - strong [ref=f142e492]: Behavior Tree
                  - text: asset.
                - generic [ref=f142e494]:
                  - generic [ref=f142e495]: 
                  - paragraph [ref=f142e497]:
                    - text: Whenever you create a new
                    - strong [ref=f142e498]: Task
                    - text: from the
                    - strong [ref=f142e499]: Behavior Tree Editor
                    - text: ", it's a good practice to go into the"
                    - strong [ref=f142e500]: Content Drawer
                    - text: and rename the asset instead of using the default name.
                - paragraph [ref=f142e501]:
                  - text: When creating a new
                  - strong [ref=f142e502]: Task
                  - text: ", you can use an existing"
