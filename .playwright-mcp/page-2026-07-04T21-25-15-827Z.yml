                - heading "Creating Behavior Tree Assets" [level=2] [ref=f142e421]
                - paragraph [ref=f142e422]:
                  - text: This section illustrates how to create the various
                  - strong [ref=f142e423]: Behavior Tree
                  - text: assets within Unreal Engine 5.
                - heading "Creating a Behavior Tree" [level=3] [ref=f142e424]
                - paragraph [ref=f142e425]:
                  - strong [ref=f142e426]: Behavior Trees
                  - text: are essentially the AI's processor and can make decisions and execute various branches based on the outcome of those decisions.
                  - strong [ref=f142e427]: Behavior Trees
                  - text: are created inside the
                  - strong [ref=f142e428]: Content Drawer
                  - text: "in the following manner:"
                - paragraph [ref=f142e429]:
                  - text: Click the
                  - strong [ref=f142e430]: +Add
                  - text: button, then under
                  - strong [ref=f142e431]: Create Advanced Asset
                  - text: select
                  - strong [ref=f142e432]: Artificial Intelligence
                  - text: and
                  - strong [ref=f142e433]: Behavior Tree
                  - text: .
                - img "Click the Add button then under Create Advanced Asset select Artificial Intelligence and Behavior Tree" [ref=f142e434]
                - paragraph [ref=f142e435]:
                  - text: The new
                  - strong [ref=f142e436]: Behavior Tree
                  - text: asset will be added to the
                  - strong [ref=f142e437]: Content Drawer
                  - text: where you can define its name.
                - img "The new Behavior Tree asset will be added to the Content Drawer where you can define its name" [ref=f142e438]
                - paragraph
                - generic [ref=f142e440]:
