                - heading "Assigning a Blackboard" [level=3] [ref=f142e686]
                - paragraph [ref=f142e687]:
                  - text: In order for the
                  - strong [ref=f142e688]: Behavior Tree
                  - text: to access a
                  - strong [ref=f142e689]: Blackboard
                  - text: ", you must assign a"
                  - strong [ref=f142e690]: Blackboard
                  - text: "asset:"
                - paragraph [ref=f142e691]:
                  - text: Select the
