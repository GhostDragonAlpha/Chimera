                - generic [ref=f142e705]:
                  - generic [ref=f142e706]: 
                  - paragraph [ref=f142e708]:
                    - text: Only
                    - strong [ref=f142e709]: Composite
                    - text: nodes can be connected to the
                    - strong [ref=f142e710]: Root
                    - text: node of a
                    - strong [ref=f142e711]: Behavior Tree
                    - text: .
                - paragraph [ref=f142e712]: You can also drag off a node and select a node to add from the context menu.
                - img "You can also drag off a node and select a node to add from the context menu"
                - paragraph [ref=f142e713]:
                  - text: To remove nodes from the graph, select a node (or nodes) and press
                  - strong [ref=f142e714]: Delete
                  - text: (or right-click and select
                  - strong [ref=f142e715]: Delete
                  - text: ).
                - img "To remove nodes from the graph select a node or nodes and press Delete or right-click and select Delete"
                - paragraph [ref=f142e716]: To connect nodes together, left-click and drag from the output pin, to input pin on another node.
                - img "To connect nodes together left-click and drag from the output pin, to an input pin on another node"
                - generic [ref=f142e718]:
                  - generic [ref=f142e719]: 
                  - paragraph [ref=f142e721]:
                    - text: Connecting nodes in
                    - strong [ref=f142e722]: Behavior Trees
                    - text: only work by connecting an output to an input (you cannot connect from an input to an output).
                - paragraph [ref=f142e723]:
                  - text: To disconnect nodes, right-click a node (or define a selection of nodes) and select your desired
                  - strong [ref=f142e724]: Break All Pin Link(s)
                  - text: method.
                - img "To disconnect nodes right-click a node or define a selection of nodes and select your desired Break Link(s) method"
                - paragraph [ref=f142e725]:
                  - strong [ref=f142e726]: Break All Pin Link(s)
                  - text: can be used to break a single link or multiple nodes that are pinned.
                  - strong [ref=f142e727]: Break link to
                  - text: ... will break the connection to the specified node.
                - generic [ref=f142e729]:
                  - generic [ref=f142e730]: 
                  - paragraph [ref=f142e732]: You can also press alt + left-click on an input or output pin to break the connection.
                - paragraph [ref=f142e733]:
                  - text: To edit a node, select a node, then in the
                  - strong [ref=f142e734]: Details
                  - text: panel, you can adjust its properties.
                - img "Select a node and in the Details panel you can adjust its properties"
                - paragraph [ref=f142e735]: You can also copy and paste selected nodes and their settings. To do this, select a node (or drag a selection box around a selection of nodes) then press ctrl+c (to copy) and ctrl+v (to paste).
