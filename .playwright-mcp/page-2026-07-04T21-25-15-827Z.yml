                    - text: You can also use the right-click context menu and select
                    - strong [ref=f142e444]: +Add > Artificial Intelligence > Behavior Tree.
                - heading "Creating a Blackboard" [level=3] [ref=f142e445]
                - paragraph [ref=f142e446]:
                  - text: The
                  - strong [ref=f142e447]: Blackboard
                  - text: asset can be considered as the "brain" of the AI and stores
                  - strong [ref=f142e448]: Key
                  - text: values that the
                  - strong [ref=f142e449]: Behavior Tree
                  - text: uses to make its decisions.
                  - strong [ref=f142e450]: Blackboard
                  - text: "assets can be created using the following methods:"
                - paragraph [ref=f142e451]:
                  - text: Click the
                  - strong [ref=f142e452]: +Add
                  - text: button, then under
                  - strong [ref=f142e453]: Create Advanced Asset
                  - text: select
                  - strong [ref=f142e454]: Artificial Intelligence
                  - text: and
                  - strong [ref=f142e455]: Blackboard
                  - text: .
                - img "Click the Add button, then under Create Advanced Asset select Artificial Intelligence and Blackboard" [ref=f142e456]
                - paragraph [ref=f142e457]:
                  - text: The new
                  - strong [ref=f142e458]: Blackboard
                  - text: asset will be added to the
                  - strong [ref=f142e459]: Content Drawer
                  - text: which you can rename to your desired name.
                - img "The new Blackboard asset will be added to the Content Drawer which you can rename to your desired name" [ref=f142e460]
                - paragraph [ref=f142e461]: "Another method in which you can create a Blackboard is inside a Behavior Tree:"
                - paragraph [ref=f142e462]:
                  - text: Inside the
                  - strong [ref=f142e463]: Behavior Tree Editor
