                  - strong [ref=f142e464]: New Blackboard
                  - text: button.
                - img "Inside the Behavior Tree Editor from the Toolbar by clicking the New Blackboard button" [ref=f142e465]
                - paragraph [ref=f142e466]:
                  - text: This will also create a new
                  - strong [ref=f142e467]: Blackboard
                  - text: asset inside the
                  - strong [ref=f142e468]: Content Drawer
                  - text: .
                - heading "Creating a Behavior Tree Task" [level=3] [ref=f142e469]
                - paragraph [ref=f142e470]:
                  - text: A
                  - strong [ref=f142e471]: Task
                  - text: is an "action" you want the AI to perform, such as move to a location or rotate to face something.
                - generic [ref=f142e473]:
                  - generic [ref=f142e474]: 
                  - paragraph [ref=f142e476]: If optimization is a concern, you may want to consider switching Blueprint Behavior Tree Tasks to native Behavior Tree Tasks.
                - paragraph [ref=f142e477]:
                  - text: In addition to the existing
                  - strong [ref=f142e478]: Tasks
                  - text: available, you can create custom
                  - strong [ref=f142e479]: Tasks
                  - text: "with your own logic:"
                - paragraph [ref=f142e480]:
                  - text: Click the
                  - strong [ref=f142e481]: New Task
                  - text: button from the Toolbar inside the
                  - strong [ref=f142e482]: Behavior Tree Editor
                  - text: .
