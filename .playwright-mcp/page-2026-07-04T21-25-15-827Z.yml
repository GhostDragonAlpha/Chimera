                - img "You can use an existing Behavior Tree Task as the Parent Class to inherit functionality by selecting it from the drop-down menu" [ref=f142e505]
                - heading "Creating a Behavior Tree Decorator" [level=3] [ref=f142e506]
                - paragraph [ref=f142e507]:
                  - strong [ref=f142e508]: Decorators
                  - text: (also known as conditionals) attach to nodes inside
                  - strong [ref=f142e509]: Behavior Trees
                  - text: and can be used to make decisions on whether a branch (or even a single node) in the tree can be executed. There are several default
                  - strong [ref=f142e510]: Decorators
                  - text: that you can use in your
                  - strong [ref=f142e511]: Behavior Trees
                  - text: ", however, you can also create custom ones:"
                - paragraph [ref=f142e512]:
                  - text: Click the
                  - strong [ref=f142e513]: New Decorator
                  - text: button from the Toolbar inside the
                  - strong [ref=f142e514]: Behavior Tree Editor
                  - text: .
                - img "Click the New Decorator button from the Toolbar inside the Behavior Tree Editor" [ref=f142e515]
                - paragraph [ref=f142e516]:
                  - text: This will open a new
                  - strong [ref=f142e517]: BTDecorator_BlueprintBase
                  - text: class where you can provide your
                  - strong [ref=f142e518]: Decorator
                  - text: logic.
                - img "This will open a new BTDecorator_BlueprintBase class where you can provide your Decorator logic" [ref=f142e519]
                - paragraph [ref=f142e520]:
                  - text: The
                  - strong [ref=f142e521]: Decorator Blueprint
                  - text: will be created inside the
                  - strong [ref=f142e522]: Content Drawer
                  - text: in the same location as your
                  - strong [ref=f142e523]: Behavior Tree
                  - text: asset.
                - generic [ref=f142e525]:
                  - generic [ref=f142e526]: 
                  - paragraph [ref=f142e528]:
                    - text: Whenever you create a new
                    - strong [ref=f142e529]: Decorator
                    - text: from the
                    - strong [ref=f142e530]: Behavior Tree Editor
                    - text: ", it's a good practice to go into the"
                    - strong [ref=f142e531]: Content Drawer
                    - text: and rename the asset instead of using the default name.
                - paragraph [ref=f142e532]:
                  - text: When creating a new
                  - strong [ref=f142e533]: Decorator
                  - text: ", you can use an existing"
