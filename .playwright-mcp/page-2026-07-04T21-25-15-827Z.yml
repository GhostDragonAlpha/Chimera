                  - text: If you are editing a
                  - strong [ref=f142e583]: Behavior Tree
                  - text: that has an assigned
                  - strong [ref=f142e584]: Blackboard
                  - text: ", you can switch to the"
                  - strong [ref=f142e585]: Blackboard
                  - text: by clicking the tab in the upper-right corner of the window.
                - img "You can switch to the Blackboard by clicking the tab in the upper-right corner of the window"
                - paragraph [ref=f142e586]:
                  - text: In the
                  - strong [ref=f142e587]: Blackboard Details
                  - text: panel, you can assign a different
