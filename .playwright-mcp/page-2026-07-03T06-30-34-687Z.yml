        - generic [ref=f6e85]:
          - generic [ref=f6e86]:
            - heading "Lighting" [level=2] [ref=f6e87]
            - paragraph [ref=f6e89]: Understanding the lighting environment is critical to human spaceflight exploration as it directly impacts astronauts’ circadian rhythms, psychological well-being, and overall performance, necessitating tailored solutions to optimize mission success and crew health. Adding to the difficulties for NASA’s exploration missions, the lighting environment on the lunar south pole presents challenges due to the prolonged periods of darkness and extreme temperature variations, which can affect power generation from solar panels, communication systems, and the operational efficiency of lunar habitats and exploration equipment. JSC’s lighting team plays a vital role in ensuring the safety and functionality of current vehicles (International Space Station, Commercial Crew & Cargo vehicles and Orion, Gateway, and lunar rovers and landers). We provide internal and external lighting requirements verification, lamp and system lighting design, modeling and precise test and measurement of lighting and camera systems, as well as the simulation of orbital and planetary surface lighting environments. This comprehensive approach ensures that lighting systems meet the rigorous demands of space environments, contributing to the overall success and safety of space missions. We invite our partners to capitalize on our expertise in lighting environment analysis and solutions to expand humankind’s reach into our solar system.
            - heading "Operational Environment Lighting" [level=2] [ref=f6e91]
            - paragraph [ref=f6e92]: The Lighting Lab team provides internal and external lighting requirements verification for all NASA human-rated Programs including International Space Station (ISS), ISS commercial cargo and crewed vehicles, and Orion, Gateway, and the EVA and Human Surface Mobility Program (EHP). The team also provides lamp and system lighting design, modeling, and test and measurement of lighting and camera systems in their unique lighting lab.
            - paragraph [ref=f6e93]: The Lighting Lab uses a controlled lighting facility with test equipment for measurement of spectral, radiometric, and photometric light properties. The Lighting Lab is a spacious facility with dimensions of 25’ W x 300’ L x 17’ H, including a dedicated dark room for controlled lighting & imaging tests.
            - paragraph [ref=f6e94]: Testing & Analysis Services Available
            - list [ref=f6e95]:
              - listitem [ref=f6e96]: Interior / exterior lamp and system lighting design
              - listitem [ref=f6e97]: Lighting requirements development and verification
              - listitem [ref=f6e98]: Simulate orbital and planetary surface lighting environments
              - listitem [ref=f6e99]: Human anthropometric modeling analysis (volume, reach and clearance)
              - listitem [ref=f6e100]: Glare and shadow analysis
              - listitem [ref=f6e101]: Camera system testing with calibrated lights and solar simulator
            - paragraph [ref=f6e102]: Software Modeling Tools
            - list [ref=f6e103]:
              - listitem [ref=f6e104]: "Radiance: Radiometric and photometric architectural lighting simulation of interior / exterior spacecraft"
              - listitem [ref=f6e105]: "Zemax: Spectral optics & lamp development using anthropometric modeling & simulation"
              - listitem [ref=f6e106]: "Jack: Anthropometric human modeling and simulation"
              - listitem [ref=f6e107]: "Creo Parametric & Rhino: Processing of CAD models & model manipulation"
              - listitem [ref=f6e108]: "Dojo: Software organizer and database of models, materials and lights for modeling purposes"
