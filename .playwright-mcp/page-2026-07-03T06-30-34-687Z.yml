              - generic [ref=f6e145]: Mountains on the Moon On the Earth, we are taught that mountains form over millions of years, the result of gradual shifting and colliding plates. On the moon however, the situation is quite different. Even the largest lunar mountains were formed in minutes or less as asteroids and comets slammed into the surface at tremendous velocities, displacing and uplifting enough crust to create peaks that easily rival those found on Earth. On a few occasions in the past year, NASA has tilted the angle of LRO to do calibrations and other tests. In such cases the camera has the opportunity to gather oblique images of the lunar surface like the one featured here of Cabeus Crater providing a dramatic view of the moon’s mountainous terrain.
