        - img "Starboard View through Port Hatch of Equipment Lock and Crew Lock with Extravehicular Activity Hardware Quest Joint Airlock International Space Station – ISS Low Earth Orbit, Space, 2017Interior Space invites us all to imagine living and working in the ISS through a visual archeological exploration of this magnificent orbiting machine. This photographic archive uniquely presents the ISS through an artistic, minimalist view-point of beautiful images and structural and technical details never before published." [ref=f8e145]
