    - 'figure "Starboard view through port hatch of equipment lock, International Space Station, 2017 ‘The International Space Station is about the size of a six-bedroom home based on its interior volume,’ says photographer Roland Miller. ‘That seems like a fairly finite environment, and I’m sure it feels that way to the astronauts and cosmonauts while they are aboard for five or six months. For the Interior Space project to be successful, I knew I would have to get to know the station’s interior in great detail’ Photograph: Paolo Nespoli and Roland Miller Share" [ref=f8e142]':
