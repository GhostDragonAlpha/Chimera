    - 'figure "Space Station Processing Facility, Kennedy Space Center, Florida, 1998 ‘Colour became apparent to me during my photography in this facility. One of the sections I photographed was the pressurised mating adaptor 3 (PMA 3). Like most of the modules and sections, it is mostly white, grey and black. In the SSPF, the PMA was resting on a yellow ground support stand. It had a temporary ring of red tape protecting the module’s connecting surface, and there was a blue cloth pad resting in the adaptor’s tunnel. I immediately thought of the great geometric abstract painter, Piet Mondrian Photograph: Roland Miller Share" [ref=f8e288]':
