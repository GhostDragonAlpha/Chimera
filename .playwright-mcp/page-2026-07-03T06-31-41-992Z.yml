    - 'figure "Destiny module (AKA US Lab), International Space Station, 2017 The ISS is an orbiting laboratory for conducting scientific and technological experiments in microgravity. It is an extraterrestrial base for learning how to live and work in a remote, isolated and confined environment to prepare for exploring other planets. It is also a home to the astronauts and cosmonauts there. Paolo Nespoli and Roland Miller’s book Interior Space: A Visual Exploration of the International Space Station is published by Damiani. All photographs courtesy of Nasa and ASI Share" [ref=f8e125]':
