                - paragraph [ref=f132e128]:
                  - text: Astronauts on the International Space Station are swapping out their fluorescent light bulbs for
                  - link "a fancy new set of light-emitting diodes (LEDs)" [ref=f132e129] [cursor=pointer]:
                    - /url: https://www.youtube.com/user/VideoFromSpace
                  - text: that scientists think will help them sleep better and be more alert. If the new lights work as intended, the technology could help people on Earth sleep better as well.
                - paragraph [ref=f132e130]: The intensity and colors of the light emitted by the new Solid-State Light Assemblies (SSLAs) can produce millions of different spectra of light. Three settings will help to create a lighting environment that can either increase alertness, promote sleepiness or provide normal "daylight" that will help astronauts see clearly during normal work hours.
                - paragraph [ref=f132e131]:
                  - text: Because the space station circles the Earth every 92 minutes, astronauts on board can see the sun rise and set 16 times in a day. While it might sound delightful to watch pretty sunrises and sunsets all day, this rapid cycle of day and night can throw astronauts' sleep schedules out of whack. Add to that a demanding work schedule with occasional night shifts, and the astronauts are bound to experience some insomnia. [
                  - 'link "Sleeping in Space: How Astronauts Do It" [ref=f132e132] [cursor=pointer]':
                    - /url: https://www.space.com/35293-how-astronauts-sleep-in-space.html
                  - text: "]"
                - paragraph [ref=f132e133]:
                  - text: In fact, research has shown that
                  - link "astronauts don't get enough sleep" [ref=f132e134] [cursor=pointer]:
                    - /url: https://www.space.com/26829-astronauts-space-station-sleep-deprivation.html
                  - text: . On average, they sleep about 6 hours per night, while their schedules allot 8.5 hours. As a result, sleeping pills and caffeine are popular commodities among space travelers.
                - complementary
                - paragraph [ref=f132e135]: On Earth, the human body naturally operates on a 24-hour schedule called a circadian rhythm. Our biological clocks depend on a regular pattern of sunlight and darkness to keep that rhythm going. In space, astronauts depend on artificial lighting to regulate their sleep-wake schedules. But it's not just the timing of the light that matters on the space station — the type of lights used can make a big difference when it comes to keeping sleep schedules on track.
                - application "Video Player" [ref=f132e138]
