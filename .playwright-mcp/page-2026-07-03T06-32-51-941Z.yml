                - 'figure "Expedition 18 Commander, Mike Fincke, holding an early version of a solid state lighting assembly (the general luminaire assembly or GLA) that is part of the Lighting Effects investigation. Equipment for that investigation will fly toward the space station aboard a Cygnus spacecraft on Oct. 14, 2016. (Image credit: NASA)" [ref=f132e180]':
                  - paragraph [ref=f132e183]:
                    - img "Expedition 18 Commander, Mike Fincke, holding an early version of a solid state lighting assembly (the general luminaire assembly or GLA) that is part of the Lighting Effects investigation. Equipment for that investigation will fly toward the space station aboard a Cygnus spacecraft on Oct. 14, 2016." [ref=f132e184]
                    - link "" [ref=f132e185] [cursor=pointer]:
                      - /url: https://cdn.mos.cms.futurecdn.net/b6BtrjdhDVZSoEfe9MbqW7.jpg
                  - generic [ref=f132e186]:
                    - text: Expedition 18 Commander, Mike Fincke, holding an early version of a solid state lighting assembly (the general luminaire assembly or GLA) that is part of the Lighting Effects investigation. Equipment for that investigation will fly toward the space station aboard a Cygnus spacecraft on Oct. 14, 2016.
                    - generic [ref=f132e187]: "(Image credit: NASA)"
                - paragraph [ref=f132e188]: Astronauts began replacing the old fluorescent General Luminaire Assemblies in August, and the transition is still ongoing. Meanwhile, NASA has been studying how the new lights are affecting the astronauts through the Lighting Effects Study.
                - paragraph [ref=f132e189]:
                  - text: "\"The system can provide millions of different light spectra,\" Steven Lockley, a sleep specialist at Brigham and Women's Hospital and co-investigator for the Lighting Effects Study,"
                  - link "said in a statement" [ref=f132e190] [cursor=pointer]:
                    - /url: https://science.nasa.gov/news-articles/the-power-of-light
                  - text: . "We’re not making the ISS into a disco, but we are going to use three different light settings. We'll use a general light setting that provides a good light to see by during normal work, a higher-intensity blue light enriched setting that elevates alertness and can better shift the circadian clock when needed, and a lower-intensity blue wavelength-depleted 'pre-sleep' setting to calm the brain and promote sleep."
                - paragraph [ref=f132e191]: Results from the sleep study will help flight planners optimize lighting schedules for astronauts during spaceflight, but it can also help people on Earth gain control of their sleeping patterns.
                - paragraph [ref=f132e192]: "\"Study results should make it clear exactly when and how to use these various settings of light intensity and spectrum,\" NASA officials said in the statement. \"These results could also lead to Earth-based benefits such as helping manage sleep patterns for shift workers, or even developing treatments for sleep disorders or jet lag.\""
