                  - text: Solid-State Light Assemblies (SSLAs) are replacing old lighting technology aboard the International Space Station. These lights offer more efficient, longer-lasting lighting options, as well as provide crewmembers with the ability to adjust lighting intensity based on the time of day, promoting a more conducive environment for both sleep and alertness.
