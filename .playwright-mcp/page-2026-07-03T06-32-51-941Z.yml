                - paragraph [ref=f132e163]:
                  - text: Fluorescent light bulbs and LEDs are prized for being energy-efficient, but the light they produce can contribute to insomnia. Both emit
                  - link "blue light" [ref=f132e164] [cursor=pointer]:
                    - /url: http://www.livescience.com/53874-blue-light-sleep.html
                  - text: ", which promotes alertness while decreasing the amount of the natural sleep hormone melatonin. While blue light may be helpful in the mornings, exposure to blue light closer to bedtime can make falling asleep more difficult."
                - paragraph [ref=f132e165]: The new SSLAs that are being installed inside the space station contain LEDs, but with the adjustable light spectrum, blue light at night will no longer pose a problem. Before bedtime, the new lighting system will emit a spectrum of light without the smaller wavelengths of blue and violet light. When it's time to wake up again, the light spectrum will include that element of the spectrum to promote alertness. This can help astronauts reset or maintain a healthy circadian rhythm and, in turn, make them more productive on the job.
