          - definition [ref=f32e32]:
            - paragraph [ref=f32e33]:
              - text: Entertainment is an important part of everyday life. From TV, to film, to games, players expect more from everything they purchase; players expect a service.
              - text: Live services are the key to player engagement. However, making the transition from a disc to a live service is difficult. You need to understand your players and your team needs to be set up for success with the right mindset and focus. This presentation will walk through the steps 'Need for Speed' took when transitioning from traditional DLC to a Live Service and hopefully provide some valuable insights for attendees when making their own transition.
