                - paragraph [ref=f139e419]:
                  - strong [ref=f139e420]: Behavior Trees
                  - text: assets in Unreal Engine 5 (Unreal Engine) can be used to create artificial intelligence (AI) for non-player characters in your projects. While the Behavior Tree asset is used to execute branches containing logic, to determine which branches should be executed, the Behavior Tree relies on another asset called a
                  - strong [ref=f139e421]: Blackboard
                  - text: which serves as the "brain" for a Behavior Tree.
                - paragraph [ref=f139e422]:
                  - text: The Blackboard contains several user-defined
                  - strong [ref=f139e423]: Keys
                  - text: that hold information used by the Behavior Tree to make decisions. For example, you could have a Boolean Key called
                  - emphasis [ref=f139e424]: Is Light On
                  - text: which the Behavior Tree can reference to see if the value has changed. If the value is true, it could execute a branch that causes a roach to flee. If it is false, it could execute a different branch where the roach maybe moves randomly around the environment. Behavior Trees can be as simplistic as the roach example given, or as complex as simulating another human player in a multiplayer game that finds cover, shoots at players, and looks for item pickups.
                - paragraph [ref=f139e425]:
                  - text: If you are new to Behavior Trees in Unreal Engine, it is recommended that you go through the
                  - strong [ref=f139e426]: Behavior Tree Quick Start
