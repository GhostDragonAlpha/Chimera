                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=4
              - paragraph [ref=f38e554]:
                - text: The success of
                - link "Alien" [ref=f38e556] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Alien_(film)
                - text: (1979) led to immediate discussions of a sequel, but the production company
                - link "Brandywine Productions" [ref=f38e557] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Brandywine_Productions
                - text: struggled to convince
                - link "20th Century Fox" [ref=f38e558] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/20th_Century_Fox
                - text: to make it. Studio president
                - link "Alan Ladd Jr." [ref=f38e559] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Alan_Ladd_Jr.
                - text: was supportive of the project but left Fox to found
                - link "the Ladd Company" [ref=f38e560] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/The_Ladd_Company
                - text: ", and his replacement, Norman Levy, was concerned about the cost of producing an"
                - generic [ref=f38e561]:
                  - text: Alien
                  - text: II
                - text: .
                - superscript [ref=f38e563]:
                  - link "[29]" [ref=f38e564] [cursor=pointer]:
                    - /url: "#cite_note-VarietyLadd-32"
                    - generic: "[29]"
                - superscript [ref=f38e565]:
                  - link "[30]" [ref=f38e566] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
                - superscript [ref=f38e567]:
                  - link "[31]" [ref=f38e568] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - text: Brandywine co-founder
                - link "David Giler" [ref=f38e569] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/David_Giler
                - text: said Levy believed a sequel would be a "disaster".
                - superscript [ref=f38e570]:
                  - link "[31]" [ref=f38e571] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - text: Fox executives believed Alien
                - generic [ref=f38e572]: "'"
                - text: s success was a fluke, and that it had not generated enough profit or audience interest to warrant a sequel.
                - superscript [ref=f38e573]:
                  - link "[31]" [ref=f38e574] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - text: Box-office returns for horror films were also declining.
                - superscript [ref=f38e575]:
                  - link "[32]" [ref=f38e576] [cursor=pointer]:
                    - /url: "#cite_note-TimeSchickelPage3-35"
                    - generic: "[32]"
                - text: Progress was further slowed when Giler and Brandywine co-founders
                - link "Walter Hill" [ref=f38e577] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Walter_Hill
                - text: and
                - link "Gordon Carroll" [ref=f38e578] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Gordon_Carroll
                - text: sued Fox for unpaid profits from Alien. Using
                - link "Hollywood accounting" [ref=f38e579] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hollywood_accounting
                - text: methods, Fox had declared Alien a financial loss despite its earnings of over $100
                - text: million against a $9–$11
                - text: million budget. Brandywine's lawsuit was settled by early 1983, the result being that Fox would finance the development of
                - generic [ref=f38e582]:
                  - text: Alien
                  - text: II
                - text: ", but was not required to distribute the film."
                - superscript [ref=f38e584]:
                  - link "[31]" [ref=f38e585] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - superscript [ref=f38e586]:
                  - link "[33]" [ref=f38e587] [cursor=pointer]:
                    - /url: "#cite_note-PopMattesAccounting-36"
                    - generic: "[33]"
              - paragraph [ref=f38e588]:
                - text: Levy's eventual replacement,
                - link "Joe Wizan" [ref=f38e589] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Joe_Wizan
                - text: ", was receptive to a sequel, and although other executives remained noncommittal, Giler's development executive, Larry Wilson, began looking for a scriptwriter by mid-1983."
                - superscript [ref=f38e590]:
                  - link "[30]" [ref=f38e591] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
                - superscript [ref=f38e592]:
                  - link "[31]" [ref=f38e593] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - text: Wilson came across the script for the in-development science fiction film,
                - link "The Terminator" [ref=f38e595] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/The_Terminator
                - text: (1984), written by
                - link "James Cameron" [ref=f38e596] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/James_Cameron
                - text: . With Cameron's collaborative scriptwriting efforts alongside
                - link "Sylvester Stallone" [ref=f38e597] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Sylvester_Stallone
                - text: "on"
                - 'link "Rambo: First Blood Part II" [ref=f38e599] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Rambo:_First_Blood_Part_II
                - text: (1985), Wilson was convinced to show the script for The Terminator to Giler, Hill, and Carroll.
                - superscript [ref=f38e600]:
                  - link "[34]" [ref=f38e601] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1985July9-37"
                    - generic: "[34]"
                - superscript [ref=f38e602]:
                  - link "[35]" [ref=f38e603] [cursor=pointer]:
                    - /url: "#cite_note-LATimesJuly1119886-38"
                    - generic: "[35]"
                - text: In November 1983, Cameron submitted a 42-page
                - link "film treatment" [ref=f38e604] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Film_treatment
                - text: for
                - generic [ref=f38e605]:
                  - text: Alien
                  - text: II
                - text: —written in three days—based on Giler and Hill's suggestion of "Ripley and soldiers".
                - superscript [ref=f38e607]:
                  - link "[30]" [ref=f38e608] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
                - superscript [ref=f38e609]:
                  - link "[31]" [ref=f38e610] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - superscript [ref=f38e611]:
                  - link "[36]" [ref=f38e612] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay19867-39"
                    - generic: "[36]"
                - text: The studio had a mixed reaction, one executive calling it a constant stream of horror without character development.
                - superscript [ref=f38e613]:
                  - link "[30]" [ref=f38e614] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
                - superscript [ref=f38e615]:
                  - link "[31]" [ref=f38e616] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - text: Negotiations to sell the sequel rights to
                - link "Rambo" [ref=f38e618] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Rambo_(franchise)
                - generic [ref=f38e619]: "'s"
                - text: developers
                - link "Mario Kassar" [ref=f38e620] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Mario_Kassar
                - text: and
                - link "Andrew G. Vajna" [ref=f38e621] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Andrew_G._Vajna
                - text: failed and the project stalled again.
                - superscript [ref=f38e622]:
                  - link "[31]" [ref=f38e623] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
            - region "Revival" [ref=f38e624]:
              - generic [ref=f38e625]:
                - heading "Revival" [level=3] [ref=f38e626]
                - generic [ref=f38e627]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=5
              - generic [ref=f38e629]:
                - generic [ref=f38e630]:
                  - link "A photograph of James Cameron" [ref=f38e634] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/File:James_Cameron_by_Gage_Skidmore.jpg
                    - img "A photograph of James Cameron" [ref=f38e635]
                  - link "A photograph of Gale Anne Hurd" [ref=f38e639] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/File:Gale_Anne_Hurd_by_Gage_Skidmore_3.jpg
                    - img "A photograph of Gale Anne Hurd" [ref=f38e640]
                - generic [ref=f38e642]:
                  - text: (Left to right) Director
                  - link "James Cameron" [ref=f38e643] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/James_Cameron
                  - text: and producer
                  - link "Gale Anne Hurd" [ref=f38e644] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Gale_Anne_Hurd
                  - text: (pictured in 2016)
              - paragraph [ref=f38e645]:
                - text: By July 1984,
                - link "Lawrence Gordon" [ref=f38e646] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Lawrence_Gordon_(producer)
                - text: had replaced Wizan. With few projects in development, Gordon looked at sequels to Fox's existing properties and came across the
                - generic [ref=f38e647]:
                  - text: Alien
                  - text: II
                - text: treatment; he said he was surprised that no one had pursued it.
                - superscript [ref=f38e649]:
                  - link "[31]" [ref=f38e650] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - text: Production of The Terminator was delayed for nine months because
                - link "Arnold Schwarzenegger" [ref=f38e651] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Arnold_Schwarzenegger
                - text: was contractually obligated to film
                - link "Conan the Destroyer" [ref=f38e653] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Conan_the_Destroyer
                - text: (1984). Cameron used the time to develop his treatment, expanding it to ninety pages.
                - superscript [ref=f38e654]:
                  - link "[30]" [ref=f38e655] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
                - superscript [ref=f38e656]:
                  - link "[35]" [ref=f38e657] [cursor=pointer]:
                    - /url: "#cite_note-LATimesJuly1119886-38"
                    - generic: "[35]"
                - text: He drew ideas from "Mother", one of his story concepts about an alien on a space station involving a power-loader suit.
                - superscript [ref=f38e658]:
                  - link "[37]" [ref=f38e659] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - text: Because of his low expectations for The Terminator, Cameron had spent much of his free time during its production developing and trying out ideas for
                - generic [ref=f38e660]:
                  - text: Alien
                  - text: II
                - text: .
                - superscript [ref=f38e662]:
                  - link "[34]" [ref=f38e663] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1985July9-37"
                    - generic: "[34]"
                - superscript [ref=f38e664]:
                  - link "[35]" [ref=f38e665] [cursor=pointer]:
                    - /url: "#cite_note-LATimesJuly1119886-38"
                    - generic: "[35]"
              - paragraph [ref=f38e666]:
                - text: This script was better received by Fox executives and Gordon, but Cameron also wanted to direct the project.
                - superscript [ref=f38e667]:
                  - link "[30]" [ref=f38e668] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
                - superscript [ref=f38e669]:
                  - link "[35]" [ref=f38e670] [cursor=pointer]:
                    - /url: "#cite_note-LATimesJuly1119886-38"
                    - generic: "[35]"
                - superscript [ref=f38e671]:
                  - link "[38]" [ref=f38e672] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
                - text: Cameron was a relatively new director, his only directing credit being
                - 'link "Piranha II: The Spawning" [ref=f38e674] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Piranha_II:_The_Spawning
                - text: (1982), a low-budget, independent horror film, and the studio was reluctant to grant his request. His credibility was elevated following the surprise financial and critical success of The Terminator in late 1984, and Gordon gave him the job.
                - superscript [ref=f38e675]:
                  - link "[31]" [ref=f38e676] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - superscript [ref=f38e677]:
                  - link "[35]" [ref=f38e678] [cursor=pointer]:
                    - /url: "#cite_note-LATimesJuly1119886-38"
                    - generic: "[35]"
                - superscript [ref=f38e679]:
                  - link "[38]" [ref=f38e680] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
                - text: Cameron's associates tried to persuade him to reject the offer, believing anything good about the film would be attributed to Alien director
                - link "Ridley Scott" [ref=f38e681] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ridley_Scott
                - text: and anything negative to Cameron.
                - superscript [ref=f38e682]:
                  - link "[39]" [ref=f38e683] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - text: Scott said he was never offered the chance to direct the sequel, possibly because he was difficult to work with on the original.
                - superscript [ref=f38e684]:
                  - link "[40]" [ref=f38e685] [cursor=pointer]:
                    - /url: "#cite_note-THRScott-43"
                    - generic: "[40]"
                - text: Cameron noted that the plural title of the film implied the increased threat and indicated that the movie was a sequel. A possibly apocryphal story involved Cameron drawing lines through the "s" of the title on a whiteboard to create a dollar sign to sell Giler and Hill on the name.
                - superscript [ref=f38e686]:
                  - link "[41]" [ref=f38e687] [cursor=pointer]:
                    - /url: "#cite_note-NameOrigin-44"
                    - generic: "[41]"
                - superscript [ref=f38e688]:
                  - link "[42]" [ref=f38e689] [cursor=pointer]:
                    - /url: "#cite_note-NameOrigin2-45"
                    - generic: "[42]"
                - superscript [ref=f38e690]:
                  - link "[43]" [ref=f38e691] [cursor=pointer]:
                    - /url: "#cite_note-46"
                    - generic: "[43]"
                - text: Cameron also wanted his collaborative partner and girlfriend,
                - link "Gale Anne Hurd" [ref=f38e692] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Gale_Anne_Hurd
                - text: ", to serve as the producer, but Fox did not take the request seriously, believing she could not stand up to Cameron, who believed she was the only person who would."
                - superscript [ref=f38e693]:
                  - link "[37]" [ref=f38e694] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - superscript [ref=f38e695]:
                  - link "[38]" [ref=f38e696] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
                - text: Hurd had several industry associates contact Fox executives to convince them she was a legitimate producer.
                - superscript [ref=f38e697]:
                  - link "[38]" [ref=f38e698] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
              - paragraph [ref=f38e699]:
                - text: Cameron turned in the finished script in February 1985, hours before a
                - link "Hollywood writer's strike" [ref=f38e700] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/List_of_Hollywood_strikes
                - text: .
                - superscript [ref=f38e701]:
                  - link "[31]" [ref=f38e702] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - text: Cameron recalled the audience reactions while seeing Alien in the theater and believed it would be difficult to recreate the emotion and novelty of the original. He and Hurd agreed to combine the horror of Alien with the action of The Terminator. According to Hill, Cameron said if the first film could be compared to a
                - link "haunted attraction" [ref=f38e703] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Haunted_attraction_(simulated)
                - text: ", Aliens should be like a"
                - link "roller coaster" [ref=f38e704] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Roller_coaster
                - text: .
                - superscript [ref=f38e705]:
                  - link "[35]" [ref=f38e706] [cursor=pointer]:
                    - /url: "#cite_note-LATimesJuly1119886-38"
                    - generic: "[35]"
                - text: Cameron believed in having a strong female heroine to distinguish his films from typical Hollywood action fare and wrote the script with a picture of Weaver on his desk.
                - superscript [ref=f38e707]:
                  - link "[38]" [ref=f38e708] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
                - text: He referred to The Terminator, and how he removed the normal protective forces from
                - link "Sarah Connor" [ref=f38e709] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Sarah_Connor_(Terminator)
                - text: so she had to fend for herself.
                - superscript [ref=f38e710]:
                  - link "[34]" [ref=f38e711] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1985July9-37"
                    - generic: "[34]"
                - text: Cameron had also always wanted to make a film about space
                - link "infantry" [ref=f38e712] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Infantry
                - text: .
                - superscript [ref=f38e713]:
                  - link "[35]" [ref=f38e714] [cursor=pointer]:
                    - /url: "#cite_note-LATimesJuly1119886-38"
                    - generic: "[35]"
              - paragraph [ref=f38e715]:
                - text: The final script was well received, but Fox executives (including chairman
                - link "Barry Diller" [ref=f38e716] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Barry_Diller
                - text: ) were concerned about the budget. Fox estimated the cost as close to $35
                - text: million, but Hurd said it would be closer to $15.5
                - text: million. Diller offered $12
                - text: million, prompting Cameron and Hurd to quit. Gordon negotiated with Diller until he relented, and Cameron and Hurd returned.
                - superscript [ref=f38e720]:
                  - link "[31]" [ref=f38e721] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - text: In April 1985, conflict turned to the cast; Fox did not want Weaver to return because they expected her to demand a high salary.
                - superscript [ref=f38e722]:
                  - link "[31]" [ref=f38e723] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - superscript [ref=f38e724]:
                  - link "[38]" [ref=f38e725] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
                - text: Cameron and Hurd were insistent Weaver return as the solo star; Fox refused, saying they would damage the studio's negotiating power with Weaver's agent. Cameron and Hurd again left the project, marrying and going on a honeymoon. When they returned, the Aliens project was ready to move forward. Cameron credited Gordon with Aliens
                - generic [ref=f38e726]: "'"
                - text: being
                - link "greenlit" [ref=f38e727] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Greenlit
                - text: .
                - superscript [ref=f38e728]:
                  - link "[31]" [ref=f38e729] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
            - region "Casting" [ref=f38e730]:
              - generic [ref=f38e731]:
                - heading "Casting" [level=3] [ref=f38e732]
                - generic [ref=f38e733]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=6
              - generic [ref=f38e735]:
                - generic [ref=f38e736]:
                  - link "A photograph of Bill Paxton" [ref=f38e740] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/File:Bill_Paxton_2014_retouched.jpg
                    - img "A photograph of Bill Paxton" [ref=f38e741]
                  - link "A photograph of Lance Henriksen" [ref=f38e745] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/File:Lance_Henriksen_in_Belgium.jpg
                    - img "A photograph of Lance Henriksen" [ref=f38e746]
                - generic [ref=f38e748]:
                  - text: (Left to right)
                  - link "Bill Paxton" [ref=f38e749] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Bill_Paxton
                  - text: (pictured in 2014) and
                  - link "Lance Henriksen" [ref=f38e750] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Lance_Henriksen
                  - text: (2016) portrayed Colonial Marine Private Hudson and the android Bishop, respectively.
              - paragraph [ref=f38e751]:
                - text: Weaver rejected initial offers to return and despite being interested after reading Cameron's script, she had to be convinced Aliens was not being made exclusively for financial reasons.
                - superscript [ref=f38e752]:
                  - link "[30]" [ref=f38e753] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
                - superscript [ref=f38e754]:
                  - link "[38]" [ref=f38e755] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
                - superscript [ref=f38e756]:
                  - link "[39]" [ref=f38e757] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - text: Weaver received a $1
                - text: million (equivalent to $2.94 million in 2025) salary and a percentage of the box-office profits, the highest salary of her career at the time.
                - superscript [ref=f38e759]:
                  - link "[31]" [ref=f38e760] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - text: Negotiations were so lengthy that Cameron and Hurd told Schwarzenegger's agent they intended to write Ripley out of the movie (knowing Weaver's agent would be told); terms were reached shortly afterward.
                - superscript [ref=f38e761]:
                  - link "[30]" [ref=f38e762] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
              - paragraph [ref=f38e763]:
                - text: Cameron wanted an unknown actor to portray Newt. Agents scouted Henn while she was at school in
                - link "Lakenheath" [ref=f38e764] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Lakenheath
                - text: ", England, and though she lacked acting experience, Cameron said she had a \"great face and expressive eyes\"."
                - superscript [ref=f38e765]:
                  - link "[44]" [ref=f38e766] [cursor=pointer]:
                    - /url: "#cite_note-PeopleHenn-47"
                    - generic: "[44]"
                - link "Stephen Lang" [ref=f38e767] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Stephen_Lang
                - text: auditioned for the role of Hicks, but
                - link "James Remar" [ref=f38e768] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/James_Remar
                - text: secured the role on the recommendation of Hill, his close friend. Remar left shortly into filming, ostensibly due to urgent family matters or creative differences with Cameron, but he later admitted he was fired after being arrested for drug possession.
                - superscript [ref=f38e769]:
                  - link "[10]" [ref=f38e770] [cursor=pointer]:
                    - /url: "#cite_note-RemarEmpire-13"
                    - generic: "[10]"
                - superscript [ref=f38e771]:
                  - link "[45]" [ref=f38e772] [cursor=pointer]:
                    - /url: "#cite_note-RemarIndieWire-48"
                    - generic: "[45]"
                - superscript [ref=f38e773]:
                  - link "[46]" [ref=f38e774] [cursor=pointer]:
                    - /url: "#cite_note-RemarDog-49"
                    - generic: "[46]"
                - text: Hurd hired Michael Biehn the following Friday.
                - superscript [ref=f38e775]:
                  - link "[10]" [ref=f38e776] [cursor=pointer]:
                    - /url: "#cite_note-RemarEmpire-13"
                    - generic: "[10]"
                - superscript [ref=f38e777]:
                  - link "[46]" [ref=f38e778] [cursor=pointer]:
                    - /url: "#cite_note-RemarDog-49"
                    - generic: "[46]"
                - text: Paxton credited his casting as Hudson to a chance encounter with Cameron at
                - link "Los Angeles International Airport" [ref=f38e779] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Los_Angeles_International_Airport
                - text: ", during which he mentioned he would be interested in a role. Fox supported Paxton's casting because of positive feedback for his performance in"
                - link "Weird Science" [ref=f38e781] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Weird_Science_(film)
                - text: (1985).
                - superscript [ref=f38e782]:
                  - link "[47]" [ref=f38e783] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCast-50"
                    - generic: "[47]"
                - superscript [ref=f38e784]:
                  - link "[48]" [ref=f38e785] [cursor=pointer]:
                    - /url: "#cite_note-DOGPaxton-51"
                    - generic: "[48]"
                - text: Paxton was worried the character would annoy audiences until he realized he was
                - link "comic relief" [ref=f38e786] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Comic_relief
                - text: for the tense scenes.
                - superscript [ref=f38e787]:
                  - link "[47]" [ref=f38e788] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCast-50"
                    - generic: "[47]"
                - text: Henriksen was concerned about portraying Bishop after other recent successful portrayals of android characters, such as
                - link "Ian Holm" [ref=f38e789] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ian_Holm
                - text: in Alien and
                - link "Rutger Hauer" [ref=f38e790] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Rutger_Hauer
                - text: in
                - link "Blade Runner" [ref=f38e792] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Blade_Runner
                - text: (1982). He played Bishop as an innocent child who pities the short-lived humans. He suggested wearing distinctive contact lenses to convey when Bishop was alerted to danger, but Cameron believed they would make the character appear more frightening than the aliens.
                - superscript [ref=f38e793]:
                  - link "[11]" [ref=f38e794] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCastPage3-14"
                    - generic: "[11]"
                - text: Biehn, Paxton, and Henriksen had worked with Cameron on The Terminator.
                - superscript [ref=f38e795]:
                  - link "[11]" [ref=f38e796] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCastPage3-14"
                    - generic: "[11]"
                - superscript [ref=f38e797]:
                  - link "[47]" [ref=f38e798] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCast-50"
                    - generic: "[47]"
              - paragraph [ref=f38e799]:
                - text: Aliens was Reiser's first major theatrical role, following small parts in films like
                - link "Beverly Hills Cop" [ref=f38e801] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Beverly_Hills_Cop
                - text: (1984).
                - superscript [ref=f38e802]:
                  - link "[10]" [ref=f38e803] [cursor=pointer]:
                    - /url: "#cite_note-RemarEmpire-13"
                    - generic: "[10]"
                - text: The Colonial Marines cast features a mix of British and American actors who underwent three weeks of intensive training with the British
                - link "Special Air Service" [ref=f38e804] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Special_Air_Service
                - text: (SAS).
                - superscript [ref=f38e805]:
                  - link "[b]" [ref=f38e806] [cursor=pointer]:
                    - /url: "#cite_note-53"
                    - generic: "[b]"
                - link "Vietnam War" [ref=f38e807] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Vietnam_War
                - text: veteran Al Matthews (Apone) helped to train the actors, teaching them how to handle firearms properly because their
                - link "blanks" [ref=f38e808] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Blank_(cartridge)
                - text: were still hazardous.
                - superscript [ref=f38e809]:
                  - link "[47]" [ref=f38e810] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCast-50"
                    - generic: "[47]"
                - superscript [ref=f38e811]:
                  - link "[49]" [ref=f38e812] [cursor=pointer]:
                    - /url: "#cite_note-Militarycom-52"
                    - generic: "[49]"
                - text: Before he left, Remar accidentally shot a hole through the set of
                - link "Frank Oz" [ref=f38e813] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Frank_Oz
                - text: "'s"
                - link "Little Shop of Horrors" [ref=f38e815] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Little_Shop_of_Horrors_(film)
                - text: on an adjacent stage.
                - superscript [ref=f38e816]:
                  - link "[10]" [ref=f38e817] [cursor=pointer]:
                    - /url: "#cite_note-RemarEmpire-13"
                    - generic: "[10]"
                - superscript [ref=f38e818]:
                  - link "[47]" [ref=f38e819] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCast-50"
                    - generic: "[47]"
                - text: The training was intended to help the marine cast develop camaraderie and treat the other actors (Weaver, Reiser, and Hope) as outsiders.
                - superscript [ref=f38e820]:
                  - link "[50]" [ref=f38e821] [cursor=pointer]:
                    - /url: "#cite_note-Sideshow-54"
                    - generic: "[50]"
                - superscript [ref=f38e822]:
                  - link "[51]" [ref=f38e823] [cursor=pointer]:
                    - /url: "#cite_note-TheDissolve-55"
                    - generic: "[51]"
                - text: Biehn's late casting caused him to miss the training, and he said he regretted being unable to customize his armor like the other actors (since he inherited Remar's).
                - superscript [ref=f38e824]:
                  - link "[10]" [ref=f38e825] [cursor=pointer]:
                    - /url: "#cite_note-RemarEmpire-13"
                    - generic: "[10]"
                - superscript [ref=f38e826]:
                  - link "[46]" [ref=f38e827] [cursor=pointer]:
                    - /url: "#cite_note-RemarDog-49"
                    - generic: "[46]"
                - text: Cameron created a distinct
                - link "backstory" [ref=f38e828] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Backstory
                - text: for each marine and instructed the actors to read
                - link "Starship Troopers" [ref=f38e830] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Starship_Troopers
                - text: so they would understand the
                - link "space marine" [ref=f38e831] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Space_marine
                - text: archetype.
                - superscript [ref=f38e832]:
                  - link "[52]" [ref=f38e833] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELowry198739-56"
                    - generic: "[52]"
                - superscript [ref=f38e834]:
                  - link "[53]" [ref=f38e835] [cursor=pointer]:
                    - /url: "#cite_note-StarShipScreenRant-57"
                    - generic: "[53]"
                - superscript [ref=f38e836]:
                  - link "[54]" [ref=f38e837] [cursor=pointer]:
                    - /url: "#cite_note-StarShipMovieFone-58"
                    - generic: "[54]"
              - paragraph [ref=f38e838]:
                - text: Vasquez was Goldstein's first feature-film role. She credited her physique to spending hours at the gym while unemployed, gaining 10 pounds (4.5 kg) at Cameron's request.
                - superscript [ref=f38e839]:
                  - link "[11]" [ref=f38e840] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCastPage3-14"
                    - generic: "[11]"
                - superscript [ref=f38e841]:
                  - link "[55]" [ref=f38e842] [cursor=pointer]:
                    - /url: "#cite_note-DailyBeastPaxton-59"
                    - generic: "[55]"
                - superscript [ref=f38e843]:
                  - link "[56]" [ref=f38e844] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELowry198737–38-60"
                    - generic: "[56]"
                - text: Goldstein wore dark contact lenses and underwent an hour of makeup to cover her freckles and darken her white skin to portray a "
                - link "Chicano" [ref=f38e845] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Chicano
                - text: "\" character; she studied Mexican-American gang interviews to develop her demeanor and accent."
                - superscript [ref=f38e846]:
                  - link "[56]" [ref=f38e847] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELowry198737–38-60"
                    - generic: "[56]"
                - text: Ricco Ross (Frost) was committed to
                - link "Full Metal Jacket" [ref=f38e849] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Full_Metal_Jacket
                - text: (1987), whose filming schedule overlapped for a week with Aliens
                - generic [ref=f38e850]: "'"
                - text: . Although Cameron offered to let Ross join the filming later, Ross was concerned that
                - link "Stanley Kubrick" [ref=f38e851] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Stanley_Kubrick
                - text: "'s projects often overran, and opted for Aliens instead."
                - superscript [ref=f38e852]:
                  - link "[11]" [ref=f38e853] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCastPage3-14"
                    - generic: "[11]"
                - text: Rolston misled the filmmakers to get his part; he had finished filming
                - link "Revolution" [ref=f38e855] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Revolution_(1985_film)
                - text: (1985), and implied he was its most prominent actor after
                - link "Al Pacino" [ref=f38e856] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Al_Pacino
                - text: .
                - superscript [ref=f38e857]:
                  - link "[14]" [ref=f38e858] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCastPage4-17"
                    - generic: "[14]"
                - text: William Hope (Gorman) was cast as Hudson before Cameron and Hurd decided to take the character in a different direction.
                - superscript [ref=f38e859]:
                  - link "[14]" [ref=f38e860] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCastPage4-17"
                    - generic: "[14]"
              - paragraph [ref=f38e861]:
                - text: Cynthia Dale Scott (Dietrich) was an aspiring singer when she was cast.
                - superscript [ref=f38e862]:
                  - link "[10]" [ref=f38e863] [cursor=pointer]:
                    - /url: "#cite_note-RemarEmpire-13"
                    - generic: "[10]"
                - text: Colette Hiller (Ferro) was upset she had to cut her hair short for the role because she was getting married shortly afterward, and made the filmmakers buy her a long, blonde wig.
                - superscript [ref=f38e864]:
                  - link "[14]" [ref=f38e865] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCastPage4-17"
                    - generic: "[14]"
                - text: Trevor Steedman (Wierzbowski) was a stuntman rather than an actor,
                - superscript [ref=f38e866]:
                  - link "[11]" [ref=f38e867] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCastPage3-14"
                    - generic: "[11]"
                - text: and Aliens was Daniel Kash's (Spunkmeyer) debut film role. He offered Cameron his coat if he got the part and also auditioned for Hudson.
                - superscript [ref=f38e868]:
                  - link "[57]" [ref=f38e869] [cursor=pointer]:
                    - /url: "#cite_note-DOGDanielKash-61"
                    - generic: "[57]"
                - text: The actors stayed at the
                - link "Holiday Inn" [ref=f38e870] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Holiday_Inn
                - text: in
                - link "Langley, Berkshire" [ref=f38e871] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Langley,_Berkshire
                - text: ", during filming. Paxton described the actors' time outside work positively: \"God, we had the best time"
                - text: ... We all hung very hard together. That's where I first met [Henriksen], who I fell in love with. [Matthews]
                - text: ... was a really good spirit to have around, with a great voice. And all these hilarious British characters, like [Steedman], the stuntman, who used to grab my bicep and go, 'Blimey, more meat on a cat's cock!'"
                - superscript [ref=f38e874]:
                  - link "[47]" [ref=f38e875] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCast-50"
                    - generic: "[47]"
            - region "Filming" [ref=f38e876]:
              - generic [ref=f38e877]:
                - heading "Filming" [level=3] [ref=f38e878]
                - generic [ref=f38e879]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=7
              - figure "Aliens was filmed almost entirely at Pinewood Studios in England (pictured in 2015)." [ref=f38e880]:
                - link "A photo of the entrance to Pinewood Studios in England" [ref=f38e881] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:Pinewood_Studios_gateway.jpg
                  - img "A photo of the entrance to Pinewood Studios in England" [ref=f38e882]
                - generic [ref=f38e883]:
                  - text: Aliens was filmed almost entirely at
                  - link "Pinewood Studios" [ref=f38e884] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Pinewood_Studios
                  - text: in England (pictured in 2015).
              - paragraph [ref=f38e885]:
                - link "Principal photography" [ref=f38e886] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Principal_photography
                - text: began in September 1985, on a 75-day schedule, and an $18.5
                - text: million budget,
                - superscript [ref=f38e888]:
                  - link "[iii]" [ref=f38e889] [cursor=pointer]:
                    - /url: "#cite_note-62"
                    - generic: "[iii]"
                - text: not including
                - link "film prints" [ref=f38e890] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Release_print
                - text: and marketing.
                - superscript [ref=f38e891]:
                  - link "[31]" [ref=f38e892] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - superscript [ref=f38e893]:
                  - link "[34]" [ref=f38e894] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1985July9-37"
                    - generic: "[34]"
                - superscript [ref=f38e895]:
                  - link "[58]" [ref=f38e896] [cursor=pointer]:
                    - /url: "#cite_note-I09Mutiny-63"
                    - generic: "[58]"
                - text: Filming took place mainly at Pinewood Studios in
                - link "Buckinghamshire" [ref=f38e897] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Buckinghamshire
                - text: near London, because of its large sets and the lower cost of filming in England.
                - superscript [ref=f38e898]:
                  - link "[c]" [ref=f38e899] [cursor=pointer]:
                    - /url: "#cite_note-66"
                    - generic: "[c]"
                - text: Filming was difficult as Cameron, a Canadian, had little familiarity with British film-industry traditions such as
                - link "tea breaks" [ref=f38e900] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Tea_culture
                - text: ", which interrupted production for up to an hour each weekday, and was frustrated at losing hours of filming every week."
                - superscript [ref=f38e901]:
                  - link "[30]" [ref=f38e902] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
                - superscript [ref=f38e903]:
                  - link "[38]" [ref=f38e904] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
                - superscript [ref=f38e905]:
                  - link "[47]" [ref=f38e906] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCast-50"
                    - generic: "[47]"
                - text: In his book The Making of Aliens,
                - link "J. W. Rinzler" [ref=f38e907] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/J._W._Rinzler
                - text: described Cameron as aggressive and certain of what he wanted, which irked the crew. The situation was exacerbated by Cameron's hands-on approach, often modifying setups such as lighting himself to fit his vision without involving the
                - link "unionized" [ref=f38e908] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Unionized
                - text: crew.
                - superscript [ref=f38e909]:
                  - link "[38]" [ref=f38e910] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
              - paragraph [ref=f38e911]:
                - text: The crew was dismissive of Cameron, thinking he had not done enough to earn such a prominent position, and that Hurd had her job only because she was his partner.
                - superscript [ref=f38e912]:
                  - link "[30]" [ref=f38e913] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
                - superscript [ref=f38e914]:
                  - link "[58]" [ref=f38e915] [cursor=pointer]:
                    - /url: "#cite_note-I09Mutiny-63"
                    - generic: "[58]"
                - superscript [ref=f38e916]:
                  - link "[61]" [ref=f38e917] [cursor=pointer]:
                    - /url: "#cite_note-ScreenRantMutiny-67"
                    - generic: "[61]"
                - text: "Cameron has also said that he was mistaken for American by the British crew, and that it affected how they initially viewed him: \"All they could see was some punk, this Yank – they thought of me as a Yank, even though I'm Canadian.\""
                - superscript [ref=f38e918]:
                  - link "[62]" [ref=f38e919] [cursor=pointer]:
                    - /url: "#cite_note-Empire1-68"
                    - generic: "[62]"
              - paragraph [ref=f38e920]:
                - text: Cinematographer
                - link "Dick Bush" [ref=f38e921] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Dick_Bush
                - text: insisted on lighting the alien hive brightly (counter to Cameron's request), and was eventually replaced with
                - link "Adrian Biddle" [ref=f38e922] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Adrian_Biddle
                - text: .
                - superscript [ref=f38e923]:
                  - link "[9]" [ref=f38e924] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1986July18-12"
                    - generic: "[9]"
                - text: First assistant director Derek Cracknell also ignored Cameron's requests.
                - superscript [ref=f38e925]:
                  - link "[38]" [ref=f38e926] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
                - superscript [ref=f38e927]:
                  - link "[61]" [ref=f38e928] [cursor=pointer]:
                    - /url: "#cite_note-ScreenRantMutiny-67"
                    - generic: "[61]"
                - text: "Gale described the situation: \"⁠[Cameron] would ask him to set up a shot one way and [Cracknell] would say, 'Oh no no no, I know what you want,'"
                - text: ... Then he'd do it wrong and the whole set would have to be broken down."
                - superscript [ref=f38e930]:
                  - link "[61]" [ref=f38e931] [cursor=pointer]:
                    - /url: "#cite_note-ScreenRantMutiny-67"
                    - generic: "[61]"
                - text: The situation deteriorated until Cameron and Hurd fired Cracknell and the Pinewood crew
                - link "walked out" [ref=f38e932] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wildcat_strike_action
                - text: in the middle of the day.
                - superscript [ref=f38e933]:
                  - link "[61]" [ref=f38e934] [cursor=pointer]:
                    - /url: "#cite_note-ScreenRantMutiny-67"
                    - generic: "[61]"
              - paragraph [ref=f38e935]:
                - text: Cameron called Fox for advice and was determined to move the production out of England until Hurd convinced him otherwise. The situation was tumultuous because the number of films simultaneously in production meant the crew could not be easily replaced. Cameron and Hurd gathered the crew to discuss their grievances; Cameron explained the importance of the production, and that any member of the crew who could not support it should volunteer to be replaced. The crew agreed to support Cameron if he supported their scheduled working hours.
                - superscript [ref=f38e936]:
                  - link "[61]" [ref=f38e937] [cursor=pointer]:
                    - /url: "#cite_note-ScreenRantMutiny-67"
                    - generic: "[61]"
                - text: "The relationship between filmmakers and crew remained cool; when filming concluded at Pinewood, Cameron told the crew: \"This has been a long and difficult shoot, fraught by many problems"
                - text: ... but the one thing that kept me going, through it all, was the certain knowledge that one day I would drive out the gate of Pinewood and never come back, and that you sorry bastards would still be here."
                - superscript [ref=f38e939]:
                  - link "[61]" [ref=f38e940] [cursor=pointer]:
                    - /url: "#cite_note-ScreenRantMutiny-67"
                    - generic: "[61]"
                - text: He described most of the crew as "lazy, insolent, and arrogant".
                - superscript [ref=f38e941]:
                  - link "[61]" [ref=f38e942] [cursor=pointer]:
                    - /url: "#cite_note-ScreenRantMutiny-67"
                    - generic: "[61]"
                - text: Paxton called the crew's work impeccable, but their attitude more relaxed than the American crews to which he was accustomed.
                - superscript [ref=f38e943]:
                  - link "[39]" [ref=f38e944] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
              - paragraph [ref=f38e945]:
                - text: The power plant and alien nest were filmed in the decommissioned
                - link "Acton Lane Power Station" [ref=f38e946] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Acton_Lane_Power_Station
                - text: in London, and the sets were left in place until
                - link "Tim Burton" [ref=f38e947] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Tim_Burton
                - text: redressed the sets into interiors for Axis Chemicals during the filming of his 1989 film
                - link "Batman" [ref=f38e949] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Batman_(1989_film)
                - text: .
                - superscript [ref=f38e950]:
                  - link "[50]" [ref=f38e951] [cursor=pointer]:
                    - /url: "#cite_note-Sideshow-54"
                    - generic: "[50]"
                - superscript [ref=f38e952]:
                  - link "[63]" [ref=f38e953] [cursor=pointer]:
                    - /url: "#cite_note-Movie_Minutiae:_Aliens-69"
                    - generic: "[63]"
                - text: While filming the dropship descent from the Sulaco, shaking collapsed the set roof onto the cast and crew. Most of the cast were unharmed, but a large piece of debris hit Cameron in the head.
                - superscript [ref=f38e954]:
                  - link "[37]" [ref=f38e955] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - superscript [ref=f38e956]:
                  - link "[64]" [ref=f38e957] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEDrennan198825–26-70"
                    - generic: "[64]"
                - text: Because of the tight budget, Hurd made Cameron pay for an early scene of a laser cutting Ripley free from her hypersleep chamber.
                - superscript [ref=f38e958]:
                  - link "[37]" [ref=f38e959] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - superscript [ref=f38e960]:
                  - link "[65]" [ref=f38e961] [cursor=pointer]:
                    - /url: "#cite_note-TimeSchickelPage6-71"
                    - generic: "[65]"
                - text: According to Henriksen, Paxton was unaware he would be involved in the knife-trick scene until it was filmed; Henriksen nicked Paxton's finger during the reshoot.
                - superscript [ref=f38e962]:
                  - link "[37]" [ref=f38e963] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - text: Some of the early establishing scenes were filmed near the end of principal photography to capture the bond that had developed between cast and characters.
                - superscript [ref=f38e964]:
                  - link "[51]" [ref=f38e965] [cursor=pointer]:
                    - /url: "#cite_note-TheDissolve-55"
                    - generic: "[51]"
              - paragraph [ref=f38e966]:
                - text: Some improvisation was encouraged.
                - superscript [ref=f38e967]:
                  - link "[66]" [ref=f38e968] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEDrennan198826-72"
                    - generic: "[66]"
                - text: Weaver discussed tweaks to her character with Cameron on set, believing she understood how Ripley would act.
                - superscript [ref=f38e969]:
                  - link "[39]" [ref=f38e970] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - text: Her line "Get away from her, you bitch!" had to be filmed in one take due to the tight schedule remaining, and the actress thought she had messed it up.
                - superscript [ref=f38e971]:
                  - link "[67]" [ref=f38e972] [cursor=pointer]:
                    - /url: "#cite_note-EWQuote-73"
                    - generic: "[67]"
                - text: Paxton believed he was not good at improvisation and discussed ideas with Cameron before filming. Hudson's signature line "Game over, man; game over!" originated from Paxton developing a backstory for the character, in which he was trained on simulators.
                - superscript [ref=f38e973]:
                  - link "[2]" [ref=f38e974] [cursor=pointer]:
                    - /url: "#cite_note-YahooPaxton-2"
                    - generic: "[2]"
                - text: Henn found it hard to act afraid of the aliens (since she was fond of the actors in the suits) and imagined a dog was chasing her.
                - superscript [ref=f38e975]:
                  - link "[44]" [ref=f38e976] [cursor=pointer]:
                    - /url: "#cite_note-PeopleHenn-47"
                    - generic: "[44]"
                - text: Other cast members spent time with Henn between scenes, including Weaver and Paxton (who would color or craft things with her).
                - superscript [ref=f38e977]:
                  - link "[44]" [ref=f38e978] [cursor=pointer]:
                    - /url: "#cite_note-PeopleHenn-47"
                    - generic: "[44]"
                - superscript [ref=f38e979]:
                  - link "[55]" [ref=f38e980] [cursor=pointer]:
                    - /url: "#cite_note-DailyBeastPaxton-59"
                    - generic: "[55]"
                - text: Biehn said he and Paxton spent much of their free time together.
                - superscript [ref=f38e981]:
                  - link "[10]" [ref=f38e982] [cursor=pointer]:
                    - /url: "#cite_note-RemarEmpire-13"
                    - generic: "[10]"
                - text: Despite the difficulties, Fox was satisfied with the
                - link "daily footage" [ref=f38e983] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Dailies
                - text: ", and principal photography concluded in January 1986, on time and on budget."
                - superscript [ref=f38e984]:
                  - link "[31]" [ref=f38e985] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - superscript [ref=f38e986]:
                  - link "[68]" [ref=f38e987] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198651-74"
                    - generic: "[68]"
            - region "Post-production" [ref=f38e988]:
              - generic [ref=f38e989]:
                - heading "Post-production" [level=3] [ref=f38e990]
                - generic [ref=f38e991]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=8
              - paragraph [ref=f38e992]:
                - text: Post-production began in late April 1986.
                - superscript [ref=f38e993]:
                  - link "[31]" [ref=f38e994] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - text: Several scenes were removed from Aliens
                - generic [ref=f38e995]: "'"
                - text: theatrical release, including Ripley learning about her daughter's death and a cocooned Burke begging her for death.
                - superscript [ref=f38e996]:
                  - link "[19]" [ref=f38e997] [cursor=pointer]:
                    - /url: "#cite_note-ScreenRantDeleted2-22"
                    - generic: "[19]"
                - text: Fox and Hurd suggested removing a long opening scene detailing the lives of the colonists, Newt's family discovering the derelict alien ship, and her father being attacked by a facehugger, because it ruined the pacing and sense of mystery.
                - superscript [ref=f38e998]:
                  - link "[37]" [ref=f38e999] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - superscript [ref=f38e1000]:
                  - link "[69]" [ref=f38e1001] [cursor=pointer]:
                    - /url: "#cite_note-ScreenRantDeleted1-75"
                    - generic: "[69]"
                - text: Two scenes with James Remar as Hicks (shown from the back) were used in the film.
                - superscript [ref=f38e1002]:
                  - link "[10]" [ref=f38e1003] [cursor=pointer]:
                    - /url: "#cite_note-RemarEmpire-13"
                    - generic: "[10]"
              - paragraph [ref=f38e1004]:
                - link "Ray Lovejoy" [ref=f38e1005] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ray_Lovejoy
                - text: was responsible for editing the final 137-minute cut of Aliens.
                - superscript [ref=f38e1006]:
                  - link "[70]" [ref=f38e1007] [cursor=pointer]:
                    - /url: "#cite_note-VarietyLovejoy-76"
                    - generic: "[70]"
                - text: Fox wanted the film to be under two hours so it could be shown more times per day in theaters, increasing its revenue potential. Fox production president
                - link "Scott Rudin" [ref=f38e1008] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Scott_Rudin
                - text: flew to England to ask Cameron and Hurd if they could cut another 12 minutes, but Cameron was concerned further cuts would make it nonsensical, and Rudin relented.
                - superscript [ref=f38e1009]:
                  - link "[31]" [ref=f38e1010] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - superscript [ref=f38e1011]:
                  - link "[70]" [ref=f38e1012] [cursor=pointer]:
                    - /url: "#cite_note-VarietyLovejoy-76"
                    - generic: "[70]"
            - region "Music" [ref=f38e1013]:
              - generic [ref=f38e1014]:
                - heading "Music" [level=3] [ref=f38e1015]
                - generic [ref=f38e1016]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=9
              - note [ref=f38e1017]:
                - text: "Main article:"
                - link "Aliens (soundtrack)" [ref=f38e1018] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Aliens_(soundtrack)
              - generic [ref=f38e1019]:
                - generic [ref=f38e1020]:
                  - figure [ref=f38e1022]
                  - generic [ref=f38e1025]:
                    - link "James Horner – Futile Escape" [ref=f38e1027] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/File:Aliens_1986_Score_-_Futile_Escape_by_James_Horner.ogg
                      - generic [ref=f38e1028]:
                        - text: James Horner
                        - text: – Futile Escape
                    - generic [ref=f38e1033]:
                      - button "Play audio" [ref=f38e1034] [cursor=pointer]
                      - generic [ref=f38e1036] [cursor=pointer]:
                        - generic [ref=f38e1037]: "Duration: 30 seconds."
                        - text: 0:30
                    - generic [ref=f38e1038]:
                      - text: James Horner was given six weeks to score Aliens but, because filming and editing were behind schedule, he had to compose it in only three.
                      - superscript [ref=f38e1039]:
                        - link "[71]" [ref=f38e1040] [cursor=pointer]:
                          - /url: "#cite_note-DOGHornerCliche-77"
                          - generic: "[71]"
                      - superscript [ref=f38e1041]:
                        - link "[72]" [ref=f38e1042] [cursor=pointer]:
                          - /url: "#cite_note-HornerVulture-78"
                          - generic: "[72]"
                - generic [ref=f38e1043]:
                  - separator [ref=f38e1044]
                  - generic [ref=f38e1045]:
                    - text: Problems playing this file? See
                    - link "media help" [ref=f38e1046] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/Help:Media
                    - text: .
              - paragraph [ref=f38e1047]:
                - link "James Horner" [ref=f38e1048] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/James_Horner
                - text: met Cameron early in their careers, when they worked for director
                - link "Roger Corman" [ref=f38e1049] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Roger_Corman
                - text: . Aliens was Horner and Cameron's first collaboration; Horner called it a "nightmare".
                - superscript [ref=f38e1050]:
                  - link "[73]" [ref=f38e1051] [cursor=pointer]:
                    - /url: "#cite_note-HornerEW-79"
                    - generic: "[73]"
                - superscript [ref=f38e1052]:
                  - link "[74]" [ref=f38e1053] [cursor=pointer]:
                    - /url: "#cite_note-HornerGuardian-80"
                    - generic: "[74]"
                - text: He arrived in London to compose, expecting a six-week schedule. There was nothing for him to score, as Cameron was still filming and editing, and Horner had only three weeks to compose.
                - superscript [ref=f38e1054]:
                  - link "[30]" [ref=f38e1055] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingRetro-33"
                    - generic: "[30]"
                - superscript [ref=f38e1056]:
                  - link "[74]" [ref=f38e1057] [cursor=pointer]:
                    - /url: "#cite_note-HornerGuardian-80"
                    - generic: "[74]"
                - superscript [ref=f38e1058]:
                  - link "[72]" [ref=f38e1059] [cursor=pointer]:
                    - /url: "#cite_note-HornerVulture-78"
                    - generic: "[72]"
                - text: The producers were unwilling to give him any more time, and he was booked to begin scoring
                - link "The Name of the Rose" [ref=f38e1061] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/The_Name_of_the_Rose_(film)
                - text: (1986) shortly afterwards.
                - superscript [ref=f38e1062]:
                  - link "[72]" [ref=f38e1063] [cursor=pointer]:
                    - /url: "#cite_note-HornerVulture-78"
                    - generic: "[72]"
              - paragraph [ref=f38e1064]:
                - text: Horner recorded the score at
                - link "Abbey Road Studios" [ref=f38e1065] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Abbey_Road_Studios
                - text: with the
                - link "London Symphony Orchestra" [ref=f38e1066] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/London_Symphony_Orchestra
                - text: .
                - superscript [ref=f38e1067]:
                  - link "[74]" [ref=f38e1068] [cursor=pointer]:
                    - /url: "#cite_note-HornerGuardian-80"
                    - generic: "[74]"
                - superscript [ref=f38e1069]:
                  - link "[75]" [ref=f38e1070] [cursor=pointer]:
                    - /url: "#cite_note-FilmTracks-81"
                    - generic: "[75]"
                - text: His schedule was so tight that the music for the climactic battle between Ripley and the queen was written overnight. Cameron first heard the score while it was being recorded by the orchestra and did not like it, but it was too late to make changes.
                - link "Brad Fiedel" [ref=f38e1071] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Brad_Fiedel
                - text: "'s synth-inspired tracks for The Terminator had allowed changes to be made quickly based on feedback, but Cameron had no experience managing orchestral music."
                - superscript [ref=f38e1072]:
                  - link "[72]" [ref=f38e1073] [cursor=pointer]:
                    - /url: "#cite_note-HornerVulture-78"
                    - generic: "[72]"
                - text: Cameron cut the score up, using pieces where he believed they fit best, and inserted pieces of
                - link "Jerry Goldsmith" [ref=f38e1074] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Jerry_Goldsmith
                - text: "'s Alien score and hired unknown composers to fill gaps."
                - superscript [ref=f38e1075]:
                  - link "[72]" [ref=f38e1076] [cursor=pointer]:
                    - /url: "#cite_note-HornerVulture-78"
                    - generic: "[72]"
                - superscript [ref=f38e1077]:
                  - link "[75]" [ref=f38e1078] [cursor=pointer]:
                    - /url: "#cite_note-FilmTracks-81"
                    - generic: "[75]"
                - text: The director said in a later interview he thought the music was good, but did not fit the scenes he had filmed.
                - superscript [ref=f38e1079]:
                  - link "[72]" [ref=f38e1080] [cursor=pointer]:
                    - /url: "#cite_note-HornerVulture-78"
                    - generic: "[72]"
                - text: Horner's "alien
                - link "sting" [ref=f38e1081] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Sting_(musical_phrase)
                - text: "\" sound was initially used only once, during the scene with the cocooned woman, as Cameron disliked it, but he eventually used it throughout the film."
                - superscript [ref=f38e1082]:
                  - link "[37]" [ref=f38e1083] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - text: Unused portions of Horner's Aliens score were repurposed for
                - link "Die Hard" [ref=f38e1085] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Die_Hard
                - text: (1988).
                - superscript [ref=f38e1086]:
                  - link "[76]" [ref=f38e1087] [cursor=pointer]:
                    - /url: "#cite_note-LATimesDieHardScore-82"
                    - generic: "[76]"
                - superscript [ref=f38e1088]:
                  - link "[77]" [ref=f38e1089] [cursor=pointer]:
                    - /url: "#cite_note-FilmScoreDieHard-83"
                    - generic: "[77]"
          - region "Special effects and design" [ref=f38e1090]:
            - generic [ref=f38e1091]:
              - heading "Special effects and design" [level=2] [ref=f38e1092]
              - generic [ref=f38e1093]:
                - link "edit":
                  - /url: /w/index.php?title=Aliens_(film)&action=edit&section=10
            - paragraph [ref=f38e1094]:
              - text: Development of the special effects for Aliens began in May 1985, with
              - link "John Richardson" [ref=f38e1095] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/John_Richardson_(special_effects_designer)
              - text: supervising a 40-person team at
              - link "Stan Winston Studio" [ref=f38e1096] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Stan_Winston_Studio
              - text: .
              - superscript [ref=f38e1097]:
                - link "[39]" [ref=f38e1098] [cursor=pointer]:
                  - /url: "#cite_note-ABCNews30Things-42"
                  - generic: "[39]"
              - superscript [ref=f38e1099]:
                - link "[78]" [ref=f38e1100] [cursor=pointer]:
                  - /url: "#cite_note-StanWinstonTheQueen-84"
                  - generic: "[78]"
              - superscript [ref=f38e1101]:
                - link "[79]" [ref=f38e1102] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEShay19868,_11-85"
                  - generic: "[79]"
              - text: L.A. Effects Group created miniatures and optical effects. Cameron lacked contacts at the more established special effects studios and avoided using them because he believed his hands-on approach would not be welcomed.
              - superscript [ref=f38e1103]:
                - link "[80]" [ref=f38e1104] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEShay198611-86"
                  - generic: "[80]"
              - text: He also did not rehire many Alien crew members because he did not want to be restricted by their loyalties to the first film. Those who returned were often given a higher status (such as
              - link "Crispian Sallis" [ref=f38e1105] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Crispian_Sallis
              - text: ", Alien"
              - link "focus puller" [ref=f38e1106] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Focus_puller
              - text: and Aliens set decorator).
              - superscript [ref=f38e1107]:
                - link "[59]" [ref=f38e1108] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEShay19869-64"
                  - generic: "[59]"
              - superscript [ref=f38e1109]:
                - link "[81]" [ref=f38e1110] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEPirani198611–12-87"
                  - generic: "[81]"
              - text: Cameron had enjoyed returning artist
              - link "Ron Cobb" [ref=f38e1111] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ron_Cobb
              - text: "'s work on Alien,"
              - superscript [ref=f38e1112]:
                - link "[82]" [ref=f38e1113] [cursor=pointer]:
                  - /url: "#cite_note-FOOTNOTEPirani198612-88"
                  - generic: "[82]"
              - text: and conceptual artist
              - link "Syd Mead" [ref=f38e1114] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Syd_Mead
              - text: was recruited because Cameron was a fan of his work on films such as
              - 'link "2010: The Year We Make Contact" [ref=f38e1116] [cursor=pointer]':
                - /url: //en.wikipedia.org/wiki/2010:_The_Year_We_Make_Contact
              - text: (1984).
              - superscript [ref=f38e1117]:
                - link "[60]" [ref=f38e1118] [cursor=pointer]:
                  - /url: "#cite_note-VultureMead-65"
                  - generic: "[60]"
            - region "Sets and technology" [ref=f38e1119]:
              - generic [ref=f38e1120]:
                - heading "Sets and technology" [level=3] [ref=f38e1121]
                - generic [ref=f38e1122]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=11
              - paragraph [ref=f38e1123]:
                - text: Mead designed the Sulaco, the marines' spaceship. He conceived it as a large sphere with antennae, but Cameron wanted it to be flatter; the full craft had to pass the camera, and a sphere would not work with the
                - link "aspect ratio" [ref=f38e1124] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Aspect_ratio_(image)
                - text: .
                - superscript [ref=f38e1125]:
                  - link "[39]" [ref=f38e1126] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - text: Mead designed the craft as a commercial freighter carrying a military unit. Its exterior was designed with a row of loading doors, a crane, and large gun fixtures to defend against threats.
                - superscript [ref=f38e1127]:
                  - link "[83]" [ref=f38e1128] [cursor=pointer]:
                    - /url: "#cite_note-SydMeadSulaco-89"
                    - generic: "[83]"
                - text: Mirrors were used as a cost-cutting measure to increase the number of sleeping pods and add a power loader.
                - superscript [ref=f38e1129]:
                  - link "[57]" [ref=f38e1130] [cursor=pointer]:
                    - /url: "#cite_note-DOGDanielKash-61"
                    - generic: "[57]"
                - text: Cobb designed the dropship, the armored personnel carrier (APC), and exteriors of the colony and its vehicles.
                - superscript [ref=f38e1131]:
                  - link "[84]" [ref=f38e1132] [cursor=pointer]:
                    - /url: "#cite_note-GuardianCobb-90"
                    - generic: "[84]"
                - superscript [ref=f38e1133]:
                  - link "[85]" [ref=f38e1134] [cursor=pointer]:
                    - /url: "#cite_note-Cobb1-91"
                    - generic: "[85]"
                - superscript [ref=f38e1135]:
                  - link "[86]" [ref=f38e1136] [cursor=pointer]:
                    - /url: "#cite_note-Cobb2-92"
                    - generic: "[86]"
                - text: The Sulaco
                - generic [ref=f38e1137]: "'"
                - text: s dropship was designed to be life-size, for use on the Sulaco set,
                - superscript [ref=f38e1138]:
                  - link "[60]" [ref=f38e1139] [cursor=pointer]:
                    - /url: "#cite_note-VultureMead-65"
                    - generic: "[60]"
                - text: but a smaller replica was used for some shots.
                - superscript [ref=f38e1140]:
                  - link "[83]" [ref=f38e1141] [cursor=pointer]:
                    - /url: "#cite_note-SydMeadSulaco-89"
                    - generic: "[83]"
                - text: The APC was a disguised
                - link "pushback" [ref=f38e1142] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Pushback_(aviation)
                - text: tug for a
                - link "Boeing 747" [ref=f38e1143] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Boeing_747
                - text: .
                - superscript [ref=f38e1144]:
                  - link "[83]" [ref=f38e1145] [cursor=pointer]:
                    - /url: "#cite_note-SydMeadSulaco-89"
                    - generic: "[83]"
                - text: The derelict alien spacecraft used in Aliens had been in historian
                - link "Bob Burns III" [ref=f38e1146] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Bob_Burns_III
                - text: "'s driveway since its appearance in Alien."
                - superscript [ref=f38e1147]:
                  - link "[37]" [ref=f38e1148] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
              - paragraph [ref=f38e1149]:
                - text: Most of the colony, apart from the main entrance used by the marines, was constructed in
                - link "scale miniature" [ref=f38e1150] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Scale_model
                - text: form. The set was about 80-foot (24 m) long to accommodate the sixth-scale APC replica. The set was so large it had to be laid out diagonally across the stage, and
                - link "forced perspective" [ref=f38e1151] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Forced_perspective
                - text: was used to add in buildings that would otherwise not fit.
                - superscript [ref=f38e1152]:
                  - link "[87]" [ref=f38e1153] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198611,_14-93"
                    - generic: "[87]"
                - text: Cobb used a stylized design for the colony, resembling a
                - link "western frontier" [ref=f38e1154] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Western_frontier
                - text: town. It featured a makeshift construction from cargo containers, broken filming equipment, and beer crates.
                - superscript [ref=f38e1155]:
                  - link "[88]" [ref=f38e1156] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198612,_14-94"
                    - generic: "[88]"
                - text: The alien nest scene was one of the earliest filmed; Weaver's participation was delayed by three weeks because of production issues on her previous film
                - link "Half Moon Street" [ref=f38e1158] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Half_Moon_Street_(film)
                - text: (1986), and the scene was one of the few not involving her. The Acton Power Station location was filled with decaying
                - link "asbestos" [ref=f38e1159] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Asbestos
                - text: and three weeks were spent having it professionally cleaned, during which time the alien hive was fabricated in clay spawning hundreds of fiberglass and vacuum-formed castings that were installed at the station over a further three weeks.
                - superscript [ref=f38e1160]:
                  - link "[89]" [ref=f38e1161] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198615-95"
                    - generic: "[89]"
                - text: Cameron wanted to
                - link "vertically pan" [ref=f38e1162] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Panning_(camera)
                - text: as the marines entered the hive, but disguising the area above the marines would be time-intensive. A hanging miniature, about 12-foot (3.7 m) square, was made from plywood and styrofoam, hung just above the actors' heads, and carefully blended into the larger set. After Remar was replaced, Cameron wanted to reshoot the scene, but the miniature had been destroyed; he was able to edit the scene to conceal Remar.
                - superscript [ref=f38e1163]:
                  - link "[90]" [ref=f38e1164] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198615–16-96"
                    - generic: "[90]"
              - paragraph [ref=f38e1165]:
                - text: The marines' smart guns weighed 65 to 70 pounds (29 to 32 kg), and were constructed from German
                - link "MG 42" [ref=f38e1166] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/MG_42
                - text: machine guns attached to a
                - link "steadicam" [ref=f38e1167] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Steadicam
                - text: and augmented with motorcycle parts.
                - superscript [ref=f38e1168]:
                  - link "[91]" [ref=f38e1169] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELowry198741-97"
                    - generic: "[91]"
                - superscript [ref=f38e1170]:
                  - link "[92]" [ref=f38e1171] [cursor=pointer]:
                    - /url: "#cite_note-Telegraph11Things-98"
                    - generic: "[92]"
                - text: Since getting in and out of the smart-gun rig was difficult, the actors kept them on when not filming.
                - superscript [ref=f38e1172]:
                  - link "[11]" [ref=f38e1173] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCastPage3-14"
                    - generic: "[11]"
                - text: The pulse rifle was made from a
                - link "Thompson submachine gun" [ref=f38e1174] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Thompson_submachine_gun
                - text: and a
                - link "Franchi SPAS-12" [ref=f38e1175] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Franchi_SPAS-12
                - text: pump-action shotgun in a futuristic shell.
                - superscript [ref=f38e1176]:
                  - link "[93]" [ref=f38e1177] [cursor=pointer]:
                    - /url: "#cite_note-LATimesWeaverRambolina-99"
                    - generic: "[93]"
                - text: Weaver was opposed to weapons in general, but Cameron explained weapons were secondary to the core narrative of Ripley bonding with and protecting Newt.
                - superscript [ref=f38e1178]:
                  - link "[38]" [ref=f38e1179] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
                - superscript [ref=f38e1180]:
                  - link "[39]" [ref=f38e1181] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - superscript [ref=f38e1182]:
                  - link "[93]" [ref=f38e1183] [cursor=pointer]:
                    - /url: "#cite_note-LATimesWeaverRambolina-99"
                    - generic: "[93]"
                - text: Weaver found using the weapons strange and difficult, due to their weight and her concern about pulling the wrong trigger.
                - superscript [ref=f38e1184]:
                  - link "[39]" [ref=f38e1185] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - superscript [ref=f38e1186]:
                  - link "[93]" [ref=f38e1187] [cursor=pointer]:
                    - /url: "#cite_note-LATimesWeaverRambolina-99"
                    - generic: "[93]"
                - text: Automated
                - link "sentry guns" [ref=f38e1188] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Sentry_gun
                - text: were also constructed for Aliens, although they do not appear in the theatrical cut. Real machine guns were positioned atop remote-controlled hydraulic tripods that allowed them to pivot horizontally or vertically. The guns were capable of firing up to 600 wooden-blank rounds per minute that were shattered into small splinters by
                - link "baffles in the muzzle" [ref=f38e1189] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Silencer_(firearms)#Baffles_and_spacers
                - text: and incinerated by the heat generated in the barrel.
                - superscript [ref=f38e1190]:
                  - link "[94]" [ref=f38e1191] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198619-100"
                    - generic: "[94]"
              - paragraph [ref=f38e1192]:
                - text: A cast was made of Henn's upper body and her stunt double's legs to construct a lightweight dummy for Weaver to hold when carrying a gun; Henn's weight plus a gun would have been too heavy.
                - superscript [ref=f38e1193]:
                  - link "[39]" [ref=f38e1194] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - text: Goldstein had never handled a gun, and held her weapon incorrectly in closeups, so Hurd stood in for her.
                - superscript [ref=f38e1195]:
                  - link "[37]" [ref=f38e1196] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - text: The flamethrowers were functional. The art department had covered the sets in an unspecified substance to artificially age them; the flamethrowers vaporized it, causing fire and heavy smoke. Goldstein struggled to breathe and, since improvisation was encouraged, Paxton thought she was acting until he also became breathless.
                - superscript [ref=f38e1197]:
                  - link "[37]" [ref=f38e1198] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - superscript [ref=f38e1199]:
                  - link "[66]" [ref=f38e1200] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEDrennan198826-72"
                    - generic: "[66]"
              - paragraph [ref=f38e1201]:
                - text: The nuclear explosion of the colony in the finale was created by shining a light bulb through cotton.
                - superscript [ref=f38e1202]:
                  - link "[37]" [ref=f38e1203] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - link "Reebok" [ref=f38e1204] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Reebok
                - text: designer Taun Le was commissioned to design custom sneakers for Weaver to wear in the film. The only mandate was that they be laceless so one could easily slide off of Weaver's foot during the finale.
                - superscript [ref=f38e1205]:
                  - link "[47]" [ref=f38e1206] [cursor=pointer]:
                    - /url: "#cite_note-EmpireCast-50"
                    - generic: "[47]"
                - superscript [ref=f38e1207]:
                  - link "[95]" [ref=f38e1208] [cursor=pointer]:
                    - /url: "#cite_note-Reebok-101"
                    - generic: "[95]"
            - region "Creature effects" [ref=f38e1209]:
              - generic [ref=f38e1210]:
                - heading "Creature effects" [level=3] [ref=f38e1211]
                - generic [ref=f38e1212]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=12
              - note [ref=f38e1213]:
                - text: "See also:"
                - link "Xenomorph" [ref=f38e1214] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Xenomorph
              - paragraph [ref=f38e1215]:
                - link "H. R. Giger" [ref=f38e1216] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/H._R._Giger
                - text: ", who designed the alien creature, was reportedly disappointed that he could not be involved in Aliens."
                - superscript [ref=f38e1217]:
                  - link "[96]" [ref=f38e1218] [cursor=pointer]:
                    - /url: "#cite_note-SyFyMakingOfBook-102"
                    - generic: "[96]"
                - text: According to Hurd, Giger was contractually obligated to
                - 'link "Poltergeist II: The Other Side" [ref=f38e1220] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Poltergeist_II:_The_Other_Side
                - text: (1986) and Fox was not allowed to negotiate with him.
                - superscript [ref=f38e1221]:
                  - link "[97]" [ref=f38e1222] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPirani198611-103"
                    - generic: "[97]"
                - text: Giger was replaced by special-effects creator
                - link "Stan Winston" [ref=f38e1223] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Stan_Winston
                - text: . Cameron also contributed to designs but was not as concerned with the warrior aliens because they were on screen only briefly.
                - superscript [ref=f38e1224]:
                  - link "[96]" [ref=f38e1225] [cursor=pointer]:
                    - /url: "#cite_note-SyFyMakingOfBook-102"
                    - generic: "[96]"
                - text: In redesigning the alien warriors, Cameron remained faithful to Giger's work while building on it. Conscious that the creatures would be seen by audiences as people in costumes, he enhanced the designs by extending their arms and often filmed them hung from wires or from atypical positions to make them appear more inhuman.
                - superscript [ref=f38e1226]:
                  - link "[59]" [ref=f38e1227] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay19869-64"
                    - generic: "[59]"
                - text: The aliens were played by dancers and stuntmen in lightweight costumes that allowed them to move quickly. Several 8-foot (2.4 m) mannequins were used for aliens that were contorted into inhuman poses.
                - superscript [ref=f38e1228]:
                  - link "[39]" [ref=f38e1229] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - text: "Although hordes of alien creatures appear to be in the film, there were only 12 alien suits: simple black leotards covered in molded foam were used for faster-moving shots, and"
                - link "detailed models" [ref=f38e1230] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Theatrical_property#Hero_props
                - text: with articulated upper bodies and mouths for closeups.
                - superscript [ref=f38e1231]:
                  - link "[98]" [ref=f38e1232] [cursor=pointer]:
                    - /url: "#cite_note-StanWinstonAlienWarriors-104"
                    - generic: "[98]"
                - text: When the aliens were shot and destroyed, puppets were hung up and detonated. The aliens' acidic blood was a combination of
                - link "titanium tetrachloride" [ref=f38e1233] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Titanium_tetrachloride
                - text: ","
                - link "cyclohexylamine" [ref=f38e1234] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Cyclohexylamine
                - text: ","
                - link "acetic acid" [ref=f38e1235] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Acetic_acid
                - text: and yellow dye.
                - superscript [ref=f38e1236]:
                  - link "[39]" [ref=f38e1237] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
              - paragraph [ref=f38e1238]:
                - text: The facehugger design remained faithful to the original Alien design, but the overall appearance was made to appear more organic, and its eight legs were made more finger-like, enhancing the detail on the knuckles and adding fingernails.
                - superscript [ref=f38e1239]:
                  - link "[99]" [ref=f38e1240] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198628-105"
                    - generic: "[99]"
                - text: Unlike in Alien, which only involved one substantial jumping scene, the facehugger models used in Aliens featured full articulation for their tongue, legs, and tail, allowing for more action set pieces. The tail was also lengthened about 6 in (15 cm) to give it more functions such as a whip-like action.
                - superscript [ref=f38e1241]:
                  - link "[99]" [ref=f38e1242] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198628-105"
                    - generic: "[99]"
                - text: Nine operators were required for the fully articulated facehugger; other less-detailed variants were used for simple actions such as scurrying across the floor. The design team struggled with making it scuttle believably while moving the appendages; they eventually developed a control wire along the floor that activated a gear inside it, causing the appendages to move as it was pulled along. Several rubber facehuggers were made to be thrown or blown up.
                - superscript [ref=f38e1243]:
                  - link "[100]" [ref=f38e1244] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198628–29-106"
                    - generic: "[100]"
                - text: Manipulating the facehugger inside a water tank was also difficult as the tank had to be watertight, limiting the use of control cables. A method was developed that required fewer cables to move the facehugger around the tank; the tail was fitted with a spring that caused it to snap back and forth.
                - superscript [ref=f38e1245]:
                  - link "[99]" [ref=f38e1246] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198628-105"
                    - generic: "[99]"
                - text: "Winston added arms to the chestburster alien form (since the adult form had arms), explaining how it could drag itself out of a host's chest. Two chestburster puppets were used: a reinforced one, and an articulated one for movement. A puppeteer punched the former through a fabricated latex-foam chest; the scene took several takes to film because it could not pierce the clothing."
                - superscript [ref=f38e1247]:
                  - link "[17]" [ref=f38e1248] [cursor=pointer]:
                    - /url: "#cite_note-StanWinstonColes-20"
                    - generic: "[17]"
                - superscript [ref=f38e1249]:
                  - link "[101]" [ref=f38e1250] [cursor=pointer]:
                    - /url: "#cite_note-StanWinston-107"
                    - generic: "[101]"
              - paragraph [ref=f38e1251]:
                - text: A deleted scene in Alien established a life cycle for the alien creatures in which a lifeform would be cocooned and transformed into an egg that birthed a facehugger.
                - superscript [ref=f38e1252]:
                  - link "[59]" [ref=f38e1253] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay19869-64"
                    - generic: "[59]"
                - superscript [ref=f38e1254]:
                  - link "[102]" [ref=f38e1255] [cursor=pointer]:
                    - /url: "#cite_note-IGNEgg-108"
                    - generic: "[102]"
                - text: Inspired by a
                - link "beehive" [ref=f38e1256] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Beehive
                - text: "-like hierarchy, Cameron believed the vast field of eggs on the derelict alien craft would come from a much larger creature, the queen, with the other alien creatures serving as her drones."
                - superscript [ref=f38e1257]:
                  - link "[59]" [ref=f38e1258] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay19869-64"
                    - generic: "[59]"
                - text: Winston described Cameron's initial queen design as a combination of a
                - link "praying mantis" [ref=f38e1259] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Praying_mantis
                - text: and
                - link "Tyrannosaurus rex" [ref=f38e1261] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Tyrannosaurus_rex
                - text: influenced by the alien warrior design.
                - superscript [ref=f38e1262]:
                  - link "[96]" [ref=f38e1263] [cursor=pointer]:
                    - /url: "#cite_note-SyFyMakingOfBook-102"
                    - generic: "[96]"
                - superscript [ref=f38e1264]:
                  - link "[103]" [ref=f38e1265] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198640-109"
                    - generic: "[103]"
                - text: Cameron said
                - link "dinosaur" [ref=f38e1266] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Dinosaur
                - text: influences were unintentional as he considered them "boring"; his goal was to extrapolate on Giger's warrior designs to create a large and powerful creature that was also swift and overtly female, describing it as "hideous and beautiful at the same time, like a black widow spider". The queen has elongated, large forelimbs, with smaller secondary ones underneath, but Winston redesigned the legs by adding a double joint to make it more inhuman.
                - superscript [ref=f38e1267]:
                  - link "[103]" [ref=f38e1268] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEShay198640-109"
                    - generic: "[103]"
                - text: Cameron and Winston worked on several concepts to vivify the queen, including large puppets, miniatures, and costumes with several people inside. A frame was built large enough to hold two people, covered in black polythene bags, and hung on a crane. The prototype was a success, and Cameron wrote the alien-queen scene.
                - superscript [ref=f38e1269]:
                  - link "[37]" [ref=f38e1270] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - superscript [ref=f38e1271]:
                  - link "[104]" [ref=f38e1272] [cursor=pointer]:
                    - /url: "#cite_note-EWPowerLoader-110"
                    - generic: "[104]"
                - text: The final alien queen was a 14-foot (4.3 m) puppet made of lightweight polyurethane foam.
                - superscript [ref=f38e1273]:
                  - link "[92]" [ref=f38e1274] [cursor=pointer]:
                    - /url: "#cite_note-Telegraph11Things-98"
                    - generic: "[92]"
                - text: Two people sat inside to control the arms; the legs were controlled by rods connected at the ankles, and a separate person whipped the tail around with fishing line. The head was manipulated with a combination of
                - link "servomotors" [ref=f38e1275] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Servomotor
                - text: and hydraulics controlled by up to four people. The effect was hidden by lighting, steam, slime, and smoke.
                - superscript [ref=f38e1276]:
                  - link "[37]" [ref=f38e1277] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - superscript [ref=f38e1278]:
                  - link "[104]" [ref=f38e1279] [cursor=pointer]:
                    - /url: "#cite_note-EWPowerLoader-110"
                    - generic: "[104]"
                - text: The Stan Winston Studio had not used hydraulics and considered them a learning experience. They were essential for moving larger parts of the queen puppet, including the head, and a foot pedal in the body could hydraulically move the tail up and down.
                - superscript [ref=f38e1280]:
                  - link "[78]" [ref=f38e1281] [cursor=pointer]:
                    - /url: "#cite_note-StanWinstonTheQueen-84"
                    - generic: "[78]"
                - link "Shane Mahan" [ref=f38e1282] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Shane_Mahan
                - text: took several weeks to sculpt the head by sight, based on a
                - link "maquette" [ref=f38e1283] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Maquette
                - text: ; computer technology to scale up the model's design did not yet exist.
                - superscript [ref=f38e1284]:
                  - link "[105]" [ref=f38e1285] [cursor=pointer]:
                    - /url: "#cite_note-StanWinstonQueenHead-111"
                    - generic: "[105]"
                - text: "Two heads were built: a lightweight, fragile one; and another that could survive some damage. Each was articulated with hydraulics and cables to control the queen's mouth and lips."
                - superscript [ref=f38e1286]:
                  - link "[78]" [ref=f38e1287] [cursor=pointer]:
                    - /url: "#cite_note-StanWinstonTheQueen-84"
                    - generic: "[78]"
              - paragraph [ref=f38e1288]:
                - text: To create the effect of the queen piercing Bishop's chest with her tail,
                - link "Tom Woodruff Jr." [ref=f38e1289] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Tom_Woodruff_Jr.
                - text: and Alec Gillis constructed a
                - link "chestplate" [ref=f38e1290] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Chestplate
                - text: for Henriksen with a rubber segment of the queen's tail flattened against it. The tail was pulled forward by wire, apparently exploding through Bishop's torso. A rigid piece of tail, attached to a body harness, was used to show more of the tail moving through Bishop, and Henriksen was levered upward as if he was being lifted by the tail. To complete the effect, a dummy of Bishop was constructed with a spring-loaded mechanism that forcibly separated his upper and lower body, as if the queen had ripped him in half. Once separated, Henriksen's upper body was below the set and a fake torso attached up to his shoulders. The android blood was milk, and after several days of filming, it was sour and foul-smelling.
                - superscript [ref=f38e1291]:
                  - link "[106]" [ref=f38e1292] [cursor=pointer]:
                    - /url: "#cite_note-StanWinstonQueenBishop-112"
                    - generic: "[106]"
              - paragraph [ref=f38e1293]:
                - text: John Richardson designed the mechanical power loader exosuit, with input from Mead. As with the queen, a prototype was built out of wood and polythene bags stuffed with newspaper to see how the movement would work.
                - superscript [ref=f38e1294]:
                  - link "[39]" [ref=f38e1295] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - superscript [ref=f38e1296]:
                  - link "[60]" [ref=f38e1297] [cursor=pointer]:
                    - /url: "#cite_note-VultureMead-65"
                    - generic: "[60]"
                - superscript [ref=f38e1298]:
                  - link "[104]" [ref=f38e1299] [cursor=pointer]:
                    - /url: "#cite_note-EWPowerLoader-110"
                    - generic: "[104]"
                - text: The finished design was so cumbersome that stuntman John Lees, in a black skinsuit, operated it from behind.
                - superscript [ref=f38e1300]:
                  - link "[39]" [ref=f38e1301] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - superscript [ref=f38e1302]:
                  - link "[104]" [ref=f38e1303] [cursor=pointer]:
                    - /url: "#cite_note-EWPowerLoader-110"
                    - generic: "[104]"
                - text: The battle between the queen and power loader was extensively choreographed, as Weaver risked serious injury battling a large, unwieldy animatronic.
                - superscript [ref=f38e1304]:
                  - link "[104]" [ref=f38e1305] [cursor=pointer]:
                    - /url: "#cite_note-EWPowerLoader-110"
                    - generic: "[104]"
                - text: The camera was sometimes moved to simulate subjects moving faster. The scene of the queen running at Ripley was one of the more difficult shots; the wires and rods had to be concealed, since they could not be removed in post-production.
                - superscript [ref=f38e1306]:
                  - link "[104]" [ref=f38e1307] [cursor=pointer]:
                    - /url: "#cite_note-EWPowerLoader-110"
                    - generic: "[104]"
                - text: Miniatures were used for parts of the scene with
                - link "go motion" [ref=f38e1308] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Go_motion
                - text: ", a version of"
                - link "stop motion" [ref=f38e1309] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Stop_motion
                - text: with
                - link "motion blur" [ref=f38e1310] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Motion_blur_(media)
                - text: added.
                - superscript [ref=f38e1311]:
                  - link "[104]" [ref=f38e1312] [cursor=pointer]:
                    - /url: "#cite_note-EWPowerLoader-110"
                    - generic: "[104]"
          - region "Release" [ref=f38e1313]:
            - generic [ref=f38e1314]:
              - heading "Release" [level=2] [ref=f38e1315]
              - generic [ref=f38e1316]:
                - link "edit":
                  - /url: /w/index.php?title=Aliens_(film)&action=edit&section=13
            - region "Context" [ref=f38e1317]:
              - generic [ref=f38e1318]:
                - heading "Context" [level=3] [ref=f38e1319]
                - generic [ref=f38e1320]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=14
              - note [ref=f38e1321]:
                - text: "See also:"
                - link "1986 in film" [ref=f38e1322] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/1986_in_film
              - figure "Cameron and Hurd holding a theatrical poster for Aliens in 1986" [ref=f38e1323]:
                - link "See caption" [ref=f38e1324] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:Gale_Ann_Hurd_and_James_Cameron.jpg
                  - img "See caption" [ref=f38e1325]
                - generic [ref=f38e1326]: Cameron and Hurd holding a theatrical poster for Aliens in 1986
              - paragraph [ref=f38e1327]:
                - text: The 1986 summer film season began in mid-May. The season had been starting earlier each year as studios attempted to beat each other with their biggest films. Fifty-five films were scheduled for release between May and September, including the action drama
                - link "Top Gun" [ref=f38e1329] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Top_Gun
                - text: and the comedic
                - link "Sweet Liberty" [ref=f38e1331] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Sweet_Liberty
                - text: ", but the season was not expected to break financial records due to fewer sequels, anticipated"
                - link "blockbusters" [ref=f38e1332] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Blockbuster_(entertainment)
                - text: ", and films by"
                - link "Steven Spielberg" [ref=f38e1333] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Steven_Spielberg
                - text: or starring popular comedians that had dominated the earlier half of the decade. Some industry experts also blamed the burgeoning home-video market, which had grown from 7
                - text: million rentals in 1983 to 58
                - text: million by 1985.
                - superscript [ref=f38e1336]:
                  - link "[107]" [ref=f38e1337] [cursor=pointer]:
                    - /url: "#cite_note-NYTimesHomeMedia-113"
                    - generic: "[107]"
                - superscript [ref=f38e1338]:
                  - link "[108]" [ref=f38e1339] [cursor=pointer]:
                    - /url: "#cite_note-NYTimesSummer1986-114"
                    - generic: "[108]"
                - text: Films expected to do well were aimed at younger audiences and featured comedy or horror, such as
                - link "Back to School" [ref=f38e1341] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Back_to_School
                - text: ","
                - link "Ferris Bueller's Day Off" [ref=f38e1343] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ferris_Bueller's_Day_Off
                - text: ", and"
                - link "SpaceCamp" [ref=f38e1345] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/SpaceCamp
                - text: .
                - superscript [ref=f38e1346]:
                  - link "[108]" [ref=f38e1347] [cursor=pointer]:
                    - /url: "#cite_note-NYTimesSummer1986-114"
                    - generic: "[108]"
                - text: Some films targeted at adults were also seen as potential successes, including
                - link "Legal Eagles" [ref=f38e1349] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Legal_Eagles
                - text: ","
                - link "Ruthless People" [ref=f38e1351] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ruthless_People
                - text: ", and"
                - link "Cobra" [ref=f38e1353] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Cobra_(1986_film)
                - text: .
                - superscript [ref=f38e1354]:
                  - link "[108]" [ref=f38e1355] [cursor=pointer]:
                    - /url: "#cite_note-NYTimesSummer1986-114"
                    - generic: "[108]"
              - paragraph [ref=f38e1356]:
                - text: Aliens was seen by industry professionals as a potential
                - link "sleeper hit" [ref=f38e1357] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Sleeper_hit
                - text: based on positive industry word-of-mouth during filming, enthusiastic industry screenings, and favorable pre-release reviews.
                - superscript [ref=f38e1358]:
                  - link "[31]" [ref=f38e1359] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - superscript [ref=f38e1360]:
                  - link "[35]" [ref=f38e1361] [cursor=pointer]:
                    - /url: "#cite_note-LATimesJuly1119886-38"
                    - generic: "[35]"
                - superscript [ref=f38e1362]:
                  - link "[93]" [ref=f38e1363] [cursor=pointer]:
                    - /url: "#cite_note-LATimesWeaverRambolina-99"
                    - generic: "[93]"
                - text: The film's success was considered dependent on its ability to attract audiences outside the young males and
                - link "blue-collar workers" [ref=f38e1364] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Blue-collar_worker
                - text: typical for the genre.
                - superscript [ref=f38e1365]:
                  - link "[109]" [ref=f38e1366] [cursor=pointer]:
                    - /url: "#cite_note-NYTimesMidSummer-115"
                    - generic: "[109]"
                - text: The tagline was, "This time, it's war".
                - superscript [ref=f38e1367]:
                  - link "[92]" [ref=f38e1368] [cursor=pointer]:
                    - /url: "#cite_note-Telegraph11Things-98"
                    - generic: "[92]"
            - region "Box office" [ref=f38e1369]:
              - generic [ref=f38e1370]:
                - heading "Box office" [level=3] [ref=f38e1371]
                - generic [ref=f38e1372]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=15
              - paragraph [ref=f38e1373]:
                - text: Aliens began a wide release in the United States (U.S.) and Canada on July
                - text: 18, 1986.
                - superscript [ref=f38e1375]:
                  - link "[9]" [ref=f38e1376] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1986July18-12"
                    - generic: "[9]"
                - text: During its opening weekend, the film earned $10.1
                - text: million from 1,437 theaters—an average of $6,995 per theater. It was the weekend's number-one film, ahead of the martial-arts drama
                - link "The Karate Kid Part II" [ref=f38e1379] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/The_Karate_Kid_Part_II
                - text: ($5.6
                - text: million in its fifth weekend) and the black comedy Ruthless People ($4.5
                - text: million in its fourth weekend).
                - superscript [ref=f38e1382]:
                  - link "[110]" [ref=f38e1383] [cursor=pointer]:
                    - /url: "#cite_note-BOMWeekendJuly18toJuly20-116"
                    - generic: "[110]"
                - text: Based on its opening-five-day total ($13.4
                - text: million), Aliens exceeded Fox's expectations and was anticipated to become the summer's top film, surpassing The Karate Kid Part II, Back to School, and Top Gun.
                - superscript [ref=f38e1385]:
                  - link "[31]" [ref=f38e1386] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
                - superscript [ref=f38e1387]:
                  - link "[109]" [ref=f38e1388] [cursor=pointer]:
                    - /url: "#cite_note-NYTimesMidSummer-115"
                    - generic: "[109]"
                - text: The
                - link "Los Angeles Times" [ref=f38e1390] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Los_Angeles_Times
                - text: reported long lines to see Aliens, even on weekday afternoons.
                - superscript [ref=f38e1391]:
                  - link "[31]" [ref=f38e1392] [cursor=pointer]:
                    - /url: "#cite_note-latimesJuly241986-34"
                    - generic: "[31]"
              - paragraph [ref=f38e1393]:
                - text: The film retained the number-one position in its second weekend with an additional gross of $8.6
                - text: million, ahead of the debuting
                - link "Heartburn" [ref=f38e1396] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Heartburn_(film)
                - text: ($5.8
                - text: million) and The Karate Kid Part II ($5
                - text: million).
                - superscript [ref=f38e1399]:
                  - link "[111]" [ref=f38e1400] [cursor=pointer]:
                    - /url: "#cite_note-BOMWeekendJuly25toJuly27-117"
                    - generic: "[111]"
                - text: Aliens remained the number-one film of its third weekend with a gross of $7.1
                - text: million, ahead of the debuts of
                - 'link "Friday the 13th Part VI: Jason Lives" [ref=f38e1403] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Friday_the_13th_Part_VI:_Jason_Lives
                - text: ($6.8
                - text: million) and the
                - link "Howard the Duck" [ref=f38e1406] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Howard_the_Duck_(film)
                - text: ($5.1
                - text: million).
                - superscript [ref=f38e1408]:
                  - link "[112]" [ref=f38e1409] [cursor=pointer]:
                    - /url: "#cite_note-BOMWeekendAug1toAug3-118"
                    - generic: "[112]"
                - superscript [ref=f38e1410]:
                  - link "[113]" [ref=f38e1411] [cursor=pointer]:
                    - /url: "#cite_note-LATimes1986Aug07-119"
                    - generic: "[113]"
                - text: The film fell to third place in its fifth weekend with a gross of $4.30
                - text: million, behind the debuts of
                - link "The Fly" [ref=f38e1414] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/The_Fly_(1986_film)
                - text: ($7
                - text: million) and
                - link "Armed and Dangerous" [ref=f38e1417] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Armed_and_Dangerous_(1986_film)
                - text: ($4.33
                - text: million).
                - superscript [ref=f38e1419]:
                  - link "[114]" [ref=f38e1420] [cursor=pointer]:
                    - /url: "#cite_note-BOMWeekendAug15toAug17-120"
                    - generic: "[114]"
                - text: Aliens was one of the top ten highest-grossing films for 11 weeks.
                - superscript [ref=f38e1421]:
                  - link "[115]" [ref=f38e1422] [cursor=pointer]:
                    - /url: "#cite_note-BOMWeekendSummary-121"
                    - generic: "[115]"
              - paragraph [ref=f38e1423]:
                - text: By the end of its theatrical run, Aliens had grossed about $85.1
                - text: million.
                - superscript [ref=f38e1425]:
                  - link "[115]" [ref=f38e1426] [cursor=pointer]:
                    - /url: "#cite_note-BOMWeekendSummary-121"
                    - generic: "[115]"
                - superscript [ref=f38e1427]:
                  - link "[116]" [ref=f38e1428] [cursor=pointer]:
                    - /url: "#cite_note-TheNumbersSummary-122"
                    - generic: "[116]"
                - superscript [ref=f38e1429]:
                  - link "[iv]" [ref=f38e1430] [cursor=pointer]:
                    - /url: "#cite_note-123"
                    - generic: "[iv]"
                - text: This figure made it
                - link "the year's seventh highest-grossing film" [ref=f38e1431] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/1986_in_film
                - text: ", behind Back to School ($91.3"
                - text: million), science-fiction film
                - 'link "Star Trek IV: The Voyage Home" [ref=f38e1434] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Star_Trek_IV:_The_Voyage_Home
                - text: ($109.6
                - text: million), The Karate Kid Part II ($115.1
                - text: million), war film
                - link "Platoon" [ref=f38e1438] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Platoon_(film)
                - text: (138.5
                - text: million), action comedy
                - link "Crocodile Dundee" [ref=f38e1441] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Crocodile_Dundee
                - text: ($174.8
                - text: million) and Top Gun ($176.8
                - text: million).
                - superscript [ref=f38e1444]:
                  - link "[117]" [ref=f38e1445] [cursor=pointer]:
                    - /url: "#cite_note-BOMDomestic1986-124"
                    - generic: "[117]"
                - superscript [ref=f38e1446]:
                  - link "[118]" [ref=f38e1447] [cursor=pointer]:
                    - /url: "#cite_note-TheNumbersDomestic1986-125"
                    - generic: "[118]"
                - text: Aliens
                - generic [ref=f38e1448]: "'"
                - link "box-office returns to the studio" [ref=f38e1449] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Film_distribution
                - text: ", minus the theaters' share, was $42.5"
                - text: million.
                - superscript [ref=f38e1451]:
                  - link "[119]" [ref=f38e1452] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1986PostMortem-126"
                    - generic: "[119]"
              - paragraph [ref=f38e1453]:
                - text: Box office figures outside the U.S. and Canada are inconsistent and not available for all 1986 films. According to the box-office tracking websites
                - link "Box Office Mojo" [ref=f38e1454] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Box_Office_Mojo
                - text: and
                - link "the Numbers" [ref=f38e1455] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/The_Numbers_(website)
                - text: ", Aliens earned from $45.9"
                - text: million to $98.1
                - text: million.
                - superscript [ref=f38e1458]:
                  - link "[v]" [ref=f38e1459] [cursor=pointer]:
                    - /url: "#cite_note-127"
                    - generic: "[v]"
                - text: This gives Aliens a worldwide gross of $131.1
                - text: million to $183.3
                - text: million, making it the year's fourth-highest-grossing film, behind Platoon ($138
                - text: million), Crocodile Dundee ($328.2
                - text: million), and Top Gun ($356.8
                - text: million), or the third-highest-grossing film behind Crocodile Dundee and Top Gun.
                - superscript [ref=f38e1465]:
                  - link "[120]" [ref=f38e1466] [cursor=pointer]:
                    - /url: "#cite_note-BOMWorldwide1986WW-128"
                    - generic: "[120]"
                - superscript [ref=f38e1467]:
                  - link "[121]" [ref=f38e1468] [cursor=pointer]:
                    - /url: "#cite_note-TheNumbers1986WW-129"
                    - generic: "[121]"
                - text: According to Fox's 1992 estimate, Aliens had earned $157
                - text: million worldwide.
                - superscript [ref=f38e1470]:
                  - link "[122]" [ref=f38e1471] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEVariety19928-130"
                    - generic: "[122]"
                - superscript [ref=f38e1472]:
                  - link "[vi]" [ref=f38e1473] [cursor=pointer]:
                    - /url: "#cite_note-131"
                    - generic: "[vi]"
                - link "The New York Times" [ref=f38e1475] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/The_New_York_Times
                - text: described the film as "extremely successful."
                - superscript [ref=f38e1476]:
                  - link "[119]" [ref=f38e1477] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1986PostMortem-126"
                    - generic: "[119]"
          - region "Reception" [ref=f38e1478]:
            - generic [ref=f38e1479]:
              - heading "Reception" [level=2] [ref=f38e1480]
              - generic [ref=f38e1481]:
                - link "edit":
                  - /url: /w/index.php?title=Aliens_(film)&action=edit&section=16
            - region "Critical response" [ref=f38e1482]:
              - generic [ref=f38e1483]:
                - heading "Critical response" [level=3] [ref=f38e1484]
                - generic [ref=f38e1485]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=17
              - figure "Critics were divided about Aliens' intense action and horror, but consistent in their praise for Weaver's (pictured in 2016) performance." [ref=f38e1486]:
                - link "A smiling, casually-dressed Sigourney Weaver" [ref=f38e1487] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:Aliens_30th_Anniversary_Panel_at_Comicpalooza_-_Sigourney_Weaver_(cropped).jpg
                  - img "A smiling, casually-dressed Sigourney Weaver" [ref=f38e1488]
                - generic [ref=f38e1489]:
                  - text: Critics were divided about Aliens
                  - generic [ref=f38e1490]: "'"
                  - text: intense action and horror, but consistent in their praise for Weaver's (pictured in 2016) performance.
              - paragraph [ref=f38e1491]:
                - text: Aliens opened to generally positive reviews.
                - superscript [ref=f38e1492]:
                  - link "[109]" [ref=f38e1493] [cursor=pointer]:
                    - /url: "#cite_note-NYTimesMidSummer-115"
                    - generic: "[109]"
                - text: It appeared on the cover of the July 28, 1986, edition of
                - link "Time" [ref=f38e1495] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Time_(magazine)
                - text: magazine, which called it "The Summer's Scariest Movie".
                - superscript [ref=f38e1496]:
                  - link "[123]" [ref=f38e1497] [cursor=pointer]:
                    - /url: "#cite_note-TimeCover2-132"
                    - generic: "[123]"
                - text: Audience polls by
                - link "CinemaScore" [ref=f38e1498] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/CinemaScore
                - text: gave the film an average grade of "A" on an A+ to F scale.
                - superscript [ref=f38e1499]:
                  - link "[124]" [ref=f38e1500] [cursor=pointer]:
                    - /url: "#cite_note-CinemaScore-133"
                    - generic: "[124]"
              - paragraph [ref=f38e1501]:
                - text: Most reviewers agreed Aliens was a worthy successor to Alien.
                - superscript [ref=f38e1502]:
                  - link "[125]" [ref=f38e1503] [cursor=pointer]:
                    - /url: "#cite_note-VarietyReview-134"
                    - generic: "[125]"
                - superscript [ref=f38e1504]:
                  - link "[126]" [ref=f38e1505] [cursor=pointer]:
                    - /url: "#cite_note-TimeSchickelPage1-135"
                    - generic: "[126]"
                - link "Variety" [ref=f38e1507] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Variety_(magazine)
                - text: and
                - link "Walter Goodman" [ref=f38e1508] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Walter_Goodman_(critic)
                - text: said it could not replicate the novelty of the first film, but Aliens compensated with special effects, technique, and a constant stream of set-piece thrills and scary scenes.
                - superscript [ref=f38e1509]:
                  - link "[9]" [ref=f38e1510] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1986July18-12"
                    - generic: "[9]"
                - superscript [ref=f38e1511]:
                  - link "[125]" [ref=f38e1512] [cursor=pointer]:
                    - /url: "#cite_note-VarietyReview-134"
                    - generic: "[125]"
                - text: Variety added Aliens was made by an expert craftsman, suggesting its predecessor was a more artistic endeavor.
                - superscript [ref=f38e1513]:
                  - link "[125]" [ref=f38e1514] [cursor=pointer]:
                    - /url: "#cite_note-VarietyReview-134"
                    - generic: "[125]"
                - link "Sheila Benson" [ref=f38e1515] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Sheila_Benson
                - text: said Aliens was clever and ironically funny, but lacked Alien
                - generic [ref=f38e1516]: "'s"
                - text: pure horror. Benson attributed this to an overabundance of creature effects in the intervening years, particularly the 1982 film
                - link "The Thing" [ref=f38e1518] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/The_Thing_(1982_film)
                - text: (which, Benson said, took alien monstrosities to an extreme).
                - superscript [ref=f38e1519]:
                  - link "[127]" [ref=f38e1520] [cursor=pointer]:
                    - /url: "#cite_note-LAtimesReview-136"
                    - generic: "[127]"
              - paragraph [ref=f38e1521]:
                - text: According to
                - link "Rick Kogan" [ref=f38e1522] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Rick_Kogan
                - text: ", Aliens demonstrated that science-fiction horror could still be entertaining after many poorly received Alien-derived films."
                - superscript [ref=f38e1523]:
                  - link "[128]" [ref=f38e1524] [cursor=pointer]:
                    - /url: "#cite_note-ChicagoTribuneKogan-137"
                    - generic: "[128]"
                - link "Dave Kehr" [ref=f38e1525] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Dave_Kehr
                - text: and
                - link "Richard Schickel" [ref=f38e1526] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Richard_Schickel
                - text: called it a rare sequel which surpassed the original, and Kehr appreciated the action used to develop the characters. Schickel wrote that the film had evolved from Alien, giving Weaver new emotional depths.
                - superscript [ref=f38e1527]:
                  - link "[126]" [ref=f38e1528] [cursor=pointer]:
                    - /url: "#cite_note-TimeSchickelPage1-135"
                    - generic: "[126]"
                - superscript [ref=f38e1529]:
                  - link "[129]" [ref=f38e1530] [cursor=pointer]:
                    - /url: "#cite_note-Kehr_review-138"
                    - generic: "[129]"
                - link "Jay Scott" [ref=f38e1531] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Jay_Scott
                - text: said Cameron had redefined the war film, combining Rambo with
                - link "Star Wars" [ref=f38e1533] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Star_Wars
                - text: .
                - superscript [ref=f38e1534]:
                  - link "[130]" [ref=f38e1535] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEScott1986D9-139"
                    - generic: "[130]"
                - text: Kogan agreed Cameron possessed a knack for action pacing and excitement, but Kehr believed Cameron pushed some elements beyond believability.
                - superscript [ref=f38e1536]:
                  - link "[128]" [ref=f38e1537] [cursor=pointer]:
                    - /url: "#cite_note-ChicagoTribuneKogan-137"
                    - generic: "[128]"
                - superscript [ref=f38e1538]:
                  - link "[129]" [ref=f38e1539] [cursor=pointer]:
                    - /url: "#cite_note-Kehr_review-138"
                    - generic: "[129]"
              - paragraph [ref=f38e1540]:
                - link "Roger Ebert" [ref=f38e1541] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Roger_Ebert
                - text: called the last hour "painfully, unremittingly intense" in horror and action, leaving him emotionally drained and unhappy. Ebert believed it could not be defined as entertainment, despite his admiration of the filmmaking craft on display.
                - superscript [ref=f38e1542]:
                  - link "[131]" [ref=f38e1543] [cursor=pointer]:
                    - /url: "#cite_note-RevEbert-140"
                    - generic: "[131]"
                - text: Dennis Fischer wrote for
                - link "The Hollywood Reporter" [ref=f38e1545] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/The_Hollywood_Reporter
                - text: that the unrelenting scenes of action and suspense worked for Aliens as they had in The Terminator; tension was created by placing the characters in successive, increasingly difficult situations.
                - superscript [ref=f38e1546]:
                  - link "[132]" [ref=f38e1547] [cursor=pointer]:
                    - /url: "#cite_note-THRReview-141"
                    - generic: "[132]"
                - link "Gene Siskel" [ref=f38e1548] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Gene_Siskel
                - text: described the film as "one extremely violent, protracted attack on the senses".
                - superscript [ref=f38e1549]:
                  - link "[133]" [ref=f38e1550] [cursor=pointer]:
                    - /url: "#cite_note-ReviewSiskel-142"
                    - generic: "[133]"
                - text: In the
                - link "Orlando Sentinel" [ref=f38e1552] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Orlando_Sentinel
                - text: ", Jay Boyar called it the"
                - link "Jaws" [ref=f38e1554] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Jaws_(franchise)
                - text: "of the 1980s: the most \"intensely shocking\" film in years."
                - superscript [ref=f38e1555]:
                  - link "[134]" [ref=f38e1556] [cursor=pointer]:
                    - /url: "#cite_note-ReviewOrlandoSentinel-143"
                    - generic: "[134]"
              - paragraph [ref=f38e1557]:
                - text: Reviewers consistently praised Weaver's performance.
                - superscript [ref=f38e1558]:
                  - link "[125]" [ref=f38e1559] [cursor=pointer]:
                    - /url: "#cite_note-VarietyReview-134"
                    - generic: "[125]"
                - superscript [ref=f38e1560]:
                  - link "[131]" [ref=f38e1561] [cursor=pointer]:
                    - /url: "#cite_note-RevEbert-140"
                    - generic: "[131]"
                - text: Benson called her the "white-hot core" around whose "defiant intelligence" and "sensual athleticism" Aliens was built, and Ripley returned not for vengeance but out of compassion.
                - superscript [ref=f38e1562]:
                  - link "[127]" [ref=f38e1563] [cursor=pointer]:
                    - /url: "#cite_note-LAtimesReview-136"
                    - generic: "[127]"
                - text: Ebert credited Weaver's sympathetic performance with holding Aliens together.
                - superscript [ref=f38e1564]:
                  - link "[131]" [ref=f38e1565] [cursor=pointer]:
                    - /url: "#cite_note-RevEbert-140"
                    - generic: "[131]"
                - text: Kogan compared her to a more attractive
                - link "John Rambo" [ref=f38e1566] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/John_Rambo
                - text: (Sylvester Stallone's action character).
                - superscript [ref=f38e1567]:
                  - link "[128]" [ref=f38e1568] [cursor=pointer]:
                    - /url: "#cite_note-ChicagoTribuneKogan-137"
                    - generic: "[128]"
                - text: Scott agreed, saying Weaver made action stars like Stallone and Schwarzenegger look like male
                - link "pin-up models" [ref=f38e1569] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Pin-up_model
                - text: . He described her as the ultimate adventure heroine, balancing action with femininity and maternal instincts.
                - superscript [ref=f38e1570]:
                  - link "[130]" [ref=f38e1571] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEScott1986D9-139"
                    - generic: "[130]"
                - link "Pauline Kael" [ref=f38e1572] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Pauline_Kael
                - text: was critical of the film overall as too "mechanical", but praised Weaver's physical presence and performance, writing that, without her, Aliens was a subpar
                - link "B picture" [ref=f38e1573] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/B_picture
                - text: .
                - superscript [ref=f38e1574]:
                  - link "[135]" [ref=f38e1575] [cursor=pointer]:
                    - /url: "#cite_note-NewYorkerKael-144"
                    - generic: "[135]"
              - paragraph [ref=f38e1576]:
                - text: Most of the cast was also praised, particularly Biehn, Goldstein, Henriksen, Henn and Reiser
                - superscript [ref=f38e1577]:
                  - link "[125]" [ref=f38e1578] [cursor=pointer]:
                    - /url: "#cite_note-VarietyReview-134"
                    - generic: "[125]"
                - superscript [ref=f38e1579]:
                  - link "[127]" [ref=f38e1580] [cursor=pointer]:
                    - /url: "#cite_note-LAtimesReview-136"
                    - generic: "[127]"
                - superscript [ref=f38e1581]:
                  - link "[131]" [ref=f38e1582] [cursor=pointer]:
                    - /url: "#cite_note-RevEbert-140"
                    - generic: "[131]"
                - text: but Benson noted that less time was spent exploring the new characters than in Alien.
                - superscript [ref=f38e1583]:
                  - link "[127]" [ref=f38e1584] [cursor=pointer]:
                    - /url: "#cite_note-LAtimesReview-136"
                    - generic: "[127]"
                - text: Schickel said Henn played her character as endearingly brave and clever, without self-pity.
                - superscript [ref=f38e1585]:
                  - link "[136]" [ref=f38e1586] [cursor=pointer]:
                    - /url: "#cite_note-TimeSchickelPage5-145"
                    - generic: "[136]"
                - text: Benson praised Horner's "ruminative, intelligent" music,
                - superscript [ref=f38e1587]:
                  - link "[127]" [ref=f38e1588] [cursor=pointer]:
                    - /url: "#cite_note-LAtimesReview-136"
                    - generic: "[127]"
                - text: but Fischer criticized it for borrowing too much from Goldsmith's score and Horner's work on
                - 'link "Star Trek III: The Search for Spock" [ref=f38e1590] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Star_Trek_III:_The_Search_for_Spock
                - text: (1984).
                - superscript [ref=f38e1591]:
                  - link "[132]" [ref=f38e1592] [cursor=pointer]:
                    - /url: "#cite_note-THRReview-141"
                    - generic: "[132]"
            - region "Accolades" [ref=f38e1593]:
              - generic [ref=f38e1594]:
                - heading "Accolades" [level=3] [ref=f38e1595]
                - generic [ref=f38e1596]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=18
              - note [ref=f38e1597]:
                - text: "Further information:"
                - link "List of accolades received by the Alien film series" [ref=f38e1598] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/List_of_accolades_received_by_the_Alien_film_series#Aliens
              - figure "Weaver's (pictured in 1989) Academy Award nomination for Best Actress was considered a milestone when the Academy paid little attention to science fiction." [ref=f38e1599]:
                - link [ref=f38e1600] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:Sigourney_Weaver.jpg
                  - img [ref=f38e1601]
                - generic [ref=f38e1602]:
                  - text: Weaver's (pictured in 1989) Academy Award nomination for Best Actress was considered a milestone when the
                  - link "Academy" [ref=f38e1603] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Academy_of_Motion_Picture_Arts_and_Sciences
                  - text: paid little attention to science fiction.
              - paragraph [ref=f38e1604]:
                - text: Aliens received two awards at the
                - link "1987 Academy Awards" [ref=f38e1605] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/59th_Academy_Awards
                - text: ":"
                - link "Best Sound Effects Editing" [ref=f38e1606] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Academy_Award_for_Best_Sound_Editing
                - text: (
                - link "Don Sharpe" [ref=f38e1607] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Don_Sharpe
                - text: ) and
                - link "Best Visual Effects" [ref=f38e1608] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Academy_Award_for_Best_Visual_Effects
                - text: (Robert Skotak, Stan Winston, John Richardson, Suzanne Benson). Weaver was nominated for
                - link "Best Actress" [ref=f38e1609] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Academy_Award_for_Best_Actress
                - text: ", losing to"
                - link "Marlee Matlin" [ref=f38e1610] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Marlee_Matlin
                - text: for the romantic drama
                - link "Children of a Lesser God" [ref=f38e1612] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Children_of_a_Lesser_God_(film)
                - text: .
                - superscript [ref=f38e1613]:
                  - link "[137]" [ref=f38e1614] [cursor=pointer]:
                    - /url: "#cite_note-Academy1987-146"
                    - generic: "[137]"
                - text: Weaver's was the first Best Actress nomination given for a science-fiction film, at a time when the genre was given little respect, and it remained a rarity for the action or science-fiction genres.
                - superscript [ref=f38e1615]:
                  - link "[138]" [ref=f38e1616] [cursor=pointer]:
                    - /url: "#cite_note-EWWeaverOscar-147"
                    - generic: "[138]"
                - superscript [ref=f38e1617]:
                  - link "[139]" [ref=f38e1618] [cursor=pointer]:
                    - /url: "#cite_note-BuzzFeedOscar-148"
                    - generic: "[139]"
                - superscript [ref=f38e1619]:
                  - link "[140]" [ref=f38e1620] [cursor=pointer]:
                    - /url: "#cite_note-AVClub2016-149"
                    - generic: "[140]"
                - text: "The film garnered four other nominations:"
                - link "Best Original Score" [ref=f38e1621] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Academy_Award_for_Best_Original_Score
                - text: for Horner;
                - link "Best Art Director" [ref=f38e1622] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Academy_Award_for_Best_Production_Design
                - text: for Peter Lamont and Crispian Sallis;
                - link "Best Editing" [ref=f38e1623] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Academy_Award_for_Best_Film_Editing
                - text: for Ray Lovejoy, and
                - link "Best Sound" [ref=f38e1624] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Academy_Award_for_Best_Sound
                - text: for Graham V. Hartstone, Nicolas Le Messurier, Michael A. Carter, and Roy Charman.
                - superscript [ref=f38e1625]:
                  - link "[137]" [ref=f38e1626] [cursor=pointer]:
                    - /url: "#cite_note-Academy1987-146"
                    - generic: "[137]"
                - text: At the
                - link "44th Golden Globe Awards" [ref=f38e1627] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/44th_Golden_Globe_Awards
                - text: ", Weaver was nominated for"
                - link "Best Actress in a Drama" [ref=f38e1628] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Golden_Globe_Award_for_Best_Actress_in_a_Motion_Picture_–_Drama
                - text: .
                - superscript [ref=f38e1629]:
                  - link "[141]" [ref=f38e1630] [cursor=pointer]:
                    - /url: "#cite_note-GoldenGlobes1987-150"
                    - generic: "[141]"
              - paragraph [ref=f38e1631]:
                - text: At the
                - link "40th British Academy Film Awards" [ref=f38e1632] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/40th_British_Academy_Film_Awards
                - text: ", Aliens won the award for"
                - link "Best Special Visual Effects" [ref=f38e1633] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/BAFTA_Award_for_Best_Special_Visual_Effects
                - text: "and three other nominations:"
                - link "Best Production Design" [ref=f38e1634] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/BAFTA_Award_for_Best_Production_Design
                - text: ","
                - link "Best Makeup and Hair" [ref=f38e1635] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/BAFTA_Award_for_Best_Makeup_and_Hair
                - text: for Peter Robb King, and
                - link "Best Sound" [ref=f38e1636] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/BAFTA_Award_for_Best_Sound
                - text: .
                - superscript [ref=f38e1637]:
                  - link "[142]" [ref=f38e1638] [cursor=pointer]:
                    - /url: "#cite_note-BAFTA-151"
                    - generic: "[142]"
                - text: At the
                - link "14th Saturn Awards" [ref=f38e1639] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/14th_Saturn_Awards
                - text: ", Aliens received eight awards:"
                - link "Best Science Fiction Film" [ref=f38e1640] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Saturn_Award_for_Best_Science_Fiction_Film
                - text: ","
                - link "Best Actress" [ref=f38e1641] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Saturn_Award_for_Best_Actress
                - text: (Weaver),
                - link "Best Performance by a Young Actor" [ref=f38e1642] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Saturn_Award_for_Best_Performance_by_a_Younger_Actor
                - text: (Henn),
                - link "Best Supporting Actress" [ref=f38e1643] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Saturn_Award_for_Best_Supporting_Actress
                - text: (Goldstein),
                - link "Best Supporting Actor" [ref=f38e1644] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Saturn_Award_for_Best_Supporting_Actor
                - text: (Paxton),
                - link "Best Special Effects" [ref=f38e1645] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Saturn_Award_for_Best_Special_Effects
                - text: (Winston and the L.A. Effects Group) and
                - link "Best Director" [ref=f38e1646] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Saturn_Award_for_Best_Director
                - text: and
                - link "Best Writing" [ref=f38e1647] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Saturn_Award_for_Best_Writing
                - text: (both for Cameron).
                - superscript [ref=f38e1648]:
                  - link "[143]" [ref=f38e1649] [cursor=pointer]:
                    - /url: "#cite_note-SaturnAwards-152"
                    - generic: "[143]"
                - text: It received a
                - link "Hugo Award" [ref=f38e1650] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hugo_Award
                - text: for
                - link "Best Dramatic Presentation" [ref=f38e1651] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hugo_Award_for_Best_Dramatic_Presentation
                - text: .
                - superscript [ref=f38e1652]:
                  - link "[144]" [ref=f38e1653] [cursor=pointer]:
                    - /url: "#cite_note-HugoAwards-153"
                    - generic: "[144]"
          - region "Post-release" [ref=f38e1654]:
            - generic [ref=f38e1655]:
              - heading "Post-release" [level=2] [ref=f38e1656]
              - generic [ref=f38e1657]:
                - link "edit":
                  - /url: /w/index.php?title=Aliens_(film)&action=edit&section=19
            - region "Home media" [ref=f38e1658]:
              - generic [ref=f38e1659]:
                - heading "Home media" [level=3] [ref=f38e1660]
                - generic [ref=f38e1661]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=20
              - paragraph [ref=f38e1662]:
                - text: Aliens was released on
                - link "VHS" [ref=f38e1663] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/VHS
                - text: in February 1987.
                - superscript [ref=f38e1664]:
                  - link "[145]" [ref=f38e1665] [cursor=pointer]:
                    - /url: "#cite_note-LATimesVHS-154"
                    - generic: "[145]"
                - superscript [ref=f38e1666]:
                  - link "[146]" [ref=f38e1667] [cursor=pointer]:
                    - /url: "#cite_note-LATimesVHS2-155"
                    - generic: "[146]"
                - text: A modified cut, including scenes deleted from the theatrical release, was broadcast on
                - link "CBS" [ref=f38e1668] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/CBS
                - text: in 1989, and a further extended edition with more deleted scenes, including the opening scene of Newt's family investigating the derelict spacecraft, was released on
                - link "LaserDisc" [ref=f38e1669] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/LaserDisc
                - text: in 1991. The extended cut is 157
                - text: minutes long, 20 minutes longer than the theatrical cut, and Cameron has stated it is his preferred version.
                - superscript [ref=f38e1671]:
                  - link "[25]" [ref=f38e1672] [cursor=pointer]:
                    - /url: "#cite_note-IGNDVD2003-28"
                    - generic: "[25]"
                - superscript [ref=f38e1673]:
                  - link "[147]" [ref=f38e1674] [cursor=pointer]:
                    - /url: "#cite_note-EWTheAlienLegacy-156"
                    - generic: "[147]"
                - superscript [ref=f38e1675]:
                  - link "[148]" [ref=f38e1676] [cursor=pointer]:
                    - /url: "#cite_note-ScreenRantCameronXTND-157"
                    - generic: "[148]"
              - paragraph [ref=f38e1677]:
                - text: The extended edition was released on VHS and
                - link "DVD" [ref=f38e1678] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/DVD-Video
                - text: in 1999 as part of the Alien Legacy
                - link "box set" [ref=f38e1679] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Box_set
                - text: "with the other three available Alien films: Alien,"
                - link "Alien 3" [ref=f38e1681] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Alien_3
                - text: (1992) and
                - link "Alien Resurrection" [ref=f38e1683] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Alien_Resurrection
                - text: (1997).
                - superscript [ref=f38e1684]:
                  - link "[147]" [ref=f38e1685] [cursor=pointer]:
                    - /url: "#cite_note-EWTheAlienLegacy-156"
                    - generic: "[147]"
                - text: The DVD version was also sold separately, and both versions included additional behind-the-scenes footage.
                - superscript [ref=f38e1686]:
                  - link "[149]" [ref=f38e1687] [cursor=pointer]:
                    - /url: "#cite_note-IGNDVD1999-158"
                    - generic: "[149]"
                - text: The 2003 Alien Quadrilogy nine-DVD box set included all four films and an additional disc for each film with behind-the-scenes footage and
                - link "featurettes" [ref=f38e1688] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Featurette
                - text: "(including a three-hour documentary, Superior Firepower: The Making of Aliens), and theatrical and extended cuts of each film. The Aliens disc included commentary by cast and crew members, including Cameron; Weaver did not participate. Each film was sold separately (including its bonus disc) in 2004."
                - superscript [ref=f38e1689]:
                  - link "[25]" [ref=f38e1690] [cursor=pointer]:
                    - /url: "#cite_note-IGNDVD2003-28"
                    - generic: "[25]"
                - superscript [ref=f38e1691]:
                  - link "[150]" [ref=f38e1692] [cursor=pointer]:
                    - /url: "#cite_note-IndieWireDocu-159"
                    - generic: "[150]"
              - paragraph [ref=f38e1693]:
                - text: Aliens was released on
                - link "Blu-ray" [ref=f38e1694] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Blu-ray
                - text: in 2010 as part of the Alien Anthology box set with remastered footage, theatrical and extended versions, and featurettes found in earlier releases. The film was released separately on Blu-ray in 2011.
                - superscript [ref=f38e1695]:
                  - link "[151]" [ref=f38e1696] [cursor=pointer]:
                    - /url: "#cite_note-IGNBluRay2010-160"
                    - generic: "[151]"
                - superscript [ref=f38e1697]:
                  - link "[152]" [ref=f38e1698] [cursor=pointer]:
                    - /url: "#cite_note-IGNBluRay2011-161"
                    - generic: "[152]"
                - text: For its 30th anniversary in 2016, Aliens was released on Blu-ray and digital download, featuring a new interview with Cameron about his inspirations for the film. In addition to the theatrical and extended versions, the release contained a limited-edition lithograph of Ripley in battle with the alien queen, an art book focused on the Aliens comic books by
                - link "Dark Horse Comics" [ref=f38e1699] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Dark_Horse_Comics
                - text: ", and collectible cards with concept art by Cameron."
                - superscript [ref=f38e1700]:
                  - link "[153]" [ref=f38e1701] [cursor=pointer]:
                    - /url: "#cite_note-EWComicCon-162"
                    - generic: "[153]"
                - text: A limited-edition, 75-copy
                - link "vinyl" [ref=f38e1702] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Phonograph_record
                - text: soundtrack was also released that year.
                - superscript [ref=f38e1703]:
                  - link "[154]" [ref=f38e1704] [cursor=pointer]:
                    - /url: "#cite_note-DOGMerch-163"
                    - generic: "[154]"
                - text: A
                - link "4K Ultra HD" [ref=f38e1705] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/4K_Ultra_HD
                - text: remastered Collector's Edition of Aliens was made available for digital release in December 2023, followed by a
                - link "4K Ultra HD Blu-ray" [ref=f38e1706] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/4K_Ultra_HD_Blu-ray
                - text: release in March 2024.
                - superscript [ref=f38e1707]:
                  - link "[155]" [ref=f38e1708] [cursor=pointer]:
                    - /url: "#cite_note-IGN4k-164"
                    - generic: "[155]"
                - text: This release received some criticism for the use of artificial intelligence to improve the image quality, which resulted in some overly smooth and uncanny results.
                - superscript [ref=f38e1709]:
                  - link "[156]" [ref=f38e1710] [cursor=pointer]:
                    - /url: "#cite_note-NYTimesUpscaling-165"
                    - generic: "[156]"
                - superscript [ref=f38e1711]:
                  - link "[157]" [ref=f38e1712] [cursor=pointer]:
                    - /url: "#cite_note-aftermath-166"
                    - generic: "[157]"
            - region "Other media" [ref=f38e1713]:
              - generic [ref=f38e1714]:
                - heading "Other media" [level=3] [ref=f38e1715]
                - generic [ref=f38e1716]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=21
              - note [ref=f38e1717]:
                - text: "See also:"
                - link "Aliens franchise" [ref=f38e1718] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Alien_(franchise)
                - text: ","
                - link "Aliens video games" [ref=f38e1719] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/List_of_Alien,_Predator,_and_Alien_vs._Predator_games
                - text: ", and"
                - link "Aliens comic books" [ref=f38e1720] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Aliens_(Dark_Horse_Comics_line)
              - paragraph [ref=f38e1721]:
                - text: Toy company
                - link "Kenner Products" [ref=f38e1722] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Kenner_Products
                - text: attempted to release figures based on Alien in 1979, but only an alien action figure was released, which was quickly withdrawn when it was deemed too frightening for children. Aliens was considered a different prospect (despite its adult-oriented content), since it focused on action and featured marines (instead of ordinary workers) fighting a large number of aliens. The toys were intended to tie into Operation Aliens (a children's cartoon scheduled for release in 1992, alongside Alien 3) and a series of mini-comics by Dark Horse Comics.
                - superscript [ref=f38e1723]:
                  - link "[158]" [ref=f38e1724] [cursor=pointer]:
                    - /url: "#cite_note-AlienMarketing-167"
                    - generic: "[158]"
                - superscript [ref=f38e1725]:
                  - link "[159]" [ref=f38e1726] [cursor=pointer]:
                    - /url: "#cite_note-ComicsAllianceKenner-168"
                    - generic: "[159]"
                - text: Since its release, Aliens has appeared across a variety of merchandise, including action figures,
                - superscript [ref=f38e1727]:
                  - link "[159]" [ref=f38e1728] [cursor=pointer]:
                    - /url: "#cite_note-ComicsAllianceKenner-168"
                    - generic: "[159]"
                - link "punching bags" [ref=f38e1729] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Punching_bag
                - text: ","
                - superscript [ref=f38e1730]:
                  - link "[154]" [ref=f38e1731] [cursor=pointer]:
                    - /url: "#cite_note-DOGMerch-163"
                    - generic: "[154]"
                - text: clothing,
                - superscript [ref=f38e1732]:
                  - link "[154]" [ref=f38e1733] [cursor=pointer]:
                    - /url: "#cite_note-DOGMerch-163"
                    - generic: "[154]"
                - text: and board games.
                - superscript [ref=f38e1734]:
                  - link "[160]" [ref=f38e1735] [cursor=pointer]:
                    - /url: "#cite_note-VentureBeatMerch-169"
                    - generic: "[160]"
                - link "McFarlane Toys" [ref=f38e1736] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/McFarlane_Toys
                - text: released figures for Hicks, the alien, and the alien queen in the early 2000s.
                - superscript [ref=f38e1737]:
                  - link "[161]" [ref=f38e1738] [cursor=pointer]:
                    - /url: "#cite_note-MCFarlane1-170"
                    - generic: "[161]"
                - superscript [ref=f38e1739]:
                  - link "[162]" [ref=f38e1740] [cursor=pointer]:
                    - /url: "#cite_note-MCFarlane2-171"
                    - generic: "[162]"
                - superscript [ref=f38e1741]:
                  - link "[163]" [ref=f38e1742] [cursor=pointer]:
                    - /url: "#cite_note-MCFarlane3-172"
                    - generic: "[163]"
                - text: In the late 2010s,
                - link "National Entertainment Collectibles Association" [ref=f38e1743] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/National_Entertainment_Collectibles_Association
                - text: (NECA) released figures based on the film, including Newt,
                - superscript [ref=f38e1744]:
                  - link "[23]" [ref=f38e1745] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingAnne-26"
                    - generic: "[23]"
                - text: Burke, and Cameron dressed as a Colonial Marine.
                - superscript [ref=f38e1746]:
                  - link "[164]" [ref=f38e1747] [cursor=pointer]:
                    - /url: "#cite_note-EWREiserFigure-173"
                    - generic: "[164]"
                - superscript [ref=f38e1748]:
                  - link "[165]" [ref=f38e1749] [cursor=pointer]:
                    - /url: "#cite_note-EWCameronFigure-174"
                    - generic: "[165]"
                - text: NECA also revived the original Kenner designs in 2019, releasing better-quality models.
                - superscript [ref=f38e1750]:
                  - link "[166]" [ref=f38e1751] [cursor=pointer]:
                    - /url: "#cite_note-NECAForbes-175"
                    - generic: "[166]"
                - superscript [ref=f38e1752]:
                  - link "[167]" [ref=f38e1753] [cursor=pointer]:
                    - /url: "#cite_note-NECASuperHeroHype-176"
                    - generic: "[167]"
              - paragraph [ref=f38e1754]:
                - text: Aliens has had several video-game adaptations, beginning with
                - 'link "Aliens: The Computer Game" [ref=f38e1756] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Aliens:_The_Computer_Game
                - text: (1986), which was followed by a separate game, also called
                - 'link "Aliens: The Computer Game" [ref=f38e1758] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Aliens:_The_Computer_Game_(1987_video_game)
                - text: ", in 1987. A"
                - link "side-scroller" [ref=f38e1759] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Side-scroller
                - text: ", Aliens (1987), was released in Japan for the"
                - link "MSX" [ref=f38e1760] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/MSX
                - text: ","
                - superscript [ref=f38e1761]:
                  - link "[168]" [ref=f38e1762] [cursor=pointer]:
                    - /url: "#cite_note-PolyGonGames-177"
                    - generic: "[168]"
                - text: and a 1990 arcade game,
                - link "Aliens" [ref=f38e1764] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Aliens_(1990_video_game)
                - text: ", allowed players to play as Ripley or Hicks against alien variants; some levels required the player to control Newt."
                - superscript [ref=f38e1765]:
                  - link "[168]" [ref=f38e1766] [cursor=pointer]:
                    - /url: "#cite_note-PolyGonGames-177"
                    - generic: "[168]"
                - superscript [ref=f38e1767]:
                  - link "[169]" [ref=f38e1768] [cursor=pointer]:
                    - /url: "#cite_note-DOGArcade-178"
                    - generic: "[169]"
                - 'link "Aliens: A Comic Book Adventure" [ref=f38e1770] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Aliens:_A_Comic_Book_Adventure
                - text: ", an adventure game focusing on puzzles, was released in 1995."
                - superscript [ref=f38e1771]:
                  - link "[168]" [ref=f38e1772] [cursor=pointer]:
                    - /url: "#cite_note-PolyGonGames-177"
                    - generic: "[168]"
                - superscript [ref=f38e1773]:
                  - link "[170]" [ref=f38e1774] [cursor=pointer]:
                    - /url: "#cite_note-SlashFilmGamesPage1-179"
                    - generic: "[170]"
                - text: A first-person shooter,
                - link "Alien Trilogy" [ref=f38e1776] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Alien_Trilogy
                - text: (1996), is based on Alien, Aliens, and Alien 3.
                - superscript [ref=f38e1777]:
                  - link "[168]" [ref=f38e1778] [cursor=pointer]:
                    - /url: "#cite_note-PolyGonGames-177"
                    - generic: "[168]"
                - superscript [ref=f38e1779]:
                  - link "[171]" [ref=f38e1780] [cursor=pointer]:
                    - /url: "#cite_note-SlashFilmGamesPage2-180"
                    - generic: "[171]"
                - link "Aliens Online" [ref=f38e1782] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Aliens_Online
                - text: (1998) was an online game which allowed players to play as Colonial Marines or aliens.
                - superscript [ref=f38e1783]:
                  - link "[168]" [ref=f38e1784] [cursor=pointer]:
                    - /url: "#cite_note-PolyGonGames-177"
                    - generic: "[168]"
                - 'link "Aliens: Colonial Marines" [ref=f38e1786] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Aliens:_Colonial_Marines
                - text: (2013) is a first-person shooter and a
                - link "canonical" [ref=f38e1787] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Fictional_canon
                - text: sequel of Aliens, focusing on the marines sent to search for Ripley's expedition.
                - superscript [ref=f38e1788]:
                  - link "[168]" [ref=f38e1789] [cursor=pointer]:
                    - /url: "#cite_note-PolyGonGames-177"
                    - generic: "[168]"
                - superscript [ref=f38e1790]:
                  - link "[170]" [ref=f38e1791] [cursor=pointer]:
                    - /url: "#cite_note-SlashFilmGamesPage1-179"
                    - generic: "[170]"
                - text: Several other games have the Aliens brand or are side stories or sequels to the film's events, and the
                - link "Aliens vs. Predator game series" [ref=f38e1792] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Alien_vs._Predator#Video_games
                - text: .
                - superscript [ref=f38e1793]:
                  - link "[d]" [ref=f38e1794] [cursor=pointer]:
                    - /url: "#cite_note-182"
                    - generic: "[d]"
              - paragraph [ref=f38e1795]:
                - text: A novelization by
                - link "Alan Dean Foster" [ref=f38e1796] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Alan_Dean_Foster
                - text: was released alongside the film.
                - superscript [ref=f38e1797]:
                  - link "[173]" [ref=f38e1798] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEFoster1986-183"
                    - generic: "[173]"
                - superscript [ref=f38e1799]:
                  - link "[174]" [ref=f38e1800] [cursor=pointer]:
                    - /url: "#cite_note-LOCNovel-184"
                    - generic: "[174]"
                - text: Comic books based on (and continuing) the story of Aliens have been published (primarily by Dark Horse Comics) since 1988, including crossovers of the titular aliens with popular franchises, such as
                - link "Predator" [ref=f38e1802] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Predator_(franchise)
                - text: (creating a derivative
                - link "Alien vs. Predator" [ref=f38e1804] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Alien_vs._Predator
                - text: franchise),
                - link "Terminator" [ref=f38e1806] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Terminator_(franchise)
                - text: ", and"
                - link "Superman" [ref=f38e1808] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Superman_(franchise)
                - text: .
                - superscript [ref=f38e1809]:
                  - link "[e]" [ref=f38e1810] [cursor=pointer]:
                    - /url: "#cite_note-194"
                    - generic: "[e]"
                - text: Reebok's boots designed for Ripley became available to the public in 2016; other versions included boots based on the power loader, Bishop, the Colonial Marines and the alien queen.
                - superscript [ref=f38e1811]:
                  - link "[95]" [ref=f38e1812] [cursor=pointer]:
                    - /url: "#cite_note-Reebok-101"
                    - generic: "[95]"
                - superscript [ref=f38e1813]:
                  - link "[154]" [ref=f38e1814] [cursor=pointer]:
                    - /url: "#cite_note-DOGMerch-163"
                    - generic: "[154]"
                - text: Rinzler published The Making of Aliens, a 300-page behind-the-scenes book with cast and crew interviews and previously unseen photographs, in 2020.
                - superscript [ref=f38e1815]:
                  - link "[96]" [ref=f38e1816] [cursor=pointer]:
                    - /url: "#cite_note-SyFyMakingOfBook-102"
                    - generic: "[96]"
                - text: Operation Aliens, a board game, was released in 1992. Players are cast as a Colonial Marine or Ripley and tasked with finding a self-destruct code to destroy an infested spaceship.
                - superscript [ref=f38e1817]:
                  - link "[160]" [ref=f38e1818] [cursor=pointer]:
                    - /url: "#cite_note-VentureBeatMerch-169"
                    - generic: "[160]"
                - superscript [ref=f38e1819]:
                  - link "[184]" [ref=f38e1820] [cursor=pointer]:
                    - /url: "#cite_note-KotakuBoardGame-195"
                    - generic: "[184]"
          - region "Themes" [ref=f38e1821]:
            - generic [ref=f38e1822]:
              - heading "Themes" [level=2] [ref=f38e1823]: Themes
              - generic [ref=f38e1824]:
                - link "edit":
                  - /url: /w/index.php?title=Aliens_(film)&action=edit&section=22
            - region "Motherhood" [ref=f38e1825]:
              - generic [ref=f38e1826]:
                - heading "Motherhood" [level=3] [ref=f38e1827]
                - generic [ref=f38e1828]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=23
              - paragraph [ref=f38e1829]:
                - text: A central theme of Aliens is motherhood.
                - superscript [ref=f38e1830]:
                  - link "[38]" [ref=f38e1831] [cursor=pointer]:
                    - /url: "#cite_note-IGNMakingOf-41"
                    - generic: "[38]"
                - superscript [ref=f38e1832]:
                  - link "[185]" [ref=f38e1833] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingThemes-196"
                    - generic: "[185]"
                - text: Alien can be seen as a metaphor for childbirth, but Aliens focuses on Ripley's maternal feelings for Newt. A scene cut from the theatrical release depicts Ripley learning her child died while she was in stasis, helping explain Ripley's motherly attention for Newt. Newt has also lost everything of value, and they form a new family from the remnants of their old ones.
                - superscript [ref=f38e1834]:
                  - link "[136]" [ref=f38e1835] [cursor=pointer]:
                    - /url: "#cite_note-TimeSchickelPage5-145"
                    - generic: "[136]"
                - superscript [ref=f38e1836]:
                  - link "[185]" [ref=f38e1837] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingThemes-196"
                    - generic: "[185]"
                - text: This relationship is mirrored by the alien queen, mother of the alien creatures.
                - superscript [ref=f38e1838]:
                  - link "[185]" [ref=f38e1839] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingThemes-196"
                    - generic: "[185]"
                - superscript [ref=f38e1840]:
                  - link "[186]" [ref=f38e1841] [cursor=pointer]:
                    - /url: "#cite_note-DOGThemes-197"
                    - generic: "[186]"
                - text: There are no paternal figures; both are single mothers, defending their young. The alien queen seeks revenge against Ripley, who destroyed her brood and her means of reproduction.
                - superscript [ref=f38e1842]:
                  - link "[126]" [ref=f38e1843] [cursor=pointer]:
                    - /url: "#cite_note-TimeSchickelPage1-135"
                    - generic: "[126]"
                - superscript [ref=f38e1844]:
                  - link "[185]" [ref=f38e1845] [cursor=pointer]:
                    - /url: "#cite_note-BloodyDisgustingThemes-196"
                    - generic: "[185]"
                - text: According to Richard Schickel, Alien is about survival; Aliens is about fighting to ensure someone else's survival.
                - superscript [ref=f38e1846]:
                  - link "[136]" [ref=f38e1847] [cursor=pointer]:
                    - /url: "#cite_note-TimeSchickelPage5-145"
                    - generic: "[136]"
              - paragraph [ref=f38e1848]:
                - text: Authors Tammy Ostrander and Susan Yunis believed Newt's capture by the aliens forces Ripley to realize she is willing to die to save her, demonstrating a selfless motherhood, unlike the queen's selfish motherhood.
                - superscript [ref=f38e1849]:
                  - link "[187]" [ref=f38e1850] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEOstranderYunis200373-198"
                    - generic: "[187]"
                - text: Writing for the Los Angeles Times, Nancy Weber wrote that as a mother, she saw in Aliens the constant vigilance required to protect her child from predators, sexism, and threats to childhood innocence.
                - superscript [ref=f38e1851]:
                  - link "[188]" [ref=f38e1852] [cursor=pointer]:
                    - /url: "#cite_note-LATimesWebber-199"
                    - generic: "[188]"
                - text: Leilani Nishime believed despite the focus on motherhood, the nuclear family is represented in Aliens with a mother (Ripley), father (Hicks), daughter (Newt), and a loyal, self-sacrificing dog (Bishop).
                - superscript [ref=f38e1853]:
                  - link "[189]" [ref=f38e1854] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTENishime200539-200"
                    - generic: "[189]"
              - paragraph [ref=f38e1855]:
                - text: According to Charles Berg, the depictions of aliens in science fiction that became more popular during the 1980s represented American fears of immigrants (the "other"). In Aliens, this can be seen in the white-skinned single mother (Ripley) confronting the dark-skinned alien queen with an endless brood.
                - superscript [ref=f38e1856]:
                  - link "[190]" [ref=f38e1857] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAscárate200457-201"
                    - generic: "[190]"
                - text: Ostrander and Yunis also identified fears of overcrowding, dwindling resources, and pollution, suggesting the alien queen demonizes motherhood and makes it less attractive. She represents mindless, unchecked maternal instinct spawning armies of children, regardless of the lives which must be sacrificed to ensure their survival. Despite imminent destruction by the colony exploding, the queen continues to reproduce.
                - superscript [ref=f38e1858]:
                  - link "[191]" [ref=f38e1859] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEOstranderYunis200369-202"
                    - generic: "[191]"
                - text: The aliens' life cycle taints the reproductive cycle. Creation involves rape, and birth involves a violent death.
                - superscript [ref=f38e1860]:
                  - link "[192]" [ref=f38e1861] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEOstranderYunis200370-203"
                    - generic: "[192]"
                - text: In destroying the aliens and their queen, Ripley rejects the unchecked proliferation of their species and sets an example for her own.
                - superscript [ref=f38e1862]:
                  - link "[193]" [ref=f38e1863] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEOstranderYunis200372-204"
                    - generic: "[193]"
            - region "Masculinity and femininity" [ref=f38e1864]:
              - generic [ref=f38e1865]:
                - heading "Masculinity and femininity" [level=3] [ref=f38e1866]
                - generic [ref=f38e1867]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=24
              - figure "Ripley was often compared to the era's masculine heroes, including Sylvester Stallone's John Rambo." [ref=f38e1868]:
                - link "Sylvester Stallone as Rambo, holding a gun" [ref=f38e1869] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:John_Rambo.jpg
                  - img "Sylvester Stallone as Rambo, holding a gun" [ref=f38e1870]
                - generic [ref=f38e1871]:
                  - text: Ripley was often compared to the era's masculine heroes, including
                  - link "Sylvester Stallone" [ref=f38e1872] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Sylvester_Stallone
                  - text: "'s"
                  - link "John Rambo" [ref=f38e1873] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/John_Rambo
                  - text: .
              - paragraph [ref=f38e1874]:
                - text: Ripley has been compared to John Rambo and dubbed Ramboette, Rambette, Fembo, Ramboline; Weaver called herself Rambolina.
                - superscript [ref=f38e1875]:
                  - link "[39]" [ref=f38e1876] [cursor=pointer]:
                    - /url: "#cite_note-ABCNews30Things-42"
                    - generic: "[39]"
                - superscript [ref=f38e1877]:
                  - link "[194]" [ref=f38e1878] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1987May03-205"
                    - generic: "[194]"
                - superscript [ref=f38e1879]:
                  - link "[195]" [ref=f38e1880] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrown19968,_58-206"
                    - generic: "[195]"
                - link "Mary Lee Settle" [ref=f38e1881] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Mary_Lee_Settle
                - text: said females in television and film had evolved from escapist fantasy to more accurately reflect their audiences. A gun, which can be seen as a
                - link "phallic" [ref=f38e1882] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Phallic
                - text: symbol, has a different meaning when wielded by Weaver.
                - superscript [ref=f38e1883]:
                  - link "[194]" [ref=f38e1884] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1987May03-205"
                    - generic: "[194]"
                - text: Schickel described Ripley as transcending the customary boundaries imposed on her gender, where females serve the male hero. In Aliens, the male characters are neutralized by the climax and Ripley faces the queen alone.
                - superscript [ref=f38e1885]:
                  - link "[32]" [ref=f38e1886] [cursor=pointer]:
                    - /url: "#cite_note-TimeSchickelPage3-35"
                    - generic: "[32]"
                - text: Cameron said he does not like cowardly female characters and removes their expected protectors to force them to fend for themselves. He called the overuse of male heroes "commercially shortsighted" in an industry whose audience is 50-percent female, and where "80 percent of the time, it's women who decide which film to see".
                - superscript [ref=f38e1887]:
                  - link "[32]" [ref=f38e1888] [cursor=pointer]:
                    - /url: "#cite_note-TimeSchickelPage3-35"
                    - generic: "[32]"
                - superscript [ref=f38e1889]:
                  - link "[34]" [ref=f38e1890] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1985July9-37"
                    - generic: "[34]"
              - paragraph [ref=f38e1891]:
                - text: The growth of female-led action films after the success of Aliens reflects the change in women's roles and the divide between professional critics (who perceive a masculinization of the heroine) and audiences that—regardless of gender—embrace, emulate, and quote Ripley.
                - superscript [ref=f38e1892]:
                  - link "[196]" [ref=f38e1893] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrown199652,_69-207"
                    - generic: "[196]"
                - text: The hyper-masculine heroes played by Schwarzenegger, Stallone, and
                - link "Jean-Claude Van Damme" [ref=f38e1894] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Jean-Claude_Van_Damme
                - text: were replaced by independent women capable of defending themselves and defeating villains in films such as
                - link "The Silence of the Lambs" [ref=f38e1896] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/The_Silence_of_the_Lambs_(film)
                - text: (1991) and Cameron's
                - 'link "Terminator 2: Judgment Day" [ref=f38e1898] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Terminator_2:_Judgment_Day
                - text: (1991).
                - superscript [ref=f38e1899]:
                  - link "[197]" [ref=f38e1900] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrown199652-208"
                    - generic: "[197]"
                - text: These female characters often perform stereotypical male actions, and have muscular physiques rather than feminine "soft" bodies.
                - superscript [ref=f38e1901]:
                  - link "[198]" [ref=f38e1902] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrown199660-209"
                    - generic: "[198]"
                - text: When Ripley has seized command of the marines and is no longer a passive outsider in Aliens, the traditional male hero (Hicks) instructs her in the use of their weapons.
                - superscript [ref=f38e1903]:
                  - link "[199]" [ref=f38e1904] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrown199661-210"
                    - generic: "[199]"
                - text: The comparison of Ripley to Rambo conflates her with the male, musclebound, gun-wielding action hero.
                - superscript [ref=f38e1905]:
                  - link "[200]" [ref=f38e1906] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrown19968-211"
                    - generic: "[200]"
                - text: To balance her masculine traits, Cameron gives Ripley maternal instincts; this counters homophobic audiences, who might see a masculinized female as
                - link "lesbian or butch" [ref=f38e1907] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Butch_and_femme
                - text: .
                - superscript [ref=f38e1908]:
                  - link "[201]" [ref=f38e1909] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrown199662-212"
                    - generic: "[201]"
                - text: These traits are further offset by the more openly masculine Vasquez, a minor character. Vasquez (who has short hair and bigger muscles) is introduced to the audience by working out, and is asked if she has ever been mistaken for a man.
                - superscript [ref=f38e1910]:
                  - link "[202]" [ref=f38e1911] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBrown199662–63-213"
                    - generic: "[202]"
                - text: Weber appreciated the change in female characters between the films, contrasting Alien
                - generic [ref=f38e1912]: "'s"
                - text: hysterical Lambert with the tough Vasquez (who sacrifices herself for her team, not only for the protagonist).
                - superscript [ref=f38e1913]:
                  - link "[188]" [ref=f38e1914] [cursor=pointer]:
                    - /url: "#cite_note-LATimesWebber-199"
                    - generic: "[188]"
            - region "War and trauma" [ref=f38e1915]:
              - generic [ref=f38e1916]:
                - heading "War and trauma" [level=3] [ref=f38e1917]
                - generic [ref=f38e1918]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=25
              - paragraph [ref=f38e1919]:
                - text: Aliens has been described as an allegory for the Vietnam War; the marines (like the United States) have superior weaponry and technology that proves largely ineffective against an unseen, local enemy.
                - superscript [ref=f38e1920]:
                  - link "[34]" [ref=f38e1921] [cursor=pointer]:
                    - /url: "#cite_note-NYTimes1985July9-37"
                    - generic: "[34]"
                - superscript [ref=f38e1922]:
                  - link "[92]" [ref=f38e1923] [cursor=pointer]:
                    - /url: "#cite_note-Telegraph11Things-98"
                    - generic: "[92]"
                - text: Like some Vietnam veterans, Ripley developed
                - link "post-traumatic stress disorder" [ref=f38e1924] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Post-traumatic_stress_disorder
                - text: after the events of Alien.
                - superscript [ref=f38e1925]:
                  - link "[203]" [ref=f38e1926] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGallardoSmith200481-214"
                    - generic: "[203]"
                - text: Writer Joe Abbott contrasted the depiction of the military in Aliens to the 1954 science-fiction film
                - link "Them!" [ref=f38e1928] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Them!
                - text: In both films, humans are beset by a monstrous invasion; in Them!, the military is the hero despite its responsibility for the infestation. Abbott said its post-
                - link "World War II" [ref=f38e1929] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/World_War_II
                - text: American setting depicts a competent military and a state authority that demands (and receives) the compliance of its citizens. The image of the post-Vietnam military is tarnished and scrutinized; in Aliens, it is ill-equipped, bumbling, and incapable of combating the threat posed by the alien creatures. Citizen cooperation can no longer be demanded or expected, and it is Ripley, an independent contractor from outside the state and military infrastructures, who saves the day.
                - superscript [ref=f38e1930]:
                  - link "[204]" [ref=f38e1931] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAbbott199423–25-215"
                    - generic: "[204]"
                - text: Unlike Them!, the military is not at fault for creating the problem in Aliens; it is the Weyland-Yutani corporation ("the company"). The power of the state has been superseded by the corporation, which also demands conformity for rewards and advancement and reflects a growing mistrust of
                - link "corporatism" [ref=f38e1932] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Corporatism
                - text: ; the company is represented by Burke, a self-interested opportunist.
                - superscript [ref=f38e1933]:
                  - link "[205]" [ref=f38e1934] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAbbott199424-216"
                    - generic: "[205]"
                - text: Ripley is elevated throughout Aliens as she prioritizes the survival and safety of all humans while Burke is often willing to callously sacrifice human life in pursuit of the interests of the company.
                - superscript [ref=f38e1935]:
                  - link "[206]" [ref=f38e1936] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAbbott199424–25-217"
                    - generic: "[206]"
              - paragraph [ref=f38e1937]:
                - text: According to Weaver, Aliens is about confronting trauma to obtain closure.
                - superscript [ref=f38e1938]:
                  - link "[207]" [ref=f38e1939] [cursor=pointer]:
                    - /url: "#cite_note-DOGTrauma-218"
                    - generic: "[207]"
                - text: This may be seen as a reflection of
                - link "Ronald Reagan" [ref=f38e1940] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ronald_Reagan
                - text: "'s United States presidency and a"
                - link "conservatism" [ref=f38e1941] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Conservatism_in_the_United_States
                - text: that believed the hero must return to confront their fears with ethics and morality on their side.
                - superscript [ref=f38e1942]:
                  - link "[208]" [ref=f38e1943] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPalmer2006386-219"
                    - generic: "[208]"
                - superscript [ref=f38e1944]:
                  - link "[209]" [ref=f38e1945] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEGallardoSmith200482-220"
                    - generic: "[209]"
                - text: Comparing Alien with Aliens,
                - link "Roger Luckhurst" [ref=f38e1946] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Roger_Luckhurst
                - text: "said: \"Even if Alien was a piece of leftist science fiction, the core of [its] myth could be inflected the other way. [Cameron's] Aliens would be a defiantly Reaganite version of the story—pumped, militarized, libertarian driven by a staunch defense of the nuclear family.\""
                - superscript [ref=f38e1947]:
                  - link "[210]" [ref=f38e1948] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTELuckhurst201446-221"
                    - generic: "[210]"
                - text: Abbott said Aliens adheres to a
                - link "radical" [ref=f38e1949] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Radical_politics
                - text: ideology and condemns
                - link "centrism" [ref=f38e1950] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Centrism
                - text: ; similar films were popular because they represented audience dissatisfaction with the social status quo.
                - superscript [ref=f38e1951]:
                  - link "[204]" [ref=f38e1952] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAbbott199423–25-215"
                    - generic: "[204]"
                - text: The film places power in the individual (Ripley), instead of institutions like the military, corporations, or the government.
                - superscript [ref=f38e1953]:
                  - link "[211]" [ref=f38e1954] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAbbott199426-222"
                    - generic: "[211]"
                - text: The Bishop character also allows Ripley to confront her distrust of androids that resulted from the deception of Ash (portrayed by Ian Holm) in Alien. Unlike Ash, Bishop is openly an android and conveys both a similarly unassuming personality and a fascination with the alien creatures. Aliens imbues Bishop with a degree of humanity as he volunteers for a potentially suicidal mission. Although the other characters assume he is artificial and thus unafraid, Bishop affirms, "Believe me, I'd prefer not to, I may be synthetic, but I'm not stupid."
                - superscript [ref=f38e1955]:
                  - link "[212]" [ref=f38e1956] [cursor=pointer]:
                    - /url: "#cite_note-DOGBishopTrust-223"
                    - generic: "[212]"
          - region "Legacy" [ref=f38e1957]:
            - generic [ref=f38e1958]:
              - heading "Legacy" [level=2] [ref=f38e1959]
              - generic [ref=f38e1960]:
                - link "edit":
                  - /url: /w/index.php?title=Aliens_(film)&action=edit&section=26
            - region "Cultural influence" [ref=f38e1961]:
              - generic [ref=f38e1962]:
                - heading "Cultural influence" [level=3] [ref=f38e1963]
                - generic [ref=f38e1964]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=27
              - figure "Carrie Henn (pictured in 2016) chose not to pursue acting after appearing in Aliens." [ref=f38e1965]:
                - link "A photograph of Carrie Henn" [ref=f38e1966] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:Carrie_Henn_(28513889272)_cropped.jpg
                  - img "A photograph of Carrie Henn" [ref=f38e1967]
                - generic [ref=f38e1968]: Carrie Henn (pictured in 2016) chose not to pursue acting after appearing in Aliens.
              - paragraph [ref=f38e1969]:
                - text: A cinematic
                - link "touchstone" [ref=f38e1970] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Touchstone_(metaphor)
                - text: ", Aliens has had an enduring influence on filmmaking."
                - superscript [ref=f38e1971]:
                  - link "[f]" [ref=f38e1972] [cursor=pointer]:
                    - /url: "#cite_note-227"
                    - generic: "[f]"
                - text: Elements such as a team of soldiers being dismantled by a villain have been repeated to the point of
                - link "cliché" [ref=f38e1973] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Cliché
                - text: .
                - superscript [ref=f38e1974]:
                  - link "[92]" [ref=f38e1975] [cursor=pointer]:
                    - /url: "#cite_note-Telegraph11Things-98"
                    - generic: "[92]"
                - text: The same is true of Horner's oft-imitated score,
                - superscript [ref=f38e1976]:
                  - link "[71]" [ref=f38e1977] [cursor=pointer]:
                    - /url: "#cite_note-DOGHornerCliche-77"
                    - generic: "[71]"
                - superscript [ref=f38e1978]:
                  - link "[92]" [ref=f38e1979] [cursor=pointer]:
                    - /url: "#cite_note-Telegraph11Things-98"
                    - generic: "[92]"
                - text: which regularly appeared in action-film trailers for the following decade.
                - superscript [ref=f38e1980]:
                  - link "[73]" [ref=f38e1981] [cursor=pointer]:
                    - /url: "#cite_note-HornerEW-79"
                    - generic: "[73]"
                - superscript [ref=f38e1982]:
                  - link "[72]" [ref=f38e1983] [cursor=pointer]:
                    - /url: "#cite_note-HornerVulture-78"
                    - generic: "[72]"
                - text: The film's influence can also be seen in video games' (particularly science-fiction games') ships, armor, and weapons,
                - superscript [ref=f38e1984]:
                  - link "[216]" [ref=f38e1985] [cursor=pointer]:
                    - /url: "#cite_note-DOGVideoGameInfluences-228"
                    - generic: "[216]"
                - superscript [ref=f38e1986]:
                  - link "[217]" [ref=f38e1987] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEJenkinsWeise2009111-229"
                    - generic: "[217]"
                - text: as well as the 1989 Italian film
                - link "Shocking Dark" [ref=f38e1989] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Shocking_Dark
                - text: ", a remake of Aliens that relocates much of the plot and scenes to a"
                - link "Venetian" [ref=f38e1990] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Venice
                - text: setting and incorporates elements of The Terminator; outside Italy, it was released as Terminator II.
                - superscript [ref=f38e1991]:
                  - link "[218]" [ref=f38e1992] [cursor=pointer]:
                    - /url: "#cite_note-DOGItalianRemake-230"
                    - generic: "[218]"
                - text: In
                - 'link "Avengers: Infinity War" [ref=f38e1994] [cursor=pointer]':
                  - /url: //en.wikipedia.org/wiki/Avengers:_Infinity_War
                - text: (2018),
                - link "Spider-Man" [ref=f38e1995] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Peter_Parker_(Marvel_Cinematic_Universe)
                - text: discusses the film with
                - link "Iron Man" [ref=f38e1996] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Tony_Stark_(Marvel_Cinematic_Universe)
                - text: ", and the two use the xenomorph queen's defeat as inspiration for how to kill"
                - link "Ebony Maw" [ref=f38e1997] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ebony_Maw_(Marvel_Cinematic_Universe)
                - text: and free
                - link "Doctor Strange" [ref=f38e1998] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Stephen_Strange_(Marvel_Cinematic_Universe)
                - text: .
                - superscript [ref=f38e1999]:
                  - link "[219]" [ref=f38e2000] [cursor=pointer]:
                    - /url: "#cite_note-231"
                    - generic: "[219]"
              - paragraph [ref=f38e2001]:
                - text: Although The Terminator was a success for Cameron, the critical and commercial success of Aliens made him a blockbuster director. It also expanded the Alien series into a franchise, spanning video games, comic books, and toys; although Ripley and the alien creature originated in Alien, Cameron elaborated on the creature's life cycle, added new characters and factions (such as the Colonial Marines), and extended the films' universe.
                - superscript [ref=f38e2002]:
                  - link "[92]" [ref=f38e2003] [cursor=pointer]:
                    - /url: "#cite_note-Telegraph11Things-98"
                    - generic: "[92]"
                - text: Ripley became a
                - link "post-feminist" [ref=f38e2004] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Post-feminist
                - text: icon, a proactive hero who retained feminine traits.
                - superscript [ref=f38e2005]:
                  - link "[92]" [ref=f38e2006] [cursor=pointer]:
                    - /url: "#cite_note-Telegraph11Things-98"
                    - generic: "[92]"
                - text: Aliens features popular quotes, including Paxton's "Game over, man; game over",
                - superscript [ref=f38e2007]:
                  - link "[215]" [ref=f38e2008] [cursor=pointer]:
                    - /url: "#cite_note-LATimesReunion-226"
                    - generic: "[215]"
                - superscript [ref=f38e2009]:
                  - link "[220]" [ref=f38e2010] [cursor=pointer]:
                    - /url: "#cite_note-UproxxGameOver-232"
                    - generic: "[220]"
                - text: and Weaver's "Get away from her, you bitch," which is considered one of Aliens
                - generic [ref=f38e2011]: "'s"
                - text: most memorable lines and has often been repeated in other media.
                - superscript [ref=f38e2012]:
                  - link "[92]" [ref=f38e2013] [cursor=pointer]:
                    - /url: "#cite_note-Telegraph11Things-98"
                    - generic: "[92]"
                - superscript [ref=f38e2014]:
                  - link "[221]" [ref=f38e2015] [cursor=pointer]:
                    - /url: "#cite_note-THRLegacy-233"
                    - generic: "[221]"
                - text: Aliens was named by director
                - link "Roland Emmerich" [ref=f38e2016] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Roland_Emmerich
                - text: as one of his top ten science-fiction films, alongside Alien.
                - superscript [ref=f38e2017]:
                  - link "[222]" [ref=f38e2018] [cursor=pointer]:
                    - /url: "#cite_note-EmpireEmmerich-234"
                    - generic: "[222]"
              - paragraph [ref=f38e2019]:
                - text: Many cast and crew members reunited at the 2016
                - link "San Diego Comic-Con" [ref=f38e2020] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/San_Diego_Comic-Con
                - text: to celebrate the film's 30th anniversary, including Weaver, Biehn, Paxton, Henriksen, Reiser, Henn, Cameron and Hurd. Cameron said he normally would not participate (and did not do so for The Terminator
                - generic [ref=f38e2021]: "'"
                - text: s anniversary) but he considered Aliens special because of its impact on his career.
                - superscript [ref=f38e2022]:
                  - link "[153]" [ref=f38e2023] [cursor=pointer]:
                    - /url: "#cite_note-EWComicCon-162"
                    - generic: "[153]"
                - superscript [ref=f38e2024]:
                  - link "[215]" [ref=f38e2025] [cursor=pointer]:
                    - /url: "#cite_note-LATimesReunion-226"
                    - generic: "[215]"
                - text: Asked why he thought Aliens
                - generic [ref=f38e2026]: "'"
                - text: "popularity had endured, Cameron said:"
              - blockquote [ref=f38e2027]:
                - paragraph [ref=f38e2028]: I have to take my filmmaker hat off and look at it as a fan and think, "Well, I really like those characters ..." There's certain lines, moments, you remember moments. It's satisfying, it ends in a satisfying way ... But I actually think it's those characters. We can all relate to Hudson running around "What the hell are we gonna do now man? What the fuck we gonna do?" We all know that guy.
              - paragraph [ref=f38e2029]: "Hurd believed that it was the experience itself:"
              - blockquote [ref=f38e2030]:
                - paragraph [ref=f38e2031]:
                  - text: It's a great midnight screening movie because you can talk back to the screen and you can have this group experience. It not only makes you feel something, it makes you cheer, it makes you jump. When you think of all the things that something can do, which is projected on a screen, it ticks all those boxes and it makes you laugh.
                  - superscript [ref=f38e2032]:
                    - link "[223]" [ref=f38e2033] [cursor=pointer]:
                      - /url: "#cite_note-ScreenRantLegacy-235"
                      - generic: "[223]"
              - paragraph [ref=f38e2034]:
                - text: The ensemble cast's popularity led to many members appearing together in later films, including Henriksen, Goldstein, and Paxton in
                - link "Near Dark" [ref=f38e2036] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Near_Dark
                - text: (1987) as well as Goldstein and Rolston in
                - link "Lethal Weapon 2" [ref=f38e2038] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Lethal_Weapon_2
                - text: (1989).
                - superscript [ref=f38e2039]:
                  - link "[51]" [ref=f38e2040] [cursor=pointer]:
                    - /url: "#cite_note-TheDissolve-55"
                    - generic: "[51]"
                - text: Biehn lost a role in Cameron's
                - link "Avatar" [ref=f38e2042] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Avatar_(2009_film)
                - text: (2009) because Weaver had been cast, and the director did not want to create an obvious association with Aliens.
                - superscript [ref=f38e2043]:
                  - link "[10]" [ref=f38e2044] [cursor=pointer]:
                    - /url: "#cite_note-RemarEmpire-13"
                    - generic: "[10]"
                - text: Paxton is also remembered as one of only two actors, along with Lance Henriksen, to play characters killed by an alien, a Terminator (in The Terminator), and a
                - link "Predator" [ref=f38e2045] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Predator_(fictional_species)
                - text: (in 1990's
                - link "Predator 2" [ref=f38e2047] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Predator_2
                - text: ).
                - superscript [ref=f38e2048]:
                  - link "[55]" [ref=f38e2049] [cursor=pointer]:
                    - /url: "#cite_note-DailyBeastPaxton-59"
                    - generic: "[55]"
                - text: Despite her sudden fame, Henn decided not to pursue acting, so that she could remain close to her family. She said some people resented her fame and was uncertain whether people liked her for being in Aliens or for herself. Henn became a teacher; she maintains a relationship with Weaver and kept a framed picture of her and Weaver that the actress had given her after filming was complete.
                - superscript [ref=f38e2050]:
                  - link "[44]" [ref=f38e2051] [cursor=pointer]:
                    - /url: "#cite_note-PeopleHenn-47"
                    - generic: "[44]"
            - region "Critical reassessment" [ref=f38e2052]:
              - generic [ref=f38e2053]:
                - heading "Critical reassessment" [level=3] [ref=f38e2054]
                - generic [ref=f38e2055]:
                  - link "edit":
                    - /url: /w/index.php?title=Aliens_(film)&action=edit&section=28
              - paragraph [ref=f38e2056]:
                - text: Aliens is considered one of the greatest science-fiction films ever made,
                - superscript [ref=f38e2057]:
                  - link "[g]" [ref=f38e2058] [cursor=pointer]:
                    - /url: "#cite_note-246"
                    - generic: "[g]"
                - text: as well as being among the best films of the 1980s,
                - superscript [ref=f38e2059]:
                  - link "[h]" [ref=f38e2060] [cursor=pointer]:
                    - /url: "#cite_note-256"
                    - generic: "[h]"
                - text: and one of the greatest action films of all time.
                - superscript [ref=f38e2061]:
                  - link "[i]" [ref=f38e2062] [cursor=pointer]:
                    - /url: "#cite_note-263"
                    - generic: "[i]"
                - text: The
                - link "British Film Institute" [ref=f38e2063] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/British_Film_Institute
                - text: "called Aliens one of the 10 greatest action films, saying: \"A matriarchal masterpiece of"
                - link "God" [ref=f38e2064] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/God
                - text: "-bothering structural engineering, there's really little that Aliens doesn't get right; from its slow-burn exemplification of character and world-building through to its jab-jab-hook-pause-uppercut series of sustained climaxes, Cameron delivers a masterclass in action direction.\""
                - superscript [ref=f38e2065]:
                  - link "[3]" [ref=f38e2066] [cursor=pointer]:
                    - /url: "#cite_note-ActionBFI-3"
                    - generic: "[3]"
              - paragraph [ref=f38e2067]:
                - text: The film is also considered one of the best sequels of all time, and equal to (or better than) Alien.
                - superscript [ref=f38e2068]:
                  - link "[j]" [ref=f38e2069] [cursor=pointer]:
                    - /url: "#cite_note-264"
                    - generic: "[j]"
                - text: According to
                - link "Slant Magazine" [ref=f38e2071] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Slant_Magazine
                - text: ", it exceeded Alien in every way."
                - superscript [ref=f38e2072]:
                  - link "[4]" [ref=f38e2073] [cursor=pointer]:
                    - /url: "#cite_note-SlantSummer86-4"
                    - generic: "[4]"
                - text: In 2009,
                - link "Den of Geek" [ref=f38e2075] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Den_of_Geek
                - text: called it the best blockbuster sequel ever made, and remarkable even as a standalone film.
                - superscript [ref=f38e2076]:
                  - link "[5]" [ref=f38e2077] [cursor=pointer]:
                    - /url: "#cite_note-DOGBlockbusterSequel-5"
                    - generic: "[5]"
                - text: In 2017, the website ranked it the second-best film in the series (behind Alien).
                - superscript [ref=f38e2078]:
                  - link "[249]" [ref=f38e2079] [cursor=pointer]:
                    - /url: "#cite_note-DOGAlienFilmsranked-265"
                    - generic: "[249]"
                - text: In 2011,
                - link "Empire" [ref=f38e2081] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Empire_(film_magazine)
                - text: called it the greatest movie sequel ever.
                - superscript [ref=f38e2082]:
                  - link "[250]" [ref=f38e2083] [cursor=pointer]:
                    - /url: "#cite_note-Empire50GreatestSequels-266"
                    - generic: "[250]"
                - text: Empire also listed Aliens as the 30th-best film ever made on the magazine's "500 Greatest Movies Of All Time" list; its readers ranked it the 17th-best.
                - superscript [ref=f38e2084]:
                  - link "[251]" [ref=f38e2085] [cursor=pointer]:
                    - /url: "#cite_note-Empire500-267"
                    - generic: "[251]"
                - superscript [ref=f38e2086]:
                  - link "[252]" [ref=f38e2087] [cursor=pointer]:
                    - /url: "#cite_note-EmpireReaders100-268"
                    - generic: "[252]"
                - text: The film is listed in the book
                - link "1001 Movies You Must See Before You Die" [ref=f38e2089] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/1001_Movies_You_Must_See_Before_You_Die
                - text: .
                - superscript [ref=f38e2090]:
                  - link "[253]" [ref=f38e2091] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTESchneider2013-269"
                    - generic: "[253]"
                - text: Aliens has a 93% approval rating on the
                - link "review aggregator" [ref=f38e2092] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Review_aggregator
                - text: website
                - link "Rotten Tomatoes" [ref=f38e2093] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Rotten_Tomatoes
                - text: from 167 reviews, with an average rating of 8.9/10. Its critical consensus reads, "While Alien was a marvel of slow-building, atmospheric tension, Aliens packs a much more visceral punch, and features a typically strong performance from Sigourney Weaver."
                - superscript [ref=f38e2094]:
                  - link "[254]" [ref=f38e2095] [cursor=pointer]:
                    - /url: "#cite_note-RottenTomatoes-270"
                    - generic: "[254]"
                - text: The film has a score of 84 out of 100 on
                - link "Metacritic" [ref=f38e2096] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Metacritic
                - text: based on 22 critics, indicating "universal acclaim".
                - superscript [ref=f38e2097]:
                  - link "[255]" [ref=f38e2098] [cursor=pointer]:
                    - /url: "#cite_note-Metacritic-271"
                    - generic: "[255]"
              - paragraph [ref=f38e2099]:
                - text: The Ellen Ripley character has also been recognized; the
                - link "American Film Institute" [ref=f38e2100] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/American_Film_Institute
                - text: ranked her the eighth-most-heroic character on its 2003
                - link "100 Years ... 100 Heroes and Villains" [ref=f38e2101] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/AFI's_100_Years...100_Heroes_&_Villains
                - text: list,
                - superscript [ref=f38e2102]:
                  - link "[256]" [ref=f38e2103] [cursor=pointer]:
                    - /url: "#cite_note-AFI100HeroesVill-272"
                    - generic: "[256]"
                - text: and she was ninth on Empire
                - generic [ref=f38e2104]: "'"
                - text: s 2006 "100 Greatest Movie Characters" list.
                - superscript [ref=f38e2105]:
                  - link "[257]" [ref=f38e2106] [cursor=pointer]:
                    - /url: "#cite_note-Empire100Ripley-273"
                    - generic: "[257]"
                - text: Despite her character's popularity, the casting of Jenette Goldstein (a Jewish actress of Russian, Moroccan, and Brazilian descent) as the Hispanic Vasquez has been considered odd.
              - paragraph [ref=f38e2107]:
                - text: "Speaking later about the casting, Cameron acknowledged the controversy, saying: \"We would get crucified if we did that today.\""
                - superscript [ref=f38e2108]:
                  - link "[62]" [ref=f38e2109] [cursor=pointer]:
                    - /url: "#cite_note-Empire1-68"
                    - generic: "[62]"
                - text: He explained that Goldstein was part of the British acting union
                - link "Equity" [ref=f38e2110] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Equity_(British_trade_union)
                - text: "at the time, and that filming in England meant casting largely from that pool. He also recalled the visual transformation required for the role: \"Right, here comes this fair-skinned, freckled, blue-eyed Jewish girl from Beverly Hills. Yeah, that's Vasquez – it's obvious!... Some body make-up, some brown contacts, dye your hair black, you'll be great!\""
                - superscript [ref=f38e2111]:
                  - link "[62]" [ref=f38e2112] [cursor=pointer]:
                    - /url: "#cite_note-Empire1-68"
                    - generic: "[62]"
              - paragraph [ref=f38e2113]:
                - text: Goldstein has said she considers herself unrecognizable as Vasquez on film, but a muscular actress was required, and the filmmakers could not find anyone else with her physique.
                - superscript [ref=f38e2114]:
                  - link "[258]" [ref=f38e2115] [cursor=pointer]:
                    - /url: "#cite_note-TooFab-274"
                    - generic: "[258]"
          - region "Franchise" [ref=f38e2116]:
            - generic [ref=f38e2117]:
              - heading "Franchise" [level=2] [ref=f38e2118]
              - generic [ref=f38e2119]:
                - link "edit":
                  - /url: /w/index.php?title=Aliens_(film)&action=edit&section=29
            - note [ref=f38e2120]:
              - text: "Main article:"
              - link "Alien franchise" [ref=f38e2121] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Alien_(franchise)
            - paragraph [ref=f38e2122]:
              - text: Aliens
              - generic [ref=f38e2123]: "'"
              - text: success resulted in immediate discussion of a sequel.
              - superscript [ref=f38e2124]:
                - link "[31]" [ref=f38e2125] [cursor=pointer]:
                  - /url: "#cite_note-latimesJuly241986-34"
                  - generic: "[31]"
              - text: Alien 3 was released in 1992, after a tumultuous development involving several writers and directors; Cameron did not return.
              - superscript [ref=f38e2126]:
                - link "[259]" [ref=f38e2127] [cursor=pointer]:
                  - /url: "#cite_note-VoxAlien3-275"
                  - generic: "[259]"
              - superscript [ref=f38e2128]:
                - link "[260]" [ref=f38e2129] [cursor=pointer]:
                  - /url: "#cite_note-EWAlien3-276"
                  - generic: "[260]"
              - superscript [ref=f38e2130]:
                - link "[261]" [ref=f38e2131] [cursor=pointer]:
                  - /url: "#cite_note-TheVergeAlien3-277"
                  - generic: "[261]"
              - text: The film was financially successful, but "generally panned" by critics, and its director,
              - link "David Fincher" [ref=f38e2132] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/David_Fincher
              - text: ", disowned it after the release, citing studio interference."
              - superscript [ref=f38e2133]:
                - link "[259]" [ref=f38e2134] [cursor=pointer]:
                  - /url: "#cite_note-VoxAlien3-275"
                  - generic: "[259]"
              - text: The film was also derided by fans because it killed the Hicks and Newt characters off-screen. Biehn called it one of his greatest disappointments and refused permission for the use of his likeness in Alien 3.
              - superscript [ref=f38e2135]:
                - link "[10]" [ref=f38e2136] [cursor=pointer]:
                  - /url: "#cite_note-RemarEmpire-13"
                  - generic: "[10]"
              - superscript [ref=f38e2137]:
                - link "[262]" [ref=f38e2138] [cursor=pointer]:
                  - /url: "#cite_note-THRBiehn-278"
                  - generic: "[262]"
              - text: "Regarding the treatment of his characters, Cameron said:"
            - blockquote [ref=f38e2139]:
              - paragraph [ref=f38e2140]:
                - text: I thought [the decision to eliminate Newt, Hicks, and Bishop] was dumb ... I thought it was a huge slap in the face to the fans ... I think it was a big mistake. Certainly, had we been involved we would not have done that, because we felt we earned something with the audience for those characters.
                - superscript [ref=f38e2141]:
                  - link "[37]" [ref=f38e2142] [cursor=pointer]:
                    - /url: "#cite_note-FSR36Things-40"
                    - generic: "[37]"
                - superscript [ref=f38e2143]:
                  - link "[263]" [ref=f38e2144] [cursor=pointer]:
                    - /url: "#cite_note-I09Alien3-279"
                    - generic: "[263]"
            - paragraph [ref=f38e2145]:
              - text: An early script for Alien 3, by
              - link "William Gibson" [ref=f38e2146] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/William_Gibson
              - text: ", was adapted as a 2019 audio drama, focusing on Hicks as the protagonist, with Biehn and Henriksen voicing their respective roles."
              - superscript [ref=f38e2147]:
                - link "[261]" [ref=f38e2148] [cursor=pointer]:
                  - /url: "#cite_note-TheVergeAlien3-277"
                  - generic: "[261]"
              - superscript [ref=f38e2149]:
                - link "[264]" [ref=f38e2150] [cursor=pointer]:
                  - /url: "#cite_note-GRadarAlien3-280"
                  - generic: "[264]"
              - text: A five-hour 2017 audio drama, River of Pain, takes place between Alien and Aliens and covers the early days of the LV-426 colony and its downfall to the aliens. Actors returning to voice their characters included William Hope, Mac MacDonald, Stuart Milligan, and Alibe Parsons.
              - superscript [ref=f38e2151]:
                - link "[27]" [ref=f38e2152] [cursor=pointer]:
                  - /url: "#cite_note-DOGRiverofPain-30"
                  - generic: "[27]"
              - text: A third sequel, Alien Resurrection, was released in 1997.
              - superscript [ref=f38e2153]:
                - link "[265]" [ref=f38e2154] [cursor=pointer]:
                  - /url: "#cite_note-DigitalSpyAR-281"
                  - generic: "[265]"
              - text: Instead of a fourth sequel, Fox began development of a prequel crossover film,
              - link "Alien vs. Predator" [ref=f38e2156] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Alien_vs._Predator_(film)
              - text: (2004), pitting the series' aliens against the titular alien race of its science-fiction property, Predator;
              - superscript [ref=f38e2157]:
                - link "[266]" [ref=f38e2158] [cursor=pointer]:
                  - /url: "#cite_note-Development14-282"
                  - generic: "[266]"
              - superscript [ref=f38e2159]:
                - link "[267]" [ref=f38e2160] [cursor=pointer]:
                  - /url: "#cite_note-Development15-283"
                  - generic: "[267]"
              - text: the film was poorly received.
              - superscript [ref=f38e2161]:
                - link "[268]" [ref=f38e2162] [cursor=pointer]:
                  - /url: "#cite_note-SyFyAvP-284"
                  - generic: "[268]"
              - superscript [ref=f38e2163]:
                - link "[269]" [ref=f38e2164] [cursor=pointer]:
                  - /url: "#cite_note-TheGuardianAVP-285"
                  - generic: "[269]"
              - text: It was followed by a sequel,
              - 'link "Aliens vs. Predator: Requiem" [ref=f38e2166] [cursor=pointer]':
                - /url: //en.wikipedia.org/wiki/Aliens_vs._Predator:_Requiem
              - text: (2007), the least financially-successful and worst-reviewed film in either franchise.
              - superscript [ref=f38e2167]:
                - link "[270]" [ref=f38e2168] [cursor=pointer]:
                  - /url: "#cite_note-DOGREquiem-286"
                  - generic: "[270]"
            - paragraph [ref=f38e2169]:
              - text: Ridley Scott returned to the series for
              - link "Prometheus" [ref=f38e2171] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Prometheus_(2012_film)
              - text: (2012) (a prequel to Alien) and its sequel,
              - 'link "Alien: Covenant" [ref=f38e2173] [cursor=pointer]':
                - /url: //en.wikipedia.org/wiki/Alien:_Covenant
              - text: (2017).
              - superscript [ref=f38e2174]:
                - link "[271]" [ref=f38e2175] [cursor=pointer]:
                  - /url: "#cite_note-IndiwireCovenantSeq-287"
                  - generic: "[271]"
              - text: A fourth Alien sequel was in development by 2020, but was canceled by
              - link "the Walt Disney Company" [ref=f38e2176] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/The_Walt_Disney_Company
              - text: following
              - link "its acquisition of 20th Century Fox" [ref=f38e2177] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Acquisition_of_21st_Century_Fox_by_Disney
              - text: .
              - superscript [ref=f38e2178]:
                - link "[272]" [ref=f38e2179] [cursor=pointer]:
                  - /url: "#cite_note-IndieWireAlienV-288"
                  - generic: "[272]"
              - superscript [ref=f38e2180]:
                - link "[273]" [ref=f38e2181] [cursor=pointer]:
                  - /url: "#cite_note-THRHill-289"
                  - generic: "[273]"
              - text: A stand-alone film in the Alien franchise,
              - 'link "Alien: Romulus" [ref=f38e2183] [cursor=pointer]':
                - /url: //en.wikipedia.org/wiki/Alien:_Romulus
              - text: ", was released on August 16, 2024; it is set between the events of Alien and Aliens."
              - superscript [ref=f38e2184]:
                - link "[274]" [ref=f38e2185] [cursor=pointer]:
                  - /url: "#cite_note-THRFede-290"
                  - generic: "[274]"
              - superscript [ref=f38e2186]:
                - link "[275]" [ref=f38e2187] [cursor=pointer]:
                  - /url: "#cite_note-EmpireFede-291"
                  - generic: "[275]"
              - superscript [ref=f38e2188]:
                - link "[276]" [ref=f38e2189] [cursor=pointer]:
                  - /url: "#cite_note-IGNRomDate-292"
                  - generic: "[276]"
          - region "Footnotes" [ref=f38e2190]:
            - generic [ref=f38e2191]:
              - heading "Footnotes" [level=2] [ref=f38e2192]
              - generic [ref=f38e2193]:
                - link "edit":
                  - /url: /w/index.php?title=Aliens_(film)&action=edit&section=30
            - list [ref=f38e2195]:
              - listitem [ref=f38e2196]:
                - link "Jump up" [ref=f38e2198] [cursor=pointer]:
                  - /url: "#cite_ref-9"
                  - text: ^
                - generic [ref=f38e2199]:
                  - text: As depicted in
                  - link "Alien" [ref=f38e2201] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Alien_(film)
                  - text: (1979).
              - listitem [ref=f38e2202]:
                - link "Jump up" [ref=f38e2204] [cursor=pointer]:
                  - /url: "#cite_ref-11"
                  - text: ^
                - generic [ref=f38e2205]:
                  - text: The
                  - link "exomoon" [ref=f38e2206] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Exomoon
                  - text: known as LV-426 is also referred to as Acheron.
                  - superscript [ref=f38e2207]:
                    - link "[8]" [ref=f38e2208] [cursor=pointer]:
                      - /url: "#cite_note-SyFyNewt-10"
                      - generic: "[8]"
              - listitem [ref=f38e2209]:
                - link "Jump up" [ref=f38e2211] [cursor=pointer]:
                  - /url: "#cite_ref-62"
