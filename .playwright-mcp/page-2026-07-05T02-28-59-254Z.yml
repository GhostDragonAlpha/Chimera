                    - text: million
            - paragraph [ref=f38e348]:
              - generic [ref=f38e349]: Aliens
              - text: is a 1986
              - link "science fiction-action" [ref=f38e350] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Science_fiction-action
              - text: film written and directed by
              - link "James Cameron" [ref=f38e351] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/James_Cameron
              - text: . It is the sequel to the 1979 science fiction horror film
              - link "Alien" [ref=f38e353] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Alien_(film)
              - text: ", and the second film in the"
              - link "Alien franchise" [ref=f38e354] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Alien_(franchise)
              - text: . Set in the far future, it stars
              - link "Sigourney Weaver" [ref=f38e355] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Sigourney_Weaver
              - text: as
              - link "Ellen Ripley" [ref=f38e356] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ellen_Ripley
              - text: ", the sole survivor of"
              - link "an alien" [ref=f38e357] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Xenomorph
              - text: attack on her ship. When communications are lost with a human colony on the moon where her crew first encountered the alien creatures, Ripley agrees to return to the site with a unit of Colonial Marines to investigate.
              - link "Michael Biehn" [ref=f38e358] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Michael_Biehn
              - text: ","
              - link "Paul Reiser" [ref=f38e359] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Paul_Reiser
              - text: ","
              - link "Lance Henriksen" [ref=f38e360] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Lance_Henriksen
              - text: ", and Carrie Henn are featured in supporting roles."
            - paragraph [ref=f38e361]:
              - text: Despite the success of Alien, its sequel took years to develop due to lawsuits, a lack of enthusiasm from
              - link "20th Century Fox" [ref=f38e362] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/20th_Century_Fox
              - text: ", and repeated management changes. Although relatively inexperienced, Cameron was hired to write a story for Aliens in 1983 on the strength of his scripts for"
              - link "The Terminator" [ref=f38e364] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/The_Terminator
              - text: (1984) and
              - 'link "Rambo: First Blood Part II" [ref=f38e366] [cursor=pointer]':
                - /url: //en.wikipedia.org/wiki/Rambo:_First_Blood_Part_II
              - text: (1985). The project stalled again until new Fox executive
              - link "Lawrence Gordon" [ref=f38e367] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Lawrence_Gordon_(producer)
              - text: pursued a sequel. On an approximately $18.5
              - text: million budget, Aliens began
              - link "principal photography" [ref=f38e369] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Principal_photography
              - text: in September 1985 and concluded in January 1986. The film's development was tumultuous and rife with conflicts between Cameron and the British crew at
              - link "Pinewood Studios" [ref=f38e370] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Pinewood_Studios
              - text: . The difficult shoot affected the composer,
              - link "James Horner" [ref=f38e371] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/James_Horner
              - text: ", who was given little time to record the music."
            - paragraph [ref=f38e372]:
              - text: Aliens was released on July 18, 1986, to critical acclaim. Reviewers praised its action, but some criticized the intensity of certain scenes. Weaver's performance garnered consistent praise along with those of
              - link "Bill Paxton" [ref=f38e373] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Bill_Paxton
              - text: and
              - link "Jenette Goldstein" [ref=f38e374] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Jenette_Goldstein
              - text: . The film received several awards and nominations, including an
              - link "Academy Award" [ref=f38e375] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Academy_Award
              - text: nomination for
              - link "Best Actress" [ref=f38e376] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Academy_Award_for_Best_Actress
              - text: for Weaver at a time when the science-fiction genre was generally overlooked. It earned $131.1–183.3
              - text: million during its theatrical run, making it one of the
              - link "highest-grossing films of 1986" [ref=f38e378] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/1986_in_film
              - text: worldwide.
            - paragraph [ref=f38e379]:
              - text: Aliens is now considered among the greatest
              - link "films of the 1980s" [ref=f38e380] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/1980s_in_film
              - text: ", and among the best science fiction, action, and sequel films ever made, often deemed equal to or better than Alien."
              - superscript [ref=f38e381]:
                - link "[a]" [ref=f38e382] [cursor=pointer]:
                  - /url: "#cite_note-8"
                  - generic: "[a]"
              - text: "It is credited with expanding the franchise's scope with additions to the series' backstory and factions such as the Colonial Marines. It inspired a variety of merchandise, including video games, comic books and toys. It was followed by two sequels:"
              - link "Alien 3" [ref=f38e384] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Alien_3
              - text: (1992) and
              - link "Alien Resurrection" [ref=f38e386] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Alien_Resurrection
              - text: (1997), an interquel film,
              - 'link "Alien: Romulus" [ref=f38e388] [cursor=pointer]':
                - /url: //en.wikipedia.org/wiki/Alien:_Romulus
              - text: (2024), and a TV series,
              - 'link "Alien: Earth" [ref=f38e390] [cursor=pointer]':
                - /url: //en.wikipedia.org/wiki/Alien:_Earth
              - text: (2025).
          - region "Plot" [ref=f38e391]:
            - generic [ref=f38e392]:
              - heading "Plot" [level=2] [ref=f38e393]
              - generic [ref=f38e394]:
                - link "edit":
                  - /url: /w/index.php?title=Aliens_(film)&action=edit&section=1
            - paragraph [ref=f38e395]:
              - text: A deep-space salvage crew find an escape shuttle where
              - link "Ellen Ripley" [ref=f38e396] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ellen_Ripley
              - text: has been in
              - link "stasis" [ref=f38e397] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Stasis_(fiction)
              - text: for 57 years after destroying her ship, the Nostromo, to kill an
              - link "alien creature" [ref=f38e398] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Xenomorph
              - text: that slaughtered the crew.
              - superscript [ref=f38e399]:
                - link "[i]" [ref=f38e400] [cursor=pointer]:
                  - /url: "#cite_note-9"
                  - generic: "[i]"
              - text: Ripley is debriefed by her Weyland-Yutani Corporation employers who doubt her claim about alien eggs in a derelict ship on the
              - link "exomoon" [ref=f38e401] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Exomoon
              - text: LV-426,
              - superscript [ref=f38e402]:
                - link "[ii]" [ref=f38e403] [cursor=pointer]:
                  - /url: "#cite_note-11"
                  - generic: "[ii]"
              - text: now the site of a
              - link "terraforming" [ref=f38e404] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Terraforming
              - text: colony.
            - paragraph [ref=f38e405]:
              - text: After contact is lost with the colony, Weyland-Yutani representative Carter Burke and Colonial Marine Lieutenant Gorman ask Ripley to accompany them to investigate. Still traumatized by her alien encounter, she agrees on the condition that they exterminate the creatures. Ripley meets the Colonial Marines aboard the spaceship Sulaco but distrusts their
              - link "android" [ref=f38e406] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Android_(robot)
              - text: ","
              - link "Bishop" [ref=f38e407] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Bishop_(Aliens)
              - text: ", because the Nostromo"
              - generic [ref=f38e408]: "'"
              - text: s android,
              - link "Ash" [ref=f38e409] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ash_(Alien)
              - text: ", betrayed its crew to protect the alien on company orders."
            - paragraph [ref=f38e410]:
              - text: A
              - link "dropship" [ref=f38e411] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Shuttlecraft
              - text: lands the crew on LV-426, where they find the battle-ravaged colony and two live
              - link "alien facehuggers" [ref=f38e412] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Facehugger
              - text: in containment tanks. The only colonist found is a traumatized young girl nicknamed Newt. The team locates the other colonists' signals beneath the
              - link "fusion-powered" [ref=f38e413] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Fusion_power
              - text: atmosphere processing station and heads to their location, descending into corridors covered in alien secretions. At the station's center, the marines discover opened eggs, dead facehuggers, and cocooned colonists serving as incubators for the alien embryos. The marines kill a
              - link "newborn alien" [ref=f38e414] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Chestburster
              - text: after it bursts through a colonist's chest, rousing several adult aliens who ambush the marines, killing or capturing many. When the inexperienced Gorman panics, Ripley assumes command and rams their
              - link "armored personnel carrier" [ref=f38e415] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Armored_personnel_carrier
              - text: into the nest to rescue Corporal
              - link "Dwayne Hicks" [ref=f38e416] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Dwayne_Hicks
              - text: ", and Privates"
              - link "Hudson" [ref=f38e417] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Hudson_(Aliens)
              - text: and Vasquez. Hicks orders the dropship to recover the survivors, but a stowaway alien kills the pilots, causing the dropship to crash into the station. Low on ammunition and resources, the survivors barricade themselves inside the colony facility.
            - paragraph [ref=f38e418]:
              - text: Ripley discovers that Burke ordered the colonists to investigate the derelict spaceship containing the alien eggs, intending to profit by recovering them for
              - link "biological weapon" [ref=f38e419] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Biological_weapon
              - text: research. Before she can expose Burke, Bishop reports that the dropship crash damaged the power plant's cooling system, and it will soon overheat and explode, destroying the colony. Bishop volunteers to travel to the colony transmitter and remotely pilot the remaining dropship to the surface.
            - paragraph [ref=f38e420]:
              - text: Asleep in the medical lab, Ripley and Newt awaken to find themselves trapped with the two released facehuggers. Ripley triggers a fire alarm to alert the marines, who rescue them and kill the creatures. She accuses Burke of releasing the facehuggers to implant her and Newt with alien embryos to smuggle them through Earth's quarantine. The power is suddenly cut, and aliens attack through the ceiling. In the ensuing firefight, the aliens kill Burke, subdue Hudson, and injure Hicks; the cornered Gorman and Vasquez sacrifice themselves to avoid capture. Newt is separated from Ripley and taken by the creatures. Ripley takes Hicks to the dropship but refuses to abandon Newt and arms herself before descending into the processing station hive alone to rescue her. During their escape, they encounter the alien queen amid dozens of eggs. When one opens, Ripley burns the eggs and blows up the queen's
              - link "ovipositor" [ref=f38e421] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ovipositor
              - text: . Pursued by the enraged queen, Ripley and Newt reach the dropship and escape with Bishop and an unconscious Hicks moments before the station explodes, consuming the colony in a nuclear blast.
            - paragraph [ref=f38e422]:
              - text: Aboard the Sulaco, the queen, stowed away in the dropship's landing gear, attacks the group. The queen rips Bishop in half and advances on Newt, but Ripley battles the creature using an
              - link "exosuit" [ref=f38e423] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Exosuit
              - text: cargo loader, expelling it into space through an airlock while the damaged Bishop shields Newt. Ripley, Newt, Hicks, and Bishop then enter hypersleep for their return trip to Earth.
