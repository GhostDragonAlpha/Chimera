        - heading "Introduction" [level=2] [ref=f136e92]
        - paragraph [ref=f136e93]: What is a planet? The word traces back to the ancient Greek word planēt, which means “wanderer.” A more modern definition can be found in the Merriam-Webster dictionary, which defines a planet as “any of the large bodies that revolve around the Sun in the solar system.”
        - paragraph [ref=f136e94]:
          - text: In 2006, the International Astronomical Union (IAU) — a group of astronomers that names objects in our solar system — agreed on their own definition of
          - link "“planet.”" [ref=f136e95] [cursor=pointer]:
            - /url: https://www.iau.org/IAU/Science/What-we-do/Pluto-and-the-Developing-Landscape-of-Our-Solar-System.aspx?WebsiteKey=9e4eaea2-b0d6-4c4b-bd18-913a208b91be#Pluto-4
          - text: This new definition caused Pluto's famous “demotion” to a dwarf planet, and reduced the solar system census from nine planets to eight.
