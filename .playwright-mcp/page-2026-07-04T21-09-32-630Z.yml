                          - text: (Hildas)
                        - link "Jupiter trojans" [ref=f135e220] [cursor=pointer]:
                          - /url: //en.wikipedia.org/wiki/Jupiter_trojan
            - figure "By far the largest object within the belt is the dwarf planet Ceres. The total mass of the asteroid belt is significantly less than Pluto's, and roughly twice that of Pluto's moon Charon." [ref=f135e221]:
              - link [ref=f135e222] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Ceres-Vesta-Eros_compared_to_Pluto-Charon.jpg
                - img [ref=f135e223]
              - generic [ref=f135e224]:
                - text: By far the largest object within the belt is the dwarf planet
                - link "Ceres" [ref=f135e225] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ceres_(dwarf_planet)
                - text: . The total mass of the asteroid belt is significantly less than
                - link "Pluto" [ref=f135e226] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Pluto
                - text: "'s, and roughly twice that of Pluto's moon"
                - link "Charon" [ref=f135e227] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Charon_(moon)
                - text: .
            - paragraph [ref=f135e228]:
              - text: The asteroid belt is a
              - link "torus" [ref=f135e229] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Torus
              - text: "-shaped region in the"
              - link "Solar System" [ref=f135e230] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Solar_System
              - text: ", centered on the"
              - link "Sun" [ref=f135e231] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Sun
              - text: and roughly spanning the space between the orbits of the planets
              - link "Jupiter" [ref=f135e232] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Jupiter
              - text: and
              - link "Mars" [ref=f135e233] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Mars
              - text: . It contains a great many solid, irregularly shaped bodies called
              - link "asteroids" [ref=f135e234] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Asteroid
              - text: or
              - link "minor planets" [ref=f135e235] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Minor_planet
              - text: . The identified objects are of many sizes, but much smaller than
              - link "planets" [ref=f135e236] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Planet
              - text: ", and, on average, are about one million kilometers (or six hundred thousand miles) apart. This asteroid belt is also called the main asteroid belt or main belt to distinguish it from other asteroid populations in the Solar System."
              - superscript [ref=f135e237]:
                - link "[1]" [ref=f135e238] [cursor=pointer]:
                  - /url: "#cite_note-Williams-1"
                  - generic [ref=f135e239]: "[1]"
            - paragraph [ref=f135e240]:
              - text: The asteroid belt is the innermost and smallest
              - link "circumstellar disc" [ref=f135e241] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Circumstellar_disc
              - text: in the Solar System. Its total mass is estimated to be 3% that of the
              - link "Moon" [ref=f135e242] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Moon
              - text: ", with about 60% contained in the four largest asteroids:"
              - link "Ceres" [ref=f135e243] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ceres_(dwarf_planet)
              - text: ","
              - link "Vesta" [ref=f135e244] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/4_Vesta
              - text: ","
              - link "Pallas" [ref=f135e245] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/2_Pallas
              - text: ", and"
              - link "Hygiea" [ref=f135e246] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/10_Hygiea
              - text: . Classes of
              - link "small Solar System bodies" [ref=f135e247] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Small_Solar_System_body
              - text: in other regions are the
              - link "near-Earth objects" [ref=f135e248] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Near-Earth_objects
              - text: ", the"
              - link "centaurs" [ref=f135e249] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Centaur_(minor_planet)
              - text: ","
              - link "trojans" [ref=f135e250] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Trojan_(celestial_body)
              - text: ", and the"
              - link "trans-Neptunian objects" [ref=f135e251] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Trans-Neptunian_objects
              - text: (
              - link "Kuiper belt" [ref=f135e252] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Kuiper_belt
              - text: objects,
              - link "scattered disc" [ref=f135e253] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Scattered_disc
              - text: objects,
              - link "sednoids" [ref=f135e254] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Sednoid
              - text: ", and"
              - link "Oort cloud" [ref=f135e255] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Oort_cloud
              - text: objects.)
              - superscript [ref=f135e256]:
                - link "[2]" [ref=f135e257] [cursor=pointer]:
                  - /url: "#cite_note-Pitjeva2018-2"
                  - generic [ref=f135e258]: "[2]"
            - paragraph [ref=f135e259]:
              - text: Ceres, the only object in the asteroid belt large enough to be classified as a
              - link "dwarf planet" [ref=f135e260] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Dwarf_planet
              - text: ", is about 950 km in diameter, whereas Vesta, Pallas, and Hygiea have mean diameters less than 600 km."
              - superscript [ref=f135e261]:
                - link "[3]" [ref=f135e262] [cursor=pointer]:
                  - /url: "#cite_note-Krasinskyetal2002-3"
                  - generic [ref=f135e263]: "[3]"
              - superscript [ref=f135e264]:
                - link "[4]" [ref=f135e265] [cursor=pointer]:
                  - /url: "#cite_note-Pitjeva2005-4"
                  - generic [ref=f135e266]: "[4]"
              - superscript [ref=f135e267]:
                - link "[5]" [ref=f135e268] [cursor=pointer]:
                  - /url: "#cite_note-halfmass-5"
                  - generic [ref=f135e269]: "[5]"
              - superscript [ref=f135e270]:
                - link "[6]" [ref=f135e271] [cursor=pointer]:
                  - /url: "#cite_note-jplsbdb-6"
                  - generic [ref=f135e272]: "[6]"
              - text: The remaining mineralogically classified bodies range in size down to a few metres.
              - superscript [ref=f135e273]:
                - link "[7]" [ref=f135e274] [cursor=pointer]:
                  - /url: "#cite_note-7"
                  - generic [ref=f135e275]: "[7]"
              - text: The asteroid material is so thinly distributed that numerous
              - link "uncrewed spacecraft" [ref=f135e276] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Uncrewed_spacecraft
              - text: have traversed it without incident.
              - superscript [ref=f135e277]:
                - link "[8]" [ref=f135e278] [cursor=pointer]:
                  - /url: "#cite_note-8"
                  - generic [ref=f135e279]: "[8]"
              - text: Nonetheless, collisions between large asteroids occur and can produce an
              - link "asteroid family" [ref=f135e280] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Asteroid_family
              - text: ", whose members have similar orbital characteristics and compositions. Individual asteroids within the belt are categorized by their"
              - link "spectra" [ref=f135e281] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Spectrum
              - text: ", with most falling into three basic groups:"
              - link "carbonaceous" [ref=f135e282] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Carbon
              - text: (
              - link "C-type" [ref=f135e283] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/C-type_asteroid
              - text: ),
              - link "silicate" [ref=f135e284] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Silicate
              - text: (
              - link "S-type" [ref=f135e285] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/S-type_asteroid
              - text: ), and
              - link "X-type" [ref=f135e286] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/X-type_asteroid
              - text: ", which includes metal-rich asteroids."
            - paragraph [ref=f135e287]:
              - text: The asteroid belt formed from the primordial
              - link "solar nebula" [ref=f135e288] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Solar_nebula
              - text: as a group of
              - link "planetesimals" [ref=f135e289] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Planetesimal
              - text: ","
              - superscript [ref=f135e290]:
                - link "[9]" [ref=f135e291] [cursor=pointer]:
                  - /url: "#cite_note-CosmosUp-9"
                  - generic [ref=f135e292]: "[9]"
              - text: the smaller precursors of the
              - link "protoplanets" [ref=f135e293] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Protoplanet
              - text: . However,
              - link "gravitational" [ref=f135e294] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Gravity
              - text: perturbations from Mars and Jupiter disrupted their
              - link "accretion" [ref=f135e295] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Accretion_(astrophysics)
              - text: into a planet,
              - superscript [ref=f135e296]:
                - link "[9]" [ref=f135e297] [cursor=pointer]:
                  - /url: "#cite_note-CosmosUp-9"
                  - generic [ref=f135e298]: "[9]"
              - superscript [ref=f135e299]:
                - link "[10]" [ref=f135e300] [cursor=pointer]:
                  - /url: "#cite_note-10"
                  - generic [ref=f135e301]: "[10]"
              - text: imparting excess kinetic energy which shattered colliding planetesimals and most of the incipient protoplanets. As a result, 99.9% of the asteroid belt's original mass was lost in the first 100 million years of the Solar System's history.
              - superscript [ref=f135e302]:
                - link "[11]" [ref=f135e303] [cursor=pointer]:
                  - /url: "#cite_note-11"
                  - generic [ref=f135e304]: "[11]"
              - text: Some fragments eventually found their way into the inner Solar System, leading to meteorite impacts with the inner planets. Asteroid orbits continue to be appreciably
              - link "perturbed" [ref=f135e305] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Perturbation_(astronomy)
              - text: whenever their period of revolution about the Sun forms an
              - link "orbital resonance" [ref=f135e306] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Orbital_resonance
              - text: with Jupiter. At these orbital distances, a
              - link "Kirkwood gap" [ref=f135e307] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Kirkwood_gap
              - text: occurs as they are swept into other orbits.
              - superscript [ref=f135e308]:
                - link "[12]" [ref=f135e309] [cursor=pointer]:
                  - /url: "#cite_note-12"
                  - generic [ref=f135e310]: "[12]"
          - region "History of observation" [ref=f135e311]:
            - generic [ref=f135e312]:
              - heading "History of observation" [level=2] [ref=f135e313]
              - generic [ref=f135e314]:
                - link "edit":
                  - /url: /w/index.php?title=Asteroid_belt&action=edit&section=1
            - figure "In 1596, Johannes Kepler's sense of proportion for the planetary orbits led him to believe that an undiscovered planet lay between the orbits of Mars and Jupiter.[13]" [ref=f135e315]:
              - link [ref=f135e316] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:JKepler.jpg
                - img [ref=f135e317]
              - generic [ref=f135e318]:
                - text: In 1596,
                - link "Johannes Kepler" [ref=f135e319] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Johannes_Kepler
                - text: "'s sense of proportion for the planetary orbits led him to believe that an undiscovered planet lay between the orbits of Mars and Jupiter."
                - superscript [ref=f135e320]:
                  - link "[13]" [ref=f135e321] [cursor=pointer]:
                    - /url: "#cite_note-13"
                    - generic [ref=f135e322]: "[13]"
            - note [ref=f135e323]:
              - text: "See also:"
              - link "Definition of planet" [ref=f135e324] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Definition_of_planet
              - text: and
              - link "List of minor planets" [ref=f135e325] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/List_of_minor_planets
            - paragraph [ref=f135e326]:
              - text: In 1596,
              - link "Johannes Kepler" [ref=f135e327] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Johannes_Kepler
              - text: wrote, "Between Mars and Jupiter, I place a planet," in his
              - link "Mysterium Cosmographicum" [ref=f135e329] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Mysterium_Cosmographicum
              - text: ", stating his prediction that a planet would be found there."
              - superscript [ref=f135e330]:
                - link "[14]" [ref=f135e331] [cursor=pointer]:
                  - /url: "#cite_note-14"
                  - generic [ref=f135e332]: "[14]"
              - text: While analyzing
              - link "Tycho Brahe" [ref=f135e333] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Tycho_Brahe
              - text: "'s data, Kepler thought that too large a gap existed between the orbits of Mars and Jupiter to fit his own model of where planetary orbits should be found."
              - superscript [ref=f135e334]:
                - link "[15]" [ref=f135e335] [cursor=pointer]:
                  - /url: "#cite_note-15"
                  - generic [ref=f135e336]: "[15]"
            - paragraph [ref=f135e337]:
              - text: In an anonymous footnote to his 1766 translation of
              - link "Charles Bonnet" [ref=f135e338] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Charles_Bonnet
              - text: "'s Contemplation de la Nature,"
              - superscript [ref=f135e339]:
                - link "[16]" [ref=f135e340] [cursor=pointer]:
                  - /url: "#cite_note-asteroids-16"
                  - generic [ref=f135e341]: "[16]"
              - text: the astronomer
              - link "Johann Daniel Titius" [ref=f135e342] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Johann_Daniel_Titius
              - text: of
              - link "Wittenberg" [ref=f135e343] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Wittenberg
              - superscript [ref=f135e344]:
                - link "[17]" [ref=f135e345] [cursor=pointer]:
                  - /url: "#cite_note-Dawn-17"
                  - generic [ref=f135e346]: "[17]"
              - superscript [ref=f135e347]:
                - link "[18]" [ref=f135e348] [cursor=pointer]:
                  - /url: "#cite_note-Hoskin-18"
                  - generic [ref=f135e349]: "[18]"
              - text: noted an apparent pattern in the layout of the planets, now known as the
              - link "Titius-Bode Law" [ref=f135e350] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Titius-Bode_Law
              - text: . If one began a numerical sequence at 0, then included 3, 6, 12, 24, 48, etc., doubling each time, and added four to each number and divided by 10, this produced a remarkably close approximation to the radii of the orbits of the known planets as measured in
              - link "astronomical units" [ref=f135e351] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Astronomical_units
              - text: ", provided one allowed for a \"missing planet\" (equivalent to 24 in the sequence) between the orbits of Mars (12) and Jupiter (48). In his footnote, Titius declared, \"But should the Lord Architect have left that space empty? Not at all.\""
              - superscript [ref=f135e352]:
                - link "[17]" [ref=f135e353] [cursor=pointer]:
                  - /url: "#cite_note-Dawn-17"
                  - generic [ref=f135e354]: "[17]"
              - text: When
              - link "William Herschel" [ref=f135e355] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/William_Herschel
              - text: discovered
              - link "Uranus" [ref=f135e356] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Uranus
              - text: in 1781, the planet's orbit closely matched the law, leading some astronomers to conclude that a planet had to be between the orbits of Mars and Jupiter.
              - superscript [ref=f135e357]:
                - link "[19]" [ref=f135e358] [cursor=pointer]:
                  - /url: "#cite_note-Nieto_2014-19"
                  - generic [ref=f135e359]: "[19]"
            - 'figure "Giuseppe Piazzi, discoverer of Ceres, the largest object in the asteroid belt: Ceres was known as a planet, but later reclassified as an asteroid and from 2006 as a dwarf planet." [ref=f135e360]':
              - link [ref=f135e361] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Costanzo_Angelini,_L'astronomo_Piazzi_1825_ca.jpg
                - img [ref=f135e362]
              - generic [ref=f135e363]:
                - link "Giuseppe Piazzi" [ref=f135e364] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Giuseppe_Piazzi
                - text: ", discoverer of Ceres, the largest object in the asteroid belt: Ceres was known as a planet, but later reclassified as an asteroid and from 2006 as a dwarf planet."
            - paragraph [ref=f135e365]:
              - text: On January 1, 1801,
              - link "Giuseppe Piazzi" [ref=f135e366] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Giuseppe_Piazzi
              - text: ", chairman of astronomy at the"
              - link "University of Palermo" [ref=f135e367] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/University_of_Palermo
              - text: ", Sicily, found a tiny moving object in an orbit with exactly the radius predicted by this pattern. He dubbed it \"Ceres\", after the"
              - link "Roman goddess" [ref=f135e368] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ceres_(Roman_mythology)
              - text: of the harvest and patron of Sicily. Piazzi initially believed it to be a comet, but its lack of a
              - link "coma" [ref=f135e369] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Coma_(cometary)
              - text: suggested it was a planet.
              - superscript [ref=f135e370]:
                - link "[20]" [ref=f135e371] [cursor=pointer]:
                  - /url: "#cite_note-police-20"
                  - generic [ref=f135e372]: "[20]"
              - text: Thus, the aforementioned pattern predicted the
              - link "semimajor axes" [ref=f135e373] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Semi-major_axis
              - text: of all eight planets of the time (Mercury, Venus, Earth, Mars, Ceres, Jupiter, Saturn, and Uranus). Concurrent with the discovery of Ceres, an informal group of 24 astronomers dubbed the "
              - link "Celestial police" [ref=f135e374] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Celestial_police
              - text: "\" was formed under the invitation of"
              - link "Franz Xaver von Zach" [ref=f135e375] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Franz_Xaver_von_Zach
              - text: with the express purpose of finding additional planets; they focused their search for them in the region between Mars and Jupiter where the
              - link "Titius–Bode law" [ref=f135e376] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Titius–Bode_law
              - text: predicted there should be a planet.
              - superscript [ref=f135e377]:
                - link "[21]" [ref=f135e378] [cursor=pointer]:
                  - /url: "#cite_note-21"
                  - generic [ref=f135e379]: "[21]"
              - superscript [ref=f135e380]:
                - link "[22]" [ref=f135e381] [cursor=pointer]:
                  - /url: "#cite_note-22"
                  - generic [ref=f135e382]: "[22]"
            - paragraph [ref=f135e383]:
              - text: About 15 months later,
              - link "Heinrich Olbers" [ref=f135e384] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Heinrich_Wilhelm_Matthias_Olbers
              - text: ", a member of the"
              - link "Celestial police" [ref=f135e385] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Celestial_police
              - text: ", discovered a second object in the same region, Pallas. Unlike the other known planets, Ceres and Pallas remained points of light even under the highest telescope magnifications instead of resolving into discs. Apart from their rapid movement, they appeared indistinguishable from"
              - link "stars" [ref=f135e386] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Star
              - text: .
              - superscript [ref=f135e387]:
                - link "[23]" [ref=f135e388] [cursor=pointer]:
                  - /url: "#cite_note-serendipity-23"
                  - generic [ref=f135e389]: "[23]"
            - paragraph [ref=f135e390]:
              - text: Accordingly, in 1802,
              - link "William Herschel" [ref=f135e391] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/William_Herschel
              - text: suggested they be placed into a separate category, named "asteroids", after the
              - link "Greek" [ref=f135e392] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ancient_Greek_language
              - text: asteroeides, meaning "star-like".
              - superscript [ref=f135e393]:
                - link "[24]" [ref=f135e394] [cursor=pointer]:
                  - /url: "#cite_note-24"
                  - generic [ref=f135e395]: "[24]"
              - superscript [ref=f135e396]:
                - link "[25]" [ref=f135e397] [cursor=pointer]:
                  - /url: "#cite_note-aster-root-25"
                  - generic [ref=f135e398]: "[25]"
              - text: Upon completing a series of observations of Ceres and Pallas, he concluded,
              - superscript [ref=f135e399]:
                - link "[26]" [ref=f135e400] [cursor=pointer]:
                  - /url: "#cite_note-26"
                  - generic [ref=f135e401]: "[26]"
            - blockquote [ref=f135e402]:
              - paragraph [ref=f135e403]: Neither the appellation of planets nor that of comets can with any propriety of language be given to these two stars ... They resemble small stars so much as hardly to be distinguished from them. From this, their asteroidal appearance, if I take my name, and call them Asteroids; reserving for myself, however, the liberty of changing that name, if another, more expressive of their nature, should occur.
            - paragraph [ref=f135e404]:
              - text: "By 1807, further investigation revealed two new objects in the region:"
              - link "Juno" [ref=f135e405] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/3_Juno
              - text: and
              - link "Vesta" [ref=f135e406] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/4_Vesta
              - text: .
              - superscript [ref=f135e407]:
                - link "[23]" [ref=f135e408] [cursor=pointer]:
                  - /url: "#cite_note-serendipity-23"
                  - generic [ref=f135e409]: "[23]"
              - text: The burning of
              - link "Lilienthal" [ref=f135e410] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Lilienthal,_Lower_Saxony
              - text: in the
              - link "Napoleonic Wars" [ref=f135e411] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Napoleonic_Wars
              - text: ", where the main body of work had been done,"
              - superscript [ref=f135e412]:
                - link "[27]" [ref=f135e413] [cursor=pointer]:
                  - /url: "#cite_note-Elkins-27"
                  - generic [ref=f135e414]: "[27]"
              - text: brought this first period of discovery to a close.
              - superscript [ref=f135e415]:
                - link "[23]" [ref=f135e416] [cursor=pointer]:
                  - /url: "#cite_note-serendipity-23"
                  - generic [ref=f135e417]: "[23]"
            - paragraph [ref=f135e418]:
              - text: Despite Herschel's coinage, for several decades it remained common practice to refer to these objects as planets
              - superscript [ref=f135e419]:
                - link "[16]" [ref=f135e420] [cursor=pointer]:
                  - /url: "#cite_note-asteroids-16"
                  - generic [ref=f135e421]: "[16]"
              - text: "and to prefix their names with numbers representing their sequence of discovery: 1 Ceres, 2 Pallas, 3 Juno, 4 Vesta. In 1845, though, the astronomer"
              - link "Karl Ludwig Hencke" [ref=f135e422] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Karl_Ludwig_Hencke
              - text: detected a fifth object (
              - link "5 Astraea" [ref=f135e423] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/5_Astraea
              - text: ) and, shortly thereafter, new objects were found at an accelerating rate. Counting them among the planets became increasingly cumbersome. Eventually, they were dropped from the planet list (as first suggested by
              - link "Alexander von Humboldt" [ref=f135e424] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Alexander_von_Humboldt
              - text: in the early 1850s) and Herschel's coinage, "asteroids", gradually came into common use.
              - superscript [ref=f135e425]:
                - link "[16]" [ref=f135e426] [cursor=pointer]:
                  - /url: "#cite_note-asteroids-16"
                  - generic [ref=f135e427]: "[16]"
            - paragraph [ref=f135e428]:
              - text: The discovery of
              - link "Neptune" [ref=f135e429] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Neptune
              - text: in 1846 led to the discrediting of the Titius–Bode law in the eyes of scientists because its orbit was nowhere near the predicted position. To date, no scientific explanation for the law has been given, and astronomers' consensus regards it as a coincidence.
              - superscript [ref=f135e430]:
                - link "[28]" [ref=f135e431] [cursor=pointer]:
                  - /url: "#cite_note-28"
                  - generic [ref=f135e432]: "[28]"
            - figure "951 Gaspra, the first asteroid imaged by a spacecraft, as viewed during Galileo's 1991 flyby; colors are exaggerated" [ref=f135e433]:
              - link [ref=f135e434] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:951_Gaspra.jpg
                - img [ref=f135e435]
              - generic [ref=f135e436]:
                - link "951 Gaspra" [ref=f135e437] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/951_Gaspra
                - text: ", the first asteroid imaged by a spacecraft, as viewed during"
                - generic [ref=f135e438]:
                  - link "Galileo" [ref=f135e439] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Galileo_(spacecraft)
                  - text: "'"
                - text: s 1991 flyby; colors are exaggerated
            - paragraph [ref=f135e440]:
              - text: The expression "asteroid belt" came into use in the early 1850s, although pinpointing who coined the term is difficult. The first English use seems to be in the 1850 translation (by
              - link "Elise Otté" [ref=f135e441] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Elise_Otté
              - text: ) of Alexander von Humboldt's
              - link "Cosmos" [ref=f135e443] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Cosmos_(Humboldt)
              - text: ":"
              - superscript [ref=f135e444]:
                - link "[29]" [ref=f135e445] [cursor=pointer]:
                  - /url: "#cite_note-29"
                  - generic [ref=f135e446]: "[29]"
              - text: "\"[...] and the regular appearance, about the 13th of November and the 11th of August, of shooting stars, which probably form part of a belt of asteroids intersecting the Earth's orbit and moving with planetary velocity\". Another early appearance occurred in"
              - link "Robert James Mann" [ref=f135e447] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Robert_James_Mann
              - text: "'s A Guide to the Knowledge of the Heavens:"
              - superscript [ref=f135e448]:
                - link "[30]" [ref=f135e449] [cursor=pointer]:
                  - /url: "#cite_note-30"
                  - generic [ref=f135e450]: "[30]"
              - text: "\"The orbits of the asteroids are placed in a wide belt of space, extending between the extremes of [...]\". The American astronomer"
              - link "Benjamin Peirce" [ref=f135e451] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Benjamin_Peirce
              - text: seems to have adopted that terminology and to have been one of its promoters.
              - superscript [ref=f135e452]:
                - link "[31]" [ref=f135e453] [cursor=pointer]:
                  - /url: "#cite_note-ENPJ1857-31"
                  - generic [ref=f135e454]: "[31]"
            - paragraph [ref=f135e455]:
              - text: Over 100 asteroids had been located by mid-1868, and in 1891, the introduction of
              - link "astrophotography" [ref=f135e456] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Astrophotography
              - text: by
              - link "Max Wolf" [ref=f135e457] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Max_Wolf
              - text: accelerated the rate of discovery.
              - superscript [ref=f135e458]:
                - link "[32]" [ref=f135e459] [cursor=pointer]:
                  - /url: "#cite_note-32"
                  - generic [ref=f135e460]: "[32]"
              - text: A total of 1,000 asteroids had been found by 1921,
              - superscript [ref=f135e461]:
                - link "[33]" [ref=f135e462] [cursor=pointer]:
                  - /url: "#cite_note-33"
                  - generic [ref=f135e463]: "[33]"
              - text: 10,000 by 1981,
              - superscript [ref=f135e464]:
                - link "[34]" [ref=f135e465] [cursor=pointer]:
                  - /url: "#cite_note-34"
                  - generic [ref=f135e466]: "[34]"
              - text: and 100,000 by 2000.
              - superscript [ref=f135e467]:
                - link "[35]" [ref=f135e468] [cursor=pointer]:
                  - /url: "#cite_note-35"
                  - generic [ref=f135e469]: "[35]"
              - text: Modern asteroid survey systems now use automated means to locate new minor planets in ever-increasing numbers.
              - superscript [ref=f135e470]:
                - text: "["
                - link "citation needed" [ref=f135e472] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
            - paragraph [ref=f135e473]:
              - text: On 22 January 2014,
              - link "European Space Agency" [ref=f135e474] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/European_Space_Agency
              - text: (ESA) scientists reported the detection, for the first definitive time, of
              - link "water vapor" [ref=f135e475] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Water_vapor
              - text: on Ceres, the largest object in the asteroid belt.
              - superscript [ref=f135e476]:
                - link "[36]" [ref=f135e477] [cursor=pointer]:
                  - /url: "#cite_note-KüppersO'Rourke2014-36"
                  - generic [ref=f135e478]: "[36]"
              - text: The detection was made by using the
              - link "far-infrared abilities" [ref=f135e479] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Far-infrared_astronomy
              - text: of the
              - link "Herschel Space Observatory" [ref=f135e480] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Herschel_Space_Observatory
              - text: .
              - superscript [ref=f135e481]:
                - link "[37]" [ref=f135e482] [cursor=pointer]:
                  - /url: "#cite_note-NASA-20140122-37"
                  - generic [ref=f135e483]: "[37]"
              - text: The finding was unexpected because
              - link "comets" [ref=f135e484] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Comet
              - text: ", not asteroids, are typically considered to \"sprout jets and plumes\". According to one of the scientists, \"The lines are becoming more and more blurred between comets and asteroids\"."
              - superscript [ref=f135e485]:
                - link "[37]" [ref=f135e486] [cursor=pointer]:
                  - /url: "#cite_note-NASA-20140122-37"
                  - generic [ref=f135e487]: "[37]"
          - region "Origin" [ref=f135e488]:
            - generic [ref=f135e489]:
              - heading "Origin" [level=2] [ref=f135e490]: Origin
              - generic [ref=f135e491]:
                - link "edit":
                  - /url: /w/index.php?title=Asteroid_belt&action=edit&section=2
            - figure "The asteroid belt showing the orbital inclinations versus distances from the Sun, with asteroids in the core region of the asteroid belt in red and other asteroids in blue" [ref=f135e492]:
              - link [ref=f135e493] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Main_belt_i_vs_a.png
                - img [ref=f135e494]
              - generic [ref=f135e495]: The asteroid belt showing the orbital inclinations versus distances from the Sun, with asteroids in the core region of the asteroid belt in red and other asteroids in blue
            - region "Formation" [ref=f135e496]:
              - generic [ref=f135e497]:
                - heading "Formation" [level=3] [ref=f135e498]
                - generic [ref=f135e499]:
                  - link "edit":
                    - /url: /w/index.php?title=Asteroid_belt&action=edit&section=3
              - paragraph [ref=f135e500]:
                - text: In 1802, shortly after discovering Pallas, Olbers suggested to Herschel and
                - link "Carl Gauss" [ref=f135e501] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Carl_Gauss
                - text: that Ceres and Pallas were
                - link "fragments of a much larger planet" [ref=f135e502] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Phaeton_(hypothetical_planet)
                - text: that once occupied the Mars–Jupiter region, with this planet having suffered an internal explosion or a cometary impact many million years before,
                - superscript [ref=f135e503]:
                  - link "[38]" [ref=f135e504] [cursor=pointer]:
                    - /url: "#cite_note-38"
                    - generic [ref=f135e505]: "[38]"
                - text: while
                - link "Odesan" [ref=f135e506] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Odesa
                - text: astronomer K. N. Savchenko suggested that Ceres, Pallas, Juno, and Vesta were escaped moons rather than fragments of the exploded planet.
                - superscript [ref=f135e507]:
                  - link "[39]" [ref=f135e508] [cursor=pointer]:
                    - /url: "#cite_note-originoftheasteroids-39"
                    - generic [ref=f135e509]: "[39]"
                - text: The large amount of energy required to destroy a planet, combined with the belt's low combined mass, which is only about 4% of the mass of Earth's Moon,
                - superscript [ref=f135e510]:
                  - link "[3]" [ref=f135e511] [cursor=pointer]:
                    - /url: "#cite_note-Krasinskyetal2002-3"
                    - generic [ref=f135e512]: "[3]"
                - text: does not support these hypotheses. Further, the significant chemical differences between the asteroids become difficult to explain if they come from the same planet.
                - superscript [ref=f135e513]:
                  - link "[40]" [ref=f135e514] [cursor=pointer]:
                    - /url: "#cite_note-40"
                    - generic [ref=f135e515]: "[40]"
              - paragraph [ref=f135e516]:
                - text: A modern hypothesis for the asteroid belt's creation relates to the long-standing
                - link "nebular hypothesis" [ref=f135e517] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Nebular_hypothesis
                - text: ; a cloud of
                - link "interstellar dust" [ref=f135e518] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Cosmic_dust
                - text: and gas collapsed under the influence of gravity to form a rotating disc of material that then conglomerated to form the Sun and planets.
                - superscript [ref=f135e519]:
                  - link "[41]" [ref=f135e520] [cursor=pointer]:
                    - /url: "#cite_note-41"
                    - generic [ref=f135e521]: "[41]"
                - text: During the first few million years of the Solar System's history, an accretion process of sticky collisions caused the clumping of small particles, which gradually increased in size. Once the clumps reached sufficient mass, they could draw in other bodies through gravitational attraction and become planetesimals. This gravitational
                - link "accretion" [ref=f135e522] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Accretion_(astrophysics)
                - text: led to the formation of the planets.
                - superscript [ref=f135e523]:
                  - link "[42]" [ref=f135e524] [cursor=pointer]:
                    - /url: "#cite_note-Chambers_2004-42"
                    - generic [ref=f135e525]: "[42]"
              - paragraph [ref=f135e526]:
                - text: Planetesimals within the region that would become the asteroid belt were strongly
                - link "perturbed" [ref=f135e527] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Perturbation_(astronomy)
                - text: by Jupiter's gravity.
                - superscript [ref=f135e528]:
                  - link "[43]" [ref=f135e529] [cursor=pointer]:
                    - /url: "#cite_note-icarus153-43"
                    - generic [ref=f135e530]: "[43]"
                - link "Orbital resonances" [ref=f135e531] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Orbital_resonance
                - text: occurred where the
                - link "orbital period" [ref=f135e532] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Orbital_period
                - text: of an object in the belt formed an integer fraction of the orbital period of Jupiter, perturbing the object into a different orbit; the region lying between the orbits of Mars and Jupiter contains many such orbital resonances. As
                - link "Jupiter migrated inward" [ref=f135e533] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Nice_model
                - text: following its formation, these resonances would have swept across the asteroid belt, dynamically exciting the region's population and increasing their velocities relative to each other.
                - superscript [ref=f135e534]:
                  - link "[44]" [ref=f135e535] [cursor=pointer]:
                    - /url: "#cite_note-44"
                    - generic [ref=f135e536]: "[44]"
                - text: In regions where the average velocity of the collisions was too high, the shattering of planetesimals tended to dominate over accretion,
                - superscript [ref=f135e537]:
                  - link "[45]" [ref=f135e538] [cursor=pointer]:
                    - /url: "#cite_note-45"
                    - generic [ref=f135e539]: "[45]"
                - text: preventing the formation of a planet. Instead, they continued to orbit the Sun as before, occasionally colliding.
                - superscript [ref=f135e540]:
                  - link "[43]" [ref=f135e541] [cursor=pointer]:
                    - /url: "#cite_note-icarus153-43"
                    - generic [ref=f135e542]: "[43]"
              - paragraph [ref=f135e543]:
                - text: During the early history of the Solar System, the asteroids melted to some degree, allowing elements within them to be
                - link "differentiated" [ref=f135e544] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Planetary_differentiation
                - text: by mass. Some of the progenitor bodies may even have undergone periods of explosive
                - link "volcanism" [ref=f135e545] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Volcanism
                - text: and formed
                - link "magma" [ref=f135e546] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Magma
                - text: oceans. Because of the relatively small size of the bodies, though, the period of melting was necessarily brief compared to the much larger planets, and had generally ended about 4.5 billion years ago, in the first tens of millions of years of formation.
                - superscript [ref=f135e547]:
                  - link "[46]" [ref=f135e548] [cursor=pointer]:
                    - /url: "#cite_note-46"
                    - generic [ref=f135e549]: "[46]"
                - text: In August 2007, a study of
                - link "zircon" [ref=f135e550] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Zircon
                - text: crystals in an Antarctic meteorite believed to have originated from Vesta suggested that it, and by extension the rest of the asteroid belt, had formed rather quickly, within 10 million years of the Solar System's origin.
                - superscript [ref=f135e551]:
                  - link "[47]" [ref=f135e552] [cursor=pointer]:
                    - /url: "#cite_note-47"
                    - generic [ref=f135e553]: "[47]"
              - note [ref=f135e554]:
                - text: "See also:"
                - link "Nice model" [ref=f135e555] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Nice_model
            - region "Evolution" [ref=f135e556]:
              - generic [ref=f135e557]:
                - heading "Evolution" [level=3] [ref=f135e558]
                - generic [ref=f135e559]:
                  - link "edit":
                    - /url: /w/index.php?title=Asteroid_belt&action=edit&section=4
              - figure "Large main belt asteroid 4 Vesta" [ref=f135e560]:
                - link [ref=f135e561] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:Vesta_from_Dawn,_July_18.jpg
                  - img [ref=f135e562]
                - generic [ref=f135e563]:
                  - text: Large main belt asteroid
                  - link "4 Vesta" [ref=f135e564] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/4_Vesta
              - paragraph [ref=f135e565]:
                - text: The asteroids are not pristine samples of the primordial Solar System. They have undergone considerable evolution since their formation, including internal heating (in the first few tens of millions of years), surface melting from impacts,
                - link "space weathering" [ref=f135e566] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Space_weathering
                - text: from radiation, and bombardment by
                - link "micrometeorites" [ref=f135e567] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Micrometeorites
                - text: .
                - superscript [ref=f135e568]:
                  - link "[48]" [ref=f135e569] [cursor=pointer]:
                    - /url: "#cite_note-48"
                    - generic [ref=f135e570]: "[48]"
                - superscript [ref=f135e571]:
                  - link "[49]" [ref=f135e572] [cursor=pointer]:
                    - /url: "#cite_note-49"
                    - generic [ref=f135e573]: "[49]"
                - superscript [ref=f135e574]:
                  - link "[50]" [ref=f135e575] [cursor=pointer]:
                    - /url: "#cite_note-50"
                    - generic [ref=f135e576]: "[50]"
                - superscript [ref=f135e577]:
                  - link "[51]" [ref=f135e578] [cursor=pointer]:
                    - /url: "#cite_note-51"
                    - generic [ref=f135e579]: "[51]"
                - text: Although some scientists refer to the asteroids as residual planetesimals,
                - superscript [ref=f135e580]:
                  - link "[52]" [ref=f135e581] [cursor=pointer]:
                    - /url: "#cite_note-52"
                    - generic [ref=f135e582]: "[52]"
                - text: other scientists consider them distinct.
                - superscript [ref=f135e583]:
                  - link "[53]" [ref=f135e584] [cursor=pointer]:
                    - /url: "#cite_note-53"
                    - generic [ref=f135e585]: "[53]"
              - paragraph [ref=f135e586]:
                - text: The current asteroid belt is believed to contain only a small fraction of the mass of the primordial belt. Computer simulations suggest that the original asteroid belt may have contained mass equivalent to the Earth's.
                - superscript [ref=f135e587]:
                  - link "[54]" [ref=f135e588] [cursor=pointer]:
                    - /url: "#cite_note-54"
                    - generic [ref=f135e589]: "[54]"
                - text: Primarily because of gravitational perturbations, most of the material was ejected from the belt within about 1 million years of formation, leaving behind less than 0.1% of the original mass.
                - superscript [ref=f135e590]:
                  - link "[43]" [ref=f135e591] [cursor=pointer]:
                    - /url: "#cite_note-icarus153-43"
                    - generic [ref=f135e592]: "[43]"
                - text: Since its formation, the size distribution of the asteroid belt has remained relatively stable; no significant increase or decrease in the typical dimensions of the main-belt asteroids has occurred.
                - superscript [ref=f135e593]:
                  - link "[55]" [ref=f135e594] [cursor=pointer]:
                    - /url: "#cite_note-55"
                    - generic [ref=f135e595]: "[55]"
              - paragraph [ref=f135e596]:
                - text: The 4:1
                - link "orbital resonance" [ref=f135e597] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Orbital_resonance
                - text: with Jupiter, at a radius 2.06
                - link "astronomical units" [ref=f135e598] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Astronomical_unit
                - text: (AUs), can be considered the inner boundary of the asteroid belt. Perturbations by Jupiter send bodies straying there into unstable orbits. Most bodies formed within the radius of this gap were swept up by Mars (which has an
                - link "aphelion" [ref=f135e599] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Aphelion
                - text: at 1.67 AU) or ejected by its gravitational perturbations in the early history of the Solar System.
                - superscript [ref=f135e600]:
                  - link "[56]" [ref=f135e601] [cursor=pointer]:
                    - /url: "#cite_note-56"
                    - generic [ref=f135e602]: "[56]"
                - text: The
                - link "Hungaria asteroids" [ref=f135e603] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hungaria_asteroids
                - text: lie closer to the Sun than the 4:1 resonance, but are protected from disruption by their high inclination.
                - superscript [ref=f135e604]:
                  - link "[57]" [ref=f135e605] [cursor=pointer]:
                    - /url: "#cite_note-hungaria-57"
                    - generic [ref=f135e606]: "[57]"
              - paragraph [ref=f135e607]:
                - text: When the asteroid belt was first formed, the temperatures at a distance of 2.7 AU from the Sun formed a "
                - link "snow line" [ref=f135e608] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Frost_line_(astrophysics)
                - text: "\" below the freezing point of water. Planetesimals formed beyond this radius were able to accumulate ice."
                - superscript [ref=f135e609]:
                  - link "[58]" [ref=f135e610] [cursor=pointer]:
                    - /url: "#cite_note-58"
                    - generic [ref=f135e611]: "[58]"
                - superscript [ref=f135e612]:
                  - link "[59]" [ref=f135e613] [cursor=pointer]:
                    - /url: "#cite_note-59"
                    - generic [ref=f135e614]: "[59]"
                - text: In 2006, a population of
                - link "comets" [ref=f135e615] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Main-belt_comet
                - text: had been discovered within the asteroid belt beyond the snow line, which may have provided a source of water for Earth's oceans. According to some models,
                - link "outgassing" [ref=f135e616] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Outgassing
                - text: of water during the Earth's formative period was insufficient to form the oceans, requiring an external source such as a cometary bombardment.
                - superscript [ref=f135e617]:
                  - link "[60]" [ref=f135e618] [cursor=pointer]:
                    - /url: "#cite_note-60"
                    - generic [ref=f135e619]: "[60]"
              - paragraph [ref=f135e620]:
                - text: The outer asteroid belt includes a few icy objects that may have been implanted there during the last few hundred years. One of these objects is the
                - link "quasi-Hilda comet" [ref=f135e621] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Quasi-Hilda_comet
                - text: 362P/
                - link "(457175) 2008 GO98" [ref=f135e623] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/(457175)_2008_GO98
                  - text: (457175) 2008 GO
                  - generic [ref=f135e624]: "98"
                - text: ", which is thought to be a possible former"
                - link "centaur" [ref=f135e625] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Centaur_(small_Solar_System_body)
                - text: that was sent to the outer asteroid belt via a close encounter with Jupiter.
                - superscript [ref=f135e626]:
                  - link "[61]" [ref=f135e627] [cursor=pointer]:
                    - /url: "#cite_note-new-61"
                    - generic [ref=f135e628]: "[61]"
          - region "Characteristics" [ref=f135e629]:
            - generic [ref=f135e630]:
              - heading "Characteristics" [level=2] [ref=f135e631]
              - generic [ref=f135e632]:
                - link "edit":
                  - /url: /w/index.php?title=Asteroid_belt&action=edit&section=5
            - figure "Size distribution of asteroids in the main belt[62]" [ref=f135e633]:
              - link [ref=f135e634] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Main_belt_asteroid_size_distribution.svg
                - img [ref=f135e635]
              - generic [ref=f135e636]:
                - text: Size distribution of asteroids in the main belt
                - superscript [ref=f135e637]:
                  - link "[62]" [ref=f135e638] [cursor=pointer]:
                    - /url: "#cite_note-62"
                    - generic [ref=f135e639]: "[62]"
            - generic [ref=f135e643]:
              - generic [ref=f135e644]:
                - text: The masses of the largest asteroids as a percent of the Main Belt. The unit of mass is×10
                - superscript [ref=f135e645]:
                  - generic [ref=f135e646]: "18"
                - text: kg.
              - list [ref=f135e647]:
                - listitem [ref=f135e648]:
                  - generic [ref=f135e650]:
                    - link "1 Ceres" [ref=f135e651] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/1_Ceres
                    - text: 938 (39.2%)
                - listitem [ref=f135e652]:
                  - generic [ref=f135e654]:
                    - link "4 Vesta" [ref=f135e655] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/4_Vesta
                    - text: 259 (10.8%)
                - listitem [ref=f135e656]:
                  - generic [ref=f135e658]:
                    - link "2 Pallas" [ref=f135e659] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/2_Pallas
                    - text: 204 (8.52%)
                - listitem [ref=f135e660]:
                  - generic [ref=f135e662]:
                    - link "10 Hygiea" [ref=f135e663] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/10_Hygiea
                    - text: 87 (3.63%)
                - listitem [ref=f135e664]:
                  - generic [ref=f135e666]:
                    - link "704 Interamnia" [ref=f135e667] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/704_Interamnia
                    - text: 35 (1.46%)
                - listitem [ref=f135e668]:
                  - generic [ref=f135e670]:
                    - link "15 Eunomia" [ref=f135e671] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/15_Eunomia
                    - text: 30 (1.25%)
                - listitem [ref=f135e672]:
                  - generic [ref=f135e674]: "remainder: 841 (35.1%)"
            - paragraph [ref=f135e687]:
              - text: Contrary to popular imagery, the asteroid belt is mostly empty. The asteroids are spread over such a large volume that reaching an asteroid without aiming carefully would be improbable.
              - superscript [ref=f135e688]:
                - link "[63]" [ref=f135e689] [cursor=pointer]:
                  - /url: "#cite_note-63"
                  - generic [ref=f135e690]: "[63]"
              - text: Nonetheless, hundreds of thousands of asteroids are currently known, and the total number ranges in the millions or more, depending on the lower size cutoff. Over 200 asteroids are larger than 100 km,
              - superscript [ref=f135e691]:
                - link "[64]" [ref=f135e692] [cursor=pointer]:
                  - /url: "#cite_note-64"
                  - generic [ref=f135e693]: "[64]"
              - text: and a survey in the infrared wavelengths has shown that the asteroid belt has between 700,000 and 1.7 million asteroids with a diameter of 1 km or more.
              - superscript [ref=f135e694]:
                - link "[65]" [ref=f135e695] [cursor=pointer]:
                  - /url: "#cite_note-65"
                  - generic [ref=f135e696]: "[65]"
            - paragraph [ref=f135e697]:
              - text: The number of asteroids in the main belt steadily increases with decreasing size. Although the size distribution generally follows a
              - link "power law" [ref=f135e698] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Power_law
              - text: ", there are 'bumps' in the curve at about"
              - generic [ref=f135e699]: 5 km
              - text: and
              - generic [ref=f135e700]: 100 km
              - text: ", where more asteroids than expected from such a curve are found. Most asteroids larger than approximately"
              - generic [ref=f135e701]: 120 km
              - text: in diameter are primordial, having survived from the accretion epoch, whereas most smaller asteroids are products of fragmentation of primordial asteroids. The primordial population of the main belt was probably 200 times what it is today.
              - superscript [ref=f135e702]:
                - link "[66]" [ref=f135e703] [cursor=pointer]:
                  - /url: "#cite_note-66"
                  - generic [ref=f135e704]: "[66]"
              - superscript [ref=f135e705]:
                - link "[67]" [ref=f135e706] [cursor=pointer]:
                  - /url: "#cite_note-67"
                  - generic [ref=f135e707]: "[67]"
            - paragraph [ref=f135e708]:
              - text: On average the distance between the asteroids is about 965,600 km (600,000 miles),
              - superscript [ref=f135e709]:
                - link "[68]" [ref=f135e710] [cursor=pointer]:
                  - /url: "#cite_note-EarthSky_Updates_on_your_cosmos_and_world_2021-68"
                  - generic [ref=f135e711]: "[68]"
              - superscript [ref=f135e712]:
                - link "[69]" [ref=f135e713] [cursor=pointer]:
                  - /url: "#cite_note-Williams_2016-69"
                  - generic [ref=f135e714]: "[69]"
              - text: although this varies among asteroid families and smaller undetected asteroids might be even closer. The total mass of the asteroid belt is estimated to be
              - generic [ref=f135e715]:
                - text: 2.39×10
                - superscript [ref=f135e716]: "21"
              - text: kg, which is 3% of the mass of the Moon.
              - superscript [ref=f135e717]:
                - link "[2]" [ref=f135e718] [cursor=pointer]:
                  - /url: "#cite_note-Pitjeva2018-2"
                  - generic [ref=f135e719]: "[2]"
              - text: The four largest objects, Ceres, Vesta, Pallas, and Hygiea, contain an estimated 62% of the belt's total mass, with 39% accounted for by Ceres alone.
              - superscript [ref=f135e720]:
                - link "[70]" [ref=f135e721] [cursor=pointer]:
                  - /url: "#cite_note-70"
                  - generic [ref=f135e722]: "[70]"
              - superscript [ref=f135e723]:
                - link "[5]" [ref=f135e724] [cursor=pointer]:
                  - /url: "#cite_note-halfmass-5"
                  - generic [ref=f135e725]: "[5]"
              - text: "The asteroid belt can be categorized into two parts: an inner belt containing mostly silicate-rich asteroids, 2.8 AU from the Sun, and an outer belt, containing mostly asteroids rich in carbon, at 3.2 AU."
              - superscript [ref=f135e726]:
                - link "[71]" [ref=f135e727] [cursor=pointer]:
                  - /url: "#cite_note-71"
                  - generic [ref=f135e728]: "[71]"
            - region "Composition" [ref=f135e729]:
              - generic [ref=f135e730]:
                - heading "Composition" [level=3] [ref=f135e731]
                - generic [ref=f135e732]:
                  - link "edit":
                    - /url: /w/index.php?title=Asteroid_belt&action=edit&section=6
              - note [ref=f135e733]:
                - text: "Main article:"
                - link "Asteroid spectral types" [ref=f135e734] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Asteroid_spectral_types
              - figure "Distribution of asteroid spectral types by distance from the Sun[72]" [ref=f135e735]:
                - link [ref=f135e736] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:Asteroid_populations_by_orbital_distance.svg
                  - img [ref=f135e737]
                - generic [ref=f135e738]:
                  - text: Distribution of asteroid spectral types by distance from the Sun
                  - superscript [ref=f135e739]:
                    - link "[72]" [ref=f135e740] [cursor=pointer]:
                      - /url: "#cite_note-72"
                      - generic [ref=f135e741]: "[72]"
              - paragraph [ref=f135e742]:
                - text: "The present day belt consists primarily of three categories of asteroids: C-type carbonaceous asteroids,"
                - link "S-type" [ref=f135e743] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/S-type_asteroid
                - text: silicate asteroids, and a hybrid group of X-type asteroids. The hybrid group have featureless spectra, but they can be divided into three groups based on reflectivity, yielding the
                - link "M-type" [ref=f135e744] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/M-type_asteroid
                - text: metallic, P-type primitive, and E-type
                - link "enstatite" [ref=f135e745] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Enstatite
                - text: asteroids. Additional types have been found that do not fit within these primary classes. There is a compositional trend of asteroid types by increasing distance from the Sun, in the order of S, C, P, and the spectrally-featureless
                - link "D-types" [ref=f135e746] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/D-type_asteroid
                - text: .
                - superscript [ref=f135e747]:
                  - link "[73]" [ref=f135e748] [cursor=pointer]:
                    - /url: "#cite_note-DeMeo_et_al_2015-73"
                    - generic [ref=f135e749]: "[73]"
              - figure "Fragment of the Allende meteorite, a carbonaceous chondrite that fell to Earth in Mexico in 1969" [ref=f135e750]:
                - link [ref=f135e751] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:AllendeMeteorite.jpg
                  - img [ref=f135e752]
                - generic [ref=f135e753]:
                  - text: Fragment of the
                  - link "Allende meteorite" [ref=f135e754] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Allende_meteorite
                  - text: ", a carbonaceous chondrite that fell to Earth in Mexico in 1969"
              - paragraph [ref=f135e755]:
                - link "Carbonaceous asteroids" [ref=f135e756] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/C-type_asteroid
                - text: ", as their name suggests, are carbon-rich. They dominate the asteroid belt's outer regions,"
                - superscript [ref=f135e757]:
                  - link "[74]" [ref=f135e758] [cursor=pointer]:
                    - /url: "#cite_note-ApJ133-74"
                    - generic [ref=f135e759]: "[74]"
                - text: and are rare in the inner belt.
                - superscript [ref=f135e760]:
                  - link "[73]" [ref=f135e761] [cursor=pointer]:
                    - /url: "#cite_note-DeMeo_et_al_2015-73"
                    - generic [ref=f135e762]: "[73]"
                - text: Together they comprise over 75% of the visible asteroids. They are redder in hue than the other asteroids and have a low
                - link "albedo" [ref=f135e763] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Albedo
                - text: . Their surface compositions are similar to
                - link "carbonaceous chondrite" [ref=f135e764] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Carbonaceous_chondrite
                - link "meteorites" [ref=f135e765] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Meteorite
                - text: . Chemically, their spectra match the primordial composition of the early Solar System, with hydrogen, helium, and
                - link "volatiles" [ref=f135e766] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Volatile_(astrogeology)
                - text: removed.
                - superscript [ref=f135e767]:
                  - link "[75]" [ref=f135e768] [cursor=pointer]:
                    - /url: "#cite_note-Blair_2002-75"
                    - generic [ref=f135e769]: "[75]"
              - paragraph [ref=f135e770]:
                - text: S-type (
                - link "silicate" [ref=f135e771] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Silicate
                - text: "-rich) asteroids are more common toward the inner region of the belt, within 2.5 AU of the Sun."
                - superscript [ref=f135e772]:
                  - link "[74]" [ref=f135e773] [cursor=pointer]:
                    - /url: "#cite_note-ApJ133-74"
                    - generic [ref=f135e774]: "[74]"
                - superscript [ref=f135e775]:
                  - link "[76]" [ref=f135e776] [cursor=pointer]:
                    - /url: "#cite_note-76"
                    - generic [ref=f135e777]: "[76]"
                - text: The spectra of their surfaces reveal the presence of silicates and some metal, but no significant carbonaceous compounds. This indicates that their materials have been significantly modified from their primordial composition, probably through melting and reformation. They have a relatively high albedo and form about 17% of the total asteroid population.
                - superscript [ref=f135e778]:
                  - link "[75]" [ref=f135e779] [cursor=pointer]:
                    - /url: "#cite_note-Blair_2002-75"
                    - generic [ref=f135e780]: "[75]"
              - paragraph [ref=f135e781]:
                - text: M-type (metal-rich) asteroids are typically found in the middle of the main belt, and they make up much of the remainder of the total population.
                - superscript [ref=f135e782]:
                  - link "[75]" [ref=f135e783] [cursor=pointer]:
                    - /url: "#cite_note-Blair_2002-75"
                    - generic [ref=f135e784]: "[75]"
                - text: Their spectra resemble that of iron-nickel. Some are believed to have formed from the metallic cores of differentiated progenitor bodies that were
                - link "disrupted" [ref=f135e785] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Disrupted_planet
                - text: through collision. However, some silicate compounds also can produce a similar appearance. For example, the large M-type asteroid
                - link "22 Kalliope" [ref=f135e786] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/22_Kalliope
                - text: does not appear to be primarily composed of metal.
                - superscript [ref=f135e787]:
                  - link "[77]" [ref=f135e788] [cursor=pointer]:
                    - /url: "#cite_note-77"
                    - generic [ref=f135e789]: "[77]"
                - text: Within the asteroid belt, the number distribution of M-type asteroids peaks at a semimajor axis of about 2.7 AU.
                - superscript [ref=f135e790]:
                  - link "[78]" [ref=f135e791] [cursor=pointer]:
                    - /url: "#cite_note-lang2003-78"
                    - generic [ref=f135e792]: "[78]"
                - text: Whether all M-types are compositionally similar, or whether it is a label for several varieties which do not fit neatly into the main C and S classes is not yet clear.
                - superscript [ref=f135e793]:
                  - link "[79]" [ref=f135e794] [cursor=pointer]:
                    - /url: "#cite_note-79"
                    - generic [ref=f135e795]: "[79]"
              - paragraph [ref=f135e796]:
                - text: One mystery is the relative rarity of
                - link "V-type" [ref=f135e797] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/V-type_asteroid
                - text: (Vestoid) or
                - link "basaltic" [ref=f135e798] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Basaltic
                - text: asteroids in the asteroid belt.
                - superscript [ref=f135e799]:
                  - link "[80]" [ref=f135e800] [cursor=pointer]:
                    - /url: "#cite_note-Duffard-80"
                    - generic [ref=f135e801]: "[80]"
                - text: Theories of asteroid formation predict that objects the size of Vesta or larger should form crusts and mantles, which would be composed mainly of basaltic rock, resulting in more than half of all asteroids being composed either of basalt or of
                - link "olivine" [ref=f135e802] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Olivine
                - text: . However, observations suggest that 99% of the predicted basaltic material is missing.
                - superscript [ref=f135e803]:
                  - link "[81]" [ref=f135e804] [cursor=pointer]:
                    - /url: "#cite_note-olivine-81"
                    - generic [ref=f135e805]: "[81]"
                - text: Until 2001, most basaltic bodies discovered in the asteroid belt were believed to originate from the asteroid Vesta (hence their name V-type), but the discovery of the asteroid
                - link "1459 Magnya" [ref=f135e806] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/1459_Magnya
                - text: revealed a slightly different chemical composition from the other basaltic asteroids discovered until then, suggesting a different origin.
                - superscript [ref=f135e807]:
                  - link "[81]" [ref=f135e808] [cursor=pointer]:
                    - /url: "#cite_note-olivine-81"
                    - generic [ref=f135e809]: "[81]"
                - text: This hypothesis was reinforced by the further discovery in 2007 of two asteroids in the outer belt,
                - link "7472 Kumakiri" [ref=f135e810] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/7472_Kumakiri
                - text: and
                - link "(10537) 1991 RY16" [ref=f135e812] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/(10537)_1991_RY16
                  - text: (10537) 1991 RY
                  - generic [ref=f135e813]: "16"
                - text: ", with a differing basaltic composition that could not have originated from Vesta. These two are the only V-type asteroids discovered in the outer belt to date."
                - superscript [ref=f135e814]:
                  - link "[80]" [ref=f135e815] [cursor=pointer]:
                    - /url: "#cite_note-Duffard-80"
                    - generic [ref=f135e816]: "[80]"
              - figure "Hubble views the multi-tailed cometary asteroid P/2013 P5.[82]" [ref=f135e817]:
                - link [ref=f135e818] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:Hubble_views_extraordinary_multi-tailed_asteroid_P2013_P5.jpg
                  - img [ref=f135e819]
                - generic [ref=f135e820]:
                  - link "Hubble" [ref=f135e821] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Hubble_Space_Telescope
                  - text: views the multi-tailed cometary asteroid
                  - link "P/2013 P5" [ref=f135e822] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/P/2013_P5
                  - text: .
                  - superscript [ref=f135e823]:
                    - link "[82]" [ref=f135e824] [cursor=pointer]:
                      - /url: "#cite_note-82"
                      - generic [ref=f135e825]: "[82]"
              - paragraph [ref=f135e826]:
                - text: The temperature of the asteroid belt varies with the distance from the Sun. For dust particles within the belt, typical temperatures range from 200 K (−73 °C) at 2.2 AU down to 165 K (−108 °C) at 3.2 AU.
                - superscript [ref=f135e827]:
                  - link "[83]" [ref=f135e828] [cursor=pointer]:
                    - /url: "#cite_note-83"
                    - generic [ref=f135e829]: "[83]"
                - text: However, due to rotation, the surface temperature of an asteroid can vary considerably as the sides are alternately exposed to solar radiation then to the stellar background.
                - superscript [ref=f135e830]:
                  - text: "["
                  - link "citation needed" [ref=f135e832] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
            - region "Main-belt comets" [ref=f135e833]:
              - generic [ref=f135e834]:
                - heading "Main-belt comets" [level=3] [ref=f135e835]
                - generic [ref=f135e836]:
                  - link "edit":
                    - /url: /w/index.php?title=Asteroid_belt&action=edit&section=7
              - note [ref=f135e837]:
                - text: "Main article:"
                - link "Main-belt comet" [ref=f135e838] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Main-belt_comet
              - paragraph [ref=f135e839]:
                - text: Several otherwise unremarkable bodies in the outer belt show
                - link "cometary" [ref=f135e840] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Comet
                - text: activity. Because their orbits cannot be explained through the capture of classical comets, many of the outer asteroids are thought to be icy, with the ice occasionally exposed to sublimation through small impacts. Main-belt comets may have been a major source of the Earth's oceans because the deuterium-hydrogen ratio is too low for classical comets to have been the principal source.
                - superscript [ref=f135e841]:
                  - link "[84]" [ref=f135e842] [cursor=pointer]:
                    - /url: "#cite_note-84"
                    - generic [ref=f135e843]: "[84]"
            - region "Orbits" [ref=f135e844]:
              - generic [ref=f135e845]:
                - heading "Orbits" [level=3] [ref=f135e846]
                - generic [ref=f135e847]:
                  - link "edit":
                    - /url: /w/index.php?title=Asteroid_belt&action=edit&section=8
              - figure "The asteroid belt (showing eccentricities), with the asteroid belt in red and blue (\"core\" region in red)" [ref=f135e848]:
                - link [ref=f135e849] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/File:Main_belt_e_vs_a.png
                  - img [ref=f135e850]
                - generic [ref=f135e851]: The asteroid belt (showing eccentricities), with the asteroid belt in red and blue ("core" region in red)
              - paragraph [ref=f135e852]:
                - text: Most asteroids within the asteroid belt have orbital eccentricities of less than 0.4, and an inclination of less than 30°. The orbital distribution of the asteroids reaches a maximum at an eccentricity around 0.07 and an inclination below 4°.
                - superscript [ref=f135e853]:
                  - link "[85]" [ref=f135e854] [cursor=pointer]:
                    - /url: "#cite_note-mpc-85"
                    - generic [ref=f135e855]: "[85]"
                - text: Thus, although a typical asteroid has a relatively circular orbit and lies near the plane of the
                - link "ecliptic" [ref=f135e856] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ecliptic
                - text: ", some asteroid orbits can be highly eccentric or travel well outside the ecliptic plane."
                - superscript [ref=f135e857]:
                  - text: "["
                  - link "citation needed" [ref=f135e859] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                  - text: "]"
              - paragraph [ref=f135e860]:
                - text: Sometimes, the term "main belt" is used to refer only to the more compact "core" region where the greatest concentration of bodies is found. This lies between the strong 4:1 and 2:1
                - link "Kirkwood gaps" [ref=f135e861] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Kirkwood_gap
                - text: at 2.06 and 3.27 AU, and at
                - link "orbital eccentricities" [ref=f135e862] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Eccentricity_(orbit)
                - text: less than roughly 0.33, along with orbital
                - link "inclinations" [ref=f135e863] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Inclination
                - text: below about 20°. As of 2006
                - text: ", this \"core\" region contained 93% of all discovered and numbered minor planets within the Solar System."
                - superscript [ref=f135e864]:
                  - link "[86]" [ref=f135e865] [cursor=pointer]:
                    - /url: "#cite_note-basedon1-86"
                    - generic [ref=f135e866]: "[86]"
                - text: The
                - link "JPL Small-Body Database" [ref=f135e867] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/JPL_Small-Body_Database
                - text: lists over 1 million known main-belt asteroids.
                - superscript [ref=f135e868]:
                  - link "[87]" [ref=f135e869] [cursor=pointer]:
                    - /url: "#cite_note-JPL-MBA-87"
                    - generic [ref=f135e870]: "[87]"
              - region "Kirkwood gaps" [ref=f135e871]:
                - generic [ref=f135e872]:
                  - heading "Kirkwood gaps" [level=4] [ref=f135e873]
                  - generic [ref=f135e874]:
                    - link "edit":
                      - /url: /w/index.php?title=Asteroid_belt&action=edit&section=9
                - note [ref=f135e875]:
                  - text: "Main article:"
                  - link "Kirkwood gap" [ref=f135e876] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Kirkwood_gap
                - 'figure "Number of asteroids in the main belt as a function of their semimajor axis (a). The dashed lines indicate Kirkwood gaps, while colors designate the following zones: I: inner main-belt (a < 2.5 AU) II: middle main-belt (2.5 AU < a < 2.82 AU) III: outer main-belt (a > 2.82 AU)" [ref=f135e877]':
                  - link [ref=f135e878] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/File:Asteroid_histogram_2026.svg
                    - img [ref=f135e879]
                  - generic [ref=f135e880]:
                    - text: Number of asteroids in the main belt as a function of their
                    - link "semimajor axis" [ref=f135e881] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/Semi-major_and_semi-minor_axes
                    - text: (a). The dashed lines indicate
                    - link "Kirkwood gaps" [ref=f135e882] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/Kirkwood_gaps
                    - text: ", while colors designate the following zones:"
                    - generic [ref=f135e883]:
                      - text: "I: inner main-belt ("
                      - generic [ref=f135e885]:
                        - link "a" [ref=f135e886] [cursor=pointer]:
                          - /url: //en.wikipedia.org/wiki/Semi-major_and_semi-minor_axes
                        - text: < 2.5
                        - link "AU" [ref=f135e887] [cursor=pointer]:
                          - /url: //en.wikipedia.org/wiki/Astronomical_unit
                      - text: )
                    - generic [ref=f135e888]:
                      - text: "II: middle main-belt ("
                      - generic [ref=f135e890]: 2.5 AU < a < 2.82 AU
                      - text: )
                    - generic [ref=f135e891]:
                      - text: "III: outer main-belt ("
                      - generic [ref=f135e893]: a > 2.82 AU
                      - text: )
                - paragraph [ref=f135e894]:
                  - text: The
                  - link "semimajor axis" [ref=f135e895] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Semi-major_and_semi-minor_axes
                  - text: of an asteroid is used to describe the dimensions of its orbit around the Sun, and its value determines the minor planet's
                  - link "orbital period" [ref=f135e896] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Orbital_period
                  - text: . In 1866,
                  - link "Daniel Kirkwood" [ref=f135e897] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Daniel_Kirkwood
                  - text: announced the discovery of gaps in the distances of these bodies' orbits from the Sun. They were located in positions where their period of revolution about the Sun was an integer fraction of Jupiter's orbital period. Kirkwood proposed that the gravitational perturbations of the planet led to the removal of asteroids from these orbits.
                  - superscript [ref=f135e898]:
                    - link "[88]" [ref=f135e899] [cursor=pointer]:
                      - /url: "#cite_note-88"
                      - generic [ref=f135e900]: "[88]"
                - paragraph [ref=f135e901]:
                  - text: When the mean orbital period of an asteroid is an integer fraction of the orbital period of Jupiter, a
                  - link "mean-motion resonance" [ref=f135e902] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Mean-motion_resonance
                  - text: with the gas giant is created that is sufficient to perturb an asteroid to new
                  - link "orbital elements" [ref=f135e903] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Orbital_element
                  - text: . Primordial asteroids entered these gaps because of the migration of Jupiter's orbit.
                  - superscript [ref=f135e904]:
                    - link "[89]" [ref=f135e905] [cursor=pointer]:
                      - /url: "#cite_note-89"
                      - generic [ref=f135e906]: "[89]"
                  - text: Subsequently, asteroids primarily migrate into these gap orbits due to the
                  - link "Yarkovsky effect" [ref=f135e907] [cursor=pointer]:
                    - /url: //en.wikipedia.org/wiki/Yarkovsky_effect
                  - text: ","
                  - superscript [ref=f135e908]:
                    - link "[73]" [ref=f135e909] [cursor=pointer]:
                      - /url: "#cite_note-DeMeo_et_al_2015-73"
                      - generic [ref=f135e910]: "[73]"
                  - text: but may also enter because of perturbations or collisions. After entering, an asteroid is gradually nudged into a different, random orbit with a larger or smaller semimajor axis.
                  - superscript [ref=f135e911]:
                    - text: "["
                    - link "citation needed" [ref=f135e913] [cursor=pointer]:
                      - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                    - text: "]"
          - region "Collisions" [ref=f135e914]:
            - generic [ref=f135e915]:
              - heading "Collisions" [level=2] [ref=f135e916]
              - generic [ref=f135e917]:
                - link "edit":
                  - /url: /w/index.php?title=Asteroid_belt&action=edit&section=10
            - figure "The zodiacal light, parts of which are reflected by interplanetary dust, which in turn originates in part from collisions of asteroids." [ref=f135e918]:
              - link [ref=f135e919] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Zodiacal.jpg
                - img [ref=f135e920]
              - generic [ref=f135e921]:
                - text: The
                - link "zodiacal light" [ref=f135e922] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Zodiacal_light
                - text: ", parts of which are reflected by"
                - link "interplanetary dust" [ref=f135e923] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Interplanetary_dust
                - text: ", which in turn originates in part from collisions of asteroids."
            - paragraph [ref=f135e924]:
              - text: The high population of the asteroid belt makes for an active environment, where collisions between asteroids occur frequently (on
              - link "deep time" [ref=f135e925] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Deep_time
              - text: scales).
              - link "Impact events" [ref=f135e926] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Impact_event
              - text: between main-belt bodies with a mean radius of 10 km are expected to occur about once every 10 million years.
              - superscript [ref=f135e927]:
                - link "[90]" [ref=f135e928] [cursor=pointer]:
                  - /url: "#cite_note-backman_report-90"
                  - generic [ref=f135e929]: "[90]"
              - text: A collision may fragment an asteroid into numerous smaller pieces (leading to the formation of a new
              - link "asteroid family" [ref=f135e930] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Asteroid_family
              - text: ).
              - superscript [ref=f135e931]:
                - link "[91]" [ref=f135e932] [cursor=pointer]:
                  - /url: "#cite_note-91"
                  - generic [ref=f135e933]: "[91]"
              - text: Conversely, collisions that occur at low relative speeds may also join two asteroids. After more than 4 billion years of such processes, the members of the asteroid belt now bear little resemblance to the original population.
              - superscript [ref=f135e934]:
                - text: "["
                - link "citation needed" [ref=f135e936] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
            - paragraph [ref=f135e937]:
              - text: Evidence suggests that most main belt asteroids between 200 m and 10 km in diameter are
              - link "rubble piles" [ref=f135e938] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Rubble_pile
              - text: formed by collisions. These bodies consist of a multitude of irregular objects that are mostly bound together by self-gravity, resulting in significant amounts of internal
              - link "porosity" [ref=f135e939] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Porosity
              - text: .
              - superscript [ref=f135e940]:
                - link "[92]" [ref=f135e941] [cursor=pointer]:
                  - /url: "#cite_note-92"
                  - generic [ref=f135e942]: "[92]"
              - text: Along with the asteroid bodies, the asteroid belt also contains bands of dust with particle radii of up to a few hundred
              - link "micrometres" [ref=f135e943] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Micrometre
              - text: . This fine material is produced, at least in part, from collisions between asteroids, and by the impact of micrometeorites upon the asteroids. Due to the
              - link "Poynting–Robertson effect" [ref=f135e944] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Poynting–Robertson_effect
              - text: ", the pressure of"
              - link "solar radiation" [ref=f135e945] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Solar_radiation
              - text: causes this dust to slowly spiral inward toward the Sun.
              - superscript [ref=f135e946]:
                - link "[93]" [ref=f135e947] [cursor=pointer]:
                  - /url: "#cite_note-apj392-93"
                  - generic [ref=f135e948]: "[93]"
            - paragraph [ref=f135e949]:
              - text: The combination of this fine asteroid dust, as well as ejected cometary material, produces the
              - link "zodiacal light" [ref=f135e950] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Zodiacal_light
              - text: . This faint auroral glow can be viewed at night extending from the direction of the Sun along the plane of the
              - link "ecliptic" [ref=f135e951] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ecliptic
              - text: . Asteroid particles that produce visible zodiacal light average about 40 μm in radius. The typical lifetimes of main-belt zodiacal cloud particles are about 700,000 years. Thus, to maintain the bands of dust, new particles must be steadily produced within the asteroid belt.
              - superscript [ref=f135e952]:
                - link "[93]" [ref=f135e953] [cursor=pointer]:
                  - /url: "#cite_note-apj392-93"
                  - generic [ref=f135e954]: "[93]"
              - text: It was once thought that collisions of asteroids form a major component of the zodiacal light. However, computer simulations by Nesvorný and colleagues attributed 85 percent of the zodiacal-light dust to fragmentations of Jupiter-family comets, rather than to comets and collisions between asteroids in the asteroid belt. At most 10 percent of the dust is attributed to the asteroid belt.
              - superscript [ref=f135e955]:
                - link "[94]" [ref=f135e956] [cursor=pointer]:
                  - /url: "#cite_note-zodiacallightJFC-94"
                  - generic [ref=f135e957]: "[94]"
            - region "Meteorites" [ref=f135e958]:
              - generic [ref=f135e959]:
                - heading "Meteorites" [level=3] [ref=f135e960]
                - generic [ref=f135e961]:
                  - link "edit":
                    - /url: /w/index.php?title=Asteroid_belt&action=edit&section=11
              - paragraph [ref=f135e962]:
                - text: Some of the debris from collisions can form
                - link "meteoroids" [ref=f135e963] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Meteoroid
                - text: that enter the Earth's atmosphere.
                - superscript [ref=f135e964]:
                  - link "[95]" [ref=f135e965] [cursor=pointer]:
                    - /url: "#cite_note-95"
                    - generic [ref=f135e966]: "[95]"
                - text: Of the 50,000
                - link "meteorites" [ref=f135e967] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Meteorites
                - text: found on Earth to date, 99.8 percent are believed to have originated in the asteroid belt.
                - superscript [ref=f135e968]:
                  - link "[96]" [ref=f135e969] [cursor=pointer]:
                    - /url: "#cite_note-96"
                    - generic [ref=f135e970]: "[96]"
          - region "Families and groups" [ref=f135e971]:
            - generic [ref=f135e972]:
              - heading "Families and groups" [level=2] [ref=f135e973]
              - generic [ref=f135e974]:
                - link "edit":
                  - /url: /w/index.php?title=Asteroid_belt&action=edit&section=12
            - note [ref=f135e975]:
              - text: "Main article:"
              - link "Asteroid family" [ref=f135e976] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Asteroid_family
            - figure "This plot of orbital inclination (ip) versus eccentricity (ep) for multi-opposition main-belt asteroids clearly shows clumpings representing asteroid families." [ref=f135e977]:
              - link [ref=f135e978] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Asteroid_proper_elements_i_vs_e.png
                - img [ref=f135e979]
              - generic [ref=f135e980]:
                - text: This plot of orbital inclination (
                - generic [ref=f135e981]:
                  - text: i
                  - subscript [ref=f135e982]: p
                - text: ) versus eccentricity (
                - generic [ref=f135e983]:
                  - text: e
                  - subscript [ref=f135e984]: p
                - text: ) for multi-opposition main-belt asteroids clearly shows clumpings representing asteroid families.
            - figure "Overview of the Inner Solar System asteroids up to the Jovian System" [ref=f135e985]:
              - link [ref=f135e986] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Inner_solar_system_objects_top_view_for_wiki.png
                - img [ref=f135e987]
              - generic [ref=f135e988]:
                - text: Overview of the Inner Solar System asteroids up to the
                - link "Jovian System" [ref=f135e989] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Jovian_System
            - figure "Linear overview of the Inner Solar System bodies" [ref=f135e990]:
              - link [ref=f135e991] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Inner_solar_system_linear_map.png
                - img [ref=f135e992]
              - generic [ref=f135e993]: Linear overview of the Inner Solar System bodies
            - paragraph [ref=f135e994]:
              - text: In 1918, the Japanese astronomer
              - link "Kiyotsugu Hirayama" [ref=f135e995] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Kiyotsugu_Hirayama
              - text: noticed that the orbits of some of the asteroids had similar parameters, forming families or groups.
              - superscript [ref=f135e996]:
                - link "[97]" [ref=f135e997] [cursor=pointer]:
                  - /url: "#cite_note-97"
                  - generic [ref=f135e998]: "[97]"
            - paragraph [ref=f135e999]:
              - text: Approximately one-third of the asteroids in the asteroid belt are members of an asteroid family. These share similar
              - link "orbital elements" [ref=f135e1000] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Orbital_elements
              - text: ", such as"
              - link "semi-major axis" [ref=f135e1001] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Semi-major_axis
              - text: ","
              - link "eccentricity" [ref=f135e1002] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Orbital_eccentricity
              - text: ", and"
              - link "orbital inclination" [ref=f135e1003] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Orbital_inclination
              - text: as well as similar spectral features, which indicate a common origin in the breakup of a larger body. Graphical displays of these element pairs, for members of the asteroid belt, show concentrations indicating the presence of an asteroid family. There are about 20 to 30 associations that are likely asteroid families. Additional groupings have been found that are less certain. Asteroid families can be confirmed when the members display similar spectral features.
              - superscript [ref=f135e1004]:
                - link "[98]" [ref=f135e1005] [cursor=pointer]:
                  - /url: "#cite_note-98"
                  - generic [ref=f135e1006]: "[98]"
              - text: Smaller associations of asteroids are called groups or clusters.
              - superscript [ref=f135e1007]:
                - text: "["
                - link "citation needed" [ref=f135e1009] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Wikipedia:Citation_needed
                - text: "]"
            - paragraph [ref=f135e1010]:
              - text: Some of the most prominent families in the asteroid belt (in order of increasing semi-major axes) are the
              - link "Flora" [ref=f135e1011] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Flora_family
              - text: ","
              - link "Vesta" [ref=f135e1012] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Vesta_family
              - text: ","
              - link "Nysa" [ref=f135e1013] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Nysa_family
              - text: ","
              - link "Eunomia" [ref=f135e1014] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Eunomia_family
              - text: ","
              - link "Koronis" [ref=f135e1015] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Koronis_family
              - text: ","
              - link "Eos" [ref=f135e1016] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Eos_family
              - text: ", and"
              - link "Themis" [ref=f135e1017] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Themis_family
              - text: families.
              - superscript [ref=f135e1018]:
                - link "[78]" [ref=f135e1019] [cursor=pointer]:
                  - /url: "#cite_note-lang2003-78"
                  - generic [ref=f135e1020]: "[78]"
              - text: The Flora family, one of the largest with more than 13,000 known members, may have formed from a collision less than 1 billion years ago.
              - superscript [ref=f135e1021]:
                - link "[99]" [ref=f135e1022] [cursor=pointer]:
                  - /url: "#cite_note-99"
                  - generic [ref=f135e1023]: "[99]"
              - text: The largest asteroid to be a true member of a family is 4 Vesta. (This is in contrast to an interloper, in the case of Ceres with the
              - link "Gefion family" [ref=f135e1024] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Gefion_family
              - text: .) The
              - link "Vesta family" [ref=f135e1025] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Vesta_family
              - text: is believed to have formed as the result of a crater-forming impact on Vesta. Likewise, the
              - link "HED meteorites" [ref=f135e1026] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/HED_meteorite
              - text: may also have originated from Vesta as a result of this collision.
              - superscript [ref=f135e1027]:
                - link "[100]" [ref=f135e1028] [cursor=pointer]:
                  - /url: "#cite_note-100"
                  - generic [ref=f135e1029]: "[100]"
            - paragraph [ref=f135e1030]:
              - text: Three prominent bands of dust have been found within the asteroid belt. These have similar orbital inclinations as the Eos, Koronis, and Themis asteroid families, and so are possibly associated with those groupings.
              - superscript [ref=f135e1031]:
                - link "[101]" [ref=f135e1032] [cursor=pointer]:
                  - /url: "#cite_note-101"
                  - generic [ref=f135e1033]: "[101]"
            - paragraph [ref=f135e1034]:
              - text: The main belt evolution after the Late Heavy Bombardment was likely affected by the passages of large centaurs and
              - link "trans-Neptunian objects" [ref=f135e1035] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Trans-Neptunian_object
              - text: (TNOs). Centaurs and TNOs that reach the inner Solar System can modify the orbits of main belt asteroids, though only if their mass is of the order of 1×10
              - superscript [ref=f135e1036]: −9
              - link "M☉" [ref=f135e1037] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Solar_mass
                - text: M
                - subscript [ref=f135e1038]: ☉
              - text: (2.0×10
              - superscript [ref=f135e1039]: "21"
              - text: kg) for single encounters or, one order less in case of multiple close encounters. However, centaurs and TNOs are unlikely to have significantly dispersed young asteroid families in the main belt, although they can have perturbed some old asteroid families. Current main belt asteroids that originated as centaurs or trans-Neptunian objects may lie in the outer belt with short lifetime of less than 4 million years, most likely orbiting between 2.8 and 3.2 AU at larger eccentricities than typical of main belt asteroids.
              - superscript [ref=f135e1040]:
                - link "[102]" [ref=f135e1041] [cursor=pointer]:
                  - /url: "#cite_note-102"
                  - generic [ref=f135e1042]: "[102]"
            - region "Periphery" [ref=f135e1043]:
              - generic [ref=f135e1044]:
                - heading "Periphery" [level=3] [ref=f135e1045]
                - generic [ref=f135e1046]:
                  - link "edit":
                    - /url: /w/index.php?title=Asteroid_belt&action=edit&section=13
              - paragraph [ref=f135e1047]:
                - text: Skirting the inner edge of the belt (ranging between 1.78 and 2.0 AU, with a mean semi-major axis of 1.9 AU) is the
                - link "Hungaria family" [ref=f135e1048] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hungaria_family
                - text: of minor planets. They are named after the main member,
                - link "434 Hungaria" [ref=f135e1049] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/434_Hungaria
                - text: ; the group contains at least 52 named asteroids. The Hungaria group is separated from the main body by the 4:1 Kirkwood gap and their orbits have a high inclination. Some members belong to the Mars-crossing category of asteroids, and gravitational perturbations by Mars are likely a factor in reducing the total population of this group.
                - superscript [ref=f135e1050]:
                  - link "[57]" [ref=f135e1051] [cursor=pointer]:
                    - /url: "#cite_note-hungaria-57"
                    - generic [ref=f135e1052]: "[57]"
              - paragraph [ref=f135e1053]:
                - text: Another high-inclination group in the inner part of the asteroid belt is the
                - link "Phocaea family" [ref=f135e1054] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Phocaea_family
                - text: . These are composed primarily of S-type asteroids, whereas the neighboring Hungaria family includes some
                - link "E-types" [ref=f135e1055] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/E-type_asteroid
                - text: .
                - superscript [ref=f135e1056]:
                  - link "[103]" [ref=f135e1057] [cursor=pointer]:
                    - /url: "#cite_note-103"
                    - generic [ref=f135e1058]: "[103]"
                - text: The Phocaea family orbit between 2.25 and 2.5 AU from the Sun.
                - superscript [ref=f135e1059]:
                  - link "[104]" [ref=f135e1060] [cursor=pointer]:
                    - /url: "#cite_note-104"
                    - generic [ref=f135e1061]: "[104]"
              - paragraph [ref=f135e1062]:
                - text: Skirting the outer edge of the asteroid belt is the
                - link "Cybele group" [ref=f135e1063] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Cybele_asteroids
                - text: ", orbiting between 3.3 and 3.5 AU. The"
                - link "Hilda family" [ref=f135e1064] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Hilda_family
                - text: orbit between 3.5 and 4.2 AU with relatively circular orbits and a stable 3:2 orbital resonance with Jupiter. There are few asteroids beyond 4.2 AU, until Jupiter's orbit. At the latter the two families of
                - link "Trojan asteroids" [ref=f135e1065] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Trojan_asteroid
                - text: can be found, which, at least for objects larger than 1 km, are approximately as numerous as the asteroids of the asteroid belt.
                - superscript [ref=f135e1066]:
                  - link "[105]" [ref=f135e1067] [cursor=pointer]:
                    - /url: "#cite_note-105"
                    - generic [ref=f135e1068]: "[105]"
            - region "New families" [ref=f135e1069]:
              - generic [ref=f135e1070]:
                - heading "New families" [level=3] [ref=f135e1071]
                - generic [ref=f135e1072]:
                  - link "edit":
                    - /url: /w/index.php?title=Asteroid_belt&action=edit&section=14
              - paragraph [ref=f135e1073]:
                - text: Some asteroid families have formed recently, in astronomical terms. The
                - link "Karin family" [ref=f135e1074] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Karin_family
                - text: apparently formed about 5.7 million years ago from a collision with a progenitor asteroid 33 km in radius.
                - superscript [ref=f135e1075]:
                  - link "[106]" [ref=f135e1076] [cursor=pointer]:
                    - /url: "#cite_note-106"
                    - generic [ref=f135e1077]: "[106]"
                - text: The
                - link "Veritas family" [ref=f135e1078] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/490_Veritas
                - text: formed about 8.3 million years ago; evidence includes interplanetary dust recovered from
                - link "ocean sediment" [ref=f135e1079] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ocean_sediment
                - text: .
                - superscript [ref=f135e1080]:
                  - link "[107]" [ref=f135e1081] [cursor=pointer]:
                    - /url: "#cite_note-107"
                    - generic [ref=f135e1082]: "[107]"
              - paragraph [ref=f135e1083]:
                - text: More recently, the
                - link "Datura cluster" [ref=f135e1084] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/1270_Datura
                - text: appears to have formed about 530,000 years ago from a collision with a main-belt asteroid. The age estimate is based on the probability of the members having their current orbits, rather than from any physical evidence. However, this cluster may have been a source for some zodiacal dust material.
                - superscript [ref=f135e1085]:
                  - link "[108]" [ref=f135e1086] [cursor=pointer]:
                    - /url: "#cite_note-108"
                    - generic [ref=f135e1087]: "[108]"
                - superscript [ref=f135e1088]:
                  - link "[109]" [ref=f135e1089] [cursor=pointer]:
                    - /url: "#cite_note-109"
                    - generic [ref=f135e1090]: "[109]"
                - text: Other recent cluster formations, such as the
                - link "Iannini cluster" [ref=f135e1091] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/4652_Iannini
                - text: (c.
                - generic [ref=f135e1092]: 1–5
                - text: million years ago), may have provided additional sources of this asteroid dust.
                - superscript [ref=f135e1093]:
                  - link "[110]" [ref=f135e1094] [cursor=pointer]:
                    - /url: "#cite_note-110"
                    - generic [ref=f135e1095]: "[110]"
          - region "Exploration" [ref=f135e1096]:
            - generic [ref=f135e1097]:
              - heading "Exploration" [level=2] [ref=f135e1098]
              - generic [ref=f135e1099]:
                - link "edit":
                  - /url: /w/index.php?title=Asteroid_belt&action=edit&section=15
            - note [ref=f135e1100]:
              - text: "See also:"
              - link "List of minor planets and comets visited by spacecraft" [ref=f135e1101] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/List_of_minor_planets_and_comets_visited_by_spacecraft
              - text: and
              - link "List of missions to minor planets" [ref=f135e1102] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/List_of_missions_to_minor_planets
            - figure "Artist's concept of the Dawn spacecraft with Vesta and Ceres" [ref=f135e1103]:
              - link [ref=f135e1104] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/File:Dawn_Flight_Configuration_2.jpg
                - img [ref=f135e1105]
              - generic [ref=f135e1106]:
                - text: Artist's concept of the
                - link "Dawn" [ref=f135e1108] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Dawn_(spacecraft)
                - text: spacecraft with
                - link "Vesta" [ref=f135e1109] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/4_Vesta
                - text: and
                - link "Ceres" [ref=f135e1110] [cursor=pointer]:
                  - /url: //en.wikipedia.org/wiki/Ceres_(dwarf_planet)
            - paragraph [ref=f135e1111]:
              - text: The first spacecraft to traverse the asteroid belt was
              - link "Pioneer 10" [ref=f135e1113] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Pioneer_10
              - text: ", which entered the region on 16 July 1972. At the time, there was some concern that the debris in the belt would pose a hazard to the spacecraft, but it has since been safely traversed by multiple spacecraft without incident."
              - link "Pioneer 11" [ref=f135e1115] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Pioneer_11
              - text: ","
              - link "Voyagers 1 and 2" [ref=f135e1116] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Voyager_program
                - generic [ref=f135e1117]: Voyagers 1
                - text: and 2
              - text: and
              - link "Ulysses" [ref=f135e1119] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Ulysses_probe
              - text: passed through the belt without imaging any asteroids.
              - link "Cassini" [ref=f135e1121] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Cassini–Huygens
              - text: measured plasma and fine dust grains while traversing the belt in 2000.
              - superscript [ref=f135e1122]:
                - link "[111]" [ref=f135e1123] [cursor=pointer]:
                  - /url: "#cite_note-111"
                  - generic [ref=f135e1124]: "[111]"
              - text: On its way to Jupiter,
              - link "Juno" [ref=f135e1126] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Juno_(spacecraft)
              - text: traversed the asteroid belt without collecting science data.
              - superscript [ref=f135e1127]:
                - link "[112]" [ref=f135e1128] [cursor=pointer]:
                  - /url: "#cite_note-112"
                  - generic [ref=f135e1129]: "[112]"
              - text: Due to the low density of materials within the belt, the odds of a probe running into an asteroid are estimated at less than 1 in 1 billion.
              - superscript [ref=f135e1130]:
                - link "[113]" [ref=f135e1131] [cursor=pointer]:
                  - /url: "#cite_note-113"
                  - generic [ref=f135e1132]: "[113]"
            - paragraph [ref=f135e1133]:
              - text: Most main belt asteroids imaged to date have come from brief
              - link "flyby" [ref=f135e1134] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Planetary_flyby
              - text: opportunities by probes headed for other targets. Only the
              - link "Dawn" [ref=f135e1135] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Dawn_(spacecraft)
              - text: mission has studied main belt asteroids for a protracted period in orbit. The
              - link "Galileo" [ref=f135e1137] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Galileo_(spacecraft)
              - text: spacecraft imaged
              - link "951 Gaspra" [ref=f135e1138] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/951_Gaspra
              - text: in 1991 and
              - link "243 Ida" [ref=f135e1139] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/243_Ida
              - text: in 1993, then
              - link "NEAR" [ref=f135e1140] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/NEAR_Shoemaker
              - text: imaged
              - link "253 Mathilde" [ref=f135e1141] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/253_Mathilde
              - text: in 1997 and landed on near–Earth asteroid
              - link "433 Eros" [ref=f135e1142] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/433_Eros
              - text: in February 2001.
              - link "Cassini" [ref=f135e1144] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Cassini–Huygens
              - text: imaged
              - link "2685 Masursky" [ref=f135e1145] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/2685_Masursky
              - text: in 2000,
              - link "Stardust" [ref=f135e1147] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Stardust_(spacecraft)
              - text: imaged
              - link "5535 Annefrank" [ref=f135e1148] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/5535_Annefrank
              - text: in 2002,
              - link "New Horizons" [ref=f135e1150] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/New_Horizons
              - text: imaged
              - link "132524 APL" [ref=f135e1151] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/132524_APL
              - text: in 2006, and
              - link "Rosetta" [ref=f135e1153] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Rosetta_(spacecraft)
              - text: imaged
              - link "2867 Šteins" [ref=f135e1154] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/2867_Šteins
              - text: in September 2008 and
              - link "21 Lutetia" [ref=f135e1155] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/21_Lutetia
              - text: in July 2010.
              - link "Dawn" [ref=f135e1157] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Dawn_(spacecraft)
              - text: orbited Vesta between July 2011 and September 2012 and has orbited Ceres since March 2015.
              - superscript [ref=f135e1158]:
                - link "[114]" [ref=f135e1159] [cursor=pointer]:
                  - /url: "#cite_note-114"
                  - generic [ref=f135e1160]: "[114]"
              - text: The
              - link "Lucy" [ref=f135e1162] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Lucy_(spacecraft)
              - text: space probe made a flyby of
              - link "152830 Dinkinesh" [ref=f135e1163] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/152830_Dinkinesh
              - text: in 2023 and
              - link "52246 Donaldjohanson" [ref=f135e1164] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/52246_Donaldjohanson
              - text: in 2025 on its way to study the
              - link "Jupiter trojans" [ref=f135e1165] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Jupiter_trojan
              - text: .
              - superscript [ref=f135e1166]:
                - link "[115]" [ref=f135e1167] [cursor=pointer]:
                  - /url: "#cite_note-115"
                  - generic [ref=f135e1168]: "[115]"
              - superscript [ref=f135e1169]:
                - link "[116]" [ref=f135e1170] [cursor=pointer]:
                  - /url: "#cite_note-116"
                  - generic [ref=f135e1171]: "[116]"
            - paragraph [ref=f135e1172]:
              - text: As of 2026, there are several future and proposed missions to the asteroid belt. The NASA spacecraft
              - link "Psyche" [ref=f135e1174] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Psyche_(spacecraft)
              - text: will enter orbit around large M-type asteroid
              - link "16 Psyche" [ref=f135e1175] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/16_Psyche
              - text: in 2029.
              - superscript [ref=f135e1176]:
                - link "[117]" [ref=f135e1177] [cursor=pointer]:
                  - /url: "#cite_note-117"
                  - generic [ref=f135e1178]: "[117]"
              - text: Additionally,
              - link "Tianwen-2" [ref=f135e1179] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Tianwen-2
              - text: is scheduled to visit
              - link "main belt comet" [ref=f135e1180] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/Active_asteroid
              - link "311P/PanSTARRS" [ref=f135e1181] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/311P/PanSTARRS
              - text: in 2035.
              - superscript [ref=f135e1182]:
                - link "[118]" [ref=f135e1183] [cursor=pointer]:
                  - /url: "#cite_note-118"
                  - generic [ref=f135e1184]: "[118]"
              - text: The future
              - link "UAESA" [ref=f135e1185] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/United_Arab_Emirates_Space_Agency
              - text: spacecraft
              - link "MBR Explorer" [ref=f135e1186] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/MBR_Explorer
              - text: ", which is planned to launch in 2028 will visit main belt asteroids"
              - link "10253 Westerwald" [ref=f135e1187] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/10253_Westerwald
              - text: ","
              - link "623 Chimaera" [ref=f135e1188] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/623_Chimaera
              - text: ","
              - link "13294 Rockox" [ref=f135e1189] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/13294_Rockox
              - text: ","
              - link "88055 Ghaf" [ref=f135e1190] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/88055_Ghaf
              - text: ","
              - link "23871 Ousha" [ref=f135e1191] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/23871_Ousha
              - text: ", and"
              - link "59980 Moza" [ref=f135e1192] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/59980_Moza
              - text: ", and enter orbit and land on"
              - link "269 Justitia" [ref=f135e1193] [cursor=pointer]:
                - /url: //en.wikipedia.org/wiki/269_Justitia
              - text: in 2035.
              - superscript [ref=f135e1194]:
                - link "[119]" [ref=f135e1195] [cursor=pointer]:
                  - /url: "#cite_note-119"
                  - generic [ref=f135e1196]: "[119]"
