                - text: "The asteroids of the inner Solar System and Jupiter: the belt is located between the orbits of Jupiter and Mars."
                - table [ref=f135e197]:
                  - rowgroup [ref=f135e198]:
                    - row "Sun and planets Near-Earth objects Hungaria asteroids Asteroid belt Hilda asteroids (Hildas) Jupiter trojans" [ref=f135e199]:
                      - cell "Sun and planets Near-Earth objects Hungaria asteroids" [ref=f135e200]:
