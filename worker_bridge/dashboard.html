<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foundry — Raw Output</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Courier New', monospace; background: #080808; color: #d0d0d0; padding: 10px; }
  h1 { color: #00ff88; font-size: 16px; margin-bottom: 10px; }
  .bar { background: #111; border: 1px solid #222; padding: 8px 12px; margin-bottom: 8px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .bar span { font-size: 12px; }
  .label { color: #666; }
  .val { color: #0f0; font-weight: bold; }
  .val.streaming { color: #ff0; }
  .val.stopped { color: #f44; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; line-height: 1.5; }
  .raw-block { background: #0a0a0a; border: 1px solid #1a1a1a; padding: 10px; margin-bottom: 6px; border-radius: 3px; max-height: none; overflow: visible; }
  .raw-block .filename { color: #00ccff; font-size: 11px; margin-bottom: 4px; }
  .raw-block .filesize { color: #555; font-size: 10px; margin-left: 8px; }
  .raw-block .content { color: #c0c0c0; }
  .raw-block .content .q { color: #ff8844; }
  .raw-block .content .a { color: #88ddff; }
  .msg { border-bottom: 1px solid #1a1a1a; padding: 6px 0; }
  .msg .role { color: #666; font-size: 10px; }
  .msg .text { color: #c0c0c0; font-size: 11px; }
  .footer { color: #333; font-size: 10px; margin-top: 20px; text-align: center; }
  .tab { display: inline-block; padding: 4px 12px; margin-right: 2px; cursor: pointer; font-size: 11px; background: #1a1a1a; color: #888; border: none; border-radius: 3px 3px 0 0; }
  .tab.active { background: #0a0a0a; color: #0f0; border-bottom: 2px solid #0f0; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body>

<h1>✦ Foundry — Raw Output (nothing hidden)</h1>

<div class="bar">
  <span><span class="label">Bridge:</span> <span class="val" id="bridgeStatus">—</span></span>
  <span><span class="label">Agent:</span> <span class="val" id="agentState">—</span></span>
  <span><span class="label">Msgs:</span> <span class="val" id="msgCount">—</span></span>
  <span><span class="label">Model:</span> <span class="val" id="modelName" style="font-size:11px">—</span></span>
  <span><span class="label">Files:</span> <span class="val" id="fileCount">—</span></span>
</div>

<div style="margin-bottom:10px">
  <button class="tab active" onclick="switchTab('messages')">Raw Messages</button>
  <button class="tab" onclick="switchTab('chronicle')">Chronicle Files</button>
  <button class="tab" onclick="switchTab('stderr')">Stderr</button>
</div>

<div id="tab-messages" class="tab-content active" id="msgContainer"></div>
<div id="tab-chronicle" class="tab-content" id="chronicleContainer"></div>
<div id="tab-stderr" class="tab-content" id="stderrContainer"></div>

<div class="footer">Raw view · refreshes every 8s · <span id="lastUpdate">—</span></div>

<script>
const WORKER = 'http://127.0.0.1:8894';

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${name === 'messages' ? 1 : name === 'chronicle' ? 2 : 3})`).classList.add('active');
  document.getElementById(`tab-${name}`).classList.add('active');
}

async function get(path) {
  try {
    const r = await fetch(WORKER + path);
    return await r.json();
  } catch(e) { return null; }
}

function esc(s) { 
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function update() {
  // Status bar
  const st = await get('/api/status');
  if (st) {
    document.getElementById('bridgeStatus').textContent = st.status || '?';
    document.getElementById('bridgeStatus').className = 'val ' + (st.status === 'running' ? '' : 'stopped');
  }

  const state = await get('/api/get_state');
  if (state && state.data) {
    document.getElementById('agentState').textContent = state.data.isStreaming ? 'STREAMING' : 'idle';
    document.getElementById('agentState').className = 'val ' + (state.data.isStreaming ? 'streaming' : '');
    document.getElementById('msgCount').textContent = state.data.messageCount || 0;
    document.getElementById('modelName').textContent = (state.data.model && state.data.model.id) || '?';
  }

  // Raw messages
  const msgs = await get('/api/get_messages');
  if (msgs && msgs.data && msgs.data.messages) {
    const all = msgs.data.messages;
    let html = '';
    for (const m of all.slice(-20)) { // last 20 messages, fully raw
      let text = m.content || '';
      if (Array.isArray(text)) {
        text = text.map(s => s.text || s.thinking || '').join('\n');
      }
      const role = m.role || '?';
      const cls = role === 'assistant' ? 'a' : 'q';
      html += `<div class="msg"><span class="role">[${role}]</span><pre class="text ${cls}">${esc(text)}</pre></div>`;
    }
    document.getElementById('msgContainer').innerHTML = html || '<pre>No messages</pre>';
  }

  // Raw chronicle files
  const ch = await get('/api/chronicle');
  if (ch && ch.files) {
    document.getElementById('fileCount').textContent = ch.files.length;
    let html = '';
    for (const f of ch.files) {
      html += `<div class="raw-block">`;
      html += `<div class="filename">${esc(f.name)} <span class="filesize">${f.size} bytes</span></div>`;
      html += `<pre class="content">${esc(f.raw)}</pre>`;
      html += `</div>`;
    }
    document.getElementById('chronicleContainer').innerHTML = html || '<pre>No chronicle files</pre>';
  }

  // Stderr
  if (st && st.stderr_tail && st.stderr_tail.length > 0) {
    document.getElementById('stderrContainer').innerHTML = `<pre>${esc(st.stderr_tail.join('\n'))}</pre>`;
  }

  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
}

update();
setInterval(update, 8000);
</script>
</body>
</html>
