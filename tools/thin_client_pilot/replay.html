<!doctype html>
<html><head><meta charset="utf-8"><title>thincli replay — deterministic pixel metric</title>
</head><body>
<canvas id="gl" width="960" height="540"></canvas>
<div id="done" style="font:12px monospace">loading data…</div>
<script>
"use strict";
/* THE REPLAY INSTRUMENT (lane/thin-client-pilot-20260920).
   Renders RECORDED frames — the thin client's sampled rendered frames (side
   A) and the twin truth at the same render points (side B) — through the
   playable slice's OWN shader program text (copied verbatim from
   tools/playable_slice/index.html MESH_P/LINE_P), fixed camera, fixed
   viewport 960x540, antialias OFF (F5 determinism: same inputs must give the
   same pixels; both sides render through the identical path so the MAD
   measures scene difference, not renderer difference).
   Loads /data.json, draws each pair, computes MAD on readback pixels, saves
   named stills, POSTs everything to /result. */
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl2', {antialias: false, preserveDrawingBuffer: true});
// preserveDrawingBuffer: readPixels must see the drawn frame (the bundled
// headless compositor clears between tasks; measured as all-zero MADs)
function sh(t, src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
function prog(vs,fs){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);return p;}
/* ── verbatim from index.html ── */
const MESH_P = prog(`#version 300 es
  in vec3 aPos; in vec3 aNrm; in vec3 aCol;
  uniform mat4 uVP; uniform vec3 uOff; out vec3 vN; out vec3 vC; out vec3 vP;
  void main(){vN=aNrm; vC=aCol; vP=aPos+uOff; gl_Position=uVP*vec4(aPos+uOff,1.0);}`,
`#version 300 es
  precision highp float; in vec3 vN; in vec3 vC; in vec3 vP; out vec4 o;
  uniform float uAlpha;
  void main(){
    vec3 L=normalize(vec3(0.5,0.9,0.35));
    float d=max(dot(normalize(vN),L),0.0)*0.75+0.25;
    o=vec4(vC*d, uAlpha);}`);
const LINE_P = prog(`#version 300 es
  in vec3 aPos; uniform mat4 uVP; void main(){gl_Position=uVP*vec4(aPos,1.0);}`,
`#version 300 es
  precision highp float; uniform vec4 uCol; out vec4 o; void main(){o=uCol;}`);
const U = (p,n)=>gl.getUniformLocation(p,n);
function persp(fov,asp,n,f){const t=1/Math.tan(fov/2);
  return [t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0];}
function lookFrom(yaw,pit,dist,tx,ty,tz){
  const cx=tx+dist*Math.cos(pit)*Math.sin(yaw), cy=ty+dist*Math.sin(pit),
        cz=tz+dist*Math.cos(pit)*Math.cos(yaw);
  let f=[cx-tx,cy-ty,cz-tz], l=Math.hypot(...f); f=f.map(v=>v/l);
  let up=[0,1,0], s=[f[1]*up[2]-f[2]*up[1], f[2]*up[0]-f[0]*up[2], f[0]*up[1]-f[1]*up[0]];
  l=Math.hypot(...s)||1e-9; s=s.map(v=>v/l);
  const u=[s[1]*f[2]-s[2]*f[1], s[2]*f[0]-s[0]*f[2], s[0]*f[1]-s[1]*f[0]];
  return {mat:[s[0],u[0],f[0],0, s[1],u[1],f[1],0, s[2],u[2],f[2],0,
    -(s[0]*cx+s[1]*cy+s[2]*cz), -(u[0]*cx+u[1]*cy+u[2]*cz), -(f[0]*cx+f[1]*cy+f[2]*cz), 1],
    eye:[cx,cy,cz]};
}
function mul(a,b){const o=new Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)
  o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}
/* ── end verbatim ── */

function b6432(b64){                 // base64 -> Float32Array
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Float32Array(u8.buffer);
}
function linesVAO(pts){const vao=gl.createVertexArray(),vbo=gl.createBuffer();
  gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pts),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,12,0);
  gl.bindVertexArray(null);return {vao,n:pts.length/3};}

let meshVao=null, meshIbo=null, meshVbo=null, idxCount=0, grid=null, ring=null, post=null, VPm=null;

function buildMesh(topoIdx){
  meshVao = gl.createVertexArray();
  meshVbo = gl.createBuffer(); meshIbo = gl.createBuffer();
  gl.bindVertexArray(meshVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, meshVbo);
  gl.bufferData(gl.ARRAY_BUFFER, 36*4*624, gl.DYNAMIC_DRAW);   // sized on first draw
  const st=36;
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,st,0);
  gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,3,gl.FLOAT,false,st,12);
  gl.enableVertexAttribArray(2);gl.vertexAttribPointer(2,3,gl.FLOAT,false,st,24);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshIbo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, topoIdx, gl.STATIC_DRAW);
  idxCount = topoIdx.length;
  gl.bindVertexArray(null);
}
function drawScene(f32){   // f32: interleaved pos|nrm|col (the page's layout)
  gl.viewport(0,0,cv.width,cv.height);
  gl.enable(gl.DEPTH_TEST); gl.clearColor(0.043,0.051,0.063,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(LINE_P); gl.uniformMatrix4fv(U(LINE_P,'uVP'),false,VPm);
  gl.uniform4f(U(LINE_P,'uCol'),0.16,0.2,0.24,1);
  gl.bindVertexArray(grid.vao); gl.drawArrays(gl.LINES,0,grid.n);
  gl.uniform4f(U(LINE_P,'uCol'),0.5,0.75,0.55,1);
  gl.bindVertexArray(ring.vao); gl.drawArrays(gl.LINE_STRIP,0,ring.n);
  gl.uniform4f(U(LINE_P,'uCol'),0.35,0.55,0.4,1);
  gl.bindVertexArray(post.vao); gl.drawArrays(gl.LINES,0,post.n);
  gl.useProgram(MESH_P); gl.uniformMatrix4fv(U(MESH_P,'uVP'),false,VPm);
  gl.uniform1f(U(MESH_P,'uAlpha'),1);
  gl.bindVertexArray(meshVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, meshVbo);
  gl.bufferData(gl.ARRAY_BUFFER, f32.buffer, gl.DYNAMIC_DRAW);
  gl.drawElements(gl.TRIANGLES, idxCount, gl.UNSIGNED_INT, 0);
  gl.bindVertexArray(null);
}
function readPixels(){
  const px = new Uint8Array(cv.width * cv.height * 4);
  gl.readPixels(0, 0, cv.width, cv.height, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return px;
}

function mad(a, b){
  let sum = 0, mx = 0, cnt = 0;
  for(let i = 0; i < a.length; i += 4){
    for(let c = 0; c < 3; c++){
      const d = Math.abs(a[i+c] - b[i+c]);
      sum += d; if(d > mx) mx = d; cnt++;
    }
  }
  return {mad: sum / cnt, max: mx};
}

async function main(){
  const D = await (await fetch('/data.json')).json();
  const topo = (function(){ const bin = atob(D.topoB64), u8 = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; })();
  const tris = new DataView(topo.buffer).getUint32(0, true);
  buildMesh(new Uint32Array(topo.buffer, 4, tris*3));
  const g=[],R=3.0,s=0.25,M=D.marker;
  for(let x=-R;x<=R+1e-6;x+=s){g.push(x,0,-R,x,0,R);}
  for(let z=-R;z<=R+1e-6;z+=s){g.push(-R,0,z,R,0,z);}
  grid=linesVAO(g);
  const r=[],N=64;
  for(let i=0;i<=N;i++){const a=2*Math.PI*i/N;r.push(M.x+M.radius*Math.sin(a),0.004,M.z+M.radius*Math.cos(a));}
  ring=linesVAO(r);
  post=linesVAO([M.x,0,M.z, M.x,0.5,M.z]);
  const [yaw,pit,dist] = D.camera, [tx,ty,tz] = D.target;
  VPm = mul(persp(0.9, cv.width/cv.height, 0.05, 60), lookFrom(yaw,pit,dist,tx,ty,tz).mat);

  const results = [], stills = [];
  for(const pr of D.pairs){
    const A = b6432(pr.a), B = b6432(pr.b);
    drawScene(A); const pa = readPixels();
    drawScene(B); const pb = readPixels();
    const m = mad(pa, pb);
    results.push({i: pr.i, t: pr.t, phase: pr.phase, r: pr.r, mad: m.mad, max: m.max});
    if(D.still_indices.includes(pr.i)){
      // side-by-side still (A left, B right) via a 2D canvas
      const c2 = document.createElement('canvas');
      c2.width = cv.width*2; c2.height = cv.height;
      const ctx = c2.getContext('2d');
      const ia = new ImageData(new Uint8ClampedArray(pa.buffer.slice(0)), cv.width, cv.height);
      const ib = new ImageData(new Uint8ClampedArray(pb.buffer.slice(0)), cv.width, cv.height);
      // readPixels is bottom-up: flip vertically while compositing
      const ca = document.createElement('canvas'); ca.width=cv.width; ca.height=cv.height;
      ca.getContext('2d').putImageData(ia, 0, 0);
      const cb = document.createElement('canvas'); cb.width=cv.width; cb.height=cv.height;
      cb.getContext('2d').putImageData(ib, 0, 0);
      ctx.save(); ctx.translate(0, cv.height); ctx.scale(1, -1);
      ctx.drawImage(ca, 0, 0); ctx.drawImage(cb, cv.width, 0); ctx.restore();
      ctx.fillStyle='#fff'; ctx.font='12px monospace';
      ctx.fillText('INTERP r='+pr.r+' '+(pr.phase||''), 8, 16);
      ctx.fillText('TRUTH  same render point', cv.width+8, 16);
      stills.push({i: pr.i, pngB64: c2.toDataURL('image/png').split(',')[1]});
    }
  }
  const payload = {pairs: results, stills, firstCanvasHash: (function(){
    drawScene(b6432(D.pairs[0].a));
    return cv.toDataURL('image/png').length + ':' + readPixels().reduce((a,v,i)=>(a*31+v+i)%4294967296,0);
  })(), done: true};
  await fetch('/result', {method: 'POST', headers: {'Content-Type': 'application/json'},
                          body: JSON.stringify(payload)});
  document.getElementById('done').textContent = 'DONE ' + results.length + ' pairs';
}
main().catch(e => { document.getElementById('done').textContent = 'ERR ' + e; });
</script></body></html>
